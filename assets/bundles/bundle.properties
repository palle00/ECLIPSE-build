eclipse-menu.whatsnew = What's new in ECLIPSE 1.0
eclipse-menu.whatsnew.text = [accent]Industry[]\n- [accent]Universal machines[]: one Gear Press for every gear, one Assembler for every part, one Electrolyzer for every electrolysis.\n- [accent]Power tiers and overclocking[]: every recipe needs its tier\'s power in full; overclock for 2x, 4x or 8x speed at a steep power price.\n- [accent]Ore minerals[]: crush, float or leach them for 1, 1.5 or 2 metal per ore, with real byproducts.\n- [accent]Power[]: Solar Farm, Combined-Cycle Turbine, Breeder and Fusion Reactor; a stronger World Engine.\n\n[accent]War[]\n- [accent]The Tide[]: a third enemy faction of amphibious boats and submarines, and the Sonar to find them.\n- New turrets: [accent]Bombard[], the [accent]Supernova[] (Primer + Stardust Launcher) and the [accent]Payload Catapult[].\n- A balance pass: weaker turrets and the top unit tiers hit much harder; tungsten carbide ammunition now pays off against armour.\n\n[accent]Information and control[]\n- [accent]Production panel[] (O): what your base makes and uses, a one-minute graph, production chains with machines needed against built, and power.\n- [accent]Stopped machines[] (K): every stalled machine marked with why.\n- [accent]Logic[]: read ECLIPSE machines with esensor, set overclock, recipe or the Orbital Platform target with econtrol, look up recipes with recipe. See the wiki\'s Logic guide.\n- [accent]Wiki[]: a production calculator on every item, comparison tables for generators, turrets and units, and a Logic section on every block.\n- [accent]Placement ratios[]: how many suppliers keep a machine fed, while you place it.
