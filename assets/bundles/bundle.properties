item.eclipse-sulfur.name = Sulfur
item.eclipse-sulfur.description = Recovered from crude oil during distillation. Burned with oxygen to make sulfuric acid. Also caustic shells for Hail and Ripple that etch enemy armour.
item.eclipse-polyethylene.name = Polyethylene
item.eclipse-polyethylene.description = A tough, chemically resistant plastic made from ethylene. Used for casings and corrosion-proof equipment.
item.eclipse-lead-acid-cell.name = Lead-Acid Cell
item.eclipse-lead-acid-cell.description = A rechargeable cell of lead plates in sulfuric acid, sealed in a polyethylene case. Building block of industrial energy storage.

liquid.eclipse-purified-water.name = Purified Water
liquid.eclipse-purified-water.description = Water stripped of minerals. Required by electrolysis and other sensitive chemical processes. A slightly better coolant than raw water.
liquid.eclipse-brine.name = Brine
liquid.eclipse-brine.description = Concentrated salt water left over from water treatment. Feedstock for the chlor-alkali process.
liquid.eclipse-hydrochloric-acid.name = Hydrochloric Acid
liquid.eclipse-hydrochloric-acid.description = A strong acid. Dissolves metals out of scrap. Corrosive to units. [scarlet]Corrodes ordinary liquid blocks; use polymer conduits and tanks.[]
liquid.eclipse-oxygen.name = Oxygen
liquid.eclipse-oxygen.description = An oxidizing gas produced by electrolysis. Used in fuel cells and sulfuric acid production.
liquid.eclipse-chlorine.name = Chlorine
liquid.eclipse-chlorine.description = A toxic, corrosive gas produced from brine. Combined with hydrogen to make hydrochloric acid. [scarlet]Corrodes ordinary liquid blocks; use polymer conduits and tanks.[]
liquid.eclipse-methane.name = Methane
liquid.eclipse-methane.description = A light fuel gas boiled off crude oil. Burned for power or industrial heat.
liquid.eclipse-naphtha.name = Naphtha
liquid.eclipse-naphtha.description = A light oil fraction. Cracked with steam and heat into ethylene.
liquid.eclipse-ethylene.name = Ethylene
liquid.eclipse-ethylene.description = The most important building block of the polymer industry.
liquid.eclipse-sulfuric-acid.name = Sulfuric Acid
liquid.eclipse-sulfuric-acid.description = The workhorse of heavy chemistry. Used as battery electrolyte. Corrosive to units. [scarlet]Corrodes ordinary liquid blocks; use polymer conduits and tanks.[]
liquid.eclipse-sodium-hydroxide.name = Sodium Hydroxide
liquid.eclipse-sodium-hydroxide.description = A strong alkali from the chlor-alkali process. Neutralizes acidic waste. [scarlet]Corrodes ordinary liquid blocks; use polymer conduits and tanks.[]
liquid.eclipse-acidic-waste.name = Acidic Waste
liquid.eclipse-acidic-waste.description = Spent acid from metal leaching. Must be neutralized or it will back up and stall production. [scarlet]Corrodes ordinary liquid blocks; use polymer conduits and tanks.[]

block.eclipse-water-treatment-plant.name = Water Treatment Plant
block.eclipse-water-treatment-plant.description = Filters water into purified water. Rejected salts leave as brine.\nPurified water exits the left side, brine exits the right side.
block.eclipse-electrolysis-plant.name = Electrolysis Plant
block.eclipse-electrolysis-plant.description = Splits purified water into hydrogen and oxygen using large amounts of power.\nHydrogen exits the left side, oxygen exits the right side.
block.eclipse-chlor-alkali-cell.name = Chlor-Alkali Cell
block.eclipse-chlor-alkali-cell.description = Electrolyzes brine into chlorine, hydrogen and sodium hydroxide.\nChlorine exits the left side, hydrogen the right side, sodium hydroxide the front.
block.eclipse-acid-synthesizer.name = Acid Synthesizer
block.eclipse-acid-synthesizer.description = Burns hydrogen in chlorine to produce hydrochloric acid.
block.eclipse-acid-leaching-vat.name = Acid Leaching Vat
block.eclipse-acid-leaching-vat.description = Dissolves scrap in hydrochloric acid and recovers titanium, copper and lead. Produces acidic waste that must be removed.
block.eclipse-distillation-column.name = Distillation Column
block.eclipse-distillation-column.description = Separates crude oil into fractions. Recovers sulfur as a byproduct.\nNaphtha exits the left side, methane exits the right side.
block.eclipse-steam-cracker.name = Steam Cracker
block.eclipse-steam-cracker.description = Cracks naphtha into ethylene with steam. Requires heat from adjacent heaters.
block.eclipse-polymerization-reactor.name = Polymerization Reactor
block.eclipse-sulfuric-acid-plant.name = Sulfuric Acid Plant
block.eclipse-battery-assembly-plant.name = Battery Assembly Plant
block.eclipse-battery-assembly-plant.description = Assembles lead plates, polyethylene casings and sulfuric acid electrolyte into lead-acid cells.
block.eclipse-industrial-neutralizer.name = Industrial Neutralizer
block.eclipse-industrial-neutralizer.description = Neutralizes acidic waste with sodium hydroxide, returning usable water.
block.eclipse-hydrogen-fuel-cell.name = Hydrogen Fuel Cell
block.eclipse-hydrogen-fuel-cell.description = Combines hydrogen and oxygen to generate power. Emits purified water as a byproduct.
block.eclipse-methane-turbine.name = Methane Turbine
block.eclipse-methane-turbine.description = Burns methane to generate a large amount of power. Exhaust leaves as flue gas; pipe it to a scrubber or gas separator, or it is vented.
block.eclipse-industrial-battery.name = Industrial Battery
block.eclipse-industrial-battery.description = A bank of lead-acid cells. Stores far more power per tile than a large battery.
block.eclipse-industrial-heater.name = Industrial Heater
block.eclipse-industrial-heater.description = Burns methane to produce heat. Outputs heat in the direction it faces. Exhaust leaves as flue gas; pipe it away to use it, or it is vented.

item.eclipse-polymer-catalyst.name = Polymer Catalyst
item.eclipse-polymer-catalyst.description = A titanium chloride (Ziegler-Natta) catalyst. Enables polymerization and is only slowly used up.
item.eclipse-ammonium-nitrate.name = Ammonium Nitrate
item.eclipse-ammonium-nitrate.description = A powerful oxidizer. Mixed with coal into blast compound. Highly explosive.
liquid.eclipse-ammonia.name = Ammonia
liquid.eclipse-ammonia.description = A pungent gas synthesized from nitrogen and hydrogen under high pressure. The foundation of nitrogen chemistry.
liquid.eclipse-nitric-acid.name = Nitric Acid
liquid.eclipse-nitric-acid.description = A strong oxidizing acid made from ammonia. Used to produce nitrates. [scarlet]Corrodes ordinary liquid blocks; use polymer conduits and tanks.[]

block.eclipse-air-separation-unit.name = Air Separation Unit
block.eclipse-air-separation-unit.description = Liquefies air with cryogenic cooling and separates it into nitrogen and oxygen.\nNitrogen exits the left side, oxygen exits the right side.
block.eclipse-high-pressure-reactor.name = High-Pressure Reactor
block.eclipse-high-pressure-reactor.description = Synthesizes ammonia from nitrogen and hydrogen. Must be pressurized with power before it can operate, and loses pressure when idle.
block.eclipse-nitric-acid-plant.name = Nitric Acid Plant
block.eclipse-ammonium-nitrate-plant.name = Ammonium Nitrate Plant
block.eclipse-ammonium-nitrate-plant.description = Neutralizes nitric acid with ammonia, crystallizing ammonium nitrate.
block.eclipse-explosives-plant.name = Explosives Plant
block.eclipse-explosives-plant.description = Mixes ammonium nitrate with coal into blast compound.
block.eclipse-catalyst-plant.name = Catalyst Plant
block.eclipse-catalyst-plant.description = Chlorinates titanium into a Ziegler-Natta polymerization catalyst.
block.eclipse-polymerization-reactor.description = Links ethylene molecules into solid polyethylene. Requires a polymer catalyst, which is used up slowly.

stat.eclipse-catalyst = Catalyst
stat.eclipse-catalyst-life = (1 used per {0} crafts)
stat.eclipse-pressure = Operating Pressure
stat.eclipse-pressure-value = {0}% (reached in {1}s at full power)
bar.eclipse-pressure = Pressure: {0}%

block.eclipse-polymer-conduit.name = Polymer Conduit
block.eclipse-polymer-conduit.description = A polyethylene-lined conduit. Immune to corrosive chemicals that eat through ordinary conduits.
block.eclipse-polymer-liquid-router.name = Polymer Liquid Router
block.eclipse-polymer-liquid-router.description = A corrosion-resistant liquid router.
block.eclipse-polymer-bridge-conduit.name = Polymer Bridge Conduit
block.eclipse-polymer-bridge-conduit.description = A corrosion-resistant bridge conduit.
block.eclipse-polymer-liquid-tank.name = Polymer Liquid Tank
block.eclipse-polymer-liquid-tank.description = A large corrosion-resistant tank. Safely stores acids, chlorine and chemical waste.

stat.eclipse-corrosive = Corrosive

item.eclipse-nickel.name = Nickel
item.eclipse-nickel.description = A tough, corrosion-resistant metal. The base of superalloys.
item.eclipse-chromium.name = Chromium
item.eclipse-chromium.description = A hard metal that protects alloys from heat and oxidation.
item.eclipse-cobalt.name = Cobalt
item.eclipse-cobalt.description = A dense metal that keeps alloys strong at high temperature.
item.eclipse-tungsten.name = Tungsten
item.eclipse-tungsten.description = An extremely hard, heat-resistant metal. Requires a laser drill to mine.
item.eclipse-lithium.name = Lithium
item.eclipse-lithium.description = A light, reactive metal extracted from brine. Used in high-capacity batteries.
item.eclipse-superalloy.name = Superalloy
item.eclipse-superalloy.description = A nickel-chromium-cobalt alloy that keeps its strength in extreme heat.
item.eclipse-tungsten-carbide.name = Tungsten Carbide
item.eclipse-tungsten-carbide.description = Sintered tungsten and carbon. Nearly as hard as diamond; ideal for cutting tools. Also armour-piercing ammunition for Duo, Fuse, Salvo and Spectre.

block.eclipse-ore-nickel.name = Nickel Ore
block.eclipse-ore-chromium.name = Chromium Ore
block.eclipse-ore-cobalt.name = Cobalt Ore
block.eclipse-ore-tungsten.name = Tungsten Ore

block.eclipse-mineral-separator.name = Mineral Separator
block.eclipse-mineral-separator.description = Leaches molten slag with sulfuric acid and separates trace nickel, chromium, cobalt and tungsten. Works on any map, no new ores required.
block.eclipse-lithium-extractor.name = Lithium Extractor
block.eclipse-lithium-extractor.description = Precipitates lithium out of brine.
block.eclipse-alloy-furnace.name = Alloy Furnace
block.eclipse-alloy-furnace.description = Melts nickel, chromium and cobalt into superalloy. Requires heat from adjacent heaters.
block.eclipse-sintering-furnace.name = Sintering Furnace
block.eclipse-sintering-furnace.description = Presses and sinters tungsten with graphite into tungsten carbide.
block.eclipse-carbide-drill.name = Carbide Drill
block.eclipse-carbide-drill.description = A drill with tungsten carbide bits. Out-mines the larger airblast drill, and hard ores slow it only half as much. Can be boosted with water.
block.eclipse-lithium-battery.name = Lithium Battery
block.eclipse-lithium-battery.description = A high-density lithium battery bank. Stores twice as much power as an industrial battery.
block.eclipse-superalloy-wall.name = Superalloy Wall
block.eclipse-superalloy-wall.description = A very strong wall that also absorbs lasers.
block.eclipse-superalloy-wall-large.name = Large Superalloy Wall
block.eclipse-superalloy-wall-large.description = A very strong wall that also absorbs lasers.\nSpans multiple tiles.

item.eclipse-alumina.name = Alumina
item.eclipse-alumina.description = Aluminium oxide refined from sand with sodium hydroxide. Smelted electrically into aluminium.
item.eclipse-aluminium.name = Aluminium
item.eclipse-aluminium.description = A light, highly conductive metal. Used in heat exchangers and turbines.
item.eclipse-high-purity-silicon.name = High-Purity Silicon
item.eclipse-high-purity-silicon.description = Silicon purified with hydrochloric acid and hydrogen to semiconductor grade.
item.eclipse-microchip.name = Microchip
item.eclipse-microchip.description = Integrated circuits etched into high-purity silicon. Control electronics for advanced machinery.
item.eclipse-reinforced-glass.name = Reinforced Glass
item.eclipse-reinforced-glass.description = Metaglass fused with a titanium mesh. Withstands high pressure and extreme cold.
item.eclipse-surge-superalloy.name = Surge Superalloy
item.eclipse-surge-superalloy.description = Surge alloy bonded into a superalloy matrix in an electric arc. Immensely strong and still crackles with stored charge.
liquid.eclipse-steam.name = Steam
liquid.eclipse-steam.description = Hot water vapor raised in a boiler. Drives steam turbines.
liquid.eclipse-liquid-nitrogen.name = Liquid Nitrogen
liquid.eclipse-liquid-nitrogen.description = Nitrogen condensed to a liquid. The most effective turret coolant, colder than cryofluid. Freezes units.

block.eclipse-heat-exchanger.name = Heat Exchanger
block.eclipse-heat-exchanger.description = Collects heat from its back and sides and passes it out of the front. Use it to route waste heat from exothermic processes.
block.eclipse-industrial-boiler.name = Industrial Boiler
block.eclipse-industrial-boiler.description = Boils purified water into steam using heat. More heat produces more steam.
block.eclipse-steam-turbine.name = Steam Turbine
block.eclipse-steam-turbine.description = Generates power from steam and returns most of the water as purified water.
block.eclipse-sulfuric-acid-plant.description = Burns sulfur in oxygen and absorbs the gas in water to produce sulfuric acid.\nThe reaction gives off waste heat out of the front; recover it with a heat exchanger and boiler.
block.eclipse-alumina-refinery.name = Alumina Refinery
block.eclipse-alumina-refinery.description = Digests sand in hot sodium hydroxide and precipitates alumina. Requires heat.
block.eclipse-aluminium-smelter.name = Aluminium Smelter
block.eclipse-aluminium-smelter.description = Reduces alumina to aluminium with graphite anodes and an enormous electric current.
block.eclipse-glass-kiln.name = Glass Kiln
block.eclipse-glass-kiln.description = Fuses metaglass around a titanium mesh into reinforced glass. Requires heat.
block.eclipse-arc-furnace.name = Arc Furnace
block.eclipse-arc-furnace.description = Bonds surge alloy into superalloy in an electric arc, producing surge superalloy.
block.eclipse-surge-superalloy-wall.name = Surge Superalloy Wall
block.eclipse-surge-superalloy-wall.description = An extremely strong wall that absorbs lasers and arcs lightning at attackers.
block.eclipse-surge-superalloy-wall-large.name = Large Surge Superalloy Wall
block.eclipse-surge-superalloy-wall-large.description = An extremely strong wall that absorbs lasers and arcs lightning at attackers.\nSpans multiple tiles.
block.eclipse-cryogenic-condenser.name = Cryogenic Condenser
block.eclipse-cryogenic-condenser.description = Condenses nitrogen gas into liquid nitrogen using cryofluid refrigeration.
block.eclipse-silicon-refinery.name = Silicon Refinery
block.eclipse-silicon-refinery.description = Purifies silicon to semiconductor grade with hydrochloric acid and hydrogen.
block.eclipse-chip-fabricator.name = Chip Fabricator
block.eclipse-chip-fabricator.description = Etches high-purity silicon into microchips with copper traces and polyethylene packaging.

item.eclipse-molybdenum.name = Molybdenum
item.eclipse-molybdenum.description = A refractory metal with a very high melting point. Its silicide makes excellent electric heating elements.
item.eclipse-vanadium.name = Vanadium
item.eclipse-vanadium.description = A metal recovered from slag. Its four oxidation states make it ideal for redox flow batteries.
item.eclipse-platinum.name = Platinum
item.eclipse-platinum.description = A rare, inert precious metal. An outstanding catalyst.
item.eclipse-thorium-fuel-rod.name = Thorium Fuel Rod
item.eclipse-thorium-fuel-rod.description = Thorium pellets sealed in superalloy cladding. Fuel for the fission reactor. Radioactive.
item.eclipse-spent-fuel-rod.name = Spent Fuel Rod
item.eclipse-spent-fuel-rod.description = A depleted fuel rod. Reprocess it with nitric acid to recover thorium. Radioactive.
liquid.eclipse-aqua-regia.name = Aqua Regia
liquid.eclipse-aqua-regia.description = A mixture of hydrochloric and nitric acid, the only acid that dissolves platinum. [scarlet]Corrodes ordinary liquid blocks; use polymer conduits and tanks.[]

block.eclipse-ore-molybdenum.name = Molybdenum Ore
block.eclipse-ore-platinum.name = Platinum Ore

block.eclipse-nitric-acid-plant.description = Oxidizes ammonia into nitric acid.\nAccepts platinum as an optional catalyst, which doubles its speed.
block.eclipse-aqua-regia-mixer.name = Aqua Regia Mixer
block.eclipse-aqua-regia-mixer.description = Mixes hydrochloric and nitric acid into aqua regia.
block.eclipse-platinum-refinery.name = Platinum Refinery
block.eclipse-platinum-refinery.description = Dissolves trace platinum out of scrap with aqua regia. Produces acidic waste.
block.eclipse-electric-heater.name = Electric Heater
block.eclipse-electric-heater.description = Turns power into heat with molybdenum disilicide elements. Outputs heat in the direction it faces.
block.eclipse-flow-battery.name = Vanadium Flow Battery
block.eclipse-flow-battery.description = Stores energy in tanks of vanadium electrolyte. The largest battery available.
block.eclipse-fuel-rod-fabricator.name = Fuel Rod Fabricator
block.eclipse-fuel-rod-fabricator.description = Seals thorium pellets in superalloy cladding to make fuel rods.
block.eclipse-fission-reactor.name = Fission Reactor
block.eclipse-fission-reactor.description = Burns thorium fuel rods to produce an enormous amount of heat out of the front. Pair it with an industrial boiler and steam turbines.\nLeaves spent fuel rods behind.
block.eclipse-reprocessing-plant.name = Reprocessing Plant
block.eclipse-reprocessing-plant.description = Dissolves spent fuel rods in nitric acid and recovers thorium. Produces acidic waste.

stat.eclipse-catalyst-optional = (optional: {0}x speed)

block.eclipse-aluminium-conveyor.name = Aluminium Conveyor
block.eclipse-aluminium-conveyor.description = A light, fast belt. Moves 20 items per second.
block.eclipse-chromium-conveyor.name = Chromium Conveyor
block.eclipse-chromium-conveyor.description = A hardened belt. Moves 30 items per second.
block.eclipse-superalloy-conveyor.name = Superalloy Conveyor
block.eclipse-superalloy-conveyor.description = A high-speed belt. Moves 40 items per second.
block.eclipse-carbide-conveyor.name = Carbide Conveyor
block.eclipse-carbide-conveyor.description = A very high-speed belt on tungsten carbide rollers. Moves 50 items per second.
block.eclipse-surge-conveyor.name = Surge Conveyor
block.eclipse-surge-conveyor.description = The fastest belt. Moves 60 items per second.\nVanilla junctions, routers and bridges are slower; feed it directly where possible.
block.eclipse-aluminium-conduit.name = Aluminium Conduit
block.eclipse-aluminium-conduit.description = A wide-bore conduit. Carries 3600 liquid per second (plated conduit: 3000). Corrosion-resistant.
block.eclipse-chromium-conduit.name = Chromium Conduit
block.eclipse-chromium-conduit.description = Carries 4200 liquid per second. Corrosion-resistant.
block.eclipse-superalloy-conduit.name = Superalloy Conduit
block.eclipse-superalloy-conduit.description = Carries 4800 liquid per second. Corrosion-resistant.
block.eclipse-carbide-conduit.name = Carbide Conduit
block.eclipse-carbide-conduit.description = Carries 5400 liquid per second. Corrosion-resistant.
block.eclipse-surge-conduit.name = Surge Conduit
block.eclipse-surge-conduit.description = The highest-capacity conduit. Carries 6000 liquid per second. Corrosion-resistant.

block.eclipse-augmentation-coupler.name = Augmentation Coupler
block.eclipse-augmentation-coupler.description = Attaches one upgrade module to an adjacent machine, vanilla or ECLIPSE, without replacing it.\nConnects automatically if only one machine is adjacent; otherwise tap it and then tap the machine to upgrade.\nInsert a module like any item. Unloaders can take it out again.\nSeveral couplers can serve one machine; extra modules of the same kind count for half as much as the previous one.
block.eclipse-basic-module-assembler.name = Basic Module Assembler
block.eclipse-basic-module-assembler.description = Builds tier I upgrade modules. Select the module to build.
block.eclipse-advanced-module-assembler.name = Advanced Module Assembler
block.eclipse-advanced-module-assembler.description = Builds tier II and III upgrade modules. Select the module to build.

item.eclipse-production-accelerator-1.name = Production Accelerator I
item.eclipse-production-accelerator-1.description = Makes the attached machine work 10% faster. The coupler draws extra power to drive it.
item.eclipse-production-accelerator-2.name = Production Accelerator II
item.eclipse-production-accelerator-2.description = Makes the attached machine work 20% faster. The coupler draws extra power to drive it.
item.eclipse-production-accelerator-3.name = Production Accelerator III
item.eclipse-production-accelerator-3.description = Makes the attached machine work 35% faster. The coupler draws a lot of extra power to drive it.
item.eclipse-power-optimizer-1.name = Power Optimizer I
item.eclipse-power-optimizer-1.description = Cuts the attached machine's power draw by 10%.
item.eclipse-power-optimizer-2.name = Power Optimizer II
item.eclipse-power-optimizer-2.description = Cuts the attached machine's power draw by 20%.
item.eclipse-power-optimizer-3.name = Power Optimizer III
item.eclipse-power-optimizer-3.description = Cuts the attached machine's power draw by 30%.

