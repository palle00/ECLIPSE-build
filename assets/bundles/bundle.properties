eclipse-wiki.fix.working = It is running.
eclipse-wiki.fix.disabled = A logic processor or a switch has turned it off. Turn it back on, or check the processor that controls it.
eclipse-wiki.fix.outputFull = A product has nowhere to go. Give every output a belt or pipe that leads somewhere, and send waste (acidic waste, wastewater, flue gas) to something that takes it. Machines with fixed liquid sides only send each liquid out of its own side.
eclipse-wiki.fix.noPower = It gets no power. Link it to a power node, or check that your grid makes anything at all.
eclipse-wiki.fix.missing = An input is missing. Check that every ingredient reaches it, in the recipe's ratio: a belt blocked by one item stops the others behind it.
eclipse-wiki.fix.noCatalyst = It needs its catalyst. Bring one in with the other inputs; it lasts several crafts.
eclipse-wiki.fix.noHeat = It gets no heat. Point a heater at it: a heater only gives heat to the block it faces, and only its full heat when its whole side touches the machine.
eclipse-wiki.fix.pressurizing = It is building up pressure. Give it a moment; it starts once the pressure is high enough.
eclipse-wiki.fix.lowHeat = It gets some heat but not all, so it runs slowly. Add a heater, or move one so its whole side touches the machine.
eclipse-wiki.fix.noRecipe = No recipe is selected. Tap the machine and pick one.
eclipse-wiki.fix.autoWaiting = It picks its recipe from what arrives and is waiting for an input.
eclipse-wiki.fix.underpowered = The grid doesn't deliver its full tier power, and below full power a machine stops. Add generators or batteries, or move it to a stronger grid.
eclipse-wiki.fix.heatShort = It gets less heat than the recipe needs. Add a heater, or move one so its whole side touches the machine: a heater touching with only part of its side gives only part of its heat.
