# military M1: ammunition
status.eclipse-etched.name = Etched
status.eclipse-etched.description = Caustic sulfur has eaten into the hull: armour is halved while it lasts. Applied by sulfur shells from Hail and Ripple.

# military M2: turrets
block.eclipse-acid-mortar.name = Acid Mortar
block.eclipse-acid-mortar.description = Lobs shells of acid over long range. The blast etches armour, and the acid pools where it lands, corroding every ground unit that wades through. Chemical-grade lining: its own acid does not corrode it. Ground targets only.
block.eclipse-minelayer.name = Minelayer
block.eclipse-minelayer.description = Lobs mines onto the enemy's path. Each mine waits on the ground for up to 30 seconds and goes off under the first ground unit to cross it. Fires ammonium nitrate or blast compound.
block.eclipse-heat-lance.name = Heat Lance
block.eclipse-heat-lance.description = A continuous beam powered by heat instead of electricity. Needs 12 heat to fire; more heat, up to 24, makes the beam twice as strong. Sets targets melting.
block.eclipse-jammer.name = Jammer
block.eclipse-jammer.description = Every 3 seconds sends out a pulse that jams enemy units in range: their weapons fire 40% slower for 4 seconds. Bosses shake it off in half the time. Does not affect buildings.
status.eclipse-jammed.name = Jammed
status.eclipse-jammed.description = Targeting and feed systems are being jammed: weapons fire 40% slower while it lasts. Applied by the Jammer.

# military M3: unit lines (built in the vanilla factories and reconstructors)
unit.eclipse-reaper.name = Reaper
unit.eclipse-reaper.description = Fast light tank. Its armour-piercing autocannon tears into buildings. Built in the Ground Factory.
unit.eclipse-bulwark.name = Bulwark
unit.eclipse-bulwark.description = Armoured tank with an armour-piercing cannon. Shrugs off light fire.
unit.eclipse-rampart.name = Rampart
unit.eclipse-rampart.description = Heavy tank with a frontal shield arc that soaks up incoming fire while its twin armour-piercing cannons work.
unit.eclipse-annihilator.name = Annihilator
unit.eclipse-annihilator.description = Siege tank. Its long-range caustic shells etch armour for every gun behind it; armour-piercing guns cover its flanks. Crushes enemy blocks it rolls over.
unit.eclipse-colossus.name = Colossus
unit.eclipse-colossus.description = Massive armoured tank. Its main cannon pierces armour and several targets in a row; two acid mortars leave corrosive pools behind the enemy line.
unit.eclipse-wraith.name = Wraith
unit.eclipse-wraith.description = Fast reconnaissance craft. Its light guns mark targets with Etched, halving their armour for heavier guns.
unit.eclipse-interceptor.name = Interceptor
unit.eclipse-interceptor.description = Anti-air fighter. Fires homing missiles at aircraft only.
unit.eclipse-valkyrie.name = Valkyrie
unit.eclipse-valkyrie.description = Gunship with rapid armour-piercing guns against air and ground.
unit.eclipse-tempest.name = Tempest
unit.eclipse-tempest.description = Strategic bomber. Each bomb scatters mines that wait on the ground for the enemy. Ground targets only.
unit.eclipse-leviathan.name = Leviathan
unit.eclipse-leviathan.description = Aerial command platform. Its jamming pulse slows enemy fire around it, point defences shoot down incoming bullets, and a heavy lance burns through targets.
ability.eclipse-jampulse = Jamming Pulse
ability.eclipse-jampulse.stats = Jams enemy units within {0} blocks every {1} s for {2} s (weapons 40% slower; bosses half as long)

# military M4: enemy factions joining the waves of custom games
eclipse-factions-start = [#c9d36a]The Swarm[] (every 2nd wave) and [#e0683a]the Dominion[] (every 3rd wave) join the waves. Every 6th wave they attack together.
unit.eclipse-mite.name = Mite
unit.eclipse-mite.description = Swarm. Small self-repairing biological machine that spits acid at close range. Comes in large numbers.
unit.eclipse-wasp.name = Wasp
unit.eclipse-wasp.description = Swarm. Fast flyer whose acid sting corrodes its target.
unit.eclipse-spitter.name = Spitter
unit.eclipse-spitter.description = Swarm. Lobs globs of acid that leave corrosive pools.
unit.eclipse-brood.name = Brood
unit.eclipse-brood.description = Swarm. Sprays spores that slow its targets. When it dies it bursts into four Mites.
unit.eclipse-behemoth.name = Behemoth
unit.eclipse-behemoth.description = Swarm boss. Regenerates quickly, keeps breeding Mites and bombards with acid.

# military M5: endgame
block.eclipse-titan-manufacturing-complex.name = Titan Manufacturing Complex
block.eclipse-titan-manufacturing-complex.description = Builds the Dreadnought. One per team: while your Dreadnought is alive, the complex pauses and uses nothing.
unit.eclipse-dreadnought.name = Dreadnought
unit.eclipse-dreadnought.description = Titan-class tank. Twin armour-piercing heavy cannons, a heat lance, acid mortars, a broad frontal shield and a jamming pulse. Only one per team.
block.eclipse-orbital-weapons-platform.name = Orbital Weapons Platform
block.eclipse-orbital-weapons-platform.description = Tap it, then tap any spot within 150 blocks to set a target. Charges for two minutes on power, then spends superconductors, aetherite and blast compound on one strike: a warning marks the target, and three seconds later everything enemy in a 10-block radius takes 3000 damage.
unit.eclipse-ew-drone.name = Electronic Warfare Drone
unit.eclipse-ew-drone.description = Unarmed and fragile. Every 5 seconds it scrambles enemy turrets within 10 blocks: they aim and fire at half speed for 4 seconds. It never disables them or touches other buildings. Built in the Air Factory.
ability.eclipse-ewpulse = Fire-Control Jamming
ability.eclipse-ewpulse.stats = Every {1} s, enemy turrets within {0} blocks aim and fire {2}% slower for {3} s

