eclipse-wiki.setup = Minimal setup
eclipse-wiki.setup.hint = Items arrive on the belt from the left, liquids in conduits; outputs leave the way the machine sends them. Machines that send liquids out of fixed sides are shown facing up (the arrow marks the front), so their left and right are the picture's left and right. Heat machines need a heater facing them; powered machines need power.

eclipse-wiki.guide.start.name = Getting Started
eclipse-wiki.guide.start.text = ECLIPSE turns Serpulo into a deeper industry: machine parts, chemistry, new metals, upgrade modules, robots, new turrets and two enemy factions. It works in free play and custom games on any Serpulo map. Research is part of the normal tech tree, and in the build menu every ECLIPSE block sits next to the vanilla blocks it builds on (the Rivet right after the Duo).\n\n[accent]How it fits together[]\nFour branches feed each other:\n- [accent]Mechanical parts[] (gears, rods, casings, bearings, frames, precision parts): what ECLIPSE buildings are made of.\n- [accent]Chemistry[] (water, brine and oil into gases, acids and plastics): inputs for the special processes.\n- [accent]Metallurgy[] (new ores into alloys): stronger materials for later machines.\n- [accent]Electronics[] (wire, circuit boards, microchips, control units): the brains of smart and late-game blocks.\nVanilla materials never go out of use: copper, lead, graphite, silicon, titanium, thorium, surge and phase are needed at every stage.\n\n[accent]Stage 1: the first minutes (copper, lead, graphite)[]\n1. Build a [accent]Gear Press[] (copper into copper gears) and a [accent]Wire Drawing Machine[] (copper into wire). Gears and wire are in most early ECLIPSE costs.\n2. Put a [accent]Rivet[] or two at your entrances: a cheap 1x1 gatling that fires faster the longer it shoots.\n3. Drop a [accent]Flow Meter[] into any belt to see how many items per second pass. It costs almost nothing and never slows the belt.\n\n[accent]Stage 2: titanium[]\n1. [accent]Metal Extruder[] (titanium into rods) and [accent]Heavy Gear Press[] (titanium gears). Then [accent]Bearing Press[] and [accent]Casing Forge[]. These parts unlock most mid-game machines.\n2. Build a [accent]Component Depot[] next to your part lines. It keeps your core stocked with up to 200 of each part, from anywhere on the map, so you can build without belting parts to the core.\n3. Start chemistry: pump water into a [accent]Water Treatment Plant[] (purified water out the left, brine out the right). Purified water feeds the [accent]Electrolysis Plant[] (hydrogen and oxygen); brine feeds the [accent]Chlor-Alkali Cell[]. Oil goes into the [accent]Distillation Column[].\n4. [scarlet]Acids eat ordinary conduits.[] Pipe them with polymer or plated conduits. See Chemistry and Corrosion.\n5. Defence: the [accent]Sickle[] throws a sawblade that cuts through ground units out and back.\n\n[accent]Stage 3: new metals, heat and electronics[]\n1. Nickel, chromium and molybdenum are near your core; cobalt, tungsten and platinum further out. No ore on the map? Crush scrap in the [accent]Ore Crusher[] and wash it in the [accent]Ore Washer[].\n2. Many machines need [accent]heat[]: point an [accent]Industrial Heater[] (methane) or [accent]Electric Heater[] at them. The [accent]Alloy Furnace[] turns nickel, chromium and cobalt into superalloy.\n3. Electronics: circuit boards, high-purity silicon, microchips and precision components.\n4. [accent]Upgrade modules[]: put an [accent]Augmentation Coupler[] next to any machine (vanilla too), build modules in a [accent]Basic Module Assembler[] and insert one. Faster, cheaper or more productive machines.\n5. Defence: [accent]Tremor[] (a ground shockwave on power), [accent]Heat Lance[], [accent]Acid Mortar[], and anti-air from [accent]Kestrel[] and [accent]Thunderhead[].\n\n[accent]Stage 4: late game[]\n- Power: a [accent]Fission Reactor[] heating [accent]Industrial Boilers[] for [accent]Steam Turbines[], or methane turbines and fuel cells.\n- [accent]Robots[]: build drones in the Air Factory and give them jobs at a [accent]Robot Dispatch Hub[].\n- [accent]Experimental cores[] and [accent]surge superalloy[] open the endgame: the [accent]Lattice Drill[] (mines a whole ore patch), the [accent]Apiary[] and [accent]Event Horizon[] turrets, the Orbital Weapons Platform and the World Engine.\n\n[accent]The enemy[]\nIn custom games, waves also bring the [accent]Swarm[] (every 2nd wave) and the [accent]Dominion[] (every 3rd). See Enemy Factions and Military.\n\n[accent]Good to know[]\n- Press [accent]I[] over any ECLIPSE block or unit to open its page here (rebind it under Controls).\n- Every page lists what a block needs, what it makes, what makes its ingredients and what uses its products. Click an icon to jump there.\n- A machine that stops tells you why: select it and read its status bar (an output with nowhere to go, a missing input, no heat, no catalyst).\n- Machines with several liquid outputs send each out of a fixed side; coloured arrows show which while you place them.\n- Waste (acidic waste, wastewater, flue gas) must go somewhere, or the machine that makes it stalls.\n- Want to see everything running first? Open the [accent]ECLIPSE Showcase[] map in Custom Games.

eclipse-wiki.guide.components.name = Mechanical Components
eclipse-wiki.guide.components.text = Advanced buildings are not made from raw metal alone: they need machine parts. Components come in tiers, and each tier is used by buildings of matching complexity:\n- [accent]Copper gears and copper wire[]: basic machinery, sorters, pumps, tier I modules.\n- [accent]Titanium rods, titanium gears, pressure casings[]: industrial machinery, reactors, columns, fast belts, tier II modules.\n- [accent]Industrial bearings and superalloy frames[]: turbines, drills, heavy and hot machinery.\n- [accent]Precision components[]: smart logistics, electronics, tier III modules.\n- [accent]Experimental cores[]: endgame machinery and tier IV modules.\n\nBuild a [accent]Component Depot[] next to your component lines. It stores components only and keeps your core stocked with up to 200 of each from anywhere on the map, so you can always build with them without belting everything to the core.

eclipse-wiki.guide.metallurgy.name = Ores and Metals
eclipse-wiki.guide.metallurgy.text = ECLIPSE adds six metals plus aetherite. There are two ways to get them.\n\n[accent]Mining.[] New ore veins are added to newly generated sectors, and to premade custom-game maps when they load. Common ores (nickel, molybdenum, chromium) can appear near your core; rarer ones only further out: cobalt, then tungsten, then platinum, and aetherite farthest of all. Tungsten and aetherite need stronger drills.\n\n[accent]Processing.[] On maps without the ores, crush scrap in the [accent]Ore Crusher[] and wash it in the [accent]Ore Washer[] to separate nickel, chromium, cobalt, molybdenum, vanadium, tungsten, a little platinum and rarely aetherite. The [accent]Mineral Separator[] also leaches trace metals out of slag.\n\n[accent]Key alloys:[] nickel, chromium and cobalt make [accent]superalloy[] in the Alloy Furnace (needs heat); tungsten and graphite make [accent]tungsten carbide[] in the Sintering Furnace; superalloy and surge alloy make [accent]surge superalloy[] in the Arc Furnace.\n\n[accent]Drills:[] the [accent]Carbide Drill[] out-mines the airblast drill in a smaller footprint. At the very end, the [accent]Lattice Drill[] grows a mining lattice over a whole ore patch and mines all of it through one building.

eclipse-wiki.guide.heat.name = Heat
eclipse-wiki.guide.heat.text = Many ECLIPSE machines need [accent]heat[], the same heat system as Serpulo's newer blocks. A machine shows its heat requirement in its stats; with less heat it runs slower or not at all.\n\n[accent]Heat sources[] send heat out of the side they face, so point them at the machine:\n- [accent]Industrial Heater[]: burns methane; its exhaust is flue gas.\n- [accent]Electric Heater[]: turns power into heat, no fuel.\n- [accent]Geothermal Heat Tap[]: free heat, but only on hot rock or magma rock.\n- [accent]Fission Reactor[]: an enormous amount of heat for boilers.\n\n[accent]Moving heat:[] the [accent]Heat Exchanger[] collects heat from its back and sides and passes it out of the front, so one heater can serve a machine around a corner. Some reactions give off waste heat you can recover this way. [accent]Thermal Storage[] works like an exchanger with a reservoir: it keeps heating for a while when the fuel runs out.\n\n[accent]Heat into power:[] an [accent]Industrial Boiler[] makes steam from purified water using heat, and [accent]Steam Turbines[] turn the steam into power and return most of the water.\n\n[accent]Placing a heater:[] the block in front of it is outlined, with how much heat it would get and what it needs.

eclipse-wiki.guide.chemistry.name = Chemistry and Corrosion
eclipse-wiki.guide.chemistry.text = The chemical industry starts with water. The [accent]Water Treatment Plant[] makes purified water and brine. The [accent]Electrolysis Plant[] splits purified water into hydrogen and oxygen, and the [accent]Chlor-Alkali Cell[] turns brine into chlorine, hydrogen and sodium hydroxide. Crude oil goes into the [accent]Distillation Column[] for naphtha, methane and sulfur. From these come acids, plastics, fertilizer and explosives.\n\n[scarlet]Corrosion:[] acids, chlorine, sodium hydroxide and acidic waste slowly destroy ordinary liquid blocks (about 1% of their health per second). Every ECLIPSE liquid block and the vanilla plated conduit resist it. Use [accent]polymer conduits, routers, bridges and tanks[], or the metal conduits from aluminium up.\n\n[accent]Outputs by side:[] machines with two or three liquid products send each out of a fixed side (left, right or front). Their descriptions say which.\n\n[accent]Waste must go somewhere.[] Acidic waste, wastewater and flue gas back up and stall the machine that makes them. Neutralize acidic waste in the [accent]Industrial Neutralizer[], treat wastewater, and scrub or separate flue gas.\n\n[accent]Special reactors:[] some need a [accent]catalyst[] item that is only used up every few crafts; others must first be [accent]pressurized[] with power, and lose pressure when idle.\n\n[accent]When a machine stops:[] select it. Its status bar says why, for example which output has nowhere to go, which input is missing, or that it needs heat or a catalyst. While placing a machine, coloured arrows show which liquid leaves which side.

eclipse-wiki.guide.electronics.name = Electronics
eclipse-wiki.guide.electronics.text = Electronics form a chain of their own:\n1. [accent]Copper wire[] from the Wire Drawing Machine.\n2. [accent]Circuit boards[]: wire traces on polyethylene, etched in hydrochloric acid (leaves acidic waste).\n3. [accent]High-purity silicon[] from the Silicon Refinery, using hydrochloric acid and hydrogen.\n4. [accent]Microchips[] from the Chip Fabricator.\n5. [accent]Control units[]: microchips, circuit boards and AlNiCo magnets.\n\nAlNiCo magnets come from the Induction Furnace (aluminium, nickel and cobalt). Control units automate advanced drills, smart logistics, reactors and module assemblers, so this chain gates much of the late game.

eclipse-wiki.guide.power.name = Power and Storage
eclipse-wiki.guide.power.text = [accent]Generators:[]\n- [accent]Hydrogen Fuel Cell[]: hydrogen and oxygen; gives purified water back.\n- [accent]Methane Turbine[]: strong power from methane; pipe its flue gas away.\n- [accent]Biofuel Engine[]: burns biofuel from fermented biomass.\n- [accent]Steam Turbine[]: runs on steam from an Industrial Boiler. Boilers heated by a Fission Reactor give the largest output.\n- [accent]World Engine[]: the endgame project, a planetary power source.\n\n[accent]Storage[], from small to large: Industrial Battery, Lithium Battery, Vanadium Flow Battery, Aetherite Capacitor.\n\nThe Capacitor Module can also keep one machine running through short power shortages.

eclipse-wiki.guide.logistics.name = Smart Logistics
eclipse-wiki.guide.logistics.text = ECLIPSE routers never lose or duplicate items: if an item's destination is full, the item waits on its belt instead of going somewhere wrong. Sides are relative to the block's rotation, so rotating a router rotates its routes. Like vanilla sorters, two instant routers need a belt between them.\n- [accent]Three-Way Sorter / Distribution Hub[]: send chosen items left, front or right, with a fallback side.\n- [accent]Advanced Item Filter[]: an allow or deny list; passing items go straight, the rest to the sides.\n- [accent]Priority Merger[]: merge three lines by priority or in turns.\n- [accent]Controlled Splitter / Line Balancer[]: split one line evenly, by ratio (for example 2:1) or by priority.\n- [accent]Logistics Buffers[]: smooth uneven supply, optionally keeping a reserve.\n- [accent]Batch Gate[]: release items in batches.\n- [accent]Smart Unloader[]: unload up to three chosen items.\n- [accent]Liquid valves[]: overflow, balance, or keep a reserve in a tank.\n\nFaster belts and conduits (aluminium up to surge) carry far more than vanilla ones.\n\n[accent]Flow Meter:[] a cheap block you put into a belt; it shows how many items per second pass.\n[accent]Upgrade Section[] (desktop): select a better belt, conduit or wall, hold Alt (rebindable in Controls) over an existing line and click: the whole connected line or wall gets replacement plans, built normally.

eclipse-wiki.guide.augmentation.name = Augmentation
eclipse-wiki.guide.augmentation.text = Upgrade modules improve a machine without replacing it. They are real items: build them in a module assembler, move them on belts, and insert them into a [accent]coupler[] next to the machine.\n\n[accent]Setting up:[] place a coupler touching the machine. With only one machine next to it, it connects by itself; otherwise tap the coupler, then the machine. Give the coupler power (and coolant for some chemical modules), then insert modules like any item.\n\n[accent]Couplers:[] Augmentation Coupler (1 slot), Advanced Coupler (2), Industrial Augmentation Hub (4), Chemical Augmentation Interface (3, chemical modules, big coolant tank), Military Augmentation Interface (3, turret modules).\n\n[accent]Stacking:[] the strongest module of a kind counts fully, each further one half as much as the previous, up to a cap. Output Amplifiers and Precision Fabricators exclude each other, and unique and legendary modules work once per machine. Hover over the coupler to see each module's state.\n\n[accent]Tiers:[] I from the Basic Module Assembler, II and III from the Advanced Module Assembler, IV and legendary from the Experimental Augmentation Facility, V from the Aetherite Module Forge. Unwanted modules go into the Module Recycling Facility for half their materials.

eclipse-wiki.guide.robotics.name = Robotics
eclipse-wiki.guide.robotics.text = ECLIPSE robots are small flying helpers built in the vanilla [accent]Air Factory[]. They only work from a [accent]Robot Dispatch Hub[], which holds up to 4 robots and reaches 25 blocks.\n1. Build a hub and give it power.\n2. Build robots; each signs in to the nearest hub with a free slot.\n3. Tap the hub to set each robot's job: a logistics drone needs a source, a destination and an item; a repair drone needs the building to repair.\n\n- [accent]Logistics Drone[]: carries one item type between two buildings. Good for awkward local routes, slower than belts.\n- [accent]Repair Drone[]: repairs one building from repair charge, refilled at the hub with titanium rods.\n- [accent]Shield Drone[]: escorts your largest group of units and tops up their shields.\n\nRobots fly home to recharge and never act beyond their hub's range.

eclipse-wiki.guide.defense.name = Defense and Waves
eclipse-wiki.guide.defense.text = [accent]Know what is coming:[] the [accent]Wave Intelligence Scanner[] (Logic tab) reports the next wave's units, counts, shields and bosses. Link it to logic displays to show the report on screens.\n\n[accent]Buy time:[] the [accent]Wave Disruption Array[] and the [accent]Temporal Interference Array[] delay the incoming wave. They share one lockout, so delays never stack.\n\n[accent]Protect units:[] the [accent]Unit Shield Beacon[] shields friendly units inside its field from a shared pool.\n\n[accent]Repair:[] the [accent]Emergency Repair Dispatch Bay[] quickly repairs one chosen building using titanium rods.\n\nThe new walls (superalloy, surge superalloy, composite) are far tougher than vanilla walls; some absorb lasers or deflect bullets.

eclipse-wiki.guide.military.name = Military
eclipse-wiki.guide.military.text = [accent]Ammunition for vanilla turrets:[] tungsten carbide (armor-piercing) for Duo, Fuse, Salvo and Spectre; sulfur (armor-etching) and lead-acid cells (EMP: everything hit is Jammed) for Hail and Ripple. The Acid Mortar can also fire Acidic Waste. Liquid nitrogen is the best turret coolant.\n\n[accent]Turrets:[]\n- [accent]Acid Mortar[]: long-range acid shells that etch armor and leave corrosive pools.\n- [accent]Minelayer[]: lays mines on the enemy's path.\n- [accent]Heat Lance[]: a beam powered by heat instead of power.\n- [accent]Jammer[]: slows enemy weapons in range.\n- [accent]Piledriver[]: a slug through up to three armoured ground units in a line.\n\n[accent]A turret for every stage[] (weakest to strongest):\n- [accent]Rivet[] (copper age): a 1x1 gatling that spins up to triple fire rate while it keeps shooting.\n- [accent]Sickle[] (titanium): a sawblade that flies out and back, cutting ground units both ways.\n- [accent]Tremor[] (power): a ground shockwave that throws enemies back and slows them.\n- [accent]Apiary[] (plastanium, microchips): drones that circle the enemy and shoot ground and air.\n- [accent]Event Horizon[] (endgame, aetherite): a singularity that pulls enemies together, then collapses.\n\n[accent]Anti-air:[] [accent]Kestrel[] hunts the strongest aircraft with guided missiles, [accent]Thunderhead[] chains lightning through flocks, and [accent]Cloudbreaker[] fills the air around it with mines.\n\n[accent]Units:[] two new lines built in the vanilla factories and reconstructors: tanks (Reaper, Bulwark, Rampart, Annihilator, Colossus) and strike aircraft (Wraith, Interceptor, Valkyrie, Tempest, Leviathan). The Electronic Warfare Drone slows enemy turrets.\n\n[accent]Endgame:[] the [accent]Titan Manufacturing Complex[] builds one Dreadnought per team, and the [accent]Orbital Weapons Platform[] calls down a strike anywhere within 150 blocks.\n\n[accent]Turret statistics:[] select any turret, vanilla or ECLIPSE, to see its DPS (last 5 seconds), enemies killed and damage done since the map was loaded.

eclipse-wiki.guide.factions.name = Enemy Factions
eclipse-wiki.guide.factions.text = Every new custom game with waves (and older custom-game saves, the first time they load) gets two enemy factions on top of the map's own waves. The campaign and PvP are not changed.\n\n[accent]The Swarm[] attacks on every 2nd wave: self-repairing biological machines in growing numbers. Mites spit acid, Wasps sting from the air, Spitters leave acid pools, Broods burst into Mites when killed, and from wave 24 a Behemoth boss comes every 12 waves, breeding Mites as it advances. Kill Broods away from your walls, and keep splash damage ready.\n\n[accent]The Dominion[] attacks on every 3rd wave: few but heavily armored units from the ECLIPSE tank and aircraft lines, with shields from mid-game and Colossus and Leviathan bosses late. Armor-piercing ammunition and armor-etching shells pay off here.\n\n[accent]Every 6th wave both factions attack together.[] Use the Wave Intelligence Scanner to see exactly what the next wave holds.

eclipse-wiki.guide.exploration.name = Exploration and Environment
eclipse-wiki.guide.exploration.text = The ground you build on matters:\n- [accent]Hot rock and magma rock[]: build Geothermal Heat Taps for free heat.\n- [accent]Ice and snow[]: the Cooling Tower and Cryogenic Condenser run faster on cold ground.\n- [accent]Moss and spore moss[]: the Biomass Cultivator grows faster.\n\n[accent]Aetherite[] is the rarest resource: crystal deposits far from your starting core (they need a carbide drill), or a rare find from the Ore Washer. It powers Tier V modules, Aetherite Capacitors, superconductors and the Orbital Weapons Platform.

# wiki entries: materials
wiki.eclipse-sulfur = Sulfur is a byproduct of refining: the Distillation Column recovers it from crude oil, and the Industrial Scrubber recovers it from flue gas. Most of it goes into the Sulfuric Acid Plant.\n\nIt is also caustic ammunition for Hail and Ripple: its shells etch enemy armor, so every other gun hits harder.
wiki.eclipse-polyethylene = The first ECLIPSE plastic, polymerized from ethylene in the Polymerization Reactor with a polymer catalyst. Ethylene comes from naphtha in the Steam Cracker, so polyethylene needs the whole oil line: Distillation Column, heater and cracker.\n\nIt goes into casings, circuit boards, microchip packaging and corrosion-proof liquid blocks.
wiki.eclipse-lead-acid-cell = A rechargeable cell: lead plates, a polyethylene case and sulfuric acid. The Battery Assembly Plant makes it, and the Industrial Battery is built from it. A good first use for your sulfuric acid line.
wiki.eclipse-nickel = The most common new metal. Nickel ore appears even close to your core; without it, wash crushed scrap in the Ore Washer.\n\nNickel is the base of superalloy and part of AlNiCo magnets, so you will need a steady supply from the mid game on.
wiki.eclipse-chromium = A hard metal for heat-resistant alloys, mainly superalloy. Its ore is fairly common but sits a little away from the starting core. The Ore Washer also recovers it from scrap.
wiki.eclipse-cobalt = A dense metal that keeps alloys strong in heat. It goes into superalloy and AlNiCo magnets. Its ore is found at medium distance from the core; the Ore Washer and the Mineral Separator also recover it.
wiki.eclipse-tungsten = An extremely hard metal. Its ore lies far from the core and needs a laser drill or better. It can also be washed out of crushed scrap or leached from slag.\n\nSintered with graphite it becomes tungsten carbide, which makes the fastest drill, armor-piercing ammunition and late machinery.
wiki.eclipse-lithium = A light, reactive metal precipitated from brine in the Lithium Extractor, so any map with water can supply it. Lithium Batteries and several late modules need it.
wiki.eclipse-superalloy = The backbone of ECLIPSE's mid and late game. The Alloy Furnace melts nickel, chromium and cobalt into it, and needs heat from adjacent heaters to do so.\n\nSuperalloy goes into frames, fuel rod cladding, strong walls, fast belts and many machines. Plan a dedicated line early.
wiki.eclipse-tungsten-carbide = Tungsten sintered with graphite in the Sintering Furnace. Nearly as hard as diamond.\n\nUses: the Carbide Drill, fast carbide belts and conduits, advanced modules, and armor-piercing ammunition for Duo, Fuse, Salvo and Spectre, which is very effective against the armored Dominion.
wiki.eclipse-alumina = Aluminium oxide, digested out of sand with hot sodium hydroxide in the Alumina Refinery. It has one job: being smelted into aluminium in the power-hungry Aluminium Smelter.
wiki.eclipse-aluminium = A light, conductive metal smelted from alumina with graphite anodes and a huge electric current. Plan plenty of power for the Aluminium Smelter.\n\nUsed in turbines, heat exchangers, magnets, robots, the first fast belts and many mid-game machines.
wiki.eclipse-high-purity-silicon = Silicon purified to semiconductor grade in the Silicon Refinery, using hydrochloric acid and hydrogen. Microchips are etched from it, and precision components need it too.
wiki.eclipse-microchip = Integrated circuits made in the Chip Fabricator from high-purity silicon, copper wire and polyethylene. Microchips are a key late-game material: control units, modules, robots and most advanced machines use them. Build several fabricators.
wiki.eclipse-reinforced-glass = Metaglass fused around a titanium mesh in the Glass Kiln, which needs heat. It withstands pressure and deep cold, so cryogenic and high-pressure equipment is built with it.
wiki.eclipse-surge-superalloy = Surge alloy bonded into superalloy in the Arc Furnace. One of the strongest materials in the game: endgame walls, experimental cores, the titan and the orbital platform use it.
wiki.eclipse-molybdenum = A refractory metal. Its ore is fairly common; the Ore Washer also separates it from crushed scrap.\n\nMolybdenum makes electric heating elements and is the catalyst of the Acrylonitrile Reactor.
wiki.eclipse-vanadium = Recovered from slag and crushed scrap. Its main use is the electrolyte of the Vanadium Flow Battery, the largest battery; some late modules use it too.
wiki.eclipse-platinum = The rarest metal. Its ore lies very far from the core; the Platinum Refinery dissolves trace platinum out of scrap with aqua regia, and the Ore Washer finds a little.\n\nPlatinum is a catalyst (it doubles the Nitric Acid Plant's speed and drives the Chemical Synthesis Complex) and goes into experimental cores and legendary modules.
wiki.eclipse-thorium-fuel-rod = Thorium sealed in superalloy cladding by the Fuel Rod Fabricator. It fuels the Fission Reactor. Each spent rod can be reprocessed with nitric acid to recover thorium, so a reactor does not need endless mining.
wiki.eclipse-spent-fuel-rod = What a fission reactor leaves behind. Do not let it pile up in the reactor: send it to the Reprocessing Plant, which recovers thorium with nitric acid (and makes acidic waste to neutralize).
wiki.eclipse-polymer-catalyst = A titanium chloride catalyst made in the Catalyst Plant from titanium and chlorine. The Polymerization Reactor and the Rubber Plant hold it while they work and only use one up every several crafts, so a small supply lasts a long time.
wiki.eclipse-ammonium-nitrate = A powerful oxidizer made from nitric acid and ammonia. The Explosives Plant mixes it with coal into blast compound, and the Minelayer can fire it directly as mines.
wiki.eclipse-copper-gear = The first mechanical component, pressed from copper in the Gear Press. Cheap and needed everywhere early: basic machines, sorters, pumps and tier I modules.
wiki.eclipse-titanium-rod = Titanium extruded in the Metal Extruder, with graphite as lubricant. Rods are the start of the titanium component tier: they go into titanium gears, pressure casings and bearings, and robot hubs and repair bays use them as repair stock.
wiki.eclipse-titanium-gear = Hard-wearing gears from the Heavy Gear Press. Industrial machinery, reactors, fast belts, precision components and tier II modules need them.
wiki.eclipse-pressure-casing = A sealed vessel shell from the Casing Forge. Every chemical reactor, column and boiler needs some to be built. Stock a few dozen before expanding your chemistry.
wiki.eclipse-industrial-bearing = Precision bearings from the Bearing Press. Anything that spins fast needs them: turbines, drills, compressors, heavy machinery.
wiki.eclipse-superalloy-frame = A heavy machine frame hot-formed from superalloy and titanium rods in the Frame Forge (needs heat). Big, hot and high-pressure machinery is built on it.
wiki.eclipse-precision-component = Fine assemblies from the Precision Assembler. They gate smart logistics, electronics and tier III modules.
wiki.eclipse-experimental-core = The top component: precision parts around surge superalloy, platinum and phase fabric. Only endgame machinery and tier IV modules need it.
wiki.eclipse-copper-wire = Drawn copper from the Wire Drawing Machine. Circuit boards are made from it, and electrical machines, heaters and batteries use it.
wiki.eclipse-circuit-board = Copper traces on polyethylene, etched in hydrochloric acid by the Circuit Board Printer. The acid leaves as acidic waste, so the printer needs a neutralizer nearby. Control units, smart logistics and augmentation interfaces use boards.
wiki.eclipse-control-unit = A microchip controller with a motor drive, built from microchips, circuit boards and AlNiCo magnets. It automates advanced drills, smart logistics, reactors and assemblers.
wiki.eclipse-alnico-magnet = An aluminium-nickel-cobalt magnet melted in the Induction Furnace (power, no heat). Motors, turbines, control units and drones use it.
wiki.eclipse-crushed-ore = Scrap and rock crushed in the Ore Crusher. Wash it in the Ore Washer to separate metals. This is the way to get ECLIPSE metals on any map.
wiki.eclipse-aetherite = A rare energy crystal. Deposits lie farthest from your core and need a carbide drill; the Ore Washer turns up one now and then.\n\nAetherite powers Tier V modules, Aetherite Capacitors, superconductors and the Orbital Weapons Platform's strikes.
wiki.eclipse-superconductor = The most advanced material, synthesized in the Chemical Synthesis Complex from copper wire and aetherite in nitric acid, under pressure, over platinum, cooled by liquid nitrogen. The World Engine, the Temporal Interference Array and the Orbital Weapons Platform need it.
wiki.eclipse-synthetic-rubber = Rubber polymerized from ethylene and propylene with a polymer catalyst and vulcanized with sulfur. Seals and belts for advanced machinery.
wiki.eclipse-epoxy-resin = A hard-setting resin from propylene, chlorine and sodium hydroxide. It binds carbon fiber into carbon composite.
wiki.eclipse-carbon-fiber = Acrylonitrile spun and carbonized at very high heat in the Carbon Fiber Furnace. Pressed with epoxy it becomes carbon composite.
wiki.eclipse-carbon-composite = Carbon fiber set in epoxy: light and extremely strong. Composite walls, robots, late units and the orbital platform are built with it.
wiki.eclipse-biomass = Plant and algae matter from the Biomass Cultivator or the Algae Photobioreactor. Ferment it into biofuel, extract enzymes from it, or digest it into methane and fertilizer.
wiki.eclipse-fertilizer = Feeds the biomass growers. Make it from ammonia and sulfuric acid in the Fertilizer Plant, or as digestate from the Anaerobic Digester.
wiki.eclipse-enzyme-extract = Biological catalysts from biomass and spore pods. Keep some in the Biochemical Fermenter and it works twice as fast; it is used up slowly.
wiki.eclipse-biofuel = Ethanol fermented from biomass. Burn it in Biofuel Engines for power: a renewable alternative to oil.

# wiki entries: liquids and gases
wiki.eclipse-purified-water = Water stripped of minerals by the Water Treatment Plant. Electrolysis, boilers and many sensitive processes require it. Fuel cells and steam turbines return some, so a closed loop wastes little.
wiki.eclipse-brine = Concentrated salt water, the second output of water treatment. Do not let it back up: feed it to the Chlor-Alkali Cell or the Lithium Extractor.
wiki.eclipse-hydrochloric-acid = A strong acid made by burning hydrogen in chlorine. It dissolves metals out of scrap, purifies silicon and etches circuit boards.\n[scarlet]Corrosive:[] carry it only in polymer or ECLIPSE metal conduits.
wiki.eclipse-oxygen = Produced by electrolysis and air separation. Fuel cells, sulfuric acid and acrylonitrile need it.
wiki.eclipse-chlorine = A toxic gas from the Chlor-Alkali Cell. It becomes hydrochloric acid, the polymer catalyst, epoxy and titanium from sand.\n[scarlet]Corrosive:[] polymer conduits only.
wiki.eclipse-methane = A light fuel gas from the Distillation Column or the Anaerobic Digester. Burn it in turbines and industrial heaters, or crack it into graphite and hydrogen.
wiki.eclipse-naphtha = A light oil fraction from the Distillation Column. The Steam Cracker turns it into ethylene.
wiki.eclipse-ethylene = Made from naphtha in the Steam Cracker. The building block of polyethylene and synthetic rubber.
wiki.eclipse-sulfuric-acid = Sulfur burned in oxygen and absorbed in water. Batteries, metal leaching, fertilizer, the Mineral Separator and electrowinning use it. Its plant gives off waste heat you can recover.\n[scarlet]Corrosive.[]
wiki.eclipse-sodium-hydroxide = A strong alkali from the Chlor-Alkali Cell. It neutralizes acidic waste, refines alumina, scrubs flue gas and makes metaglass without lead.\n[scarlet]Corrosive.[]
wiki.eclipse-acidic-waste = Spent acid from leaching, etching, electrowinning and reprocessing. If it has nowhere to go, the machine that makes it stops. Pipe it to an Industrial Neutralizer; Waste Recovery modules turn part of it back into acid.\n[scarlet]Corrosive.[]
wiki.eclipse-ammonia = Synthesized from nitrogen and hydrogen in the pressurized High-Pressure Reactor. The base of nitric acid, fertilizer, ammonium nitrate and acrylonitrile.
wiki.eclipse-nitric-acid = Made from ammonia in the Nitric Acid Plant (twice as fast with platinum). Used for nitrates, aqua regia, fuel reprocessing and superconductors.\n[scarlet]Corrosive.[]
wiki.eclipse-steam = Raised in an Industrial Boiler from purified water and heat. Steam Turbines turn it into power and return most of the water.
wiki.eclipse-liquid-nitrogen = Nitrogen condensed in the Cryogenic Condenser. The best turret coolant (colder than cryofluid), it freezes units it hits, and the Chemical Synthesis Complex needs it for cooling.
wiki.eclipse-aqua-regia = Hydrochloric and nitric acid mixed; the only acid that dissolves platinum. The Platinum Refinery uses it.\n[scarlet]Corrosive.[]
wiki.eclipse-flue-gas = Exhaust from methane, biofuel and waste burners. It is vented if not piped away, so it never blocks anything. Piped into an Industrial Scrubber it gives sulfur; into a Gas Separator, nitrogen and carbon dioxide.
wiki.eclipse-carbon-dioxide = Captured from flue gas by the Gas Separator, or released by the fermenter. Turn it into methanol, or feed it to the Algae Photobioreactor.
wiki.eclipse-wastewater = Dirty water from scrubbing and chemical plants. It backs up and stalls them if not removed: the Wastewater Treatment Plant turns it into purified water and sludge.
wiki.eclipse-industrial-sludge = Solids filtered out of wastewater. Burn it in the Thermal Waste Processor for scrap and sand, or let bacteria digest it into methane and fertilizer.
wiki.eclipse-methanol = Made from carbon dioxide and hydrogen. It starts the methanol route to plastics: the Olefin Reactor turns it into propylene.
wiki.eclipse-propylene = A reactive gas from methanol. It goes into epoxy, synthetic rubber and acrylonitrile.
wiki.eclipse-acrylonitrile = A toxic monomer from propylene, ammonia and oxygen. The Carbon Fiber Furnace spins and carbonizes it into carbon fiber.
wiki.eclipse-chilled-water = Water cooled by evaporation in the Cooling Tower. A cheap coolant for turrets and couplers: better than water, not as good as cryofluid.

# wiki entries: ores
wiki.eclipse-ore-nickel = The most common ECLIPSE ore; veins can appear close to the starting core. Any basic drill mines it.
wiki.eclipse-ore-chromium = A common ore found a little away from the starting core.
wiki.eclipse-ore-cobalt = Found at medium distance from the starting core, in smaller veins than nickel.
wiki.eclipse-ore-tungsten = A hard ore far from the starting core. It needs a laser drill or better.
wiki.eclipse-ore-molybdenum = A fairly common ore, found a short way from the starting core.
wiki.eclipse-ore-platinum = The rarest metal ore: small veins very far from the starting core.
wiki.eclipse-ore-aetherite = Energy crystals in small deposits, the farthest of all from the starting core. Mine them with a Carbide Drill.

# wiki entries: water and basic chemistry
wiki.eclipse-water-treatment-plant = The root of the chemical industry. Feed it water (and power): purified water comes out of the left side, brine out of the right.\nBoth outputs must be able to leave, or the plant stops: send brine to a Chlor-Alkali Cell or Lithium Extractor.
wiki.eclipse-electrolysis-plant = Splits purified water into hydrogen (left side) and oxygen (right side). It needs a lot of power. Hydrogen feeds acids, ammonia and silicon refining; oxygen feeds fuel cells and sulfuric acid.
wiki.eclipse-chlor-alkali-cell = Electrolyzes brine into three products: chlorine (left), hydrogen (right) and sodium hydroxide (front). Plan all three outputs before building it; if one backs up, the cell stops.\nChlorine and sodium hydroxide are corrosive: use polymer conduits.
wiki.eclipse-acid-synthesizer = Burns hydrogen in chlorine to make hydrochloric acid. Place it right next to a Chlor-Alkali Cell to save piping, and use polymer conduits for the acid.
wiki.eclipse-acid-leaching-vat = Dissolves scrap in hydrochloric acid and recovers titanium, copper and lead. Acidic waste leaves as a liquid and must be removed, usually into an Industrial Neutralizer. A good use for scrap walls and sand-mining waste.
wiki.eclipse-industrial-neutralizer = Neutralizes acidic waste with sodium hydroxide and returns usable water. Put one next to every acid-using line; acidic waste that cannot leave stalls the machine that makes it.
wiki.eclipse-distillation-column = Separates crude oil: naphtha leaves the left side, methane the right side, and sulfur comes out as an item. This is where the oil route to plastics, fuel and acid starts.
wiki.eclipse-steam-cracker = Cracks naphtha into ethylene with steam. It also needs heat: point an Industrial Heater or Electric Heater at it.
wiki.eclipse-polymerization-reactor = Turns ethylene into polyethylene. Keep a few polymer catalysts in it; they are only used up every several crafts. The reactor will not run without one.
wiki.eclipse-catalyst-plant = Chlorinates titanium into polymer catalyst. One small plant can keep several polymerization reactors and rubber plants supplied.
wiki.eclipse-battery-assembly-plant = Assembles lead-acid cells from lead, polyethylene and sulfuric acid. The cells build Industrial Batteries.
wiki.eclipse-sulfuric-acid-plant = Burns sulfur in oxygen and absorbs it in water to make sulfuric acid. The reaction gives off waste heat out of the front: put a Heat Exchanger and an Industrial Boiler there to turn it into steam.
wiki.eclipse-air-separation-unit = Liquefies air and separates it into nitrogen (left) and oxygen (right). It needs cryofluid for cooling. For nitrogen without cryofluid, use the Gas Separator on flue gas.
wiki.eclipse-high-pressure-reactor = Makes ammonia from nitrogen and hydrogen. It must first build up pressure with power, and loses pressure while idle, so keep its inputs steady. Pressure Stabilizer modules help.
wiki.eclipse-nitric-acid-plant = Oxidizes ammonia into nitric acid. Put platinum in it as an optional catalyst to double its speed.
wiki.eclipse-ammonium-nitrate-plant = Combines nitric acid and ammonia into ammonium nitrate, for explosives and Minelayer ammunition.
wiki.eclipse-explosives-plant = Mixes ammonium nitrate with coal into blast compound: an alternative to the vanilla blast mixer that needs no spores or pyratite.
wiki.eclipse-aqua-regia-mixer = Mixes hydrochloric and nitric acid into aqua regia, which only the Platinum Refinery uses.
wiki.eclipse-platinum-refinery = Dissolves trace platinum out of scrap with aqua regia. Slow, but platinum anywhere. Its acidic waste must be neutralized.
wiki.eclipse-fertilizer-plant = Neutralizes ammonia with sulfuric acid into fertilizer for the biomass growers.
wiki.eclipse-industrial-scrubber = Washes flue gas with sodium hydroxide and recovers its sulfur. Leaves wastewater to treat. Pipe the exhaust of turbines, heaters and engines here.
wiki.eclipse-gas-separator = Splits flue gas through membranes: nitrogen left, carbon dioxide right. A source of nitrogen without cryofluid, and the source of CO2 for methanol and algae.
wiki.eclipse-wastewater-treatment-plant = Settles wastewater into purified water and industrial sludge. Put one after scrubbers and the methanol route.
wiki.eclipse-thermal-waste-processor = Burns industrial sludge with heat from adjacent heaters, recovering scrap and sand. Gives off flue gas.
wiki.eclipse-methanol-synthesizer = Combines carbon dioxide and hydrogen into methanol. Like the High-Pressure Reactor, it must reach operating pressure first.
wiki.eclipse-olefin-reactor = Converts methanol into propylene (left) and wastewater (right).
wiki.eclipse-epoxy-plant = Makes epoxy resin from propylene, chlorine and sodium hydroxide. Leaves wastewater.
wiki.eclipse-rubber-plant = Polymerizes ethylene and propylene into synthetic rubber with sulfur. It holds a polymer catalyst that is used up slowly.
wiki.eclipse-acrylonitrile-reactor = Reacts propylene, ammonia and oxygen into acrylonitrile over a molybdenum catalyst that is used up slowly.
wiki.eclipse-carbon-fiber-furnace = Spins acrylonitrile into fiber and carbonizes it. It needs a lot of heat, so plan two heaters or a heat exchanger network. Gives off flue gas.
wiki.eclipse-composite-press = Lays carbon fiber in epoxy and cures it into carbon composite, the end of the methanol route.
wiki.eclipse-cryogenic-condenser = Condenses nitrogen into liquid nitrogen using cryofluid. Runs faster on ice and snow.
wiki.eclipse-cooling-tower = Cools water by evaporation into chilled water, a cheap coolant. Some water is lost. Runs faster on ice and snow.
wiki.eclipse-chemical-synthesis-complex = The peak of chemistry: makes superconductors from copper wire and aetherite in nitric acid. It must be pressurized, holds a platinum catalyst that is slowly used up, and needs liquid nitrogen cooling. Expect to build most of the chemical industry before it.

# wiki entries: metallurgy
wiki.eclipse-mineral-separator = Leaches molten slag with sulfuric acid and separates trace nickel, chromium, cobalt and tungsten. Feed it slag from a vanilla melter: new metals on any map.
wiki.eclipse-lithium-extractor = Precipitates lithium out of brine. A good use for the brine from water treatment.
wiki.eclipse-alloy-furnace = Melts nickel, chromium and cobalt into superalloy. It needs heat from a heater facing it as well as power. Build several: superalloy is used everywhere later.
wiki.eclipse-sintering-furnace = Sinters tungsten with graphite into tungsten carbide.
wiki.eclipse-alumina-refinery = Digests sand in hot sodium hydroxide into alumina. It needs heat.
wiki.eclipse-aluminium-smelter = Reduces alumina to aluminium with graphite anodes. It draws a huge amount of power; give it its own generators.
wiki.eclipse-glass-kiln = Fuses metaglass around titanium into reinforced glass. It needs heat.
wiki.eclipse-arc-furnace = Bonds surge alloy into superalloy with an electric arc, making surge superalloy. Very power hungry.
wiki.eclipse-silicon-refinery = Purifies silicon to semiconductor grade with hydrochloric acid and hydrogen. Feeds the Chip Fabricator.
wiki.eclipse-ore-crusher = Crushes scrap into crushed ore, leaving sand. The first step of getting ECLIPSE metals on any map.
wiki.eclipse-ore-washer = Washes crushed ore with water and separates nickel, chromium, cobalt, molybdenum, vanadium, tungsten, some platinum and rarely aetherite. Sort its mixed output with a Three-Way Sorter or Advanced Item Filter.
wiki.eclipse-induction-furnace = Melts aluminium, nickel and cobalt into AlNiCo magnets with electricity alone, no heat.
wiki.eclipse-electrowinning-cell = Dissolves scrap in sulfuric acid and plates out copper and lead. Its spent acid must be neutralized.
wiki.eclipse-silicon-reduction-furnace = Reduces sand to silicon with methane instead of coal, much faster than the vanilla smelter. Needs heat.
wiki.eclipse-methane-pyrolysis-reactor = Cracks methane into graphite and hydrogen with heat: graphite without coal, plus hydrogen for chemistry.
wiki.eclipse-soda-glass-furnace = Melts sand with sodium hydroxide into metaglass, without lead. Needs heat.
wiki.eclipse-chloride-titanium-plant = Chlorinates sand with coal and reduces it to titanium: titanium on maps without titanium ore. Needs heat.
wiki.eclipse-carbide-drill = The best drill in the game, in a 3x3 footprint: it out-mines the 4x4 airblast drill on every ore, and its carbide bits make hard ores (titanium, thorium, tungsten, aetherite) slow it only half as much as other drills. Water boosts it as much as the airblast drill. Needed for aetherite.

# wiki entries: components and electronics
wiki.eclipse-gear-press = Presses copper into copper gears. One of the first ECLIPSE machines to build.
wiki.eclipse-metal-extruder = Extrudes titanium into rods, with graphite as lubricant.
wiki.eclipse-heavy-gear-press = Presses titanium into titanium gears.
wiki.eclipse-casing-forge = Builds pressure casings from titanium rods and metaglass, sealed with graphite.
wiki.eclipse-bearing-press = Makes industrial bearings from titanium rods, copper and graphite.
wiki.eclipse-frame-forge = Hot-forms superalloy and titanium rods into superalloy frames. Needs heat.
wiki.eclipse-precision-assembler = Assembles precision components from titanium gears and silicon.
wiki.eclipse-experimental-core-assembler = Builds experimental cores, the top component, from precision components, surge superalloy, platinum and phase fabric.
wiki.eclipse-component-depot = Storage for components only. Place it at the end of your component lines: it keeps your core stocked with up to 200 of each component from anywhere on the map, so you can always build, without belting everything to the core. It never merges with the core.
wiki.eclipse-wire-drawing-machine = Draws copper into copper wire.
wiki.eclipse-circuit-board-printer = Prints circuit boards from copper wire and polyethylene, etched in hydrochloric acid. Its acidic waste must go to a neutralizer.
wiki.eclipse-chip-fabricator = Etches microchips from high-purity silicon, copper wire and polyethylene.
wiki.eclipse-control-unit-assembler = Builds control units from microchips, circuit boards and AlNiCo magnets.

# wiki entries: heat and power
wiki.eclipse-industrial-heater = Burns methane into heat and sends it out of the side it faces. Its flue gas is vented unless you pipe it away.
wiki.eclipse-electric-heater = Turns power into heat. No fuel, no exhaust: the simplest heater if you have power to spare.
wiki.eclipse-geothermal-heat-tap = Free heat with no fuel, but it can only be built on hot rock or magma rock. The hotter the ground under it, the more heat.
wiki.eclipse-heat-exchanger = Collects heat from its back and sides and sends it out of the front. Use it to route heat around corners or to collect waste heat from reactions.
wiki.eclipse-thermal-storage = Passes heat through like an exchanger and stores it. When the heaters stop (for example when fuel runs out), it keeps the machine heated until its reservoir is empty.
wiki.eclipse-industrial-boiler = Boils purified water into steam with heat. More heat gives more steam. Pair it with Steam Turbines; a Fission Reactor is its best heat source.
wiki.eclipse-steam-turbine = Turns steam into power and returns most of the water as purified water, so a boiler loop needs little fresh water.
wiki.eclipse-hydrogen-fuel-cell = Combines hydrogen and oxygen into power, giving purified water back. A clean generator for electrolysis setups.
wiki.eclipse-methane-turbine = Burns methane for a large amount of power. Pipe the flue gas to a scrubber or gas separator, or it is vented.
wiki.eclipse-biofuel-engine = Burns biofuel for power: renewable, if you run biomass growers and a fermenter.
wiki.eclipse-fission-reactor = Burns thorium fuel rods into an enormous amount of heat out of the front. Put an Industrial Boiler there, with Steam Turbines after it. Remove its spent fuel rods and reprocess them.
wiki.eclipse-fuel-rod-fabricator = Seals thorium in superalloy cladding to make fuel rods.
wiki.eclipse-reprocessing-plant = Recovers thorium from spent fuel rods with nitric acid. Produces acidic waste.
wiki.eclipse-industrial-battery = A bank of lead-acid cells. Stores far more power per tile than a large battery.
wiki.eclipse-lithium-battery = Stores twice as much power as an industrial battery.
wiki.eclipse-flow-battery = The largest battery: vanadium electrolyte in big tanks.
wiki.eclipse-aetherite-capacitor = Stores power in aetherite crystals, more than twice a lithium battery in the same space.
wiki.eclipse-world-engine = The ultimate ECLIPSE project. Build the frame, then complete it in five stages (Foundation, Energy Core, Chemistry, Control, Activation). Each stage needs large deliveries from a different industry and only accepts what the stage still needs. Tap it to see what is missing. Once complete, it is a planetary power source.

# wiki entries: biology
wiki.eclipse-biomass-cultivator = Grows biomass from purified water and fertilizer under artificial light. Works anywhere, faster on moss and spore moss.
wiki.eclipse-algae-photobioreactor = Grows algae on water, carbon dioxide and fertilizer, making biomass and oxygen. A use for captured CO2.
wiki.eclipse-enzyme-extractor = Extracts enzymes from biomass and spore pods. The enzymes double the fermenter's speed.
wiki.eclipse-biochemical-fermenter = Ferments biomass into biofuel (left) and carbon dioxide (right). Twice as fast with enzyme extract.
wiki.eclipse-anaerobic-digester = Digests sludge and biomass into methane and fertilizer, without power.

# wiki entries: transport and liquids
wiki.eclipse-aluminium-conveyor = A belt for 20 items per second, the first ECLIPSE belt.
wiki.eclipse-chromium-conveyor = A belt for 30 items per second.
wiki.eclipse-superalloy-conveyor = A belt for 40 items per second.
wiki.eclipse-carbide-conveyor = A belt for 50 items per second.
wiki.eclipse-surge-conveyor = The fastest belt, 60 items per second. Vanilla junctions, routers and bridges are slower; feed it directly where you can.
wiki.eclipse-aluminium-conduit = A wide conduit, 3600 liquid per second, and corrosion-resistant.
wiki.eclipse-chromium-conduit = 4200 liquid per second, corrosion-resistant.
wiki.eclipse-superalloy-conduit = 4800 liquid per second, corrosion-resistant.
wiki.eclipse-carbide-conduit = 5400 liquid per second, corrosion-resistant.
wiki.eclipse-surge-conduit = The highest-capacity conduit, 6000 liquid per second, corrosion-resistant.
wiki.eclipse-polymer-conduit = The first corrosion-proof conduit. Use it for acids, chlorine, sodium hydroxide and acidic waste.
wiki.eclipse-polymer-liquid-router = A liquid router that corrosive liquids cannot destroy.
wiki.eclipse-polymer-bridge-conduit = A bridge conduit that corrosive liquids cannot destroy.
wiki.eclipse-polymer-liquid-tank = A large tank that safely stores acids, chlorine and chemical waste. Useful as a buffer in front of neutralizers.
wiki.eclipse-liquid-overflow-valve = Liquid from the back goes straight on; only what the front cannot take goes left, then right. Use it to feed a main consumer first and send the surplus elsewhere.
wiki.eclipse-liquid-balancer = Divides liquid from the back evenly between left, front and right.
wiki.eclipse-reserve-valve = Place it after a tank and pick a level: it only lets liquid out while the tank is above that level. Keep coolant or fuel in reserve for important machines.

# wiki entries: logistics
wiki.eclipse-three-way-sorter = Sends up to three chosen items to the left, front or right; input from the back. Other items go to a fallback side, or wait on the belt if you set none. A blocked route holds its item instead of losing it. Tap it to set the rules.
wiki.eclipse-distribution-hub = A 2x2 sorter with four item rules and a fallback side, at 60 items per second. Needs a little power.
wiki.eclipse-priority-merger = Merges the back, left and right lines into the front. In priority mode the top line always goes first and the others fill the gaps; in round-robin they take turns.
wiki.eclipse-controlled-splitter = Splits one line across left, front and right: evenly, by ratio (weights 0-3, for example 2:1) or by priority. Blocked branches are skipped, so nothing jams.
wiki.eclipse-line-balancer = A 2x2 splitter that shares one supply fairly between up to four buildings on its left, front and right. Needs power.
wiki.eclipse-small-logistics-buffer = Stores up to 60 items from its back and sides and exports them through the front. It can keep a minimum of one item type that is never exported.
wiki.eclipse-industrial-logistics-buffer = Stores up to 200 items, can keep a reserve and can export only one chosen item. Needs power.
wiki.eclipse-advanced-item-filter = Filters a whole list of items. Allow mode: listed items go straight, others to the sides. Deny mode: the reverse.
wiki.eclipse-batch-gate = Collects a set number of items (2, 5, 10 or 20) from the back, then releases the whole batch through the front. Useful for machines that should get full loads.
wiki.eclipse-smart-unloader = Unloads up to three chosen item types from adjacent containers, taking turns. Like the vanilla unloader, it never loads into storage.

# wiki entries: augmentation buildings
wiki.eclipse-augmentation-coupler = Attaches one module to an adjacent machine, vanilla or ECLIPSE. With one machine next to it, it connects by itself; otherwise tap the coupler, then the machine. Give it power. Hover over it to see what each module is doing.
wiki.eclipse-advanced-coupler = A coupler with two module slots.
wiki.eclipse-augmentation-hub = A large interface with four module slots for heavily upgraded machines.
wiki.eclipse-chemical-augmentation-interface = A coupler for chemical machines: three slots, chemical modules only, and a large coolant tank for modules that need cooling.
wiki.eclipse-military-augmentation-interface = A coupler for turrets: three slots, military modules only.
wiki.eclipse-basic-module-assembler = Builds tier I modules. Tap it to choose the module; it then accepts only that module's ingredients.
wiki.eclipse-advanced-module-assembler = Builds tier II and III modules. Tap it to choose the module.
wiki.eclipse-experimental-augmentation-facility = Builds tier IV, unique and legendary modules from the most advanced materials.
wiki.eclipse-aetherite-module-forge = Builds Tier V modules around aetherite crystals.
wiki.eclipse-module-recycling-facility = Dismantles unwanted modules and returns half of their materials.

# wiki entries: defense, robotics and endgame
wiki.eclipse-wave-intelligence-scanner = While powered, shows the next wave: unit types, counts, shields and bosses, and the time left. Tap it for the report. To show the wave on screens, select the scanner and tap up to 4 logic displays within 12 blocks. It never changes the wave.
wiki.eclipse-wave-disruption-array = When fully charged, tap Activate to delay the incoming wave by 20 seconds. Only before the wave arrives, and only on maps with a wave timer. All arrays share a lockout of 2 waves, so you cannot chain delays.
wiki.eclipse-temporal-interference-array = A stronger wave delay: 50 seconds. It shares the lockout with the Wave Disruption Array, then locks both for 4 waves.
wiki.eclipse-unit-shield-beacon = Shields friendly units (not buildings) in its field from a shared pool, up to 80 shield each. The shield it gave is taken back when a unit leaves. It recharges with power, slower while the field is under fire.
wiki.eclipse-emergency-repair-dispatch-bay = Repairs one chosen building quickly. Select the bay, then tap the building; tap the bay again to clear. Each chunk of repair uses a titanium rod.
wiki.eclipse-robot-dispatch-hub = Home of up to 4 robots within 25 blocks. Robots from the Air Factory sign in by themselves; tap the hub to give each one its job, then tap a building to pick it. Docked robots recharge with power, and titanium rods become repair charge.
wiki.eclipse-titan-manufacturing-complex = Builds the Dreadnought. Only one Dreadnought per team: while it lives, the complex pauses and uses nothing.
wiki.eclipse-orbital-weapons-platform = Tap it, then tap a spot within 150 blocks. It charges for two minutes, then spends superconductors, aetherite and blast compound on one strike: a red warning marks the target, and three seconds later all enemies within 10 blocks take 3000 damage. Your own buildings are safe.

# wiki entries: walls and turrets
wiki.eclipse-superalloy-wall = A very strong wall that also absorbs lasers.
wiki.eclipse-superalloy-wall-large = A very strong large wall that also absorbs lasers.
wiki.eclipse-surge-superalloy-wall = An extremely strong wall that absorbs lasers and arcs lightning at attackers.
wiki.eclipse-surge-superalloy-wall-large = An extremely strong large wall that absorbs lasers and arcs lightning at attackers.
wiki.eclipse-composite-wall = A carbon composite wall, stronger than superalloy, that sometimes deflects bullets.
wiki.eclipse-composite-wall-large = A large carbon composite wall that sometimes deflects bullets.
wiki.eclipse-acid-mortar = Lobs acid shells over long range at ground targets. The blast etches armor, and the acid pools where it lands, corroding units that wade through. Feed it an acid through polymer conduits.
wiki.eclipse-minelayer = Lobs mines onto the enemy's path. Each mine waits up to 30 seconds and goes off under the first ground unit that crosses it. Fires ammonium nitrate or blast compound.
wiki.eclipse-heat-lance = A continuous beam powered by heat instead of power. It needs 12 heat to fire; up to 24 heat makes it twice as strong. Point a heater (or a heat exchanger) at it.
wiki.eclipse-jammer = Every 3 seconds, jams enemy units in range: their weapons fire 40% slower for 4 seconds. Bosses recover twice as fast. It does not affect buildings.

# wiki entries: units
wiki.eclipse-logistics-drone = Carries up to 20 of one item between two buildings within its hub's range, and only delivers what the destination accepts (a turret gets ammo). Slower than a belt; use it for awkward routes, like feeding a turret on a cliff. Needs a Robot Dispatch Hub.
wiki.eclipse-repair-drone = Flies to one assigned building and repairs it from a finite repair charge, refilled at its hub with titanium rods. Assign it to an important wall or turret.
wiki.eclipse-shield-drone = Escorts the largest group of friendly units near its hub and tops their shields up to 40 from a shared pool. It recharges only at the hub, and the shields it gave vanish if it is destroyed. Slow and fragile: keep it behind your army.
wiki.eclipse-reaper = The first ECLIPSE tank: fast and light, with an armor-piercing autocannon that tears into buildings. Built in the Ground Factory; upgrade it in the reconstructors.
wiki.eclipse-bulwark = An armored tank with an armor-piercing cannon that shrugs off light fire.
wiki.eclipse-rampart = A heavy tank. Its frontal shield arc soaks up incoming fire while its twin armor-piercing cannons work.
wiki.eclipse-annihilator = A siege tank. Its long-range caustic shells etch armor so every gun behind it hits harder, and it crushes enemy blocks it rolls over.
wiki.eclipse-colossus = The largest ECLIPSE tank. Its main cannon pierces armor and several targets in a row, and two acid mortars leave corrosive pools behind the enemy line. The Dominion sends it as a late boss.
wiki.eclipse-wraith = A fast reconnaissance craft. Its light guns mark targets as Etched, halving their armor for heavier guns. The start of the strike aircraft line.
wiki.eclipse-interceptor = An anti-air fighter with homing missiles that only target aircraft. Escort your ground army with a few.
wiki.eclipse-valkyrie = A gunship with rapid armor-piercing guns against both air and ground.
wiki.eclipse-tempest = A strategic bomber. Each bomb scatters mines that wait on the ground for the enemy. Ground targets only.
wiki.eclipse-leviathan = An aerial command platform. Its jamming pulse slows enemy fire around it, point defenses shoot down incoming bullets, and a heavy lance burns through targets. The Dominion sends it as a late boss.
wiki.eclipse-dreadnought = The titan: twin armor-piercing heavy cannons, a heat lance, acid mortars, a broad frontal shield and a jamming pulse. Only one per team, built in the Titan Manufacturing Complex.
wiki.eclipse-ew-drone = Unarmed and fragile. Every 5 seconds it scrambles enemy turrets within 10 blocks so they aim and fire at half speed for 4 seconds. Send it in with an attack to blunt the enemy's defenses.
wiki.eclipse-mite = Swarm. A small self-repairing machine that spits acid at close range. Weak alone, but it comes in growing numbers on every Swarm wave, and Broods and Behemoths release more. Splash damage handles them best.
wiki.eclipse-wasp = Swarm. A fast flyer whose acid sting corrodes its target. Make sure you have anti-air from about wave 6.
wiki.eclipse-spitter = Swarm. Lobs acid that leaves corrosive pools. Outrange it, or it will slowly eat through your front line.
wiki.eclipse-brood = Swarm. Sprays spores that slow its targets, and bursts into four Mites when it dies. Kill it before it reaches your walls.
wiki.eclipse-behemoth = Swarm boss. It regenerates quickly, keeps breeding Mites while it advances and bombards with acid. It comes every 12 waves from wave 24. Focus fire on it; long fights only give it more Mites.

# wiki entries: upgrade modules (one text per family; the tiers differ only in strength)
wiki.eclipse-production-accelerator = Makes the machine work faster. The coupler draws extra power for it, partly a flat amount and partly in proportion to the machine's own power use, so it costs most on power-hungry machines.\nThe stronger the tier, the bigger the boost and the power cost. A second accelerator on the same machine counts half.
wiki.eclipse-power-optimizer = Refunds part of the machine's power draw to its grid. The coupler must be on the same power grid as the machine. Great on smelters and electrolysis.
wiki.eclipse-output-amplifier = More output per production cycle, at the cost of some speed. It saves input material rather than time.\nIt cannot share a machine with a Precision Fabricator.
wiki.eclipse-precision-fabricator = Returns part of the items the machine consumes each cycle, so the same inputs go further.\nIt cannot share a machine with an Output Amplifier.
wiki.eclipse-material-recycler = Collects part of the machine's consumed items as scrap, which the coupler pushes out. Belt the scrap to an Ore Crusher.
wiki.eclipse-reaction-accelerator = Makes chemical machines work faster. It needs coolant in the coupler; colder coolants (chilled water, cryofluid, liquid nitrogen) last longer. Best in a Chemical Augmentation Interface with its big coolant tank.
wiki.eclipse-thermal-controller = Supplies part of a heat-driven machine's heat requirement, so you need smaller heaters.
wiki.eclipse-pressure-stabilizer = Pressurized reactors reach operating pressure faster and lose it more slowly while idle.
wiki.eclipse-catalyst-optimizer = Catalysts in the attached reactor last more crafts.
wiki.eclipse-purification-module = The machine makes more of its main product liquid (for example purified water, not the brine).
wiki.eclipse-waste-recovery = Turns part of the machine's acidic waste back into the acid it consumes: less waste to neutralize and less acid to make.
wiki.eclipse-thermal-recovery = Turns a hot machine's waste heat into power for the grid. Strongest on heat producers such as the Fission Reactor.
wiki.eclipse-energy-overcharger = Charges for 15 seconds, then pushes the machine much faster for 5 seconds.
wiki.eclipse-capacitor-module = Stores spare grid power and feeds it to the machine during shortages, keeping it running through dips.
wiki.eclipse-deep-mining = Drills mine faster.
wiki.eclipse-advanced-drill-head = Drills extract more ore per cycle without slowing down. It cannot share a drill with other efficiency modules.
wiki.eclipse-geological-analyzer = Surveys every deposit within 10 tiles of the drill. Hover over the coupler to see what is there and how much.
wiki.eclipse-rapid-fire-controller = The turret fires faster but heats up while shooting; an overheated turret slows down until it cools. Pair the stronger tiers with a Cooling System.
wiki.eclipse-cooling-system = The turret sheds Rapid Fire heat faster, so it overheats less or never.
wiki.eclipse-advanced-ammunition = The turret's shots deal more damage. Works on lasers and beams too.
wiki.eclipse-targeting-computer = Removes part (or all) of the turret's random spread. Fragments, mines and other bullets its shots release keep their own spread.
wiki.eclipse-ballistic-computer = Shots fly 50% faster over the same range, so fast targets are easier to hit. Beams and lasers are not affected.
wiki.eclipse-mass-production = A machine configuration: faster and more output per cycle, at an enormous power cost. One per machine.
wiki.eclipse-closed-loop-processing = A machine configuration: returns part of the inputs, recycles some as scrap and recovers half of any acidic waste. One per machine.
wiki.eclipse-emergency-overdrive = A machine configuration: after charging, bursts the machine to 2.5x speed for 5 seconds. Very power hungry. One per machine.
wiki.eclipse-quantum-accelerator = Legendary: the machine works 2.5 times as fast, at a high power cost. One per machine.
wiki.eclipse-matter-replicator = Legendary: 50% more output per cycle with no slowdown. One per machine.
wiki.eclipse-ancient-efficiency-core = Legendary: halves the machine's power draw and returns a quarter of its inputs. One per machine.
wiki.eclipse-temporal-processing-core = Legendary: after charging, the machine runs 4 times as fast for 5 seconds. One per machine.

