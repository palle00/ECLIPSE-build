item.eclipse-superconductor.name = Superconductor
item.eclipse-superconductor.description = An exotic ceramic that carries current without resistance when kept cold. Made in the Chemical Synthesis Complex; needed for the World Engine and the Temporal Interference Array.
block.eclipse-chemical-synthesis-complex.name = Chemical Synthesis Complex
block.eclipse-chemical-synthesis-complex.description = The peak of the chemical industry. Synthesizes superconductors from copper wire and aetherite in nitric acid, under pressure, over a platinum catalyst that is slowly used up, cooled with liquid nitrogen.
block.eclipse-temporal-interference-array.name = Temporal Interference Array
block.eclipse-temporal-interference-array.description = Once fully charged, tap and activate to delay the incoming wave by 50 seconds. Only before the wave arrives. Shares its lockout with the Wave Disruption Array, then locks both for 4 waves.
block.eclipse-world-engine.name = World Engine
block.eclipse-world-engine.description = The ultimate ECLIPSE project. After the frame is built, complete it in six stages (Foundation, Energy Core, Chemistry, Control, Confinement, Activation), each fed with a different industry's output. It only accepts what the current stage needs. Once online it gives 300,000 power/s, stores 5,000,000 power, adds 15% of your other generators' power and overdrives everything within 40 blocks.
block.eclipse-core-bastion.name = Core: Bastion
block.eclipse-core-bastion.description = The core after the Nucleus. Holds far more of every item, raises the unit cap and is much tougher. Its built-in power node links nearby power nodes and batteries into one grid. Place it over a Nucleus to upgrade. You respawn as Delta.
block.eclipse-core-citadel.name = Core: Citadel
block.eclipse-core-citadel.description = The largest core. Holds 60,000 of every item, raises the unit cap even further, has the strongest armour and a longer power reach. Place it over a Core: Bastion to upgrade. You respawn as Epsilon.
unit.eclipse-delta.name = Delta
unit.eclipse-delta.description = The Core: Bastion's builder. Builds and mines faster than Gamma, mines thorium, and its guns fire more homing bullets. A repair beam fixes damaged blocks around it by itself.
unit.eclipse-epsilon.name = Epsilon
unit.eclipse-epsilon.description = The Core: Citadel's builder. The fastest builder and miner. Its guns fire even more homing bullets, which explode on impact, and its repair beam is stronger.
