block.eclipse-three-way-sorter.name = Three-Way Item Sorter
block.eclipse-three-way-sorter.description = Routes up to three chosen items to the left, front or right. Input from the back. Other items go to a fallback side or wait on the belt; a blocked route holds its item instead of losing it.\nHandles 30 items/s. Like vanilla sorters, it needs a belt between it and other instant routers.
block.eclipse-priority-merger.name = Priority Merger
block.eclipse-priority-merger.description = Merges up to three lines (back, left, right) into the front.\nPriority mode: the top line always goes first, lower lines fill the gaps. Round-robin: lines take turns.\nHandles 30 items/s; items it can't take stay on their belts.
block.eclipse-controlled-splitter.name = Controlled Splitter
block.eclipse-controlled-splitter.description = Splits one line (from the back) across left, front and right: evenly, by ratio (e.g. 2:1), or by priority. Blocked branches are skipped; nothing is lost.\nHandles 30 items/s.
block.eclipse-distribution-hub.name = Distribution Hub
block.eclipse-distribution-hub.description = A 2x2 routing junction: four item rules to the left, front or right, plus a fallback side. Input from the back.\nHandles 60 items/s. Needs a little power.
block.eclipse-small-logistics-buffer.name = Small Logistics Buffer
block.eclipse-small-logistics-buffer.description = Smooths uneven supply: stores up to 60 items from the back and sides and exports them through the front at up to 60 items/s.\nCan keep a reserve of one item.
block.eclipse-industrial-logistics-buffer.name = Industrial Logistics Buffer
block.eclipse-industrial-logistics-buffer.description = Stores up to 200 items and exports them through the front at up to 60 items/s. Can keep a reserve of one item and only export a chosen item. Needs power.
block.eclipse-line-balancer.name = Line Balancer
block.eclipse-line-balancer.description = Shares one supply fairly across up to four production lines (every building on its left, front and right): evenly, by ratio, or by priority. Input from the back.\nHandles 60 items/s. Needs power.
block.eclipse-advanced-item-filter.name = Advanced Item Filter
block.eclipse-advanced-item-filter.description = Filters a whole list of items: passing items go straight on, the rest alternate left and right. Allow-list or deny-list mode.\nHandles 30 items/s.
block.eclipse-batch-gate.name = Batch Gate
block.eclipse-batch-gate.description = Collects a set number of items (2, 5, 10 or 20) from the back, then releases the whole batch through the front.
block.eclipse-smart-unloader.name = Smart Unloader
block.eclipse-smart-unloader.description = Unloads up to three chosen items from adjacent containers, taking turns. As fast as a vanilla unloader; never loads into storage.
block.eclipse-liquid-overflow-valve.name = Liquid Overflow Valve
block.eclipse-liquid-overflow-valve.description = Sends liquid from the back straight on; only what the front can't take goes left, then right.
block.eclipse-liquid-balancer.name = Liquid Balancer
block.eclipse-liquid-balancer.description = Divides liquid from the back evenly between the left, front and right.
block.eclipse-reserve-valve.name = Reserve Valve
block.eclipse-reserve-valve.description = Place it after a tank: it only lets liquid out while the tank is above the chosen level, keeping a reserve.

