bar.eclipse-augment-active = {0}: augmented

block.eclipse-advanced-coupler.name = Advanced Coupler
block.eclipse-advanced-coupler.description = An augmentation coupler with two module slots.
block.eclipse-augmentation-hub.name = Industrial Augmentation Hub
block.eclipse-augmentation-hub.description = A large augmentation interface with four module slots, for heavily specialized machines.

item.eclipse-output-amplifier-1.name = Output Amplifier I
item.eclipse-output-amplifier-1.description = The machine produces 10% more per cycle, but runs 10% slower. Saves material rather than time.\nCannot be combined with a Precision Fabricator on the same machine.
item.eclipse-output-amplifier-2.name = Output Amplifier II
item.eclipse-output-amplifier-2.description = The machine produces 20% more per cycle, but runs 15% slower.\nCannot be combined with a Precision Fabricator on the same machine.
item.eclipse-output-amplifier-3.name = Output Amplifier III
item.eclipse-output-amplifier-3.description = The machine produces 30% more per cycle, but runs 20% slower.\nCannot be combined with a Precision Fabricator on the same machine.
item.eclipse-precision-fabricator-1.name = Precision Fabricator I
item.eclipse-precision-fabricator-1.description = Returns 10% of the items the machine consumes each cycle.\nCannot be combined with an Output Amplifier on the same machine.
item.eclipse-precision-fabricator-2.name = Precision Fabricator II
item.eclipse-precision-fabricator-2.description = Returns 20% of the items the machine consumes each cycle.\nCannot be combined with an Output Amplifier on the same machine.
item.eclipse-precision-fabricator-3.name = Precision Fabricator III
item.eclipse-precision-fabricator-3.description = Returns 30% of the items the machine consumes each cycle.\nCannot be combined with an Output Amplifier on the same machine.
item.eclipse-material-recycler-1.name = Material Recycler I
item.eclipse-material-recycler-1.description = Collects 10% of the machine's consumed items as scrap, which the coupler outputs.
item.eclipse-material-recycler-2.name = Material Recycler II
item.eclipse-material-recycler-2.description = Collects 20% of the machine's consumed items as scrap, which the coupler outputs.

stat.eclipse-module-yield = Output per Cycle
stat.eclipse-module-saving = Item Inputs
stat.eclipse-module-recycle = Recycled as Scrap
stat.eclipse-module-exclusive = Exclusive With
stat.eclipse-exclusive-efficiency = Other efficiency modules (Output Amplifier / Precision Fabricator)
stat.eclipse-compat-item-producers = Item crafters and drills (vanilla and ECLIPSE)
stat.eclipse-compat-item-consumers = Crafters that consume items (vanilla and ECLIPSE)
stat.eclipse-coupler-slots = Module Slots
bar.eclipse-augment-conflict = {0}: conflicting modules

block.eclipse-chemical-augmentation-interface.name = Chemical Augmentation Interface
block.eclipse-chemical-augmentation-interface.description = A coupler for chemical plants: three module slots and a large coolant tank. Only accepts chemical modules.

item.eclipse-reaction-accelerator-1.name = Reaction Accelerator I
item.eclipse-reaction-accelerator-1.description = Chemical machines work 15% faster. Needs coolant in the coupler; colder coolants last longer.
item.eclipse-reaction-accelerator-2.name = Reaction Accelerator II
item.eclipse-reaction-accelerator-2.description = Chemical machines work 30% faster. Needs coolant in the coupler; colder coolants last longer.
item.eclipse-reaction-accelerator-3.name = Reaction Accelerator III
item.eclipse-reaction-accelerator-3.description = Chemical machines work 50% faster. Needs coolant in the coupler; colder coolants last longer.
item.eclipse-thermal-controller-1.name = Thermal Controller I
item.eclipse-thermal-controller-1.description = Supplies 15% of a heat-driven machine's heat requirement.
item.eclipse-thermal-controller-2.name = Thermal Controller II
item.eclipse-thermal-controller-2.description = Supplies 30% of a heat-driven machine's heat requirement.
item.eclipse-thermal-controller-3.name = Thermal Controller III
item.eclipse-thermal-controller-3.description = Supplies 45% of a heat-driven machine's heat requirement.
item.eclipse-pressure-stabilizer-1.name = Pressure Stabilizer I
item.eclipse-pressure-stabilizer-1.description = A pressurized reactor reaches operating pressure 50% faster and loses it more slowly.
item.eclipse-pressure-stabilizer-2.name = Pressure Stabilizer II
item.eclipse-pressure-stabilizer-2.description = A pressurized reactor reaches operating pressure twice as fast and loses it more slowly.
item.eclipse-catalyst-optimizer-1.name = Catalyst Optimizer I
item.eclipse-catalyst-optimizer-1.description = Catalysts in the attached reactor last 50% longer.
item.eclipse-catalyst-optimizer-2.name = Catalyst Optimizer II
item.eclipse-catalyst-optimizer-2.description = Catalysts in the attached reactor last twice as long.
item.eclipse-purification-module-1.name = Purification Module I
item.eclipse-purification-module-1.description = The machine produces 10% more of its main product liquid (e.g. purified water, not brine).
item.eclipse-purification-module-2.name = Purification Module II
item.eclipse-purification-module-2.description = The machine produces 20% more of its main product liquid (e.g. purified water, not brine).
item.eclipse-purification-module-3.name = Purification Module III
item.eclipse-purification-module-3.description = The machine produces 30% more of its main product liquid (e.g. purified water, not brine).
item.eclipse-waste-recovery-1.name = Waste Recovery I
item.eclipse-waste-recovery-1.description = Turns 25% of the machine's acidic waste back into the acid it consumes.
item.eclipse-waste-recovery-2.name = Waste Recovery II
item.eclipse-waste-recovery-2.description = Turns 50% of the machine's acidic waste back into the acid it consumes.

