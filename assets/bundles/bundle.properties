eclipse-wiki.check.gear-press = Build a Gear Press|Copper into copper gears, which most early ECLIPSE costs need.
eclipse-wiki.check.extruder = Build an Extruder|Copper into wire. Gears and wire unlock the early machines.
eclipse-wiki.check.rivet = Put a Rivet at an entrance|A 1x1 gatling that fires faster the longer it keeps shooting.
eclipse-wiki.check.flow-meter = Drop a Flow Meter into a belt|See how many items per second pass. It never slows the belt.
eclipse-wiki.check.metal-press = Build a Metal Press|Titanium into plates, for casings and frames.
eclipse-wiki.check.lathe = Build a Lathe|Bolts, screws, rings and springs from rods.
eclipse-wiki.check.assembler = Build an Assembler|Pressure casings, bearings, motors, pumps and pistons from the parts.
eclipse-wiki.check.component-depot = Build a Component Depot|Keeps your core stocked with parts, from anywhere on the map.
eclipse-wiki.check.water-treatment-plant = Build a Water Treatment Plant|Purified water out of one side, brine out of the other: the start of chemistry.
eclipse-wiki.check.ore-crusher = Build an Ore Crusher|Ore minerals into metal, or scrap into crushed ore on any map.
eclipse-wiki.check.electric-heater = Build an Electric Heater|Heat on power, for the furnaces.
eclipse-wiki.check.blast-furnace = Build a Blast Furnace|Nickel, chromium and cobalt into hot superalloy (heat 8: two heaters).
eclipse-wiki.check.vacuum-freezer = Build a Vacuum Freezer|Cools hot metal and glass with cryofluid.
eclipse-wiki.check.augmentation-coupler = Put an Augmentation Coupler on a machine|Then insert an upgrade module into it.
eclipse-wiki.check.fission-reactor = Build a Fission Reactor|Heat for boilers, and through them steam for the turbines.
eclipse-wiki.check.steam-turbine = Build a Steam Turbine|900 power/s from a boiler's steam.
eclipse-wiki.check.robot-dispatch-hub = Build a Robot Dispatch Hub|Gives drones their jobs.
eclipse-wiki.check.lattice-drill = Build a Lattice Drill|Mines a whole ore patch through one building.
wiki.eclipse-mite.counter = They come in numbers and repair themselves. Splash damage (Ripple, Acid Mortar, Tremor) clears them before they reach your walls; keep steady fire on them so their exoskeleton never grows.
wiki.eclipse-wasp.counter = Fast flyers with an acid sting. Anti-air that hits several at once (Thunderhead, Cloudbreaker, Scatter) beats them.
wiki.eclipse-spitter.counter = Lobs acid from behind the swarm and leaves corrosive pools. Out-range it with artillery, and keep walls a few tiles in front of your turrets.
wiki.eclipse-brood.counter = Bursts into four Mites when it dies. Kill it away from your walls, with splash ready for what comes out.
wiki.eclipse-behemoth.counter = Lays Mite eggs as it walks. Splash the eggs before they hatch (3 seconds), and focus fire on the Behemoth: long fights only give it more Mites. Sulfur shells (Etched) stop its exoskeleton growing back.
wiki.eclipse-scrabba.counter = A melee unit: it has to reach your walls. Hit it hard while it walks up, keep steady fire on it so its exoskeleton stays down, and etch it with sulfur shells. Several wall layers buy time against its claws; its stinger heals it, so focus fire.
wiki.eclipse-skiff.counter = Fast on water, slow on land. Leaves targets Wet, so lightning and electric damage hit harder. Fight it on the shore.
wiki.eclipse-slicker.counter = Its oil sets targets alight. Keep turrets apart so a fire doesn't spread, and fight it on land where it is slow.
wiki.eclipse-frostwake.counter = Freezes targets and drops mines behind it. Keep your own ground units off its trail.
wiki.eclipse-lamprey.counter = Leaps from the water onto your nearest turret and freezes it. Keep turrets back from the shore, or covered by other turrets that can shoot it off. Anti-air can hit it in the air.
wiki.eclipse-cinderwake.counter = Melts armour with slag and arcs lightning at Wet targets. Kill the Skiffs first so its shocks find fewer Wet targets.
wiki.eclipse-maelstrom.counter = Tide boss: two jets, mines and a shock coil, and it regenerates. Fight it on the shore, where it slows to a crawl.
wiki.eclipse-lurker.counter = Can't be hit under water. A Sonar puts it on contact so your turrets can fire; mines go off under it anyway.
wiki.eclipse-barracuda.counter = Twin torpedoes and a deck gun; dives when it stops firing. Sonar and mines, as for the Lurker.
wiki.eclipse-abyss.counter = Never surfaces. Only a Sonar lets your turrets hit it; point defence can shoot down its missiles.
eclipse-welcome.title = Welcome to ECLIPSE
eclipse-welcome.text = ECLIPSE adds a lot, so it comes with its own help:\n\n[accent]ECLIPSE Wiki[] (pause menu): a step-by-step [accent]Getting Started[] guide, guides for every system, and a page for every block, material and unit.\n\n[accent]{0}[]: open the wiki page of the ECLIPSE block or unit under the cursor.\n[accent]{1}[]: mark every stopped machine on the map.\n[accent]{2}[]: the production panel, what your base makes and uses per second.\n[accent]{3}[] (hold): with a better belt, conduit or wall selected, upgrade a whole connected line.\n\nThe [accent]search box[] above the build menu finds any block by name. Keys can be changed in Settings > Controls, under ECLIPSE.
eclipse-welcome.text.mobile = ECLIPSE adds a lot, so it comes with its own help:\n\n[accent]ECLIPSE Wiki[] (pause menu): a step-by-step [accent]Getting Started[] guide, guides for every system, and a page for every block, material and unit.\n\nThe [accent]search box[] above the build menu finds any block by name, and machines show why they stopped.
