item.eclipse-sulfur.name = Sulfur
item.eclipse-sulfur.description = Recovered from crude oil during distillation. Burned with oxygen to make sulfuric acid. Also caustic shells for Hail and Ripple that etch enemy armour.
item.eclipse-polyethylene.name = Polyethylene
item.eclipse-polyethylene.description = A tough, chemically resistant plastic made from ethylene. Used for casings and corrosion-proof equipment.
item.eclipse-lead-acid-cell.name = Lead-Acid Cell
item.eclipse-lead-acid-cell.description = A rechargeable cell of lead plates in sulfuric acid, sealed in a polyethylene case. Building block of industrial energy storage.

liquid.eclipse-purified-water.name = Purified Water
liquid.eclipse-purified-water.description = Water stripped of minerals. Required by electrolysis and other sensitive chemical processes. A slightly better coolant than raw water.
liquid.eclipse-brine.name = Brine
liquid.eclipse-brine.description = Concentrated salt water left over from water treatment. Feedstock for the chlor-alkali process.
liquid.eclipse-hydrochloric-acid.name = Hydrochloric Acid
liquid.eclipse-hydrochloric-acid.description = A strong acid. Dissolves metals out of scrap. Corrosive to units. [scarlet]Corrodes ordinary liquid blocks; use polymer conduits and tanks.[]
liquid.eclipse-oxygen.name = Oxygen
liquid.eclipse-oxygen.description = An oxidizing gas produced by electrolysis. Used in fuel cells and sulfuric acid production.
liquid.eclipse-chlorine.name = Chlorine
liquid.eclipse-chlorine.description = A toxic, corrosive gas produced from brine. Combined with hydrogen to make hydrochloric acid. [scarlet]Corrodes ordinary liquid blocks; use polymer conduits and tanks.[]
liquid.eclipse-methane.name = Methane
liquid.eclipse-methane.description = A light fuel gas boiled off crude oil. Burned for power or industrial heat.
liquid.eclipse-diesel.name = Diesel
liquid.eclipse-diesel.description = A middle distillate of crude oil. Fuel in ANFO explosives and the solvent carrier in fuel reprocessing.
liquid.eclipse-argon.name = Argon
liquid.eclipse-argon.description = An inert gas, about 1% of air. Shields electric arcs.
liquid.eclipse-heavy-water.name = Heavy Water
liquid.eclipse-heavy-water.description = Water made with deuterium, a heavier hydrogen. Concentrated by long electrolysis, then electrolysed again into deuterium.
liquid.eclipse-deuterium.name = Deuterium
liquid.eclipse-deuterium.description = Heavy hydrogen: the fuel of the Fusion Reactor. Flammable.
liquid.eclipse-liquid-sodium.name = Liquid Sodium
liquid.eclipse-liquid-sodium.description = Molten sodium metal. Cools the Breeder Reactor without slowing its fast neutrons. Burns in air.
liquid.eclipse-naphtha.name = Naphtha
liquid.eclipse-naphtha.description = A light oil fraction. Cracked with steam and heat into ethylene.
liquid.eclipse-ethylene.name = Ethylene
liquid.eclipse-ethylene.description = The most important building block of the polymer industry.
liquid.eclipse-sulfuric-acid.name = Sulfuric Acid
liquid.eclipse-sulfuric-acid.description = The workhorse of heavy chemistry. Used as battery electrolyte. Corrosive to units. [scarlet]Corrodes ordinary liquid blocks; use polymer conduits and tanks.[]
liquid.eclipse-sodium-hydroxide.name = Sodium Hydroxide
liquid.eclipse-sodium-hydroxide.description = A strong alkali from the chlor-alkali process. Neutralizes acidic waste. [scarlet]Corrodes ordinary liquid blocks; use polymer conduits and tanks.[]
liquid.eclipse-acidic-waste.name = Acidic Waste
liquid.eclipse-acidic-waste.description = Spent acid from metal leaching. Must be neutralized or it will back up and stall production. [scarlet]Corrodes ordinary liquid blocks; use polymer conduits and tanks.[]

block.eclipse-water-treatment-plant.name = Water Treatment Plant
block.eclipse-water-treatment-plant.description = Filters water into purified water. Rejected salts leave as brine.\nPurified water exits the left side, brine exits the right side.
block.eclipse-acid-leaching-vat.name = Acid Leaching Vat
block.eclipse-acid-leaching-vat.description = Dissolves scrap in hydrochloric acid and recovers titanium, copper and lead. Produces acidic waste that must be removed.
block.eclipse-distillation-column.name = Distillation Column
block.eclipse-distillation-column.description = Separates crude oil into fractions and cokes the residue into petroleum coke. Recovers sulfur from the sour gas.\nNaphtha exits the left side, methane the right side, diesel the front.
block.eclipse-steam-cracker.name = Steam Cracker
block.eclipse-steam-cracker.description = Cracks naphtha into ethylene with steam. Requires heat from adjacent heaters.
block.eclipse-sulfuric-acid-plant.name = Sulfuric Acid Plant
block.eclipse-hydrogen-fuel-cell.name = Hydrogen Fuel Cell
block.eclipse-hydrogen-fuel-cell.description = Combines hydrogen and oxygen to generate power. Emits purified water as a byproduct.
block.eclipse-methane-turbine.name = Methane Turbine
block.eclipse-methane-turbine.description = Burns methane to generate a large amount of power. Exhaust leaves as flue gas; pipe it to a scrubber or gas separator, or it is vented.
block.eclipse-industrial-battery.name = Industrial Battery
block.eclipse-industrial-battery.description = A bank of lead-acid cells. Stores far more power per tile than a large battery.
block.eclipse-industrial-heater.name = Industrial Heater
block.eclipse-industrial-heater.description = Burns methane to produce heat. Outputs heat in the direction it faces. Exhaust leaves as flue gas; pipe it away to use it, or it is vented.

item.eclipse-polymer-catalyst.name = Polymer Catalyst
item.eclipse-polymer-catalyst.description = A titanium chloride (Ziegler-Natta) catalyst. Enables polymerization and is only slowly used up.
item.eclipse-ammonium-nitrate.name = Ammonium Nitrate
item.eclipse-ammonium-nitrate.description = A powerful oxidizer. Mixed with coal into blast compound. Highly explosive.
liquid.eclipse-ammonia.name = Ammonia
liquid.eclipse-ammonia.description = A pungent gas synthesized from nitrogen and hydrogen under high pressure. The foundation of nitrogen chemistry.
liquid.eclipse-nitric-acid.name = Nitric Acid
liquid.eclipse-nitric-acid.description = A strong oxidizing acid made from ammonia. Used to produce nitrates. [scarlet]Corrodes ordinary liquid blocks; use polymer conduits and tanks.[]

block.eclipse-air-separation-unit.name = Air Separation Unit
block.eclipse-air-separation-unit.description = Liquefies air with cryogenic cooling and separates it into nitrogen, oxygen and argon.\nNitrogen exits the left side, oxygen the right side, argon the front.

stat.eclipse-catalyst = Catalyst
stat.eclipse-catalyst-life = (1 used per {0} crafts)
stat.eclipse-pressure = Operating Pressure
stat.eclipse-pressure-value = {0}% (reached in {1}s at full power)
bar.eclipse-pressure = Pressure: {0}%

block.eclipse-polymer-conduit.name = Polymer Conduit
block.eclipse-polymer-conduit.description = A polyethylene-lined conduit. Immune to corrosive chemicals that eat through ordinary conduits.
block.eclipse-polymer-liquid-router.name = Polymer Liquid Router
block.eclipse-polymer-liquid-router.description = A corrosion-resistant liquid router.
block.eclipse-polymer-bridge-conduit.name = Polymer Bridge Conduit
block.eclipse-polymer-bridge-conduit.description = A corrosion-resistant bridge conduit.
block.eclipse-polymer-liquid-tank.name = Polymer Liquid Tank
block.eclipse-polymer-liquid-tank.description = A large corrosion-resistant tank. Safely stores acids, chlorine and chemical waste.

stat.eclipse-corrosive = Corrosive

item.eclipse-nickel.name = Nickel
item.eclipse-nickel.description = A tough, corrosion-resistant metal. The base of superalloys.
item.eclipse-chromium.name = Chromium
item.eclipse-chromium.description = A hard metal that protects alloys from heat and oxidation.
item.eclipse-cobalt.name = Cobalt
item.eclipse-cobalt.description = A dense metal that keeps alloys strong at high temperature.
item.eclipse-tungsten.name = Tungsten
item.eclipse-tungsten.description = An extremely hard, heat-resistant metal. Requires a laser drill to mine.
item.eclipse-lithium.name = Lithium
item.eclipse-lithium.description = A light, reactive metal extracted from brine. Used in high-capacity batteries.
item.eclipse-superalloy.name = Superalloy
item.eclipse-superalloy.description = A nickel-chromium-cobalt alloy that keeps its strength in extreme heat.
item.eclipse-tungsten-carbide.name = Tungsten Carbide
item.eclipse-tungsten-carbide.description = Sintered tungsten and carbon. Nearly as hard as diamond; ideal for cutting tools. Also armour-piercing ammunition for Duo, Fuse, Salvo and Spectre.

block.eclipse-ore-nickel.name = Nickel Ore
block.eclipse-flotation-cell.name = Flotation Cell
block.eclipse-flotation-cell.description = Grinds ore minerals in water and floats the valuable mineral off with the froth: 1.5 metal per ore, plus the byproducts real deposits carry. Tier II.
block.eclipse-ore-bauxite.name = Bauxite
block.eclipse-ore-chromium.name = Chromium Ore
block.eclipse-ore-cobalt.name = Cobalt Ore
block.eclipse-ore-tungsten.name = Tungsten Ore

block.eclipse-mineral-separator.name = Mineral Separator
block.eclipse-mineral-separator.description = Leaches molten slag with sulfuric acid and separates the vanadium and chromium it carries, as real steel slag does. Works on any map with slag.
block.eclipse-lithium-extractor.name = Lithium Extractor
block.eclipse-lithium-extractor.description = Precipitates lithium carbonate out of brine with soda ash.
block.eclipse-carbide-drill.name = Carbide Drill
block.eclipse-carbide-drill.description = A drill with tungsten carbide bits. Out-mines the larger airblast drill, and hard ores slow it only half as much. Can be boosted with water.
block.eclipse-lithium-battery.name = Lithium Battery
block.eclipse-lithium-battery.description = A high-density lithium battery bank. Stores twice as much power as an industrial battery.
block.eclipse-superalloy-wall.name = Superalloy Wall
block.eclipse-superalloy-wall.description = A very strong wall that also absorbs lasers.
block.eclipse-superalloy-wall-large.name = Large Superalloy Wall
block.eclipse-superalloy-wall-large.description = A very strong wall that also absorbs lasers.\nSpans multiple tiles.

item.eclipse-alumina.name = Alumina
item.eclipse-alumina.description = Aluminium oxide refined from bauxite with hot sodium hydroxide. Smelted electrically into aluminium.
item.eclipse-aluminium.name = Aluminium
item.eclipse-aluminium.description = A light, highly conductive metal. Used in heat exchangers and turbines.
item.eclipse-high-purity-silicon.name = High-Purity Silicon
item.eclipse-high-purity-silicon.description = Silicon purified with hydrochloric acid and hydrogen to semiconductor grade.
item.eclipse-microchip.name = Microchip
item.eclipse-microchip.description = Integrated circuits etched into high-purity silicon. Control electronics for advanced machinery.
item.eclipse-reinforced-glass.name = Reinforced Glass
item.eclipse-reinforced-glass.description = Metaglass fused with a titanium mesh. Withstands high pressure and extreme cold.
item.eclipse-hot-superalloy.name = Hot Superalloy
item.eclipse-hot-superalloy.description = Superalloy fresh from the alloy furnace, still glowing. Cool it in a vacuum freezer before use.
item.eclipse-hot-tungsten-carbide.name = Hot Tungsten Carbide
item.eclipse-hot-tungsten-carbide.description = Tungsten carbide fresh from the sintering furnace. Cool it in a vacuum freezer before use.
item.eclipse-hot-aluminium.name = Hot Aluminium
item.eclipse-hot-aluminium.description = Aluminium fresh from the smelter's electrolytic cell. Cool it in a vacuum freezer before use.
item.eclipse-hot-surge-superalloy.name = Hot Surge Superalloy
item.eclipse-hot-surge-superalloy.description = Surge superalloy fresh from the arc furnace, still crackling. Cool it in a vacuum freezer before use.
item.eclipse-hot-titanium.name = Hot Titanium
item.eclipse-hot-titanium.description = Titanium sponge fresh from the chloride titanium plant. Cool it in a vacuum freezer before use.
item.eclipse-hot-silicon.name = Hot Silicon
item.eclipse-hot-silicon.description = Silicon fresh from the electric arc. Cool it in a vacuum freezer before use.
item.eclipse-hot-metaglass.name = Hot Metaglass
item.eclipse-hot-metaglass.description = Soda-lime glass fresh from the blast furnace. Cool it in a vacuum freezer before use.
item.eclipse-hot-reinforced-glass.name = Hot Reinforced Glass
item.eclipse-hot-reinforced-glass.description = Reinforced glass fresh from the glass kiln. Cool it in a vacuum freezer before use.
item.eclipse-surge-superalloy.name = Surge Superalloy
item.eclipse-surge-superalloy.description = Surge alloy bonded into a superalloy matrix in an electric arc. Immensely strong and still crackles with stored charge.
liquid.eclipse-steam.name = Steam
liquid.eclipse-steam.description = Hot water vapor raised in a boiler. Drives steam turbines.
liquid.eclipse-liquid-nitrogen.name = Liquid Nitrogen
liquid.eclipse-liquid-nitrogen.description = Nitrogen condensed to a liquid. The most effective turret coolant, colder than cryofluid. Freezes units.

block.eclipse-heat-exchanger.name = Heat Exchanger
block.eclipse-heat-exchanger.description = Collects heat from its back and sides and passes it out of the front. Use it to route waste heat from exothermic processes.
block.eclipse-industrial-boiler.name = Industrial Boiler
block.eclipse-industrial-boiler.description = Boils purified water into steam using heat. More heat produces more steam.
block.eclipse-steam-turbine.name = Steam Turbine
block.eclipse-steam-turbine.description = Generates power from steam and returns most of the water as purified water.
block.eclipse-combined-cycle-turbine.name = Combined-Cycle Turbine
block.eclipse-combined-cycle-turbine.description = A large gas turbine: more power per methane than the Methane Turbine. Its hot exhaust also gives heat out of the front; put an Industrial Boiler there for even more power. Pipe the flue gas away, or it is vented.
block.eclipse-solar-farm.name = Solar Farm
block.eclipse-solar-farm.description = A field of high-purity silicon cells: power without fuel, about four large solar panels in a smaller space. Weaker on dark maps.
block.eclipse-sulfuric-acid-plant.description = Burns sulfur in oxygen and absorbs the gas in water to produce sulfuric acid.\nThe reaction gives off waste heat out of the front; recover it with a heat exchanger and boiler.
block.eclipse-alumina-refinery.name = Alumina Refinery
block.eclipse-alumina-refinery.description = Digests bauxite in hot sodium hydroxide and precipitates alumina (the Bayer process). The residue leaves as red mud, which must be taken away. Requires heat.
block.eclipse-blast-furnace.name = Blast Furnace
block.eclipse-blast-furnace.description = Melts and hot-forms with heat from adjacent heaters: hot superalloy, superalloy frames, Kroll titanium (with magnesium under argon), soda-lime glass (sand with soda ash) and reinforced glass. Each recipe stops below the heat it needs.
block.eclipse-electric-furnace.name = Electric Furnace
block.eclipse-electric-furnace.description = Melts and sinters with electricity alone: AlNiCo magnets (induction), hot tungsten carbide (sintered with a cobalt binder), silicon (sand reduced with graphite in the arc; the CO2 is vented or piped off), graphite from petroleum coke, aluminium remelted from scrap, titanium out of red mud, and hot surge superalloy (electric arc under argon).
block.eclipse-pressure-reactor.name = Pressure Reactor
block.eclipse-pressure-reactor.description = Catalytic and high-pressure synthesis: ammonia and methanol (pressurized first), olefins (propylene left, wastewater right), nitric acid (platinum catalyst), acrylonitrile (molybdenum catalyst), polyethylene and synthetic rubber (polymer catalyst). Catalysts wear out slowly. Tier III power.
block.eclipse-chemical-reactor.name = Chemical Reactor
block.eclipse-chemical-reactor.description = Small-batch chemistry. Select a reaction: hydrochloric acid, neutralizing acidic waste into brine, soda ash, flue gas scrubbing (tier II), pyratite, aqua regia, ammonium nitrate, fertilizer, polymer catalyst, epoxy resin or blast compound (ANFO, with diesel) (tier III).
block.eclipse-electrolyzer.name = Electrolyzer
block.eclipse-electrolyzer.description = Splits with electricity. Water into hydrogen (left) and oxygen (right); brine into chlorine (left), hydrogen (right) and sodium hydroxide (front); long water electrolysis into heavy water (front); heavy water into deuterium (left) and oxygen (right); brine into liquid sodium (left) and chlorine (right); alumina into hot aluminium; magnesium from brine; ore minerals leached in sulfuric acid and electrowon (2 metal per ore, with byproducts); scrap in sulfuric acid into copper and lead, leaving acidic waste. Rotate it to aim the gas outputs.
block.eclipse-vacuum-freezer.name = Vacuum Freezer
block.eclipse-vacuum-freezer.description = Cools hot metal and glass from the ECLIPSE furnaces with cryofluid so it can be used. With nothing selected it cools whatever arrives. Titanium, silicon and glass need tier II power, superalloy, tungsten carbide and aluminium tier III, surge superalloy tier V.
block.eclipse-surge-superalloy-wall.name = Surge Superalloy Wall
block.eclipse-surge-superalloy-wall.description = An extremely strong wall that absorbs lasers and arcs lightning at attackers.
block.eclipse-surge-superalloy-wall-large.name = Large Surge Superalloy Wall
block.eclipse-surge-superalloy-wall-large.description = An extremely strong wall that absorbs lasers and arcs lightning at attackers.\nSpans multiple tiles.
block.eclipse-cryogenic-condenser.name = Cryogenic Condenser
block.eclipse-cryogenic-condenser.description = Condenses nitrogen gas into liquid nitrogen using cryofluid refrigeration.
block.eclipse-silicon-refinery.name = Silicon Refinery
block.eclipse-silicon-refinery.description = Purifies silicon to semiconductor grade with hydrochloric acid and hydrogen.
block.eclipse-chip-fabricator.name = Chip Fabricator
block.eclipse-chip-fabricator.description = Etches high-purity silicon and builds transistors into it, packaged in polyethylene: one microchip per cycle.

item.eclipse-molybdenum.name = Molybdenum
item.eclipse-molybdenum.description = A refractory metal with a very high melting point. Its silicide makes excellent electric heating elements.
item.eclipse-vanadium.name = Vanadium
item.eclipse-vanadium.description = A metal recovered from slag. Its four oxidation states make it ideal for redox flow batteries.
item.eclipse-platinum.name = Platinum
item.eclipse-platinum.description = A rare, inert precious metal. An outstanding catalyst.
item.eclipse-thorium-fuel-rod.name = Thorium Fuel Rod
item.eclipse-thorium-fuel-rod.description = Thorium pellets sealed in superalloy cladding. Fuel for the fission reactor. Radioactive.
item.eclipse-spent-fuel-rod.name = Spent Fuel Rod
item.eclipse-spent-fuel-rod.description = A depleted fuel rod. Reprocess it with nitric acid to recover thorium. Radioactive.
liquid.eclipse-aqua-regia.name = Aqua Regia
liquid.eclipse-aqua-regia.description = A mixture of hydrochloric and nitric acid, the only acid that dissolves platinum. [scarlet]Corrodes ordinary liquid blocks; use polymer conduits and tanks.[]

block.eclipse-ore-molybdenum.name = Molybdenum Ore
block.eclipse-ore-platinum.name = Platinum Ore

block.eclipse-platinum-refinery.name = Platinum Refinery
block.eclipse-platinum-refinery.description = Dissolves trace platinum out of scrap with aqua regia. Produces acidic waste.
block.eclipse-electric-heater.name = Electric Heater
block.eclipse-electric-heater.description = Turns power into heat with molybdenum disilicide elements. Outputs heat in the direction it faces.
block.eclipse-flow-battery.name = Vanadium Flow Battery
block.eclipse-flow-battery.description = Stores energy in tanks of vanadium electrolyte. The largest battery available.
block.eclipse-fission-reactor.name = Fission Reactor
block.eclipse-fission-reactor.description = Burns thorium fuel rods to produce an enormous amount of heat out of the front. Pair it with an industrial boiler and steam turbines.\nLeaves spent fuel rods behind.
block.eclipse-breeder-reactor.name = Breeder Reactor
block.eclipse-breeder-reactor.description = A fast reactor with a thorium blanket: 2.5 times the Fission Reactor's heat, and every fuel rod comes out as two spent rods to reprocess. Cooled with liquid sodium. Point it at an Industrial Boiler.
block.eclipse-fusion-reactor.name = Fusion Reactor
block.eclipse-fusion-reactor.description = A tokamak. Fuses deuterium with tritium bred from lithium, held by superconducting magnets cooled with liquid nitrogen. Needs power to ignite and warms up slowly, then gives an enormous amount of power. Explodes if destroyed while running.
block.eclipse-reprocessing-plant.name = Reprocessing Plant
block.eclipse-reprocessing-plant.description = Dissolves spent fuel rods in nitric acid and extracts the thorium with a solvent carried in diesel (PUREX). Produces acidic waste.

stat.eclipse-catalyst-optional = (optional: {0}x speed)

block.eclipse-aluminium-conveyor.name = Aluminium Conveyor
block.eclipse-aluminium-conveyor.description = A light, fast belt. Moves 20 items per second.
block.eclipse-chromium-conveyor.name = Chromium Conveyor
block.eclipse-chromium-conveyor.description = A hardened belt. Moves 30 items per second.
block.eclipse-superalloy-conveyor.name = Superalloy Conveyor
block.eclipse-superalloy-conveyor.description = A high-speed belt. Moves 40 items per second.
block.eclipse-carbide-conveyor.name = Carbide Conveyor
block.eclipse-carbide-conveyor.description = A very high-speed belt on tungsten carbide rollers. Moves 50 items per second.
block.eclipse-surge-conveyor.name = Surge Conveyor
block.eclipse-surge-conveyor.description = The fastest belt. Moves 60 items per second.\nVanilla junctions, routers and bridges are slower; feed it directly where possible.
block.eclipse-aluminium-conduit.name = Aluminium Conduit
block.eclipse-aluminium-conduit.description = A wide-bore conduit. Carries 3600 liquid per second (plated conduit: 3000). Corrosion-resistant.
block.eclipse-chromium-conduit.name = Chromium Conduit
block.eclipse-chromium-conduit.description = Carries 4200 liquid per second. Corrosion-resistant.
block.eclipse-superalloy-conduit.name = Superalloy Conduit
block.eclipse-superalloy-conduit.description = Carries 4800 liquid per second. Corrosion-resistant.
block.eclipse-carbide-conduit.name = Carbide Conduit
block.eclipse-carbide-conduit.description = Carries 5400 liquid per second. Corrosion-resistant.
block.eclipse-surge-conduit.name = Surge Conduit
block.eclipse-surge-conduit.description = The highest-capacity conduit. Carries 6000 liquid per second. Corrosion-resistant.

block.eclipse-augmentation-coupler.name = Augmentation Coupler
block.eclipse-augmentation-coupler.description = Attaches one upgrade module to an adjacent machine, vanilla or ECLIPSE, without replacing it.\nConnects automatically if only one machine is adjacent; otherwise tap it and then tap the machine to upgrade.\nInsert a module like any item. Unloaders can take it out again.\nSeveral couplers can serve one machine; extra modules of the same kind count for half as much as the previous one.
block.eclipse-basic-module-assembler.name = Basic Module Assembler
block.eclipse-basic-module-assembler.description = Builds tier I upgrade modules. Select the module to build.
block.eclipse-advanced-module-assembler.name = Advanced Module Assembler
block.eclipse-advanced-module-assembler.description = Builds tier II and III upgrade modules. Select the module to build.

item.eclipse-production-accelerator-1.name = Production Accelerator I
item.eclipse-production-accelerator-1.description = Makes the attached machine work 10% faster. The coupler draws extra power to drive it.
item.eclipse-production-accelerator-2.name = Production Accelerator II
item.eclipse-production-accelerator-2.description = Makes the attached machine work 20% faster. The coupler draws extra power to drive it.
item.eclipse-production-accelerator-3.name = Production Accelerator III
item.eclipse-production-accelerator-3.description = Makes the attached machine work 35% faster. The coupler draws a lot of extra power to drive it.
item.eclipse-power-optimizer-1.name = Power Optimizer I
item.eclipse-power-optimizer-1.description = Cuts the attached machine's power draw by 10%.
item.eclipse-power-optimizer-2.name = Power Optimizer II
item.eclipse-power-optimizer-2.description = Cuts the attached machine's power draw by 20%.
item.eclipse-power-optimizer-3.name = Power Optimizer III
item.eclipse-power-optimizer-3.description = Cuts the attached machine's power draw by 30%.

stat.eclipse-module-tier = Tier
stat.eclipse-module-speed = Machine Speed
stat.eclipse-module-power = Machine Power Draw
stat.eclipse-module-cost = Coupler Power Draw
stat.eclipse-module-cost-value = {0} power units/s + {1}% of the machine's draw
stat.eclipse-module-compatible = Fits
stat.eclipse-compat-production = Crafters, separators and drills (vanilla and ECLIPSE)
stat.eclipse-compat-powered = Any machine that uses power (not batteries)
stat.eclipse-compat-any = Any machine
bar.eclipse-augment-none = No machine connected
bar.eclipse-augment-idle = {0}: inactive
bar.eclipse-augment-active = {0}: augmented

block.eclipse-advanced-coupler.name = Advanced Coupler
block.eclipse-advanced-coupler.description = An augmentation coupler with two module slots.
block.eclipse-augmentation-hub.name = Industrial Augmentation Hub
block.eclipse-augmentation-hub.description = A large augmentation interface with four module slots, for heavily specialized machines.

item.eclipse-output-amplifier-1.name = Output Amplifier I
item.eclipse-output-amplifier-1.description = The machine produces 10% more per cycle, but runs 10% slower. Saves material rather than time.\nCannot be combined with a Precision Fabricator on the same machine.
item.eclipse-output-amplifier-2.name = Output Amplifier II
item.eclipse-output-amplifier-2.description = The machine produces 20% more per cycle, but runs 15% slower.\nCannot be combined with a Precision Fabricator on the same machine.
item.eclipse-output-amplifier-3.name = Output Amplifier III
item.eclipse-output-amplifier-3.description = The machine produces 30% more per cycle, but runs 20% slower.\nCannot be combined with a Precision Fabricator on the same machine.
item.eclipse-precision-fabricator-1.name = Precision Fabricator I
item.eclipse-precision-fabricator-1.description = Returns 10% of the items the machine consumes each cycle.\nCannot be combined with an Output Amplifier on the same machine.
item.eclipse-precision-fabricator-2.name = Precision Fabricator II
item.eclipse-precision-fabricator-2.description = Returns 20% of the items the machine consumes each cycle.\nCannot be combined with an Output Amplifier on the same machine.
item.eclipse-precision-fabricator-3.name = Precision Fabricator III
item.eclipse-precision-fabricator-3.description = Returns 30% of the items the machine consumes each cycle.\nCannot be combined with an Output Amplifier on the same machine.
item.eclipse-material-recycler-1.name = Material Recycler I
item.eclipse-material-recycler-1.description = Collects 10% of the machine's consumed items as scrap, which the coupler outputs.
item.eclipse-material-recycler-2.name = Material Recycler II
item.eclipse-material-recycler-2.description = Collects 20% of the machine's consumed items as scrap, which the coupler outputs.

stat.eclipse-module-yield = Output per Cycle
stat.eclipse-module-saving = Item Inputs
stat.eclipse-module-recycle = Recycled as Scrap
stat.eclipse-module-exclusive = Exclusive With
stat.eclipse-exclusive-efficiency = Other efficiency modules (Output Amplifier / Precision Fabricator / Matter Replicator / Zero-Point Efficiency Core)
stat.eclipse-compat-item-producers = Item crafters and drills (vanilla and ECLIPSE)
stat.eclipse-compat-item-consumers = Crafters that consume items (vanilla and ECLIPSE)
stat.eclipse-coupler-slots = Module Slots
bar.eclipse-augment-conflict = {0}: conflicting modules

block.eclipse-chemical-augmentation-interface.name = Chemical Augmentation Interface
block.eclipse-chemical-augmentation-interface.description = A coupler for chemical plants: three module slots and a large coolant tank. Only accepts chemical modules.

item.eclipse-reaction-accelerator-1.name = Reaction Accelerator I
item.eclipse-reaction-accelerator-1.description = Chemical machines work 15% faster. Needs coolant in the coupler; colder coolants last longer.
item.eclipse-reaction-accelerator-2.name = Reaction Accelerator II
item.eclipse-reaction-accelerator-2.description = Chemical machines work 30% faster. Needs coolant in the coupler; colder coolants last longer.
item.eclipse-reaction-accelerator-3.name = Reaction Accelerator III
item.eclipse-reaction-accelerator-3.description = Chemical machines work 50% faster. Needs coolant in the coupler; colder coolants last longer.
item.eclipse-thermal-controller-1.name = Thermal Controller I
item.eclipse-thermal-controller-1.description = Supplies 15% of a heat-driven machine's heat requirement.
item.eclipse-thermal-controller-2.name = Thermal Controller II
item.eclipse-thermal-controller-2.description = Supplies 30% of a heat-driven machine's heat requirement.
item.eclipse-thermal-controller-3.name = Thermal Controller III
item.eclipse-thermal-controller-3.description = Supplies 45% of a heat-driven machine's heat requirement.
item.eclipse-pressure-stabilizer-1.name = Pressure Stabilizer I
item.eclipse-pressure-stabilizer-1.description = A pressurized reactor reaches operating pressure 50% faster and loses it more slowly.
item.eclipse-pressure-stabilizer-2.name = Pressure Stabilizer II
item.eclipse-pressure-stabilizer-2.description = A pressurized reactor reaches operating pressure twice as fast and loses it more slowly.
item.eclipse-catalyst-optimizer-1.name = Catalyst Optimizer I
item.eclipse-catalyst-optimizer-1.description = Catalysts in the attached reactor last 50% longer.
item.eclipse-catalyst-optimizer-2.name = Catalyst Optimizer II
item.eclipse-catalyst-optimizer-2.description = Catalysts in the attached reactor last twice as long.
item.eclipse-purification-module-1.name = Purification Module I
item.eclipse-purification-module-1.description = The machine produces 10% more of its main product liquid (e.g. purified water, not brine).
item.eclipse-purification-module-2.name = Purification Module II
item.eclipse-purification-module-2.description = The machine produces 20% more of its main product liquid (e.g. purified water, not brine).
item.eclipse-purification-module-3.name = Purification Module III
item.eclipse-purification-module-3.description = The machine produces 30% more of its main product liquid (e.g. purified water, not brine).
item.eclipse-waste-recovery-1.name = Waste Recovery I
item.eclipse-waste-recovery-1.description = Turns 25% of the machine's acidic waste back into the acid it consumes.
item.eclipse-waste-recovery-2.name = Waste Recovery II
item.eclipse-waste-recovery-2.description = Turns 50% of the machine's acidic waste back into the acid it consumes.

stat.eclipse-module-thermal = Heat Supplied
stat.eclipse-module-pressure = Pressurizing Speed
stat.eclipse-module-catalyst = Catalyst Life
stat.eclipse-module-liquid-yield = Main Product Liquid
stat.eclipse-module-waste = Waste Recovered
stat.eclipse-module-coolant = Coolant
stat.eclipse-module-coolant-value = {0} water/s (colder coolants: less)
stat.eclipse-compat-chemical = Chemical machines: crafters that use or produce liquids
stat.eclipse-compat-heat = Heat-driven machines
stat.eclipse-compat-pressurized = Pressurized reactors
stat.eclipse-compat-catalytic = Reactors that use a catalyst
stat.eclipse-compat-liquid-producers = Crafters that produce a liquid
stat.eclipse-compat-waste-producers = Crafters that produce acidic waste

block.eclipse-military-augmentation-interface.name = Military Augmentation Interface
block.eclipse-military-augmentation-interface.description = A coupler for turrets: three module slots, military modules only.
block.eclipse-experimental-augmentation-facility.name = Experimental Augmentation Facility
block.eclipse-experimental-augmentation-facility.description = Builds tier IV and legendary modules from the most advanced materials available.
block.eclipse-module-recycling-facility.name = Module Recycling Facility
block.eclipse-module-recycling-facility.description = Dismantles unwanted modules and recovers half of the materials used to make them.

item.eclipse-thermal-recovery-1.name = Thermal Recovery I
item.eclipse-thermal-recovery-1.description = Turns 10% of a hot machine's waste heat into power for the grid. Works best on heat producers such as the fission reactor.
item.eclipse-thermal-recovery-2.name = Thermal Recovery II
item.eclipse-thermal-recovery-2.description = Turns 20% of a hot machine's waste heat into power for the grid.
item.eclipse-thermal-recovery-3.name = Thermal Recovery III
item.eclipse-thermal-recovery-3.description = Turns 30% of a hot machine's waste heat into power for the grid.
item.eclipse-energy-overcharger-1.name = Energy Overcharger I
item.eclipse-energy-overcharger-1.description = Charges for 15 seconds, then pushes the machine 60% faster for 5 seconds.
item.eclipse-energy-overcharger-2.name = Energy Overcharger II
item.eclipse-energy-overcharger-2.description = Charges for 15 seconds, then pushes the machine twice as fast for 5 seconds.
item.eclipse-capacitor-module-1.name = Capacitor Module I
item.eclipse-capacitor-module-1.description = Stores 2000 power units from spare grid power and feeds them to the machine during power shortages.
item.eclipse-capacitor-module-2.name = Capacitor Module II
item.eclipse-capacitor-module-2.description = Stores 6000 power units from spare grid power and feeds them to the machine during power shortages.
item.eclipse-deep-mining-1.name = Deep Mining I
item.eclipse-deep-mining-1.description = Drills mine 20% faster.
item.eclipse-deep-mining-2.name = Deep Mining II
item.eclipse-deep-mining-2.description = Drills mine 40% faster.
item.eclipse-deep-mining-3.name = Deep Mining III
item.eclipse-deep-mining-3.description = Drills mine 60% faster.
item.eclipse-advanced-drill-head-1.name = Advanced Drill Head I
item.eclipse-advanced-drill-head-1.description = Drills extract 15% more ore per cycle, without slowing down.\nCannot be combined with other efficiency modules.
item.eclipse-advanced-drill-head-2.name = Advanced Drill Head II
item.eclipse-advanced-drill-head-2.description = Drills extract 30% more ore per cycle, without slowing down.\nCannot be combined with other efficiency modules.
item.eclipse-geological-analyzer.name = Geological Analyzer
item.eclipse-geological-analyzer.description = Surveys every deposit within 10 tiles of the drill. Hover over the coupler to see the results.
item.eclipse-rapid-fire-controller-1.name = Rapid Fire Controller I
item.eclipse-rapid-fire-controller-1.description = The turret fires 20% faster but heats up while shooting. An overheated turret slows down until it cools.
item.eclipse-rapid-fire-controller-2.name = Rapid Fire Controller II
item.eclipse-rapid-fire-controller-2.description = The turret fires 35% faster but heats up while shooting. An overheated turret slows down until it cools.
item.eclipse-rapid-fire-controller-3.name = Rapid Fire Controller III
item.eclipse-rapid-fire-controller-3.description = The turret fires 50% faster but heats up quickly while shooting. Pair it with a cooling system.
item.eclipse-cooling-system-1.name = Cooling System I
item.eclipse-cooling-system-1.description = The turret sheds heat 50% faster, preventing rapid-fire overheating.
item.eclipse-cooling-system-2.name = Cooling System II
item.eclipse-cooling-system-2.description = The turret sheds heat twice as fast, preventing rapid-fire overheating.
item.eclipse-advanced-ammunition-1.name = Advanced Ammunition I
item.eclipse-advanced-ammunition-1.description = The turret's shots deal 10% more damage.
item.eclipse-advanced-ammunition-2.name = Advanced Ammunition II
item.eclipse-advanced-ammunition-2.description = The turret's shots deal 20% more damage.
item.eclipse-advanced-ammunition-3.name = Advanced Ammunition III
item.eclipse-advanced-ammunition-3.description = The turret's shots deal 30% more damage.
item.eclipse-targeting-computer-1.name = Targeting Computer I
item.eclipse-targeting-computer-1.description = Removes half of the turret's spread.
item.eclipse-targeting-computer-2.name = Targeting Computer II
item.eclipse-targeting-computer-2.description = Removes all of the turret's spread.
item.eclipse-ballistic-computer.name = Ballistic Computer
item.eclipse-ballistic-computer.description = Shots fly 50% faster over the same range, making fast targets easier to hit.

item.eclipse-production-accelerator-4.name = Production Accelerator IV
item.eclipse-production-accelerator-4.description = Experimental. The machine works 50% faster at a very high power cost.
item.eclipse-power-optimizer-4.name = Power Optimizer IV
item.eclipse-power-optimizer-4.description = Experimental. Cuts the machine's power draw by 40%.
item.eclipse-output-amplifier-4.name = Output Amplifier IV
item.eclipse-output-amplifier-4.description = Experimental. 40% more output per cycle; the machine runs 20% slower.\nCannot be combined with other efficiency modules.
item.eclipse-precision-fabricator-4.name = Precision Fabricator IV
item.eclipse-precision-fabricator-4.description = Experimental. Returns 40% of consumed items.\nCannot be combined with other efficiency modules.
item.eclipse-reaction-accelerator-4.name = Reaction Accelerator IV
item.eclipse-reaction-accelerator-4.description = Experimental. Chemical machines work 70% faster. Needs a lot of coolant.
item.eclipse-deep-mining-4.name = Deep Mining IV
item.eclipse-deep-mining-4.description = Experimental. Drills mine 80% faster.
item.eclipse-mass-production.name = Mass Production
item.eclipse-mass-production.description = A machine configuration: 40% faster and 20% more output per cycle, but it consumes enormous amounts of power. One per machine.
item.eclipse-closed-loop-processing.name = Closed-Loop Processing
item.eclipse-closed-loop-processing.description = A machine configuration: returns 15% of inputs, recycles 10% as scrap and recovers half of any acidic waste. One per machine.
item.eclipse-emergency-overdrive.name = Emergency Overdrive
item.eclipse-emergency-overdrive.description = A machine configuration: after charging, bursts the machine to 2.5x speed for 5 seconds. Very power hungry. One per machine.
item.eclipse-quantum-accelerator.name = Quantum Accelerator
item.eclipse-quantum-accelerator.description = [purple]Legendary.[] Makes the machine work 2.5 times as fast, using exotic energy. One per machine.
item.eclipse-matter-replicator.name = Matter Replicator
item.eclipse-matter-replicator.description = [purple]Legendary.[] 80% more output per cycle with no slowdown, above the usual 50% cap. One per machine; replaces other efficiency modules.
item.eclipse-ancient-efficiency-core.name = Zero-Point Efficiency Core
item.eclipse-ancient-efficiency-core.description = [purple]Legendary.[] Cuts the machine's power draw by 70% and returns a quarter of its inputs. One per machine; replaces other efficiency modules.
item.eclipse-temporal-processing-core.name = Temporal Processing Core
item.eclipse-temporal-processing-core.description = [purple]Legendary.[] After charging, bends time: the machine runs 4x as fast for 5 seconds. One per machine.

