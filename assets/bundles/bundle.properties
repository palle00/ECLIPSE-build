# military: second turret set (line-breaker and anti-air)
block.eclipse-piledriver.name = Piledriver
block.eclipse-piledriver.description = A heavy cannon that fires tungsten carbide slugs. Each slug punches through up to three ground units in a line, with no splash. Slow to reload; cannot hit aircraft.
block.eclipse-kestrel.name = Kestrel
block.eclipse-kestrel.description = Launches one guided interceptor at a time at the strongest aircraft in range. Very accurate, long range; weak against swarms. Fires ammonium nitrate or blast compound.
block.eclipse-thunderhead.name = Thunderhead
block.eclipse-thunderhead.description = An electrical discharge that hits one aircraft and jumps to up to four more nearby, losing a quarter of its strength with every jump. Every aircraft hit is Jammed briefly. Short range, needs a lot of power; air only.
block.eclipse-cloudbreaker.name = Cloudbreaker
block.eclipse-cloudbreaker.description = Lays floating mines around itself, up to 8 at a time. Each mine waits for up to 20 seconds; when an aircraft comes near, it darts at it and bursts. Air only. Fires blast compound or ammonium nitrate.
wiki.eclipse-piledriver = The answer to armoured columns. Its slug passes through up to three ground units in a line, so place it where enemies march in a row toward it: a straight approach or a corridor. It has no splash and a long reload, so it is poor against swarms of small units.\nIt works best together with armour-weakening fire: Acid Mortar shells and sulfur shells from Hail or Ripple leave enemies Etched (half armour), and the Piledriver then goes through them.
wiki.eclipse-kestrel = Precision anti-air. It always aims at the strongest aircraft in range, so it removes the dangerous units (gunships, bombers, command platforms) first. Each missile follows its target. Against a large swarm of small flyers it is wasted: pair it with a Cloudbreaker or a Thunderhead.
wiki.eclipse-thunderhead = Anti-air against groups. One discharge can hit five aircraft, each jump dealing less damage, and every aircraft hit is Jammed for a moment. It shines against the Swarm's wasp flocks and loses value against a single heavily armoured aircraft. It has a short range and draws a lot of power, so give it a strong grid.
wiki.eclipse-cloudbreaker = A defended airspace instead of a gun. It lays floating mines around itself (up to 8 at a time); armed mines dart at any aircraft that comes close and burst. Mines that find nothing fizzle out after 20 seconds. Place it where aircraft pass on their way to your base. It is a filter for passing formations, not a replacement for normal anti-air, and it never hits ground units.

# Third turret set: one per tier, from the first minutes to the endgame
block.eclipse-rivet.name = Rivet
block.eclipse-rivet.description = A small gatling. It starts slow, but the longer it keeps firing, the faster it shoots: up to three times its starting rate after 3 seconds. It winds down when it has nothing to shoot. Fires copper, graphite or silicon (seeking rounds).
block.eclipse-sickle.name = Sickle
block.eclipse-sickle.description = Throws a spinning sawblade that flies out, turns, and comes back to the turret, cutting through every ground unit on its path both ways. Cannot hit aircraft. Fires titanium blades, or tungsten carbide blades that hit harder and etch armour.
block.eclipse-tremor.name = Tremor
block.eclipse-tremor.description = Slams the ground: a shockwave spreads from the turret to its full range, hitting every enemy ground unit it passes, throwing it back and slowing it. Aircraft and buildings are unaffected. Needs only power.
block.eclipse-apiary.name = Apiary
block.eclipse-apiary.description = Launches drones, up to 6 at a time. Each drone flies to the enemy, circles above it for 10 seconds and fires laser bolts at whatever enemy is nearest, ground or air, moving on when its target dies. Drones cannot be shot down. Fires silicon drones, or microchip drones that hit harder and fire faster.
block.eclipse-event-horizon.name = Event Horizon
block.eclipse-event-horizon.description = Fires a slow singularity that stops where it was aimed and pulls every enemy around it inward, ground and air, hurting them, until it collapses in a huge blast after 5 seconds. Heavier units are pulled less. Needs power. Fires aetherite, or phase fabric for a weaker singularity.
wiki.eclipse-rivet = The first ECLIPSE turret, buildable in the copper age. A 1x1 gatling that spins up: it opens at 2 shots a second and climbs to 6 a second after 3 seconds of continuous fire, then winds down over 2 seconds once it has nothing to shoot. That makes it weak against a single quick runner but strong against a steady stream of enemies. Spun up on copper it deals about 54 damage per second, twice a Duo; graphite (heavier rounds) and silicon (seeking rounds) reach about 86. It takes copper gears to build, so it is a good first use for your Gear Press.
wiki.eclipse-sickle = An early-midgame line cutter. Its sawblade flies out about 18 blocks, turns and comes straight back, cutting every ground unit it passes on the way out and again on the way back, so a tight group takes double damage. Point it down a path enemies follow. Titanium blades deal 32 per cut; tungsten carbide blades deal 60 and etch armour. It never hits aircraft or buildings.
wiki.eclipse-tremor = Crowd control for the ground. Every two seconds a shockwave spreads from the turret out to 15 blocks, dealing 70 damage to each enemy ground unit it passes, throwing it back and slowing it for 2 seconds. Light units are thrown about two blocks, heavy ones barely move. It never misses and needs no ammunition, only power, but it cannot hit aircraft. Put it at a choke point so the wave catches many units at once, behind walls so the knockback keeps them off the walls.
wiki.eclipse-apiary = A late-game drone launcher that covers ground and air at once. Each drone circles above its target for 10 seconds and fires laser bolts at the nearest enemy; when that target dies it looks for another. Up to 6 drones fly at once, so it is strongest against long, spread-out waves. Silicon drones fire every half second; microchip drones fire faster with heavier bolts and give two drones per chip.
wiki.eclipse-event-horizon = The endgame turret, made with experimental cores and fired with aetherite. Its singularity drifts to the aimed point and stops there; for 5 seconds it drags every enemy within 9 blocks toward its centre, hurting them, and then collapses in a blast that deals up to 900 damage. Swarms and light units are pulled into a tight ball; the heaviest units barely move but still take the damage. Pair it with splash turrets (Ripple, Acid Mortar, Cyclone) that hit the ball. Phase fabric works as a weaker fallback ammunition.
stat.eclipse-spin = Spin-up
stat.eclipse-spin-value = up to {0}x fire rate after {1}s of firing
stat.eclipse-drones = Drones at Once

# Lattice Drill (endgame)
block.eclipse-lattice-drill.name = Lattice Drill
block.eclipse-lattice-drill.description = Place it on an ore patch: once built, it grows a mining lattice over the whole connected patch of that ore (up to 200 tiles, 3 a second), and every covered tile mines into the drill. Building on a covered tile cuts it out. Power use grows with the lattice. Optional coolant (water, cryofluid, liquid nitrogen...) speeds up mining and growth: the colder the coolant, the bigger the boost.
wiki.eclipse-lattice-drill = The endgame way to mine a whole ore field with one building. Place the core on the ore you want (it mines the ore most common under it). Once powered, a glowing lattice spreads tile by tile across every connected tile of that ore, up to 200 tiles, and each covered tile mines into the core. A 100-tile copper patch gives about 29 copper per second through one block.\nThe lattice only follows the same ore and only free ground: it never crosses to another patch or another ore, and if you build on a covered tile, that tile drops out. Two lattice drills never claim the same tile. Power use grows with the covered area (3 per tile per second on top of the core's base use), so a big patch needs a strong grid.\nBoost it with coolant piped into the core: water gives about 1.6x, cryofluid about 2.35x and liquid nitrogen about 2.65x, on both mining and growth. Corrosive liquids are refused. The drill heads that swing over the patch are just for show; every covered tile mines whether a head is over it or not.
