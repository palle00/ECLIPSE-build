# military: second turret set (line-breaker and anti-air)
block.eclipse-piledriver.name = Piledriver
block.eclipse-piledriver.description = A heavy cannon that fires tungsten carbide slugs. Each slug punches through up to three ground units in a line, with no splash. Slow to reload; cannot hit aircraft.
block.eclipse-kestrel.name = Kestrel
block.eclipse-kestrel.description = Launches one guided interceptor at a time at the strongest aircraft in range. Very accurate, long range; weak against swarms. Fires ammonium nitrate or blast compound.
block.eclipse-thunderhead.name = Thunderhead
block.eclipse-thunderhead.description = An electrical discharge that hits one aircraft and jumps to up to four more nearby, losing a quarter of its strength with every jump. Every aircraft hit is Jammed briefly. Short range, needs a lot of power; air only.
block.eclipse-cloudbreaker.name = Cloudbreaker
block.eclipse-cloudbreaker.description = Lays floating mines around itself, up to 8 at a time. Each mine waits for up to 20 seconds; when an aircraft comes near, it darts at it and bursts. Air only. Fires blast compound or ammonium nitrate.
wiki.eclipse-piledriver = The answer to armoured columns. Its slug passes through up to three ground units in a line, so place it where enemies march in a row toward it: a straight approach or a corridor. It has no splash and a long reload, so it is poor against swarms of small units.\nIt works best together with armour-weakening fire: Acid Mortar shells and sulfur shells from Hail or Ripple leave enemies Etched (half armour), and the Piledriver then goes through them.
block.eclipse-bombard.name = Bombard
block.eclipse-bombard.description = A siege mortar with the longest range of any turret: 70 blocks. Its heavy shells fly slowly in a high arc and blow up a wide area; a red ring on the ground shows where each will land. It cannot fire at anything within 15 blocks of itself, and it cannot hit aircraft. Fires graphite, ammonium nitrate or blast compound.
wiki.eclipse-bombard = Long-range siege artillery. It outranges Ripple and even Foreshadow, so it can shell enemy bases and spawn points from deep inside your own defences, and its shells do extra damage to buildings. The price is a 15-block blind spot: anything that gets close is safe from it, so always cover it with shorter-range turrets and walls.\nShells take about three seconds to land and the landing spot is marked, so fast units can get out of the way. Use it on slow, heavy columns and on buildings, and pair it with Etching (Acid Mortar, sulfur shells) for armoured targets.
block.eclipse-primer.name = Primer
block.eclipse-primer.description = One half of the Supernova. Fires a weak shot that leaves a ticking mark. After 2.5 seconds the mark detonates, pulls in every friendly stardust cloud within 11 blocks and explodes. Alone it only makes a small bang; with Stardust Launchers around it the blast grows with every cloud. Needs power.
wiki.eclipse-primer = The detonator of the Supernova pair. Place it together with one or more [accent]Stardust Launchers[] aimed at the same approach: the Launchers fill the area with stardust, and the Primer's mark gathers up to 60 clouds into one explosion. Its size and damage grow with every cloud, and every item adds its own trait:\n- explosive items (blast compound, ammonium nitrate, pyratite) add the most damage;\n- flammable items (coal, spore pods, pyratite, sulfur) start fires;\n- charged surge alloy throws lightning;\n- radioactive items (thorium, phase fabric) add damage;\n- plastanium bursts into fragments;\n- spore pods slow whatever survives.\nClouds last only 4 seconds, so the Launchers must keep firing while the fuse runs down. The dashed circle around the mark shows how far it reaches.
block.eclipse-stardust-launcher.name = Stardust Launcher
block.eclipse-stardust-launcher.description = The other half of the Supernova. Rapidly fires small shots of almost any item: sand, scrap, coal, metals, glass, silicon, thorium, spore pods, pyratite, blast compound, plastanium, phase fabric, surge alloy, sulfur or ammonium nitrate. Each shot is weak, but where it lands it leaves a cloud of stardust in the item's colour for 4 seconds, for a Primer to set off.
wiki.eclipse-stardust-launcher = On its own it barely hurts anything: it is the fuel for a [accent]Primer[]. Every cloud it leaves adds to the Primer's blast, so more Launchers (or faster ones, with coolant) make a far bigger Supernova.\nCheap items such as sand and scrap make a cheap, wide blast. Expensive ones add strong traits: blast compound for raw damage, pyratite for fire, surge alloy for lightning, plastanium for fragments. Mixing items mixes the traits, and the blast takes on their colours.
planet.eclipse-hive.name = Hive
planet.eclipse-hive.description = A spore-choked jungle world, the Swarm's home. It attacks every wave, breeders and Behemoths sooner than anywhere else. Research is shared with Serpulo.
planet.eclipse-ironhold.name = Ironhold
planet.eclipse-ironhold.description = A scorched industrial wasteland, the Dominion's stronghold. Its armoured tanks and gunships attack every wave, with both bosses sooner than anywhere else. Research is shared with Serpulo.
planet.eclipse-tide.name = Tide
planet.eclipse-tide.description = An ocean world of scattered islands, held by the Tide. Its boats attack every wave and its submarines come from the open sea; ground armies drown here. Research is shared with Serpulo.
block.eclipse-sonar.name = Sonar
block.eclipse-sonar.description = Pings every 2 seconds. Submerged submarines within 25 blocks are put on Sonar Contact for 3 seconds, so your turrets can target and hit them. Needs power.
wiki.eclipse-sonar = The answer to the Tide's submarines. Under water a sub cannot be seen or hit by anything but mines; on Sonar Contact it can be shot like any boat. Place Sonars along the coast near the water spawn, overlapping with your turrets' range. The nuclear Abyss never surfaces, so against it a Sonar is the only way to fight back besides mines.
block.eclipse-payload-catapult.name = Payload Catapult
block.eclipse-payload-catapult.description = Throws whole blocks. Feed it empty containers, vaults, liquid tanks or batteries by payload conveyor, then fill the loaded block from belts, pipes and power. Once nothing more has gone in for 2 seconds it hurls the block up to 52 blocks away, where it explodes just as that block would if destroyed. Cannot hit aircraft; its shots always land at least 8 blocks away. Needs power.
wiki.eclipse-payload-catapult = The most expensive shots in the game, and the biggest. Whatever the shell holds decides the blast, by the same rules as when that block is destroyed:\n- a container or vault of [accent]blast compound[] (up to 300 or 1000) is a devastating explosion;\n- [accent]pyratite, coal, spore pods, oil[] and other flammables start fires;\n- a charged [accent]battery[] throws lightning;\n- [accent]slag, oil, cryofluid[] and other liquids splash out as puddles over the target.\nThe cheaper options (a tank of oil or slag, a charged battery) are the budget ammunition; a vault full of blast compound is the real thing.\nSetup: a [accent]Casing Fabricator[] builds the empty shells onto a payload conveyor that leads into the catapult; belts and pipes into the catapult fill the shell it holds. It fires when the shell stops filling (full, or the supply ran dry), so a slow supply means a slow but full shot. The blast does not care whose buildings it hits: keep it away from your own.
block.eclipse-casing-fabricator.name = Casing Fabricator
block.eclipse-casing-fabricator.description = Builds empty containers, vaults, liquid containers, liquid tanks, batteries and large batteries from their usual building materials, and pushes them out onto a payload conveyor. Made to supply the Payload Catapult. Needs power.
wiki.eclipse-casing-fabricator = Serpulo has no Constructor, so this is how the Payload Catapult gets its shells. Choose which block to build, feed it that block's building materials, and point its output at a payload conveyor that leads into the catapult. Small shells (a container, a battery) are quick and cheap; vaults and large tanks hold far more, for far bigger shots.
wiki.eclipse-kestrel = Precision anti-air. It always aims at the strongest aircraft in range, so it removes the dangerous units (gunships, bombers, command platforms) first. Each missile follows its target. Against a large swarm of small flyers it is wasted: pair it with a Cloudbreaker or a Thunderhead.
wiki.eclipse-thunderhead = Anti-air against groups. One discharge can hit five aircraft, each jump dealing less damage, and every aircraft hit is Jammed for a moment. It shines against the Swarm's wasp flocks and loses value against a single heavily armoured aircraft. It has a short range and draws a lot of power, so give it a strong grid.
wiki.eclipse-cloudbreaker = A defended airspace instead of a gun. It lays floating mines around itself (up to 8 at a time); armed mines dart at any aircraft that comes close and burst. Mines that find nothing fizzle out after 20 seconds. Place it where aircraft pass on their way to your base. It is a filter for passing formations, not a replacement for normal anti-air, and it never hits ground units.

# Third turret set: one per tier, from the first minutes to the endgame
block.eclipse-rivet.name = Rivet
block.eclipse-rivet.description = A small gatling. It starts slow, but the longer it keeps firing, the faster it shoots: up to three times its starting rate after 3 seconds. It winds down when it has nothing to shoot. Fires copper, graphite or silicon (seeking rounds).
block.eclipse-sickle.name = Sickle
block.eclipse-sickle.description = Throws a spinning sawblade that flies out, turns, and comes back to the turret, cutting through every ground unit on its path both ways. Cannot hit aircraft. Fires titanium blades, or tungsten carbide blades that hit harder and etch armour.
block.eclipse-tremor.name = Tremor
block.eclipse-tremor.description = Slams the ground: a shockwave spreads from the turret to its full range, hitting every enemy ground unit it passes, throwing it back and slowing it. Aircraft and buildings are unaffected. Needs only power.
block.eclipse-apiary.name = Apiary
block.eclipse-apiary.description = Launches drones, up to 6 at a time. Each drone flies to the enemy, circles above it for 10 seconds and fires laser bolts at whatever enemy is nearest, ground or air, moving on when its target dies. Drones cannot be shot down. Fires silicon drones, or microchip drones that hit harder and fire faster.
block.eclipse-event-horizon.name = Event Horizon
block.eclipse-event-horizon.description = Fires a slow singularity that stops where it was aimed and pulls every enemy around it inward, ground and air, hurting them, until it collapses in a huge blast after 5 seconds. Heavier units are pulled less. Needs power. Fires aetherite, or phase fabric for a weaker singularity.
wiki.eclipse-rivet = The first ECLIPSE turret, buildable in the copper age. A 1x1 gatling that spins up: it opens at 2 shots a second and climbs to 6 a second after 3 seconds of continuous fire, then winds down over 2 seconds once it has nothing to shoot. That makes it weak against a single quick runner but strong against a steady stream of enemies. Spun up on copper it deals about 54 damage per second, twice a Duo; graphite (heavier rounds) and silicon (seeking rounds) reach about 86. It takes copper gears to build, so it is a good first use for your Gear Press.
wiki.eclipse-sickle = An early-midgame line cutter. Its sawblade flies out about 18 blocks, turns and comes straight back, cutting every ground unit it passes on the way out and again on the way back, so a tight group takes double damage. Point it down a path enemies follow. Titanium blades deal 96 per cut; tungsten carbide blades deal 180 and etch armour. It never hits aircraft or buildings.
wiki.eclipse-tremor = Crowd control for the ground. Every two seconds a shockwave spreads from the turret out to 15 blocks, dealing 175 damage to each enemy ground unit it passes, throwing it back and slowing it for 2 seconds. Light units are thrown about two blocks, heavy ones barely move. It never misses and needs no ammunition, only power, but it cannot hit aircraft. Put it at a choke point so the wave catches many units at once, behind walls so the knockback keeps them off the walls.
wiki.eclipse-apiary = A late-game drone launcher that covers ground and air at once. Each drone circles above its target for 10 seconds and fires laser bolts at the nearest enemy; when that target dies it looks for another. Up to 6 drones fly at once, so it is strongest against long, spread-out waves. Silicon drones fire every half second; microchip drones fire faster with heavier bolts and give two drones per chip.
wiki.eclipse-event-horizon = The endgame turret, made with experimental cores and fired with aetherite. Its singularity drifts to the aimed point and stops there; for 5 seconds it drags every enemy within 9 blocks toward its centre, hurting them, and then collapses in a blast that deals up to 2,700 damage. Swarms and light units are pulled into a tight ball; the heaviest units barely move but still take the damage. Pair it with splash turrets (Ripple, Acid Mortar, Cyclone) that hit the ball. Phase fabric works as a weaker fallback ammunition.
