item.eclipse-aetherite.name = Aetherite
item.eclipse-aetherite.description = A rare energy crystal, found deep in far-off ground or washed out of crushed ore. Stores enormous amounts of energy; used in Tier V modules and Aetherite Capacitors.
block.eclipse-ore-aetherite.name = Aetherite Deposit
block.eclipse-ore-aetherite.description = Rare aetherite crystals, found far from the starting core on new sectors. Needs a carbide drill or better.
block.eclipse-aetherite-capacitor.name = Aetherite Capacitor
block.eclipse-aetherite-capacitor.description = Stores power in aetherite crystals: more than twice a lithium battery in the same space.
block.eclipse-geothermal-heat-tap.name = Geothermal Heat Tap
block.eclipse-geothermal-heat-tap.description = Draws free heat from hot rock and magma rock, with no fuel. Can only be built on hot floors; hotter ground gives more heat.
eclipse-geothermal.heat = Heat: {0}
stat.eclipse-geothermal-value = {0} heat per unit of floor heat
block.eclipse-aetherite-module-forge.name = Aetherite Module Forge
block.eclipse-aetherite-module-forge.description = Builds Tier V modules around aetherite crystals.
item.eclipse-production-accelerator-5.name = Production Accelerator V
item.eclipse-production-accelerator-5.description = Aetherite-powered. The machine works 70% faster, at a lower power cost than tier IV.
item.eclipse-power-optimizer-5.name = Power Optimizer V
item.eclipse-power-optimizer-5.description = Aetherite-powered. Cuts the machine's power draw by 50%, the maximum.
item.eclipse-output-amplifier-5.name = Output Amplifier V
item.eclipse-output-amplifier-5.description = Aetherite-powered. 50% more output per cycle for only 10% less speed. Cannot be combined with a Precision Fabricator.
item.eclipse-deep-mining-5.name = Deep Mining V
item.eclipse-deep-mining-5.description = Aetherite-powered. Drills mine twice as fast.

block.eclipse-robot-dispatch-hub.name = Robot Dispatch Hub
block.eclipse-robot-dispatch-hub.description = Home base for up to 4 ECLIPSE robots within 25 tiles. Robots built in the Air Factory sign in to the nearest hub with a free slot. Tap the hub to give each robot its job, then tap a building to pick it. Recharges docked robots with power, and turns titanium rods into repair charge.
unit.eclipse-logistics-drone.name = Logistics Drone
unit.eclipse-logistics-drone.description = Carries up to 20 of one item from a source building to a destination building, both within its hub's range. Only delivers what the destination accepts; a turret destination gets ammo. Slower than belts; meant for awkward local routes.
unit.eclipse-repair-drone.name = Repair Drone
unit.eclipse-repair-drone.description = Flies to one assigned building and repairs it from a finite repair charge, refilled at its hub with titanium rods. Never builds.
unit.eclipse-shield-drone.name = Shield Support Drone
unit.eclipse-shield-drone.description = Escorts the largest group of friendly units near its hub and tops them up to 40 shield from a finite pool. Recharges only at its hub. Its shields vanish if it is destroyed.
