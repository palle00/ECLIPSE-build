liquid.eclipse-flue-gas.name = Flue Gas
liquid.eclipse-flue-gas.description = Hot exhaust from burning methane and waste: nitrogen and carbon dioxide with traces of sulfur dioxide. Vented when not piped away, but worth processing in a scrubber or gas separator.
liquid.eclipse-carbon-dioxide.name = Carbon Dioxide
liquid.eclipse-carbon-dioxide.description = Captured from flue gas by the gas separator. Combined with hydrogen into methanol.
liquid.eclipse-wastewater.name = Wastewater
liquid.eclipse-wastewater.description = Dirty process water left over from scrubbing. Treat it to recover purified water; it backs up and stalls the scrubber otherwise.
item.eclipse-industrial-sludge.name = Industrial Sludge
item.eclipse-industrial-sludge.description = Solids filtered out of wastewater. Burned down in a thermal waste processor to recover scrap and sand.
block.eclipse-industrial-scrubber.name = Industrial Scrubber
block.eclipse-industrial-scrubber.description = Washes flue gas with sodium hydroxide, recovering its sulfur. Leaves wastewater.
block.eclipse-gas-separator.name = Gas Separator
block.eclipse-gas-separator.description = Splits flue gas through selective membranes. Nitrogen exits the left side, carbon dioxide exits the right side. A source of nitrogen without cryofluid.
block.eclipse-wastewater-treatment-plant.name = Wastewater Treatment Plant
block.eclipse-wastewater-treatment-plant.description = Settles and filters wastewater into purified water, leaving industrial sludge.
block.eclipse-thermal-waste-processor.name = Thermal Waste Processor
block.eclipse-thermal-waste-processor.description = Burns down industrial sludge with heat from adjacent heaters, recovering scrap and sand. Gives off flue gas.

liquid.eclipse-methanol.name = Methanol
liquid.eclipse-methanol.description = Made from captured carbon dioxide and hydrogen. The starting point of the methanol route to plastics and fibers.
liquid.eclipse-propylene.name = Propylene
liquid.eclipse-propylene.description = A reactive gas made from methanol. Building block for epoxy, synthetic rubber and acrylonitrile.
liquid.eclipse-acrylonitrile.name = Acrylonitrile
liquid.eclipse-acrylonitrile.description = Toxic monomer made from propylene, ammonia and oxygen. Spun and carbonized into carbon fiber.
item.eclipse-synthetic-rubber.name = Synthetic Rubber
item.eclipse-synthetic-rubber.description = Vulcanized ethylene-propylene rubber. Used for seals, gaskets and belts in advanced machinery.
item.eclipse-epoxy-resin.name = Epoxy Resin
item.eclipse-epoxy-resin.description = A hard-setting resin. Binds carbon fiber into composite.
item.eclipse-carbon-fiber.name = Carbon Fiber
item.eclipse-carbon-fiber.description = Strong, light fiber made by carbonizing acrylonitrile at very high temperature.
item.eclipse-carbon-composite.name = Carbon Composite
item.eclipse-carbon-composite.description = Carbon fiber set in epoxy. A light, extremely strong armor material.
block.eclipse-methanol-synthesizer.name = Methanol Synthesizer
block.eclipse-methanol-synthesizer.description = Combines carbon dioxide and hydrogen into methanol. Must reach operating pressure first.
block.eclipse-olefin-reactor.name = Olefin Reactor
block.eclipse-olefin-reactor.description = Converts methanol into propylene. Propylene exits the left side, wastewater exits the right side.
block.eclipse-epoxy-plant.name = Epoxy Plant
block.eclipse-epoxy-plant.description = Reacts propylene with chlorine and cures it with sodium hydroxide into epoxy resin. Leaves wastewater.
block.eclipse-rubber-plant.name = Rubber Plant
block.eclipse-rubber-plant.description = Polymerizes ethylene and propylene into synthetic rubber, vulcanized with sulfur. Needs polymer catalyst, which is slowly used up.
block.eclipse-acrylonitrile-reactor.name = Acrylonitrile Reactor
block.eclipse-acrylonitrile-reactor.description = Reacts propylene, ammonia and oxygen into acrylonitrile over a molybdenum catalyst, which is slowly used up.
block.eclipse-carbon-fiber-furnace.name = Carbon Fiber Furnace
block.eclipse-carbon-fiber-furnace.description = Spins acrylonitrile into fiber and carbonizes it. Needs a lot of heat from adjacent heaters. Gives off flue gas.
block.eclipse-composite-press.name = Composite Press
block.eclipse-composite-press.description = Lays carbon fiber in epoxy resin and cures it into carbon composite.
block.eclipse-composite-wall.name = Composite Wall
block.eclipse-composite-wall.description = A carbon composite wall. Stronger than superalloy, and sometimes deflects bullets.
block.eclipse-composite-wall-large.name = Large Composite Wall
block.eclipse-composite-wall-large.description = A large carbon composite wall. Stronger than superalloy, and sometimes deflects bullets.

item.eclipse-biomass.name = Biomass
item.eclipse-biomass.description = Plant and algae matter. Fermented into biofuel, processed into enzymes, or burned in combustion generators.
item.eclipse-fertilizer.name = Fertilizer
item.eclipse-fertilizer.description = Ammonium sulfate granules, or digestate from sludge. Feeds biomass cultivators.
item.eclipse-enzyme-extract.name = Enzyme Extract
item.eclipse-enzyme-extract.description = Biological catalysts extracted from biomass and spores. Doubles the speed of the biochemical fermenter.
liquid.eclipse-biofuel.name = Biofuel
liquid.eclipse-biofuel.description = Ethanol fermented from biomass. Burned in biofuel engines for power.
block.eclipse-fertilizer-plant.name = Fertilizer Plant
block.eclipse-fertilizer-plant.description = Neutralizes ammonia with sulfuric acid into ammonium sulfate fertilizer.
block.eclipse-biomass-cultivator.name = Biomass Cultivator
block.eclipse-biomass-cultivator.description = Grows biomass under artificial light from purified water and fertilizer. Works on any ground.
block.eclipse-algae-photobioreactor.name = Algae Photobioreactor
block.eclipse-algae-photobioreactor.description = Grows algae on water, carbon dioxide and fertilizer, producing biomass and releasing oxygen. A use for captured CO2.
block.eclipse-enzyme-extractor.name = Enzyme Extractor
block.eclipse-enzyme-extractor.description = Extracts enzymes from biomass and spore pods.
block.eclipse-biochemical-fermenter.name = Biochemical Fermenter
block.eclipse-biochemical-fermenter.description = Ferments biomass into biofuel. Biofuel exits the left side, carbon dioxide exits the right side. Runs twice as fast with enzyme extract, which is slowly used up.
block.eclipse-biofuel-engine.name = Biofuel Engine
block.eclipse-biofuel-engine.description = Burns biofuel for power. Exhaust leaves as flue gas; pipe it away to use it, or it is vented.
block.eclipse-anaerobic-digester.name = Anaerobic Digester
block.eclipse-anaerobic-digester.description = Bacteria digest industrial sludge and biomass into methane and fertilizer. Needs no power.

item.eclipse-copper-gear.name = Copper Gear
item.eclipse-copper-gear.description = Pressed from copper. Moving parts for basic machinery, pumps, sorters and tier I modules.
item.eclipse-titanium-rod.name = Titanium Rod
item.eclipse-titanium-rod.description = Extruded titanium. Structural frames, pressure vessels and bearing races.
item.eclipse-titanium-gear.name = Titanium Gear
item.eclipse-titanium-gear.description = Hard-wearing gears for industrial machinery, reactors, fast belts and tier II modules.
item.eclipse-pressure-casing.name = Pressure Casing
item.eclipse-pressure-casing.description = A sealed titanium and metaglass vessel shell. Needed by chemical reactors, columns and boilers.
item.eclipse-industrial-bearing.name = Industrial Bearing
item.eclipse-industrial-bearing.description = Precision bearings for turbines, drills, compressors and other fast machinery.
item.eclipse-superalloy-frame.name = Superalloy Frame
item.eclipse-superalloy-frame.description = A hot-formed superalloy machine frame for heavy, hot and high-pressure machinery.
item.eclipse-precision-component.name = Precision Component
item.eclipse-precision-component.description = Fine mechanical and electronic assemblies for smart logistics, electronics and tier III modules.
item.eclipse-experimental-core.name = Experimental Core
item.eclipse-experimental-core.description = Surge superalloy, platinum and phase fabric around precision parts. The heart of endgame machinery and tier IV modules.
block.eclipse-gear-press.name = Gear Press
block.eclipse-gear-press.description = Presses copper into copper gears.
block.eclipse-metal-extruder.name = Metal Extruder
block.eclipse-metal-extruder.description = Extrudes titanium into rods, using graphite as die lubricant.
block.eclipse-heavy-gear-press.name = Heavy Gear Press
block.eclipse-heavy-gear-press.description = Presses titanium into titanium gears.
block.eclipse-casing-forge.name = Casing Forge
block.eclipse-casing-forge.description = Builds pressure casings from titanium rods and metaglass, sealed with graphite.
block.eclipse-bearing-press.name = Bearing Press
block.eclipse-bearing-press.description = Makes industrial bearings from titanium rods, copper and graphite.
block.eclipse-frame-forge.name = Frame Forge
block.eclipse-frame-forge.description = Hot-forms superalloy and titanium rods into superalloy frames. Needs heat from adjacent heaters.
block.eclipse-precision-assembler.name = Precision Assembler
block.eclipse-precision-assembler.description = Assembles precision components from titanium gears, silicon and high-purity silicon.
block.eclipse-experimental-core-assembler.name = Experimental Core Assembler
block.eclipse-experimental-core-assembler.description = Builds experimental cores from precision components, surge superalloy, platinum and phase fabric.

block.eclipse-component-depot.name = Component Depot
block.eclipse-component-depot.description = Stores mechanical components only, so they can stay next to their production lines. Keeps your core stocked with up to 200 of each component from anywhere on the map, so you can always build with them. Never merges with the core.
stat.eclipse-core-reserve = Core Reserve
stat.eclipse-core-reserve-value = Keeps up to {0} of each component in the core
setting.eclipse-compact-core.name = ECLIPSE: compact core display (hide process intermediates)

item.eclipse-copper-wire.name = Copper Wire
item.eclipse-copper-wire.description = Drawn copper wire. Made into circuit boards and used in electrical machinery, heaters and batteries.
item.eclipse-circuit-board.name = Circuit Board
item.eclipse-circuit-board.description = Copper traces on a polyethylene board. Used in control units, smart logistics and augmentation interfaces.
item.eclipse-control-unit.name = Control Unit
item.eclipse-control-unit.description = A microchip controller with motor drive. Automates advanced drills, smart logistics, reactors and assemblers.
item.eclipse-alnico-magnet.name = AlNiCo Magnet
item.eclipse-alnico-magnet.description = An aluminium-nickel-cobalt permanent magnet. Used in motors, turbines and magnetic confinement.
item.eclipse-crushed-ore.name = Crushed Ore
item.eclipse-crushed-ore.description = Crushed scrap and rock. Washed into metals in the ore washer.
liquid.eclipse-chilled-water.name = Chilled Water
liquid.eclipse-chilled-water.description = Evaporatively cooled water. A cheap coolant for turrets and augmentation couplers, better than water but not as good as cryofluid.
block.eclipse-wire-drawing-machine.name = Wire Drawing Machine
block.eclipse-wire-drawing-machine.description = Draws copper into copper wire.
block.eclipse-circuit-board-printer.name = Circuit Board Printer
block.eclipse-circuit-board-printer.description = Lays copper wire traces on polyethylene and etches them in hydrochloric acid into circuit boards. The spent acid leaves as acidic waste.
block.eclipse-control-unit-assembler.name = Control Unit Assembler
block.eclipse-control-unit-assembler.description = Builds control units from microchips, circuit boards and AlNiCo motor magnets.
block.eclipse-ore-crusher.name = Ore Crusher
block.eclipse-ore-crusher.description = Crushes scrap into crushed ore, leaving sand.
block.eclipse-ore-washer.name = Ore Washer
block.eclipse-ore-washer.description = Washes crushed ore with water and separates the metals by density: nickel, chromium, cobalt, molybdenum, vanadium, tungsten, a little platinum and, rarely, aetherite.
block.eclipse-induction-furnace.name = Induction Furnace
block.eclipse-induction-furnace.description = Melts aluminium, nickel and cobalt electrically into AlNiCo magnets. Needs a lot of power but no heat.
block.eclipse-thermal-storage.name = Thermal Storage
block.eclipse-thermal-storage.description = Passes heat through like a heat exchanger and stores it. When the heaters stop, it keeps delivering heat until it runs empty.
block.eclipse-cooling-tower.name = Cooling Tower
block.eclipse-cooling-tower.description = Cools water by evaporation into chilled water, a cheap coolant. Some water is lost to the air.
stat.eclipse-heat-capacity = Heat Storage
stat.eclipse-heat-capacity-value = {0} heat-seconds, up to {1} heat out
bar.eclipse-stored-heat = Stored Heat: {0}

block.eclipse-silicon-reduction-furnace.name = Silicon Reduction Furnace
block.eclipse-silicon-reduction-furnace.description = Reduces sand to silicon with methane instead of coal. Needs heat from adjacent heaters; far faster than the silicon smelter.
block.eclipse-methane-pyrolysis-reactor.name = Methane Pyrolysis Reactor
block.eclipse-methane-pyrolysis-reactor.description = Cracks methane into graphite and hydrogen with heat. Graphite without coal, with hydrogen to spare.
block.eclipse-soda-glass-furnace.name = Soda Glass Furnace
block.eclipse-soda-glass-furnace.description = Melts sand with sodium hydroxide flux into metaglass. Uses no lead, and needs heat from adjacent heaters.
block.eclipse-chloride-titanium-plant.name = Chloride Titanium Plant
block.eclipse-chloride-titanium-plant.description = Chlorinates mineral sands with coal and reduces them to titanium. Titanium from sand instead of ore; needs heat.
block.eclipse-electrowinning-cell.name = Electrowinning Cell
block.eclipse-electrowinning-cell.description = Dissolves scrap in sulfuric acid and plates out copper and lead. The spent electrolyte leaves as acidic waste.

block.eclipse-wave-intelligence-scanner.name = Wave Intelligence Scanner
block.eclipse-wave-intelligence-scanner.description = While powered, analyses the next enemy wave: unit types, counts, shields and bosses, and the time left. Tap it for the report. To show the wave on screens, select the scanner and tap up to 4 logic displays within 12 tiles. Information only; it never changes the wave.
block.eclipse-wave-disruption-array.name = Wave Disruption Array
block.eclipse-wave-disruption-array.description = Once fully charged, tap and activate to delay the incoming wave by 20 seconds. Only before the wave arrives, and only on maps with a wave timer. All arrays share one lockout of 2 waves, so delays never stack.
block.eclipse-unit-shield-beacon.name = Unit Shield Beacon
block.eclipse-unit-shield-beacon.description = Projects a field that shields friendly units (not buildings) from a shared, finite pool. Tops each unit up to 80 shield and takes it back when the unit leaves. Recharges with power, slower while the field is under fire.
block.eclipse-emergency-repair-dispatch-bay.name = Emergency Repair Dispatch Bay
block.eclipse-emergency-repair-dispatch-bay.description = Repairs one chosen friendly building quickly, using titanium rods as repair stock. Select the bay, then tap the building to service; tap the bay again to clear. It never repairs an area and never builds.
