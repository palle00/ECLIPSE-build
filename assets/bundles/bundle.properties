eclipse-wiki.setup = Minimal setup
eclipse-wiki.setup.hint = Items arrive on the belt from the left, liquids in conduits; outputs leave the way the machine sends them. Machines that send liquids out of fixed sides are shown facing up (the arrow marks the front), so their left and right are the picture's left and right. Heat machines need a heater facing them; powered machines need power.

eclipse-wiki.guide.start.name = Getting Started
eclipse-wiki.guide.start.text = ECLIPSE turns Serpulo into a deeper industry: machine parts, chemistry, new metals, upgrade modules, robots, new turrets and three enemy factions. It works in the campaign, free play and custom games. Research is part of the normal tech tree, and in the build menu every ECLIPSE block sits next to the vanilla blocks it builds on (the Rivet right after the Duo).\n\n[accent]How it fits together[]\nFour branches feed each other:\n- [accent]Mechanical parts[] (gears, rods, casings, bearings, frames, precision parts): what ECLIPSE buildings are made of.\n- [accent]Chemistry[] (water, brine and oil into gases, acids and plastics): inputs for the special processes.\n- [accent]Metallurgy[] (new ores into alloys): stronger materials for later machines.\n- [accent]Electronics[] (wire, circuit boards, microchips, control units): the brains of smart and late-game blocks.\nVanilla materials never go out of use: copper, lead, graphite, silicon, titanium, thorium, surge and phase are needed at every stage.\n\n!tip Every machine has a Build examples tab|Animated, ratio-correct setups with the real items on the belts. In a game, Build this puts the example on your cursor.\n\n## The first minutes\nCopper, lead and graphite.\n\n1. Build a [accent]Gear Press[] (copper into copper gears) and an [accent]Extruder[] (copper into wire). Gears and wire are in most early ECLIPSE costs.\n2. Put a [accent]Rivet[] or two at your entrances: a cheap 1x1 gatling that fires faster the longer it shoots.\n3. Drop a [accent]Flow Meter[] into any belt to see how many items per second pass. It costs almost nothing and never slows the belt.\n\n## Titanium parts\n1. [accent]Extruder[] (titanium into rods), [accent]Gear Press[] (titanium gears), [accent]Metal Press[] (plates) and [accent]Lathe[] (bolts, screws, rings, springs). The [accent]Assembler[] builds pressure casings, bearings, motors, pumps and pistons from them. These parts unlock most mid-game machines.\n2. Build a [accent]Component Depot[] next to your part lines. It keeps your core stocked with up to 200 of each part, from anywhere on the map, so you can build without belting parts to the core.\n3. Start chemistry: pump water into a [accent]Water Treatment Plant[] (purified water out of one side, brine out of the other). Purified water feeds the [accent]Electrolyzer[] (hydrogen and oxygen), and so does brine. Oil goes into the [accent]Distillation Column[].\n4. Defence: the [accent]Sickle[] throws a sawblade that cuts through ground units out and back.\n\n!warn Acids eat ordinary conduits|Pipe them with polymer or plated conduits. See Chemistry and Corrosion.\n\n## Metals, heat and electronics\n1. Nickel, chromium and molybdenum are near your core; cobalt, tungsten and platinum further out. No ore on the map? Crush scrap in the [accent]Ore Crusher[] and wash it in the [accent]Ore Washer[].\n2. Many machines need [accent]heat[]: point an [accent]Electric Heater[] or [accent]Industrial Heater[] at them. The [accent]Blast Furnace[] turns nickel, chromium and cobalt into superalloy (heat 8: two electric heaters on two sides).\n3. Electronics: circuit boards, high-purity silicon, microchips and precision components.\n4. [accent]Upgrade modules[]: put an [accent]Augmentation Coupler[] next to any machine (vanilla too), build modules in a [accent]Basic Module Assembler[] and insert one.\n5. Defence: [accent]Tremor[], [accent]Heat Lance[], [accent]Acid Mortar[], and anti-air from [accent]Kestrel[] and [accent]Thunderhead[].\n\n!warn A heater only gives its full heat when its whole side touches the machine|A 2x2 heater hanging half off a 3x3 furnace gives half its heat. On a 3x3 machine, one heater fits per side.\n\n!next Superalloy comes out hot|Cool it in a Vacuum Freezer with cryofluid before use; one freezer keeps up with three furnaces. The Blast Furnace's Build examples tab shows the whole line.\n\n## Late game\n- Power: a [accent]Fission Reactor[] heating [accent]Industrial Boilers[] for [accent]Steam Turbines[], or methane turbines and fuel cells; later the Breeder and Fusion reactors.\n- [accent]Robots[]: build drones in the Air Factory and give them jobs at a [accent]Robot Dispatch Hub[].\n- [accent]Experimental cores[] and [accent]surge superalloy[] open the endgame: the [accent]Lattice Drill[] (mines a whole ore patch), the [accent]Apiary[] and [accent]Event Horizon[] turrets, the Orbital Weapons Platform and the World Engine.\n\n[accent]The enemy[]\nWaves also bring the [accent]Swarm[] (every 2nd wave), the [accent]Dominion[] (every 3rd) and the [accent]Tide[] (every 5th). See Enemy Factions and Military.\n\n## Good to know\n- Most ECLIPSE machines are [accent]universal[]: one Gear Press makes every gear, one Assembler every part. Tap a machine to pick its recipe; the [accent]?[] in the recipe menu opens its page here.\n- Every recipe has a [accent]power tier[] (I 30/s, II 120/s, III 480/s, IV 1920/s, V 7680/s). Below full power the machine stops rather than slowing down. Overclocking speeds a machine up for much more power.\n- Every item page has a [accent]Chain[] tab: the whole chain down to raw materials, with how many machines it takes.\n- Press [accent]I[] over any ECLIPSE block or unit to open its page here. Over a stopped machine it opens with why it stopped and how to fix it.\n- Click any icon to jump to its page; hover it for a short card. Pin pages you use often (P), and go back and forward with Alt and the arrow keys.\n- Machines with several liquid outputs send each out of a fixed side; coloured arrows show which while you place them.\n- Waste (acidic waste, wastewater, flue gas) must go somewhere, or the machine that makes it stalls.\n\n!tip See everything running|Open the ECLIPSE Showcase map in Custom Games.

eclipse-wiki.guide.industry.name = Universal machines
eclipse-wiki.guide.industry.text = Most ECLIPSE production runs on [accent]universal machines[]: one machine, many recipes. The Gear Press makes every gear, the Assembler every part, the Electrolyzer every electrolysis.\n\n[accent]Picking a recipe:[] tap the machine and pick a product. Hover a choice to see the whole recipe: inputs, outputs, power tier, heat, pressure, catalyst and time. The chosen recipe also shows below the buttons. Logic processors can set it with [accent]control config[] and the product; schematics copy it. Tap the chosen recipe again to clear it.\n\n[accent]Automatic:[] the Vacuum Freezer with nothing selected cools whatever hot material arrives, taking turns, so a mixed belt never jams it.\n\n[accent]Power tiers:[] each recipe has a tier: I 30 power/s, II 120, III 480, IV 1920, V 7680. A machine only runs while its grid covers that in full; below it, it stops (its status bar says how much it needs and how much the grid gives).\n\n[accent]Overclocking:[] levels I to III double the speed each time, for 5, 30 and 200 times the power. Level III is for a few key machines on a very strong grid. Production Accelerator modules stack on top, and their extra power grows with the overclock.\n\n[accent]Heat, pressure and catalysts:[] some recipes need heat from adjacent heaters, pressure built up with power, or a catalyst item in the machine. The status bar tells you what is missing.\n\n[accent]Hot metals:[] metal and glass from ECLIPSE furnaces come out hot and must be cooled in a [accent]Vacuum Freezer[] with cryofluid before use.\n\n[accent]Crafting depth:[] metal is formed into plates, rods, wire and foil, turned into bolts, rings, springs, resistors and transistors, and assembled into motors, pumps, pistons and sensors before it becomes a component. Every item page has a [accent]recipe tree[] with the whole chain for 1 per second, the raw materials and the machines it takes.
eclipse-wiki.guide.qol.name = Quality of Life
eclipse-wiki.guide.qol.text = Small helpers ECLIPSE adds to the game. Keys can be rebound in [accent]Settings > Controls[], under ECLIPSE; the keys below are your current ones.\n\n[accent]Keybinds (desktop)[]\n- [accent]{0}[]: open the wiki on the ECLIPSE block or unit under the cursor, or on the ECLIPSE block selected in the build menu. Press again to close.\n- [accent]{1}[] (hold): [accent]Upgrade Section[]. Select a better belt, conduit or wall, hold the key over an existing line or wall of the same kind and click. The whole connected section lights up with a block count and a cost check, then gets replacement plans that builders build normally, with normal costs. Belt contents are kept. Lines stop at gaps, other block types and merges, so a line joining from the side is never included.\n- [accent]{2}[]: open the [accent]Production panel[]. It is also a button at the bottom of the wiki. Resources: everything your base makes and uses per second, with a one-minute graph, its production chain and a hint for the selected one. Production Chains: machines needed against machines built for a target rate. Power: what your generators make and your machines draw.\n- [accent]{3}[]: mark every stopped machine: a frame coloured by the reason and the icon of what it is missing. Press again to hide.\n\n[accent]Information[]\n- [accent]Machine status[]: every ECLIPSE machine says why it stopped in its status bar ("Brine has nowhere to go", "No heat (needs 10)", a missing input or catalyst).\n- [accent]Liquid output arrows[]: machines with several liquid outputs show a coloured arrow at each output side while you place them and while you hover them.\n- [accent]Heat preview[]: while placing a heater, the block in front of it is outlined with the heat it would get and what it needs.\n- [accent]Ratio hint[]: while placing a machine next to one that feeds it (or that it feeds), how many suppliers keep one consumer running.\n- [accent]Turret statistics[]: every turret, vanilla too, shows its damage per second, kills and total damage in its info panel.\n- [accent]Flow Meter[]: put it into any belt to see items per second, per material. Logic processors can read it.\n- [accent]Wave Intelligence Scanner[]: shows exactly what the next wave holds, and can print it on a logic display.\n- [accent]Live map[]: open the map (M) and zoom in. Past a point the map picture fades into the live game, tinted like an old monitor, so you can watch any part of your base without going there. Zoom back out for the map.\n- [accent]Milestones[]: a short message the first time you make a key material, once per save.\n\n[accent]Convenience[]\n- [accent]Component Depot[]: keeps your core stocked with machine parts from anywhere on the map, so you can always build.\n- [accent]Compact core display[]: the core resource list only shows materials used in building costs; process intermediates stay in the core but are hidden. Turn it off in [accent]Settings > Game[].\n- [accent]ECLIPSE main menu[]: a dusk landscape under the eclipse. Turn it off in [accent]Settings > Graphics[].\n\n[accent]This wiki[]\n- Open it from the pause menu, or with [accent]{0}[] in game.\n- Search with the box at the top left. [accent]Previous[] goes back to the last page.\n- Click any icon on a page to jump to its entry. Every machine page has an animated picture of a minimal working setup.

eclipse-wiki.guide.components.name = Mechanical Components
eclipse-wiki.guide.components.text = Advanced buildings are not made from raw metal alone: they need machine parts. Metal is first formed into plates, rods, wire and foil (Metal Press, Extruder), then turned into small parts (Lathe: bolts, screws, rings, springs; Circuit Assembler: resistors, capacitors, transistors), then assembled into parts (Assembler: motors, pumps, pistons, rotors, heating coils, sensors, emitters) and components. Components come in tiers, and each tier is used by buildings of matching complexity:\n- [accent]Copper gears and copper wire[]: basic machinery, sorters, pumps, tier I modules.\n- [accent]Titanium rods, titanium gears, pressure casings[]: industrial machinery, reactors, columns, fast belts, tier II modules.\n- [accent]Industrial bearings and superalloy frames[]: turbines, drills, heavy and hot machinery.\n- [accent]Precision components[]: smart logistics, electronics, tier III modules.\n- [accent]Experimental cores[]: endgame machinery and tier IV modules.\n\nBuild a [accent]Component Depot[] next to your component lines. It stores components, parts and formed metal only, and keeps your core stocked with up to 200 of each from anywhere on the map, so you can always build with them without belting everything to the core.

eclipse-wiki.guide.metallurgy.name = Ores and Metals
eclipse-wiki.guide.metallurgy.text = ECLIPSE adds seven metal ores (bauxite for aluminium among them) plus aetherite. There are two ways to get them.\n\n[accent]Mining.[] The veins hold real ore minerals (pentlandite for nickel, chromite, cobaltite, wolframite, molybdenite, sperrylite for platinum, bauxite for aluminium). Process them: the Ore Crusher gives 1 metal per ore, the Flotation Cell 1.5 with byproducts, leaching in the Electrolyzer 2 with more byproducts. New ore veins are added to newly generated sectors, and to premade custom-game maps when they load. Common ores (nickel, molybdenum, chromium) can appear near your core; rarer ones only further out: cobalt, then tungsten, then platinum, and aetherite farthest of all. Tungsten and aetherite need stronger drills.\n\n[accent]Processing.[] On maps without the ores, crush scrap in the [accent]Ore Crusher[] and wash it in the [accent]Ore Washer[] to separate nickel, chromium, cobalt, molybdenum, vanadium, tungsten, a little platinum and rarely aetherite. The [accent]Mineral Separator[] also leaches trace metals out of slag.\n\n[accent]Key alloys:[] nickel, chromium and cobalt make [accent]superalloy[] in the Blast Furnace (needs heat); tungsten and graphite make [accent]tungsten carbide[] in the Electric Furnace; superalloy and surge alloy make [accent]surge superalloy[] in the Electric Furnace.\n\n[accent]Drills:[] the [accent]Carbide Drill[] out-mines the airblast drill in a smaller footprint. At the very end, the [accent]Lattice Drill[] grows a mining lattice over a whole ore patch and mines all of it through one building.

eclipse-wiki.guide.heat.name = Heat
eclipse-wiki.guide.heat.text = !warn A heater gives its full heat only when its whole side touches the machine|Heat is shared over the tiles in contact: a 2x2 heater hanging half off a 3x3 furnace gives half its heat. On a 3x3 machine, one 2x2 heater fits per side.\n\nMany ECLIPSE machines need [accent]heat[], the same heat system as Serpulo's newer blocks. A machine shows its heat requirement in its stats; with less heat it runs slower or not at all. Universal machines with heat recipes (the Blast Furnace) stop completely below the heat a recipe needs.\n\n[accent]Heat sources[] send heat out of the side they face, so point them at the machine:\n- [accent]Industrial Heater[]: burns methane; its exhaust is flue gas.\n- [accent]Electric Heater[]: turns power into heat, no fuel.\n- [accent]Geothermal Heat Tap[]: free heat, but only on hot rock or magma rock.\n- [accent]Fission Reactor[]: an enormous amount of heat for boilers.\n\n[accent]Moving heat:[] the [accent]Heat Exchanger[] collects heat from its back and sides and passes it out of the front, so one heater can serve a machine around a corner. Some reactions give off waste heat you can recover this way. [accent]Thermal Storage[] works like an exchanger with a reservoir: it keeps heating for a while when the fuel runs out.\n\n[accent]Heat into power:[] an [accent]Industrial Boiler[] makes steam from purified water using heat, and [accent]Steam Turbines[] turn the steam into power and return most of the water.\n\n[accent]Placing a heater:[] the block in front of it is outlined, with how much heat it would get and what it needs.

eclipse-wiki.guide.chemistry.name = Chemistry and Corrosion
eclipse-wiki.guide.chemistry.text = The chemical industry starts with water. The [accent]Water Treatment Plant[] makes purified water and brine. The [accent]Electrolyzer[] splits purified water into hydrogen and oxygen, and turns brine into chlorine, hydrogen and sodium hydroxide. Crude oil goes into the [accent]Distillation Column[] for naphtha, methane, diesel, sulfur and petroleum coke; the [accent]Air Separation Unit[] gives nitrogen, oxygen and argon. From these come acids, plastics, fertilizer and explosives.\n\n[scarlet]Corrosion:[] acids, chlorine, sodium hydroxide and acidic waste slowly destroy ordinary liquid blocks (about 1% of their health per second). Every ECLIPSE liquid block and the vanilla plated conduit resist it. Use [accent]polymer conduits, routers, bridges and tanks[], or the metal conduits from aluminium up.\n\n[accent]Outputs by side:[] machines with two or three liquid products send each out of a fixed side (left, right or front). Their descriptions say which.\n\n[accent]Waste must go somewhere.[] Acidic waste, wastewater and flue gas back up and stall the machine that makes them. Neutralize acidic waste in the [accent]Chemical Reactor[] (it becomes brine, back to the Electrolyzer), treat wastewater, and scrub or separate flue gas. Exhaust gases such as the CO2 of arc furnaces are vented when nothing takes them.\n\n[accent]The Pressure Reactor:[] some recipes need a [accent]catalyst[] item that is only used up every few crafts (platinum gauze for nitric acid, molybdenum for acrylonitrile, the polymer catalyst for plastics); others must first be [accent]pressurized[] with power, and lose pressure when idle.\n\n[accent]Real chemistry:[] ECLIPSE follows the real processes (Haber-Bosch, Ostwald, chlor-alkali, Bayer, Hall-Heroult, Kroll, Dow, PUREX), with real ratios and byproducts. Every byproduct has somewhere to go.\n\n[accent]When a machine stops:[] select it. Its status bar says why, for example which output has nowhere to go, which input is missing, or that it needs heat or a catalyst. While placing a machine, coloured arrows show which liquid leaves which side.

eclipse-wiki.guide.electronics.name = Electronics
eclipse-wiki.guide.electronics.text = Electronics form a chain of their own:\n1. [accent]Copper wire[] from the Extruder and [accent]copper foil[] from the Metal Press.\n2. [accent]High-purity silicon[] from the Silicon Refinery, using hydrochloric acid and hydrogen.\n3. [accent]Resistors, capacitors and transistors[] from the Circuit Assembler.\n4. [accent]Circuit boards[]: copper foil on polyethylene with resistors, a capacitor and a transistor, etched in hydrochloric acid (leaves acidic waste).\n5. [accent]Microchips[] from the Chip Fabricator: high-purity silicon, two transistors and polyethylene.\n6. [accent]Control units[]: a microchip on circuit boards driving an electric motor, in the Circuit Assembler.\n\nThe Assembler builds [accent]sensors[] and [accent]emitters[] on the same parts. Control units automate advanced drills, smart logistics, reactors and module assemblers, so this chain gates much of the late game.

eclipse-wiki.guide.power.name = Power and Storage
eclipse-wiki.guide.power.text = [accent]Generators[], roughly from small to large:\n- [accent]Hydrogen Fuel Cell[] (90/s): hydrogen and oxygen; gives purified water back.\n- [accent]Biofuel Engine[] (150/s): biofuel from fermented biomass, or diesel from the Distillation Column.\n- [accent]Solar Farm[] (300/s): no fuel; follows the map's light.\n- [accent]Methane Turbine[] (360/s): methane; pipe its flue gas away.\n- [accent]Steam Turbine[] (900/s each): steam from an Industrial Boiler. A Fission Reactor drives a boiler for 4 turbines (3,600/s), a Breeder Reactor one for 10 (9,000/s).\n- [accent]Combined-Cycle Turbine[] (2,400/s): methane; its exhaust heat drives a boiler and turbine for another 900/s.\n- [accent]Fusion Reactor[] (24,000/s): deuterium and lithium; needs power to ignite.\n- [accent]World Engine[] (300,000/s): the endgame project, with a 5,000,000 store, a 15% uplink bonus and an overdrive field.\n\n[accent]Power tiers:[] every universal machine recipe needs its tier's power in full (I 30/s, II 120/s, III 480/s, IV 1920/s, V 7680/s), and stops below it, so plan the grid for the recipes you run; batteries bridge short dips. If several tier machines share an overloaded grid, they all stop together. Overclocking multiplies a recipe's power by 5, 30 or 200: a tier V recipe at overclock III wants about 1.5 million/s.\n\n[accent]Storage[], from small to large: Industrial Battery, Lithium Battery, Vanadium Flow Battery, Aetherite Capacitor.\n\nThe Capacitor Module can also keep one machine running through short power shortages.

eclipse-wiki.guide.logistics.name = Smart Logistics
eclipse-wiki.guide.logistics.text = ECLIPSE routers never lose or duplicate items: if an item's destination is full, the item waits on its belt instead of going somewhere wrong. Sides are relative to the block's rotation, so rotating a router rotates its routes. Like vanilla sorters, two instant routers need a belt between them.\n- [accent]Three-Way Sorter / Distribution Hub[]: send chosen items left, front or right, with a fallback side.\n- [accent]Advanced Item Filter[]: an allow or deny list; passing items go straight, the rest to the sides.\n- [accent]Priority Merger[]: merge three lines by priority or in turns.\n- [accent]Controlled Splitter / Line Balancer[]: split one line evenly, by ratio (for example 2:1) or by priority.\n- [accent]Logistics Buffers[]: smooth uneven supply, optionally keeping a reserve.\n- [accent]Batch Gate[]: release items in batches.\n- [accent]Smart Unloader[]: unload up to three chosen items.\n- [accent]Liquid valves[]: overflow, balance, or keep a reserve in a tank.\n\nFaster belts and conduits (aluminium up to surge) carry far more than vanilla ones.\n\n[accent]Flow Meter:[] a cheap block you put into a belt; it shows how many items per second pass.\n[accent]Upgrade Section[] (desktop): select a better belt, conduit or wall, hold Alt (rebindable in Controls) over an existing line and click: the whole connected line or wall gets replacement plans, built normally.

eclipse-wiki.guide.augmentation.name = Augmentation
eclipse-wiki.guide.augmentation.text = Upgrade modules improve a machine without replacing it. They are real items: build them in a module assembler, move them on belts, and insert them into a [accent]coupler[] next to the machine.\n\n[accent]Setting up:[] place a coupler touching the machine. With only one machine next to it, it connects by itself; otherwise tap the coupler, then the machine. Give the coupler power (and coolant for some chemical modules), then insert modules like any item.\n\n[accent]Couplers:[] Augmentation Coupler (1 slot), Advanced Coupler (2), Industrial Augmentation Hub (4), Chemical Augmentation Interface (3, chemical modules, big coolant tank), Military Augmentation Interface (3, turret modules).\n\n[accent]Stacking:[] the strongest module of a kind counts fully, each further one half as much as the previous, up to a cap. Output Amplifiers and Precision Fabricators exclude each other, and unique and legendary modules work once per machine. Hover over the coupler to see each module's state.\n\n[accent]Tiers:[] I from the Basic Module Assembler, II and III from the Advanced Module Assembler, IV and legendary from the Experimental Augmentation Facility, V from the Aetherite Module Forge. Unwanted modules go into the Module Recycling Facility for half their materials.

eclipse-wiki.guide.robotics.name = Robotics
eclipse-wiki.guide.robotics.text = ECLIPSE robots are small flying helpers built in the vanilla [accent]Air Factory[]. They only work from a [accent]Robot Dispatch Hub[], which holds up to 4 robots and reaches 25 blocks.\n1. Build a hub and give it power.\n2. Build robots; each signs in to the nearest hub with a free slot.\n3. Tap the hub to set each robot's job: a logistics drone needs a source, a destination and an item; a repair drone needs the building to repair.\n\n- [accent]Logistics Drone[]: carries one item type between two buildings. Good for awkward local routes, slower than belts.\n- [accent]Repair Drone[]: repairs one building from repair charge, refilled at the hub with titanium rods.\n- [accent]Shield Drone[]: escorts your largest group of units and tops up their shields.\n\nRobots fly home to recharge and never act beyond their hub's range.

eclipse-wiki.guide.defense.name = Defense and Waves
eclipse-wiki.guide.defense.text = [accent]Know what is coming:[] the [accent]Wave Intelligence Scanner[] (Logic tab) reports the next wave's units, counts, shields and bosses. Link it to logic displays to show the report on screens.\n\n[accent]Buy time:[] the [accent]Wave Disruption Array[] and the [accent]Temporal Interference Array[] delay the incoming wave. They share one lockout, so delays never stack.\n\n[accent]Protect units:[] the [accent]Unit Shield Beacon[] shields friendly units inside its field from a shared pool.\n\n[accent]Repair:[] the [accent]Emergency Repair Dispatch Bay[] quickly repairs one chosen building using titanium rods.\n\nThe new walls (superalloy, surge superalloy, composite) are far tougher than vanilla walls; some absorb lasers or deflect bullets.

eclipse-wiki.guide.military.name = Military
eclipse-wiki.guide.military.text = [accent]Ammunition for vanilla turrets:[] tungsten carbide (armor-piercing) for Duo, Fuse, Salvo and Spectre; sulfur (armor-etching) and lead-acid cells (EMP: everything hit is Jammed) for Hail and Ripple. The Acid Mortar can also fire Acidic Waste. Liquid nitrogen is the best turret coolant.\n\n[accent]Turrets:[]\n- [accent]Acid Mortar[]: long-range acid shells that etch armor and leave corrosive pools.\n- [accent]Minelayer[]: lays mines on the enemy's path.\n- [accent]Heat Lance[]: a beam powered by heat instead of power.\n- [accent]Jammer[]: slows enemy weapons in range.\n- [accent]Piledriver[]: a slug through up to three armoured ground units in a line.\n- [accent]Bombard[]: a siege mortar that outranges every other turret, with a blind spot around itself.\n- [accent]Sonar[]: finds submerged submarines so your turrets can hit them.\n- [accent]Payload Catapult[]: throws whole blocks (filled containers, tanks, batteries) that explode where they land as if destroyed; a [accent]Casing Fabricator[] builds the empty shells.\n- [accent]Supernova[]: two turrets that work together. The [accent]Stardust Launcher[] scatters clouds of almost any item; the [accent]Primer[]'s mark detonates a few seconds later and pulls every cloud nearby into one blast. More Launchers, bigger blast; each item adds its own trait.\n\n[accent]A turret for every stage[] (weakest to strongest):\n- [accent]Rivet[] (copper age): a 1x1 gatling that spins up to triple fire rate while it keeps shooting.\n- [accent]Sickle[] (titanium): a sawblade that flies out and back, cutting ground units both ways.\n- [accent]Tremor[] (power): a ground shockwave that throws enemies back and slows them.\n- [accent]Apiary[] (plastanium, microchips): drones that circle the enemy and shoot ground and air.\n- [accent]Event Horizon[] (endgame, aetherite): a singularity that pulls enemies together, then collapses.\n\n[accent]Anti-air:[] [accent]Kestrel[] hunts the strongest aircraft with guided missiles, [accent]Thunderhead[] chains lightning through flocks, and [accent]Cloudbreaker[] fills the air around it with mines.\n\n[accent]Units:[] two new lines built in the vanilla factories and reconstructors: tanks (Reaper, Bulwark, Rampart, Annihilator, Colossus) and strike aircraft (Wraith, Interceptor, Valkyrie, Tempest, Leviathan). The Electronic Warfare Drone slows enemy turrets.\n\n[accent]Endgame:[] the [accent]Titan Manufacturing Complex[] builds one Dreadnought per team, and the [accent]Orbital Weapons Platform[] calls down a strike anywhere within 150 blocks.\n\n[accent]Turret statistics:[] select any turret, vanilla or ECLIPSE, to see its DPS (last 5 seconds), enemies killed and damage done since the map was loaded.

eclipse-wiki.guide.factions.name = Enemy Factions
eclipse-wiki.guide.factions.text = Every custom game and campaign sector with waves (older saves too, the first time they load) gets three enemy factions on top of the map's own waves, PvP maps with waves too (the waves attack every team alike).\n\n## The Swarm\n[accent]The Swarm[] attacks on every 2nd wave: self-repairing biological machines in growing numbers. Mites spit acid, Wasps sting from the air, Spitters leave acid pools, Broods burst into Mites when killed, and from wave 24 a Behemoth boss comes every 12 waves, laying Mite eggs as it advances (they hatch after 3 seconds; splash wipes a clutch). From wave 40, [accent]Scrabba[] comes every 20 waves: a giant scorpion whose claws crush walls in front of it and whose stinger heals it. At full health every Swarm unit grows an [accent]exoskeleton[] that takes damage first and cuts damage by 20% while it holds; steady fire keeps it from growing back, and acid (Etched, from sulfur shells) stops it growing at all. Kill Broods away from your walls, and keep splash damage ready.\n\n## The Dominion\n[accent]The Dominion[] attacks on every 3rd wave: few but heavily armored units from the ECLIPSE tank and aircraft lines, with shields from mid-game and Colossus and Leviathan bosses late. Armor-piercing ammunition and armor-etching shells pay off here.\n\n## The Tide\n[accent]The Tide[] attacks on every 5th wave: amphibious boats that cross water and land alike, fast on water and slow on land. Each sprays a liquid that sets up a reaction for the others: Skiffs leave targets Wet (electric attacks hit harder), Slickers coat them in oil and set them alight, Frostwakes freeze them and drop mines, Cinderwakes melt armour with slag and arc lightning. From wave 15 [accent]Lampreys[] leap out of the water onto your turrets and clamp on, freezing them until killed: keep turrets back from the shore, or cover them with other turrets and anti-air. From wave 35 a Maelstrom boss comes every 20 waves. On maps with a spawn point on water the Tide also sends [accent]submarines[] (Lurker from wave 10, Barracuda from 20, the nuclear Abyss boss every 25 waves from 50): under water they cannot be targeted or hit, except by mines, until a [accent]Sonar[] finds them. Fight them on the shore, where they are slow, and keep ground units off the mine trails.\n\n[accent]Every 6th wave the Swarm and the Dominion attack together[]; every 10th the Tide comes with the Swarm. Use the Wave Intelligence Scanner to see exactly what the next wave holds.\n\n## The ECLIPSE\n[#b37aff]The ECLIPSE[]: every 5th wave may bring an eclipse, more likely the longer the game goes on: a 5% chance at wave 5, 10% at wave 10, 30% at wave 30, about 60% at wave 100, and certain from wave 200. The sky darkens, and until the next wave every enemy unit is tougher and hits harder: x1.1 at wave 10, x1.3 at wave 30, x2 at wave 200. It ends when the next wave arrives.

eclipse-wiki.guide.exploration.name = Exploration and Environment
eclipse-wiki.guide.exploration.text = The ground you build on matters:\n- [accent]Hot rock and magma rock[]: build Geothermal Heat Taps for free heat.\n- [accent]Ice and snow[]: the Cooling Tower and Cryogenic Condenser run faster on cold ground.\n- [accent]Moss and spore moss[]: the Biomass Cultivator grows faster.\n\n[accent]Aetherite[] is the rarest resource: crystal deposits far from your starting core (they need a carbide drill), or a rare find from the Ore Washer. It powers Tier V modules, Aetherite Capacitors, superconductors and the Orbital Weapons Platform.
eclipse-wiki.guide.logic.name = Logic
eclipse-wiki.guide.logic.text = Processors can read and drive most ECLIPSE machines.\n\n[accent]Vanilla instructions[]\n- [accent]sensor r machine @config[]: the product of a universal machine's recipe. @heat and @progress work too.\n- [accent]control config machine @eclipse-titanium-gear[]: picks a recipe (keeps the overclock).\n- [accent]control shoot platform x y 1[]: aims the Orbital Weapons Platform, like a turret.\n- [accent]sensor r meter @copper[]: items per second through a Flow Meter.\n\n[accent]ECLIPSE instructions[] (in the editor's Block and Operation lists)\n- [accent]esensor result block field[]: status, stalled, missing, recipe, overclock, heat, pressure, catalyst, charge, stored, stage, targetX/Y, waveGround/Air/Boss/Time, modules. Every block page lists what it answers.\n- [accent]econtrol overclock|recipe|target block value [y][]: sets overclock, recipe or the platform target. The block must be linked, as with control.\n- [accent]recipe result item field index[]: what the ECLIPSE machine making an item needs: machine, time, amount, power, tier, inputs, input #, inputAmount #.\n\n[accent]Examples[] (paste into a processor; link the blocks first)\n\n[lightgray]Overclock only while power is spare:[]\n[#8fd8ff]sensor stored node1 @powerNetStored\nsensor cap node1 @powerNetCapacity\nop div f stored cap\nop greaterThan spare f 0.8\nop mul lvl spare 2\necontrol overclock assembler1 lvl 0[]\n\n[lightgray]Make gears or plates, whichever the core has less of:[]\n[#8fd8ff]sensor g core @eclipse-titanium-gear\nsensor p core @eclipse-titanium-plate\njump 5 lessThan g p\ncontrol config press1 @eclipse-titanium-plate\nend\ncontrol config press1 @eclipse-titanium-gear[]\n\n[lightgray]Light a lamp when a machine is stuck:[]\n[#8fd8ff]esensor bad assembler1 stalled\ncontrol enabled illuminator1 bad[]\n\n[lightgray]Orbital strike on the strongest enemy in range (link the platform):[]\n[#8fd8ff]radar enemy any any maxHealth platform1 1 u\njump 0 equal u null\nsensor x u @x\nsensor y u @y\ncontrol shoot platform1 x y 1[]\n\n[lightgray]Warn before a big wave:[]\n[#8fd8ff]esensor n scanner1 waveGround\nesensor t scanner1 waveTime\nprint "Next wave: "\nprint n\nprint " ground units in "\nprint t\nprintflush message1[]
eclipse-wiki.guide.compare.name = Comparison Tables
eclipse-wiki.guide.compare.text = Generators, turrets and units side by side, read from the game itself, so the numbers always match this version. Click any name for its page.

# wiki entries: materials
wiki.eclipse-sulfur = Sulfur is a byproduct of refining: the Distillation Column recovers it from crude oil, and the Chemical Reactor recovers it from flue gas. Most of it goes into the Sulfuric Acid Plant.\n\nIt is also caustic ammunition for Hail and Ripple: its shells etch enemy armor, so every other gun hits harder.
wiki.eclipse-polyethylene = The first ECLIPSE plastic, polymerized from ethylene in the Pressure Reactor with a polymer catalyst. Ethylene comes from naphtha in the Steam Cracker, so polyethylene needs the whole oil line: Distillation Column, heater and cracker.\n\nIt goes into casings, circuit boards, microchip packaging and corrosion-proof liquid blocks.
wiki.eclipse-lead-acid-cell = A rechargeable cell: lead plates, a polyethylene case and sulfuric acid. The Assembler makes it, and the Industrial Battery is built from it. A good first use for your sulfuric acid line.
wiki.eclipse-nickel = The most common new metal. Nickel ore appears even close to your core; without it, wash crushed scrap in the Ore Washer.\n\nNickel is the base of superalloy and part of AlNiCo magnets, so you will need a steady supply from the mid game on.
wiki.eclipse-chromium = A hard metal for heat-resistant alloys, mainly superalloy. Its ore is fairly common but sits a little away from the starting core. The Ore Washer also recovers it from scrap.
wiki.eclipse-cobalt = A dense metal that keeps alloys strong in heat. It goes into superalloy and AlNiCo magnets. Its ore is found at medium distance from the core; the Ore Washer and the Mineral Separator also recover it.
wiki.eclipse-tungsten = An extremely hard metal. Its ore lies far from the core and needs a laser drill or better. It can also be washed out of crushed scrap or leached from slag.\n\nSintered with graphite it becomes tungsten carbide, which makes the fastest drill, armor-piercing ammunition and late machinery.
wiki.eclipse-lithium = A light, reactive metal precipitated from brine in the Lithium Extractor, so any map with water can supply it. Lithium Batteries and several late modules need it.
wiki.eclipse-superalloy = The backbone of ECLIPSE's mid and late game. The Blast Furnace melts nickel, chromium and cobalt into it, and needs heat from adjacent heaters to do so.\n\nSuperalloy goes into frames, fuel rod cladding, strong walls, fast belts and many machines. Plan a dedicated line early.
wiki.eclipse-tungsten-carbide = Tungsten sintered with graphite in the Electric Furnace. Nearly as hard as diamond.\n\nUses: the Carbide Drill, fast carbide belts and conduits, advanced modules, and armor-piercing ammunition for Duo, Fuse, Salvo and Spectre, which is very effective against the armored Dominion.
wiki.eclipse-alumina = Aluminium oxide, digested out of bauxite with hot sodium hydroxide in the Alumina Refinery. It has one job: being smelted into aluminium in the power-hungry Electrolyzer.
wiki.eclipse-hot-superalloy = Superalloy straight from the Blast Furnace, too hot to use. Belt it to a Vacuum Freezer set to superalloy; it cools it with cryofluid into usable superalloy.
wiki.eclipse-hot-tungsten-carbide = Tungsten carbide straight from the Electric Furnace, too hot to use. Belt it to a Vacuum Freezer set to tungsten carbide.
wiki.eclipse-hot-aluminium = Aluminium straight from the Electrolyzer, too hot to use. Belt it to a Vacuum Freezer set to aluminium.
wiki.eclipse-hot-surge-superalloy = Surge superalloy straight from the Electric Furnace, too hot to use. Belt it to a Vacuum Freezer set to surge superalloy; cooling it needs tier V power.
wiki.eclipse-hot-titanium = Titanium from the Blast Furnace, too hot to use. A Vacuum Freezer cools it (tier II power). Titanium from ore is never hot.
wiki.eclipse-hot-silicon = Silicon reduced from sand with graphite in the arc of the Electric Furnace, too hot to use. A Vacuum Freezer cools it (tier II power). The vanilla smelter's silicon is ready to use.
wiki.eclipse-hot-metaglass = Metaglass from the Blast Furnace, too hot to use. A Vacuum Freezer cools it (tier II power).
wiki.eclipse-hot-reinforced-glass = Reinforced glass from the Blast Furnace, too hot to use. A Vacuum Freezer cools it (tier II power).
wiki.eclipse-aluminium = A light, conductive metal smelted from alumina with petroleum coke anodes (or remelted from scrap in the Electric Furnace) and a huge electric current. Plan plenty of power for the Electrolyzer.\n\nUsed in turbines, heat exchangers, magnets, robots, the first fast belts and many mid-game machines.
wiki.eclipse-high-purity-silicon = Silicon purified to semiconductor grade in the Silicon Refinery, using hydrochloric acid and hydrogen. Microchips are etched from it, and precision components need it too.
wiki.eclipse-microchip = Integrated circuits made in the Chip Fabricator from high-purity silicon, two transistors and polyethylene. Microchips are a key late-game material: control units, modules, robots and most advanced machines use them. Build several fabricators.
wiki.eclipse-reinforced-glass = Metaglass fused around a titanium mesh in the Blast Furnace, which needs heat. It withstands pressure and deep cold, so cryogenic and high-pressure equipment is built with it.
wiki.eclipse-surge-superalloy = Surge alloy bonded into superalloy in the Electric Furnace. One of the strongest materials in the game: endgame walls, experimental cores, the titan and the orbital platform use it.
wiki.eclipse-molybdenum = A refractory metal. Its ore is fairly common; the Ore Washer also separates it from crushed scrap.\n\nMolybdenum makes electric heating elements and is the catalyst of the Pressure Reactor.
wiki.eclipse-vanadium = Recovered from slag and crushed scrap. Its main use is the electrolyte of the Vanadium Flow Battery, the largest battery; some late modules use it too.
wiki.eclipse-platinum = The rarest metal. Its ore lies very far from the core; the Platinum Refinery dissolves trace platinum out of scrap with aqua regia, and the Ore Washer finds a little.\n\nPlatinum is a catalyst (it doubles the Pressure Reactor's speed and drives the Chemical Synthesis Complex) and goes into experimental cores and legendary modules.
wiki.eclipse-thorium-fuel-rod = Thorium sealed in superalloy cladding by the Assembler. It fuels the Fission Reactor. Each spent rod can be reprocessed with nitric acid to recover thorium, so a reactor does not need endless mining.
wiki.eclipse-spent-fuel-rod = What a fission reactor leaves behind. Do not let it pile up in the reactor: send it to the Reprocessing Plant, which recovers thorium with nitric acid (and makes acidic waste to neutralize).
wiki.eclipse-polymer-catalyst = A titanium chloride catalyst made in the Chemical Reactor from titanium and chlorine. The Pressure Reactor and the Pressure Reactor hold it while they work and only use one up every several crafts, so a small supply lasts a long time.
wiki.eclipse-ammonium-nitrate = A powerful oxidizer made from nitric acid and ammonia. The Chemical Reactor mixes it with coal into blast compound, and the Minelayer can fire it directly as mines.
wiki.eclipse-copper-gear = The first mechanical component, pressed from copper in the Gear Press. Cheap and needed everywhere early: basic machines, sorters, pumps and tier I modules.
wiki.eclipse-titanium-rod = Titanium extruded in the Extruder, with graphite as lubricant. Rods are the start of the titanium parts: the Lathe turns them into bolts, screws, rings and springs, and they go into frames and many buildings.
wiki.eclipse-titanium-gear = Hard-wearing gears from the Gear Press. Industrial machinery, reactors, fast belts, precision components and tier II modules need them.
wiki.eclipse-pressure-casing = A sealed vessel shell from the Assembler. Every chemical reactor, column and boiler needs some to be built. Stock a few dozen before expanding your chemistry.
wiki.eclipse-industrial-bearing = Precision bearings from the Assembler. Anything that spins fast needs them: turbines, drills, compressors, heavy machinery.
wiki.eclipse-superalloy-frame = A heavy machine frame hot-formed from superalloy and titanium rods in the Blast Furnace (needs heat). Big, hot and high-pressure machinery is built on it.
wiki.eclipse-precision-component = Fine assemblies from the Assembler. They gate smart logistics, electronics and tier III modules.
wiki.eclipse-experimental-core = The top component: precision parts around surge superalloy, platinum and phase fabric. Only endgame machinery and tier IV modules need it.
wiki.eclipse-copper-plate = Copper rolled flat in the Metal Press (tier I). Rolled thinner it becomes copper foil; the Water Treatment Plant is built from it.
wiki.eclipse-lead-plate = Lead rolled flat in the Metal Press (tier I). Lead-acid cells are built round lead plates, and the Sulfuric Acid Plant is lined with them, as real lead chambers were.
wiki.eclipse-titanium-plate = Titanium rolled flat in the Metal Press (tier II). Pressure casings are titanium plates bolted round metaglass, and the Pressure Reactor uses them.
wiki.eclipse-aluminium-plate = Aluminium rolled flat in the Metal Press (tier III). Heat exchangers are built from it, and it rolls on into aluminium foil.
wiki.eclipse-superalloy-plate = Superalloy rolled flat in the Metal Press (tier III). Superalloy frames and the Fission Reactor are built from it.
wiki.eclipse-tungsten-plate = Tungsten rolled flat in the Metal Press (tier III). Armour for the Piledriver and shielding for the Fission Reactor.
wiki.eclipse-copper-foil = Copper plate rolled thin in the Metal Press (tier I). Circuit boards are copper foil on polyethylene, and lithium batteries use it as the anode current collector, as real ones do.
wiki.eclipse-aluminium-foil = Aluminium plate rolled thin in the Metal Press (tier III). The cathode current collector of lithium batteries and the electrodes of capacitors.
wiki.eclipse-tungsten-rod = Tungsten extruded in the Extruder with graphite (tier III). Electric heaters and the Electric Furnace use it for their elements and electrodes.
wiki.eclipse-aluminium-wire = Aluminium drawn in the Extruder (tier III). Lithium and vanadium flow batteries are wired with it.
wiki.eclipse-titanium-bolt = Turned from titanium rod in the Lathe (tier II). Pressure casings and superalloy frames are bolted with them, and threaded they become screws.
wiki.eclipse-titanium-screw = A titanium bolt threaded in the Lathe (tier II). Precision components and control units are screwed together.
wiki.eclipse-titanium-ring = Turned from titanium rod in the Lathe (tier II). The races of industrial bearings and the flanges of steam turbines.
wiki.eclipse-titanium-spring = Coiled from titanium rod in the Lathe (tier II). Smart logistics like the Batch Gate and Smart Unloader use them.
wiki.eclipse-superalloy-gear = Pressed from superalloy in the Gear Press (tier III). For the hardest-working drives: the Carbide Drill and the Line Balancer.
wiki.eclipse-magnet-wire = Copper wire coated with epoxy enamel in the Extruder (tier III), so the turns of a winding cannot short. Permanent-magnet motors and the generator of the Methane Turbine are wound with it.
wiki.eclipse-resistor = Graphite and copper wire, made in the Circuit Assembler (tier II). Circuit boards and sensors use them.
wiki.eclipse-capacitor = Aluminium foil and polyethylene, made in the Circuit Assembler (tier III). Circuit boards use them, and the Aetherite Capacitor is a bank of them.
wiki.eclipse-transistor = High-purity silicon, copper wire and polyethylene, made in the Circuit Assembler (tier III). Circuit boards, sensors and emitters use them.
wiki.eclipse-insulated-cable = Copper wire sheathed in synthetic rubber in the Circuit Assembler (tier III). Industrial batteries and the Jammer are wired with it.
wiki.eclipse-electric-motor = Copper wire windings round a titanium rod shaft, in a titanium plate housing bolted shut, built in the Assembler (tier II). Pump units, pistons and control units are built round one.
wiki.eclipse-permanent-magnet-motor = Magnet wire round an AlNiCo magnet rotor, built in the Assembler (tier III). Smaller and stronger than a wound motor: steam turbines and the Carbide Drill use it.
wiki.eclipse-superconducting-motor = Superconductor windings in a superalloy housing, cooled with liquid nitrogen while it is built in the Assembler (tier V). The Titan Manufacturing Complex and the Lattice Drill are driven by them.
wiki.eclipse-pump-unit = An electric motor, a rotor, two titanium rings and a titanium plate, built in the Assembler (tier II). Industrial boilers and the Air Separation Unit pump with them.
wiki.eclipse-piston = An electric motor driving a titanium rod in a titanium plate cylinder, with springs, built in the Assembler (tier II). The Piledriver and the Tremor hit with them.
wiki.eclipse-rotor = Titanium plates screwed to a titanium ring hub in the Assembler (tier II). Pump units, the Cooling Tower fan and the Methane Turbine use them.
wiki.eclipse-heating-coil = Tungsten rods and molybdenum (its silicide makes good elements), built in the Assembler (tier III). The Electric Heater and the Electric Furnace heat with them.
wiki.eclipse-sensor = Built in the Assembler (tier III) from a transistor, resistors, high-purity silicon and reinforced glass. Precision components and emitters are built on one, and the Wave Intelligence Scanner looks through them.
wiki.eclipse-emitter = A sensor, transistors, platinum and reinforced glass, built in the Assembler (tier IV). The Jammer and the Wave Disruption Array broadcast through them.
wiki.eclipse-soda-ash = Sodium carbonate, made in the Chemical Reactor from sodium hydroxide and carbon dioxide (2 NaOH + CO2). Real glassmaking melts sand with soda ash, and real brine lithium is precipitated as lithium carbonate with it: the Blast Furnace and the Lithium Extractor use it. A good home for the CO2 from the gas separator, the fermenter and the arc furnace.
wiki.eclipse-petroleum-coke = The residue left at the bottom of the Distillation Column, coked. Real graphite electrodes are graphitized petroleum coke: the Electric Furnace turns it into graphite (tier III), and the Electrolyzer burns it as the anodes of its aluminium cells.
wiki.eclipse-diesel = A middle distillate, out of the front of the Distillation Column. Mixed with ammonium nitrate it makes ANFO (blast compound) in the Chemical Reactor, and the Reprocessing Plant carries its extractant in it, as real PUREX plants use kerosene.
wiki.eclipse-argon = About 1% of air, out of the front of the Air Separation Unit. The Electric Furnace runs its surge superalloy arc under argon, as real arc melting is done under an inert gas.
wiki.eclipse-heavy-water = Water whose hydrogen is deuterium, about 1 part in 6400 of natural water. Light water splits faster, so long electrolysis leaves the heavy water behind: the Electrolyzer's heavy water recipe gives a trickle of it out of the front, with hydrogen and oxygen out of the sides. Electrolyse it again for deuterium.
wiki.eclipse-deuterium = Heavy hydrogen, electrolysed out of heavy water. The Fusion Reactor fuses it with tritium bred from lithium; the World Engine's Confinement stage needs a large supply.
wiki.eclipse-liquid-sodium = Sodium metal, electrolysed out of brine in the Electrolyzer (real plants use molten salt). The Breeder Reactor's coolant: it carries the heat away without slowing the fast neutrons that breed new fuel.
wiki.eclipse-magnesium = Won from brine in the Electrolyzer, as in the Dow process: magnesium chloride from the brine is electrolysed molten (with hydrochloric acid; chlorine comes off). The Blast Furnace uses it to reduce titanium chloride to titanium (the Kroll process), and the Chemical Reactor mixes it with ammonium nitrate into pyratite, since magnesium is a classic incendiary.
wiki.eclipse-pentlandite = Nickel-iron sulfide, the main nickel ore. Real nickel ores carry cobalt and platinum-group metals. What the nickel veins drop. Three ways to get nickel out of it: crush and sort it in the Ore Crusher (1 nickel per ore), float it in the Flotation Cell with water (1.5 per ore, with cobalt), or leach it in sulfuric acid and electrowin it in the Electrolyzer (2 per ore, with cobalt and a little platinum (most of the world's platinum really comes out of nickel refining); acidic waste).
wiki.eclipse-chromite = Chromium-iron oxide, the only chromium ore. What the chromium veins drop. Three ways to get chromium out of it: crush and sort it in the Ore Crusher (1 chromium per ore), float it in the Flotation Cell with water (1.5 per ore), or leach it in sulfuric acid and electrowin it in the Electrolyzer (2 per ore; acidic waste).
wiki.eclipse-cobaltite = Cobalt sulfarsenide, a cobalt ore that carries nickel. What the cobalt veins drop. Three ways to get cobalt out of it: crush and sort it in the Ore Crusher (1 cobalt per ore), float it in the Flotation Cell with water (1.5 per ore, with nickel), or leach it in sulfuric acid and electrowin it in the Electrolyzer (2 per ore, with nickel; acidic waste).
wiki.eclipse-wolframite = Iron-manganese tungstate, the main tungsten ore. Molybdenum is often found with it. What the tungsten veins drop. Three ways to get tungsten out of it: crush and sort it in the Ore Crusher (1 tungsten per ore), float it in the Flotation Cell with water (1.5 per ore, with molybdenum), or leach it in sulfuric acid and electrowin it in the Electrolyzer (2 per ore, with molybdenum; acidic waste).
wiki.eclipse-molybdenite = Molybdenum disulfide, the molybdenum ore. What the molybdenum veins drop. Three ways to get molybdenum out of it: crush and sort it in the Ore Crusher (1 molybdenum per ore), float it in the Flotation Cell with water (1.5 per ore, with sulfur), or leach it in sulfuric acid and electrowin it in the Electrolyzer (2 per ore, with sulfur; acidic waste).
wiki.eclipse-sperrylite = Platinum arsenide, a platinum ore found with nickel deposits. What the platinum veins drop. Three ways to get platinum out of it: crush and sort it in the Ore Crusher (1 platinum per ore), float it in the Flotation Cell with water (1.5 per ore, with nickel), or leach it in sulfuric acid and electrowin it in the Electrolyzer (2 per ore, with nickel; acidic waste).
wiki.eclipse-copper-wire = Drawn copper from the Extruder. Electrical machines, heaters, batteries and the superconductor synthesis use it.
wiki.eclipse-circuit-board = Copper traces on polyethylene, etched in hydrochloric acid by the Circuit Assembler. The acid leaves as acidic waste, so the printer needs a neutralizer nearby. Control units, smart logistics and augmentation interfaces use boards.
wiki.eclipse-control-unit = A microchip controller with a motor drive, built from microchips, circuit boards and AlNiCo magnets. It automates advanced drills, smart logistics, reactors and assemblers.
wiki.eclipse-alnico-magnet = An aluminium-nickel-cobalt magnet melted in the Electric Furnace (power, no heat). Motors, turbines, control units and drones use it.
wiki.eclipse-crushed-ore = Scrap and rock crushed in the Ore Crusher. Wash it in the Ore Washer to separate metals. This is the way to get ECLIPSE metals on any map.
wiki.eclipse-aetherite = A rare energy crystal. Deposits lie farthest from your core and need a carbide drill; the Ore Washer turns up one now and then.\n\nAetherite powers Tier V modules, Aetherite Capacitors, superconductors and the Orbital Weapons Platform's strikes.
wiki.eclipse-superconductor = The most advanced material, synthesized in the Chemical Synthesis Complex from copper wire and aetherite in nitric acid, under pressure, over platinum, cooled by liquid nitrogen. The World Engine, the Temporal Interference Array and the Orbital Weapons Platform need it.
wiki.eclipse-synthetic-rubber = Rubber polymerized from ethylene and propylene with a polymer catalyst and vulcanized with sulfur. Seals and belts for advanced machinery.
wiki.eclipse-epoxy-resin = A hard-setting resin from propylene, chlorine and sodium hydroxide. It binds carbon fiber into carbon composite.
wiki.eclipse-carbon-fiber = Acrylonitrile spun and carbonized at very high heat in the Carbon Fiber Furnace. Pressed with epoxy it becomes carbon composite.
wiki.eclipse-carbon-composite = Carbon fiber set in epoxy: light and extremely strong. Composite walls, robots, late units and the orbital platform are built with it.
wiki.eclipse-biomass = Plant and algae matter from the Biomass Cultivator or the Algae Photobioreactor. Ferment it into biofuel, extract enzymes from it, or digest it into methane and fertilizer.
wiki.eclipse-fertilizer = Feeds the biomass growers. Make it from ammonia and sulfuric acid in the Chemical Reactor, or as digestate from the Anaerobic Digester.
wiki.eclipse-enzyme-extract = Biological catalysts from biomass and spore pods. Keep some in the Biochemical Fermenter and it works twice as fast; it is used up slowly.
wiki.eclipse-biofuel = Ethanol fermented from biomass. Burn it in Biofuel Engines for power: a renewable alternative to oil.

# wiki entries: liquids and gases
wiki.eclipse-purified-water = Water stripped of minerals by the Water Treatment Plant. Electrolysis, boilers and many sensitive processes require it. Fuel cells and steam turbines return some, so a closed loop wastes little.
wiki.eclipse-brine = Concentrated salt water, the second output of water treatment. Do not let it back up: feed it to the Electrolyzer or the Lithium Extractor.
wiki.eclipse-hydrochloric-acid = A strong acid made by burning hydrogen in chlorine. It dissolves metals out of scrap, purifies silicon and etches circuit boards.\n[scarlet]Corrosive:[] carry it only in polymer or ECLIPSE metal conduits.
wiki.eclipse-oxygen = Produced by electrolysis and air separation. Fuel cells, sulfuric acid and acrylonitrile need it.
wiki.eclipse-chlorine = A toxic gas from the Electrolyzer. It becomes hydrochloric acid, the polymer catalyst, epoxy and titanium from sand.\n[scarlet]Corrosive:[] polymer conduits only.
wiki.eclipse-methane = A light fuel gas from the Distillation Column or the Anaerobic Digester. Burn it in turbines and industrial heaters, or crack it into graphite and hydrogen.
wiki.eclipse-naphtha = A light oil fraction from the Distillation Column. The Steam Cracker turns it into ethylene.
wiki.eclipse-ethylene = Made from naphtha in the Steam Cracker. The building block of polyethylene and synthetic rubber.
wiki.eclipse-sulfuric-acid = Sulfur burned in oxygen and absorbed in water. Batteries, metal leaching, fertilizer, the Mineral Separator and electrowinning use it. Its plant gives off waste heat you can recover.\n[scarlet]Corrosive.[]
wiki.eclipse-sodium-hydroxide = A strong alkali from the Electrolyzer. It neutralizes acidic waste, refines alumina, scrubs flue gas and makes soda ash for glass without lead.\n[scarlet]Corrosive.[]
wiki.eclipse-acidic-waste = Spent acid from leaching, etching, electrowinning and reprocessing. If it has nowhere to go, the machine that makes it stops. Pipe it to an Chemical Reactor; Waste Recovery modules turn part of it back into acid.\n[scarlet]Corrosive.[]
wiki.eclipse-ammonia = Synthesized from nitrogen and hydrogen in the pressurized Pressure Reactor. The base of nitric acid, fertilizer, ammonium nitrate and acrylonitrile.
wiki.eclipse-nitric-acid = Made from ammonia in the Pressure Reactor (twice as fast with platinum). Used for nitrates, aqua regia, fuel reprocessing and superconductors.\n[scarlet]Corrosive.[]
wiki.eclipse-steam = Raised in an Industrial Boiler from purified water and heat. Steam Turbines turn it into power and return most of the water.
wiki.eclipse-liquid-nitrogen = Nitrogen condensed in the Cryogenic Condenser. The best turret coolant (colder than cryofluid), it freezes units it hits, and the Chemical Synthesis Complex needs it for cooling.
wiki.eclipse-aqua-regia = Hydrochloric and nitric acid mixed; the only acid that dissolves platinum. The Platinum Refinery uses it.\n[scarlet]Corrosive.[]
wiki.eclipse-flue-gas = Exhaust from methane, biofuel and waste burners. It is vented if not piped away, so it never blocks anything. Piped into an Chemical Reactor it gives sulfur; into a Gas Separator, nitrogen and carbon dioxide.
wiki.eclipse-carbon-dioxide = Captured from flue gas by the Gas Separator, or released by the fermenter. Turn it into methanol, or feed it to the Algae Photobioreactor.
wiki.eclipse-wastewater = Dirty water from scrubbing and chemical plants. It backs up and stalls them if not removed: the Wastewater Treatment Plant turns it into purified water and sludge.
wiki.eclipse-industrial-sludge = Solids filtered out of wastewater. Burn it in the Thermal Waste Processor for scrap and sand, or let bacteria digest it into methane and fertilizer.
wiki.eclipse-methanol = Made from carbon dioxide and hydrogen. It starts the methanol route to plastics: the Pressure Reactor turns it into propylene.
wiki.eclipse-propylene = A reactive gas from methanol. It goes into epoxy, synthetic rubber and acrylonitrile.
wiki.eclipse-acrylonitrile = A toxic monomer from propylene, ammonia and oxygen. The Carbon Fiber Furnace spins and carbonizes it into carbon fiber.
wiki.eclipse-chilled-water = Water cooled by evaporation in the Cooling Tower. A cheap coolant for turrets and couplers: better than water, not as good as cryofluid.

# wiki entries: ores
wiki.eclipse-ore-bauxite = Aluminium ore, fairly common and found from close to the core outward, since aluminium is needed from mid-game on. Any basic drill mines it. No bauxite on the map? The Electric Furnace remelts scrap into aluminium.
wiki.eclipse-bauxite = Aluminium ore. The Alumina Refinery digests it in hot sodium hydroxide (the Bayer process), and the Electrolyzer smelts the alumina into aluminium.
wiki.eclipse-red-mud = What is left of bauxite after alumina refining: iron and titanium oxides. It is waste, so belt it away from the Alumina Refinery or the refinery stops; the Electric Furnace smelts titanium out of it, as real red mud is mined for its metals.
wiki.eclipse-flotation-cell = Froth flotation, the way most real metal ore is concentrated: ore minerals ground in water, the valuable mineral floated off with the froth. 4 ore give 6 metal (1.5 per ore) and a byproduct: cobalt from pentlandite, nickel from cobaltite and sperrylite, molybdenum from wolframite, sulfur from molybdenite. Tier II power; needs water. Between the Ore Crusher (1 per ore) and leaching in the Electrolyzer (2 per ore).
wiki.eclipse-ore-nickel = The most common ECLIPSE ore; veins can appear close to the starting core. Any basic drill mines it.
wiki.eclipse-ore-chromium = A common ore found a little away from the starting core.
wiki.eclipse-ore-cobalt = Found at medium distance from the starting core, in smaller veins than nickel.
wiki.eclipse-ore-tungsten = A hard ore far from the starting core. It needs a laser drill or better.
wiki.eclipse-ore-molybdenum = A fairly common ore, found a short way from the starting core.
wiki.eclipse-ore-platinum = The rarest metal ore: small veins very far from the starting core.
wiki.eclipse-ore-aetherite = Energy crystals in small deposits, the farthest of all from the starting core. Mine them with a Carbide Drill.

# wiki entries: water and basic chemistry
wiki.eclipse-water-treatment-plant = The root of the chemical industry. Feed it water (and power): purified water comes out of the left side, brine out of the right.\nBoth outputs must be able to leave, or the plant stops: send brine to a Electrolyzer or Lithium Extractor.
wiki.eclipse-acid-leaching-vat = Dissolves scrap in hydrochloric acid and recovers titanium, copper and lead. Acidic waste leaves as a liquid and must be removed, usually into an Chemical Reactor. A good use for scrap walls and sand-mining waste.
wiki.eclipse-distillation-column = Separates crude oil: naphtha leaves the left side, methane (refinery gas) the right side and diesel the front; the heavy residue is coked into petroleum coke, and sulfur is recovered from the sour gas (in a real refinery by hydrodesulfurization and a Claus unit; here folded into the column). This is where the oil route to plastics, fuel, graphite and acid starts.
wiki.eclipse-steam-cracker = Cracks naphtha into ethylene with steam. It also needs heat: point an Industrial Heater or Electric Heater at it.
wiki.eclipse-sulfuric-acid-plant = Burns sulfur in oxygen and absorbs it in water to make sulfuric acid. The reaction gives off waste heat out of the front: put a Heat Exchanger and an Industrial Boiler there to turn it into steam.
wiki.eclipse-air-separation-unit = Liquefies air and separates it into nitrogen (left), oxygen (right) and a little argon (front). It needs cryofluid for cooling. For nitrogen without cryofluid, use the Gas Separator on flue gas.
wiki.eclipse-platinum-refinery = Dissolves trace platinum out of scrap with aqua regia. Slow, but platinum anywhere. Its acidic waste must be neutralized.
wiki.eclipse-gas-separator = Splits flue gas through membranes: nitrogen left, carbon dioxide right. A source of nitrogen without cryofluid, and the source of CO2 for methanol and algae.
wiki.eclipse-wastewater-treatment-plant = Settles wastewater into purified water and industrial sludge. Put one after scrubbers and the methanol route.
wiki.eclipse-thermal-waste-processor = Burns industrial sludge with heat from adjacent heaters, recovering scrap and sand. Gives off flue gas.
wiki.eclipse-carbon-fiber-furnace = Spins acrylonitrile into fiber and carbonizes it. It needs a lot of heat, so plan two heaters or a heat exchanger network. Gives off flue gas.
wiki.eclipse-composite-press = Lays carbon fiber in epoxy and cures it into carbon composite, the end of the methanol route.
wiki.eclipse-cryogenic-condenser = Condenses nitrogen into liquid nitrogen using cryofluid. Runs faster on ice and snow.
wiki.eclipse-cooling-tower = Cools water by evaporation into chilled water, a cheap coolant. Some water is lost. Runs faster on ice and snow.
wiki.eclipse-chemical-synthesis-complex = The peak of chemistry: makes superconductors from copper wire and aetherite in nitric acid. It must be pressurized, holds a platinum catalyst that is slowly used up, and needs liquid nitrogen cooling. Expect to build most of the chemical industry before it.

# wiki entries: metallurgy
wiki.eclipse-mineral-separator = Leaches molten slag with sulfuric acid and separates the vanadium and chromium steel slag really carries. Feed it slag from a vanilla melter or separator. Nickel, cobalt, molybdenum and tungsten come from ores, or from crushed and washed scrap.
wiki.eclipse-lithium-extractor = Precipitates lithium out of brine with soda ash (as lithium carbonate, the way real brine lithium is won). A good use for the brine from water treatment and neutralizing.
wiki.eclipse-alumina-refinery = Digests bauxite in hot sodium hydroxide and precipitates alumina, the Bayer process every real aluminium plant starts with. It needs heat. The residue comes out as red mud: belt it away (an incinerator will do) or the refinery stops; the Electric Furnace can smelt the titanium out of it.
wiki.eclipse-blast-furnace = The heat-driven furnace. Point heaters at it (industrial, electric or geothermal, through heat exchangers or thermal storage). Hot superalloy from nickel, chromium and cobalt (8 heat, tier III power); superalloy frames hot-formed from superalloy plates, titanium rods and bolts (8 heat, tier III); soda-lime glass from sand with a soda ash flux (6 heat, tier II); reinforced glass from metaglass and titanium (5 heat, tier II); hot titanium by the Kroll process: sand chlorinated with coal, the titanium chloride reduced with magnesium under argon (10 heat, tier III). Below a recipe's heat the furnace stops. Superalloy and glass come out hot: a Vacuum Freezer cools them.\n\n!warn Most common mistake: not enough heat|A heater only gives its full heat when its whole side touches the furnace. Two Electric Heaters on two sides give 4 + 4 = 8, exactly what superalloy needs.\n\n!next What comes next|Everything it makes comes out hot. Cool it in a Vacuum Freezer: one freezer keeps up with three furnaces making superalloy (the full line on the Build examples tab).
wiki.eclipse-electric-furnace = The power-only furnace: induction melting of aluminium, nickel and cobalt into AlNiCo magnets (tier III), sintering of tungsten and graphite in a cobalt binder into cemented tungsten carbide (tier III), silicon from sand and graphite in the arc, the real way (tier II; carbon dioxide out, vented when not piped), graphite from petroleum coke (tier III), secondary aluminium remelted from scrap (tier III; aluminium on any map), titanium smelted out of red mud (tier III), and the electric arc under argon that bonds surge alloy into superalloy (tier V, 7680 power/s). Carbide and surge superalloy come out hot: a Vacuum Freezer cools them. Built with heating coils.\n\n!next What comes next|Its metals come out hot: cool them in a Vacuum Freezer before use.
wiki.eclipse-pressure-reactor = The big synthesis vessel. Tap it to pick: [accent]ammonia[] (Haber-Bosch: nitrogen + 3 hydrogen, needs 80% pressure), [accent]methanol[] (carbon dioxide + 3 hydrogen, 60% pressure), [accent]olefins[] (methanol into propylene out of the left and wastewater out of the right), [accent]nitric acid[] (Ostwald: ammonia burnt with oxygen over platinum gauze; one platinum lasts 60 crafts), [accent]acrylonitrile[] (propylene, ammonia and oxygen over a molybdenum catalyst; 30 crafts each), [accent]polyethylene[] and [accent]synthetic rubber[] (over the polymer catalyst; 12 crafts each). Pressure builds up with power and leaks away while the reactor is idle. All tier III.
wiki.eclipse-chemical-reactor = The workhorse of small-batch chemistry. Tap it to pick a reaction: [accent]hydrochloric acid[] (hydrogen + chlorine) and [accent]neutralizing[] acidic waste with sodium hydroxide into brine (salt water, back to chlor-alkali), [accent]soda ash[] (sodium hydroxide carbonated with captured carbon dioxide), [accent]flue gas scrubbing[] (sodium hydroxide captures the sulfur dioxide, recovered as sulfuric acid out of the left, wastewater out of the right) (tier II); [accent]pyratite[] (magnesium and ammonium nitrate); [accent]aqua regia[] (3 hydrochloric : 1 nitric acid), [accent]ammonium nitrate[] (ammonia + nitric acid), [accent]fertilizer[] (ammonia + sulfuric acid), the [accent]polymer catalyst[] (titanium chlorinated with chlorine), [accent]epoxy resin[] (propylene, chlorine and sodium hydroxide; wastewater out) and [accent]blast compound[] (ANFO: ammonium nitrate + diesel) (tier III).\n\n!warn Acids need the right pipes|Ordinary conduits corrode. Use polymer or plated conduits for acids and chlorine, and give every waste product somewhere to go.
wiki.eclipse-electrolyzer = Every electrolysis in one machine. Tap it to pick: [accent]water[] (purified water into hydrogen out of the left and oxygen out of the right, 2:1, tier II), [accent]chlor-alkali[] (brine into chlorine left, hydrogen right and sodium hydroxide out of the front, tier II), [accent]Hall-Heroult[] (alumina with petroleum coke anodes into hot aluminium, tier III) [accent]magnesium[] (from brine with hydrochloric acid, tier III), [accent]ore leaching[] (an ore mineral dissolved in sulfuric acid and electrowon: 2 metal per ore, plus byproducts such as cobalt and platinum from pentlandite; acidic waste out; tier III) or [accent]electrowinning[] (scrap dissolved in sulfuric acid plated out as copper and lead, tier II; the spent acid leaves as acidic waste). [accent]Heavy water[] (long electrolysis of purified water concentrates D2O: a trickle out of the front, hydrogen left, oxygen right, tier III), [accent]deuterium[] (heavy water into deuterium left and oxygen right, tier III) and [accent]sodium[] (brine into liquid sodium left and chlorine right, tier III) feed the fusion and breeder reactors. The output sides turn with the machine; arrows show them while you place it.\n\n!warn Each liquid leaves from its own side|Recipes with several liquid outputs send each out of a fixed side, relative to the way the machine faces. Coloured arrows show them while you place it, and the Build examples tab shows every recipe with its pipes on the right sides.
wiki.eclipse-vacuum-freezer = Midgame and later metals leave their furnace hot and can't be used until they are cooled. The vacuum freezer quenches them in a vacuum chamber with cryofluid, which it uses up. With nothing selected it cools whatever hot material arrives, so one freezer can take a mixed belt; select one to cool only that. Titanium, silicon, metaglass and reinforced glass need tier II power (120/s); superalloy, tungsten carbide and aluminium tier III (480/s); surge superalloy tier V. Vanilla machines' titanium, silicon and metaglass are never hot.\n\n!tip One freezer, many furnaces|It cools 2 hot superalloy per second, as much as three Blast Furnaces make. With nothing selected it takes a mixed belt of hot metals.
wiki.eclipse-silicon-refinery = Purifies silicon to semiconductor grade with hydrochloric acid and hydrogen. Feeds the Chip Fabricator.
wiki.eclipse-ore-crusher = Two jobs. Scrap: crushed into crushed ore (for the Ore Washer) and sand, on any map (tier I). Ore minerals from the ECLIPSE veins: crushed and sorted into their metal, 1 metal per ore, with no byproducts (tier II). For more metal per ore, use the Flotation Cell (1.5) or leach in the Electrolyzer (2).
wiki.eclipse-ore-washer = Washes crushed ore with water and separates nickel, chromium, cobalt, molybdenum, vanadium, tungsten, some platinum and rarely aetherite. Sort its mixed output with a Three-Way Sorter or Advanced Item Filter.
wiki.eclipse-methane-pyrolysis-reactor = Cracks methane into graphite and hydrogen with heat: graphite without coal, plus hydrogen for chemistry.
wiki.eclipse-carbide-drill = The best drill in the game, in a 3x3 footprint: it out-mines the 4x4 airblast drill on every ore, and its carbide bits make hard ores (titanium, thorium, tungsten, aetherite) slow it only half as much as other drills. Water boosts it as much as the airblast drill. Needed for aetherite.

# wiki entries: components and electronics
wiki.eclipse-gear-press = Presses every gear: tap it and pick the gear to make. Copper gears need tier I power (30/s), titanium gears tier II (120/s), superalloy gears tier III (480/s). One of the first ECLIPSE machines to build.
wiki.eclipse-extruder = Pushes metal through a die into rods and wire: copper wire (tier I, 30 power/s), titanium rods with graphite lubricant (tier II, 120/s), tungsten rods with graphite, aluminium wire, and magnet wire (copper wire enamelled with epoxy, for motor windings) (tier III, 480/s). Tap it to pick what to make.
wiki.eclipse-metal-press = A rolling mill for plates and foil. Copper and lead plates (tier I) go into early machines and lead-acid cells; titanium plates (tier II) into pressure casings; aluminium, superalloy and tungsten plates (tier III) into heat exchangers, frames, reactors and armour. Plates roll on into copper and aluminium foil for circuit boards, batteries and capacitors.
wiki.eclipse-lathe = Turns titanium rods into the small parts machines are bolted together from: bolts and screws (pressure casings, frames, precision components, control units), rings (bearing races, turbine flanges) and springs (smart logistics). Tier II power (120/s).
wiki.eclipse-assembler = The heart of mechanical manufacturing: it builds the parts every advanced machine is made of, and the components built from them. Parts: electric motor (copper wire windings, rod, plate, bolts; tier II), permanent-magnet motor (magnet wire and an AlNiCo magnet; tier III), superconducting motor (superconductor cooled with liquid nitrogen; tier V), rotor, pump unit and piston (tier II), heating coil (tungsten and molybdenum; tier III), sensor (tier III) and emitter (tier IV). Components: pressure casings and industrial bearings (tier II), precision components, lead-acid cells (sulfuric acid in) and fuel rods (tier III). Tap it to pick; hover a choice to see its recipe.
wiki.eclipse-experimental-core-assembler = Builds experimental cores, the top component, from precision components, surge superalloy, platinum and phase fabric.
wiki.eclipse-component-depot = Storage for components, parts and formed metal only (gears, plates, foil, rods, wire, bolts, screws, rings, springs, motors, pumps, sensors...). Place it at the end of your component lines: it keeps your core stocked with up to 200 of each component from anywhere on the map, so you can always build, without belting everything to the core. It never merges with the core.
wiki.eclipse-circuit-assembler = Builds circuits from the bottom up: resistors (graphite and copper wire, tier II), capacitors (aluminium foil and polyethylene), transistors (high-purity silicon, copper wire, polyethylene) and insulated cable (copper wire in synthetic rubber), all tier III. A circuit board is copper foil on polyethylene with resistors, a capacitor and a transistor, etched in hydrochloric acid; its acidic waste must go to a neutralizer or the machine stops. A control unit is a microchip on circuit boards driving an electric motor (tier IV).
wiki.eclipse-chip-fabricator = Etches microchips from high-purity silicon, copper wire and polyethylene.

# wiki entries: heat and power
wiki.eclipse-industrial-heater = Burns methane into heat and sends it out of the side it faces. Its flue gas is vented unless you pipe it away.
wiki.eclipse-electric-heater = Turns power into heat. No fuel, no exhaust: the simplest heater if you have power to spare.
wiki.eclipse-geothermal-heat-tap = Free heat with no fuel, but it can only be built on hot rock or magma rock. The hotter the ground under it, the more heat.
wiki.eclipse-heat-exchanger = Collects heat from its back and sides and sends it out of the front. Use it to route heat around corners or to collect waste heat from reactions.
wiki.eclipse-thermal-storage = Passes heat through like an exchanger and stores it. When the heaters stop (for example when fuel runs out), it keeps the machine heated until its reservoir is empty.
wiki.eclipse-industrial-boiler = Boils purified water into steam with heat. More heat gives more steam. Pair it with Steam Turbines; a Fission Reactor is its best heat source.
wiki.eclipse-steam-turbine = Turns steam into power and returns most of the water as purified water, so a boiler loop needs little fresh water.
wiki.eclipse-hydrogen-fuel-cell = Combines hydrogen and oxygen into power, giving purified water back. A clean generator for electrolysis setups.
wiki.eclipse-methane-turbine = Burns methane for a large amount of power. Pipe the flue gas to a scrubber or gas separator, or it is vented.
wiki.eclipse-biofuel-engine = Burns biofuel or diesel for power (150/s either way). Biofuel is renewable if you run biomass growers and a fermenter; diesel is the Distillation Column's surplus, which little else uses.
wiki.eclipse-fission-reactor = Burns thorium fuel rods into an enormous amount of heat out of the front. Put an Industrial Boiler there, with Steam Turbines after it. Remove its spent fuel rods and reprocess them.
wiki.eclipse-breeder-reactor = Burns thorium fuel rods into 100 heat out of the front, 2.5 times a Fission Reactor. Its thorium blanket breeds new fuel: every rod leaves two spent rods, and the Reprocessing Plant turns each into 2 thorium, so the fuel cycle grows. Cooled with liquid sodium from the Electrolyzer. One Industrial Boiler takes all of its heat and feeds 10 Steam Turbines (9,000 power/s); that boiler needs a lot of purified water and gives a lot of steam, so use several pipes.
wiki.eclipse-fusion-reactor = Fuses deuterium with tritium that its lithium blanket breeds, for 27,000 power/s: 24,000 after what its magnets and plasma heating use. Like the Impact Reactor it needs power to start and warms up slowly; it cools down when deuterium, lithium or the liquid nitrogen for its superconducting magnets runs out. Deuterium comes from heavy water in the Electrolyzer. It explodes if destroyed while hot.
wiki.eclipse-combined-cycle-turbine = Burns methane for 2,400 power/s, twice the Methane Turbine's power per methane. The exhaust is still hot: 10 heat leaves the front (rotate it to aim), enough for an Industrial Boiler and one Steam Turbine, another 900/s. Pipe the flue gas to a scrubber or gas separator, or it is vented.
wiki.eclipse-solar-farm = 300 power/s in full light from high-purity silicon cells, with no fuel. Like vanilla solar panels it follows the map's lighting and solar settings. Good for outposts that are hard to supply.
wiki.eclipse-reprocessing-plant = Recovers thorium from spent fuel rods: the rods are dissolved in nitric acid and the thorium extracted with a solvent carried in diesel, as real PUREX plants use kerosene. Produces acidic waste.
wiki.eclipse-industrial-battery = A bank of lead-acid cells. Stores far more power per tile than a large battery.
wiki.eclipse-lithium-battery = Stores twice as much power as an industrial battery.
wiki.eclipse-flow-battery = The largest battery: vanadium electrolyte in big tanks.
wiki.eclipse-aetherite-capacitor = Stores power in aetherite crystals, more than twice a lithium battery in the same space.
wiki.eclipse-world-engine = The ultimate ECLIPSE project. Build the frame, then complete it in six stages (Foundation, Energy Core, Chemistry, Control, Confinement, Activation). Each stage needs large deliveries from a different industry and only accepts what the stage still needs; Confinement needs the fusion industry's deuterium. Tap it to see what is missing. Once online:\n- [accent]300,000 power/s[].\n- [accent]A store of 5,000,000 power[]: it keeps what the grid doesn't use and gives it back when the grid runs short, before the grid's own batteries.\n- [accent]Uplink[]: it also makes 15% of everything your other generators on the map produce. That power comes out of the World Engine, so link your grids to it. Only one World Engine per team gives it.\n- [accent]Overdrive field[]: buildings within 40 blocks work 50% faster, like an overdrive projector (boosts don't stack).
wiki.eclipse-core-bastion = The first core after the Nucleus. Place it over your Nucleus to upgrade, as with vanilla cores. It holds 30,000 of every item, raises the unit cap by 8 more than a Nucleus, and has twice its health and more armour. Its [accent]built-in power node[] reaches 12 blocks: every few seconds it links up to 10 power nodes and batteries that are on other grids, so the grids around the core become one. You can also link power nodes to it by hand. You respawn as [accent]Delta[].
wiki.eclipse-core-citadel = The largest core. Place it over a Core: Bastion to upgrade. It holds 60,000 of every item, raises the unit cap by 16 more than a Nucleus, has 3.5 times its health and the strongest armour, and its built-in power node reaches 16 blocks with up to 15 links. You respawn as [accent]Epsilon[].
wiki.eclipse-delta = The Core: Bastion's core unit, Gamma's successor: faster building and mining, it mines thorium and carries more. Its guns fire 2 more bullets per volley than Gamma's, and they home in on targets. A [accent]repair beam[] heals damaged blocks near it by itself while you fly.
wiki.eclipse-epsilon = The Core: Citadel's core unit: the fastest builder and miner, mining one tier higher than Delta. Its guns fire 2 more bullets per volley again (4 more than Gamma), homing, and every bullet explodes on impact. Its repair beam is the strongest.

# wiki entries: biology
wiki.eclipse-biomass-cultivator = Grows biomass from purified water and fertilizer under artificial light. Works anywhere, faster on moss and spore moss.
wiki.eclipse-algae-photobioreactor = Grows algae on water, carbon dioxide and fertilizer, making biomass and oxygen. A use for captured CO2.
wiki.eclipse-enzyme-extractor = Extracts enzymes from biomass and spore pods. The enzymes double the fermenter's speed.
wiki.eclipse-biochemical-fermenter = Ferments biomass into biofuel (left) and carbon dioxide (right). Twice as fast with enzyme extract.
wiki.eclipse-anaerobic-digester = Digests sludge and biomass into methane and fertilizer, without power.

# wiki entries: transport and liquids
wiki.eclipse-aluminium-conveyor = A belt for 20 items per second, the first ECLIPSE belt.
wiki.eclipse-chromium-conveyor = A belt for 30 items per second.
wiki.eclipse-superalloy-conveyor = A belt for 40 items per second.
wiki.eclipse-carbide-conveyor = A belt for 50 items per second.
wiki.eclipse-surge-conveyor = The fastest belt, 60 items per second. Vanilla junctions, routers and bridges are slower; feed it directly where you can.
wiki.eclipse-aluminium-conduit = A wide conduit, 3600 liquid per second, and corrosion-resistant.
wiki.eclipse-chromium-conduit = 4200 liquid per second, corrosion-resistant.
wiki.eclipse-superalloy-conduit = 4800 liquid per second, corrosion-resistant.
wiki.eclipse-carbide-conduit = 5400 liquid per second, corrosion-resistant.
wiki.eclipse-surge-conduit = The highest-capacity conduit, 6000 liquid per second, corrosion-resistant.
wiki.eclipse-polymer-conduit = The first corrosion-proof conduit. Use it for acids, chlorine, sodium hydroxide and acidic waste.
wiki.eclipse-polymer-liquid-router = A liquid router that corrosive liquids cannot destroy.
wiki.eclipse-polymer-bridge-conduit = A bridge conduit that corrosive liquids cannot destroy.
wiki.eclipse-polymer-liquid-tank = A large tank that safely stores acids, chlorine and chemical waste. Useful as a buffer in front of neutralizers.
wiki.eclipse-liquid-overflow-valve = Liquid from the back goes straight on; only what the front cannot take goes left, then right. Use it to feed a main consumer first and send the surplus elsewhere.
wiki.eclipse-liquid-balancer = Divides liquid from the back evenly between left, front and right.
wiki.eclipse-reserve-valve = Place it after a tank and pick a level: it only lets liquid out while the tank is above that level. Keep coolant or fuel in reserve for important machines.

# wiki entries: logistics
wiki.eclipse-three-way-sorter = Sends up to three chosen items to the left, front or right; input from the back. Other items go to a fallback side, or wait on the belt if you set none. A blocked route holds its item instead of losing it. Tap it to set the rules.
wiki.eclipse-distribution-hub = A 2x2 sorter with four item rules and a fallback side, at 60 items per second. Needs a little power.
wiki.eclipse-priority-merger = Merges the back, left and right lines into the front. In priority mode the top line always goes first and the others fill the gaps; in round-robin they take turns.
wiki.eclipse-controlled-splitter = Splits one line across left, front and right: evenly, by ratio (weights 0-3, for example 2:1) or by priority. Blocked branches are skipped, so nothing jams.
wiki.eclipse-line-balancer = A 2x2 splitter that shares one supply fairly between up to four buildings on its left, front and right. Needs power.
wiki.eclipse-small-logistics-buffer = Stores up to 60 items from its back and sides and exports them through the front. It can keep a minimum of one item type that is never exported.
wiki.eclipse-industrial-logistics-buffer = Stores up to 200 items, can keep a reserve and can export only one chosen item. Needs power.
wiki.eclipse-advanced-item-filter = Filters a whole list of items. Allow mode: listed items go straight, others to the sides. Deny mode: the reverse.
wiki.eclipse-batch-gate = Collects a set number of items (2, 5, 10 or 20) from the back, then releases the whole batch through the front. Useful for machines that should get full loads.
wiki.eclipse-smart-unloader = Unloads up to three chosen item types from adjacent containers, taking turns. Like the vanilla unloader, it never loads into storage.

# wiki entries: augmentation buildings
wiki.eclipse-augmentation-coupler = Attaches one module to an adjacent machine, vanilla or ECLIPSE. With one machine next to it, it connects by itself; otherwise tap the coupler, then the machine. Give it power. Hover over it to see what each module is doing.
wiki.eclipse-advanced-coupler = A coupler with two module slots.
wiki.eclipse-augmentation-hub = A large interface with four module slots for heavily upgraded machines.
wiki.eclipse-chemical-augmentation-interface = A coupler for chemical machines: three slots, chemical modules only, and a large coolant tank for modules that need cooling.
wiki.eclipse-military-augmentation-interface = A coupler for turrets: three slots, military modules only.
wiki.eclipse-basic-module-assembler = Builds tier I modules. Tap it to choose the module; it then accepts only that module's ingredients.
wiki.eclipse-advanced-module-assembler = Builds tier II and III modules. Tap it to choose the module.
wiki.eclipse-experimental-augmentation-facility = Builds tier IV, unique and legendary modules from the most advanced materials.
wiki.eclipse-aetherite-module-forge = Builds Tier V modules around aetherite crystals.
wiki.eclipse-module-recycling-facility = Dismantles unwanted modules and returns half of their materials.

# wiki entries: defense, robotics and endgame
wiki.eclipse-wave-intelligence-scanner = While powered, shows the next wave: unit types, counts, shields and bosses, and the time left. Tap it for the report. To show the wave on screens, select the scanner and tap up to 4 logic displays within 12 blocks. It never changes the wave.
wiki.eclipse-wave-disruption-array = When fully charged, tap Activate to delay the incoming wave by 20 seconds. Only before the wave arrives, and only on maps with a wave timer. All arrays share a lockout of 2 waves, so you cannot chain delays.
wiki.eclipse-temporal-interference-array = A stronger wave delay: 50 seconds. It shares the lockout with the Wave Disruption Array, then locks both for 4 waves.
wiki.eclipse-unit-shield-beacon = Shields friendly units (not buildings) in its field from a shared pool, up to 80 shield each. The shield it gave is taken back when a unit leaves. It recharges with power, slower while the field is under fire.
wiki.eclipse-emergency-repair-dispatch-bay = Repairs one chosen building quickly. Select the bay, then tap the building; tap the bay again to clear. Each chunk of repair uses a titanium rod.
wiki.eclipse-robot-dispatch-hub = Home of up to 4 robots within 25 blocks. Robots from the Air Factory sign in by themselves; tap the hub to give each one its job, then tap a building to pick it. Docked robots recharge with power, and titanium rods become repair charge.
wiki.eclipse-titan-manufacturing-complex = Builds the Dreadnought. Only one Dreadnought per team: while it lives, the complex pauses and uses nothing.
wiki.eclipse-orbital-weapons-platform = Tap it, then tap a spot within 150 blocks. It charges for two minutes, then spends superconductors, aetherite and blast compound on one strike: a red warning marks the target, and three seconds later all enemies within 10 blocks take 3000 damage. Your own buildings are safe.

# wiki entries: walls and turrets
wiki.eclipse-superalloy-wall = A very strong wall that also absorbs lasers.
wiki.eclipse-superalloy-wall-large = A very strong large wall that also absorbs lasers.
wiki.eclipse-surge-superalloy-wall = An extremely strong wall that absorbs lasers and arcs lightning at attackers.
wiki.eclipse-surge-superalloy-wall-large = An extremely strong large wall that absorbs lasers and arcs lightning at attackers.
wiki.eclipse-composite-wall = A carbon composite wall, stronger than superalloy, that sometimes deflects bullets.
wiki.eclipse-composite-wall-large = A large carbon composite wall that sometimes deflects bullets.
wiki.eclipse-acid-mortar = Lobs acid shells over long range at ground targets. The blast etches armor, and the acid pools where it lands, corroding units that wade through. Feed it an acid through polymer conduits.
wiki.eclipse-minelayer = Lobs mines onto the enemy's path. Each mine waits up to 30 seconds and goes off under the first ground unit that crosses it. Fires ammonium nitrate or blast compound.
wiki.eclipse-heat-lance = A continuous beam powered by heat instead of power. It needs 12 heat to fire; up to 24 heat makes it twice as strong. Point a heater (or a heat exchanger) at it.
wiki.eclipse-jammer = Every 3 seconds, jams enemy units in range: their weapons fire 40% slower for 4 seconds. Bosses recover twice as fast. It does not affect buildings.

# wiki entries: units
wiki.eclipse-logistics-drone = Carries up to 20 of one item between two buildings within its hub's range, and only delivers what the destination accepts (a turret gets ammo). Slower than a belt; use it for awkward routes, like feeding a turret on a cliff. Needs a Robot Dispatch Hub.
wiki.eclipse-repair-drone = Flies to one assigned building and repairs it from a finite repair charge, refilled at its hub with titanium rods. Assign it to an important wall or turret.
wiki.eclipse-shield-drone = Escorts the largest group of friendly units near its hub and tops their shields up to 40 from a shared pool. It recharges only at the hub, and the shields it gave vanish if it is destroyed. Slow and fragile: keep it behind your army.
wiki.eclipse-reaper = The first ECLIPSE tank: fast and light, with an armor-piercing autocannon that tears into buildings. Built in the Ground Factory; upgrade it in the reconstructors.
wiki.eclipse-bulwark = An armored tank with an armor-piercing cannon that shrugs off light fire.
wiki.eclipse-rampart = A heavy tank. Its frontal shield arc soaks up incoming fire while its twin armor-piercing cannons work.
wiki.eclipse-annihilator = A siege tank. Its long-range caustic shells etch armor so every gun behind it hits harder, and it crushes enemy blocks it rolls over.
wiki.eclipse-colossus = The largest ECLIPSE tank. Its main cannon pierces armor and several targets in a row, and two acid mortars leave corrosive pools behind the enemy line. The Dominion sends it as a late boss.
wiki.eclipse-wraith = A fast reconnaissance craft. Its light guns mark targets as Etched, halving their armor for heavier guns. The start of the strike aircraft line.
wiki.eclipse-interceptor = An anti-air fighter: it goes for aircraft first, then turrets that can shoot aircraft; with none around it chases enemy players and never attacks the core. Escort your ground army with a few.
wiki.eclipse-valkyrie = A gunship with rapid armor-piercing guns against both air and ground.
wiki.eclipse-tempest = A strategic bomber. Each bomb scatters mines that wait on the ground for the enemy. Ground targets only.
wiki.eclipse-leviathan = An aerial command platform. Its jamming pulse slows enemy fire around it, point defenses shoot down incoming bullets, and a heavy lance burns through targets. The Dominion sends it as a late boss.
wiki.eclipse-dreadnought = The titan: twin armor-piercing heavy cannons, a heat lance, acid mortars, a broad frontal shield and a jamming pulse. Only one per team, built in the Titan Manufacturing Complex.
wiki.eclipse-ew-drone = Unarmed and fragile. Every 5 seconds it scrambles enemy turrets within 10 blocks so they aim and fire at half speed for 4 seconds. Send it in with an attack to blunt the enemy's defenses.
wiki.eclipse-skiff = Tide. The first boat of every Tide wave. Its water jet does little damage but leaves targets Wet, and Wet units take extra damage from electric attacks, including the Tide's own shock coils. Fast on water, slow on land: catch it on the shore.
wiki.eclipse-slicker = Tide. Coats targets in oil (Tarred) and then sets them alight with incendiary rounds; burning and tarred together hurt far more. Keep fire-sensitive blocks away from the shore it lands on.
wiki.eclipse-frostwake = Tide. Freezes what it hits and leaves a trail of mines: ground units chasing it walk into them. Mines go off under ground units only.
wiki.eclipse-cinderwake = Tide. A late, armoured boat. Its slag jet melts armour away, its shock coil punishes anything left Wet by Skiffs, and it seeds mines behind it.
wiki.eclipse-maelstrom = Tide boss, every 20 waves from wave 35. Two jets (water and cryofluid) soak and freeze everything in front of it, the shock coil turns Wet targets into easy kills, and mines trail behind it. It regenerates; on land it slows to a crawl, so fight it on the shore.
wiki.eclipse-lurker = Tide. The first submarine, from wave 10 on maps with a spawn point on water. Under water it is invisible to your turrets: build a [accent]Sonar[] near the coast so they can see it, or lay mines in the water. It surfaces for a moment whenever it fires, and then anything can hit it.
wiki.eclipse-barracuda = Tide. A heavier hunter-killer from wave 20, with twin torpedoes and a deck gun for whatever it surfaces next to. Same counters as the Lurker: Sonar to see it, mines to hit it under water.
wiki.eclipse-abyss = Tide boss, every 25 waves from wave 50 on maps with a water spawn. It never surfaces, so without a Sonar in range it simply cannot be fought: only mines reach it. Its missiles can be shot down by point defence, its torpedoes cannot.
wiki.eclipse-mite = Swarm. A small self-repairing machine that spits acid at close range. Weak alone, but it comes in growing numbers on every Swarm wave, and Broods and Behemoths release more. Splash damage handles them best.
wiki.eclipse-wasp = Swarm. A fast flyer whose acid sting corrodes its target. Make sure you have anti-air from about wave 6.
wiki.eclipse-spitter = Swarm. Lobs acid that leaves corrosive pools. Outrange it, or it will slowly eat through your front line.
wiki.eclipse-brood = Swarm. Sprays spores that slow its targets, and bursts into four Mites when it dies. Kill it before it reaches your walls.
wiki.eclipse-behemoth = Swarm boss. It regenerates quickly, lays a Mite egg every 6 seconds while it advances and bombards with acid. It comes every 12 waves from wave 24. The eggs hatch after 3 seconds; until then they cannot move or attack and take double damage, so splash turrets can wipe each clutch. Focus fire on it; long fights only give it more Mites.
wiki.eclipse-scrabba = Swarm boss: a giant scorpion, every 20 waves from wave 40 (from wave 30 on the Hive). The first melee unit: it walks up to your walls and its claws crush a 3x3 area in front of them, walls included, with double damage to buildings. Its stinger saps whatever it hits, healing Scrabba and leaving the target Sapped. Its exoskeleton holds up to 3000 damage and grows back at full health. Keep steady fire on it so the exoskeleton never returns, etch it with sulfur shells, and keep layered walls so it can't chew straight through.
wiki.eclipse-lamprey = Tide unit from wave 15. A robotic eel, fast in water, slow on land. From the water it leaps up to 10 blocks onto your nearest turret, clearing walls, and clamps on beside it: the turret freezes (no reload, no turning) and loses health until the Lamprey dies. In the air only anti-air can hit it. On land it clamps onto any building it reaches except walls. Keep turrets back from the shore or covered by other turrets, so a clamped Lamprey dies fast.

# wiki entries: upgrade modules (one text per family; the tiers differ only in strength)
wiki.eclipse-production-accelerator = Makes the machine work faster. The coupler draws extra power for it, partly a flat amount and partly in proportion to the machine's own power use, so it costs most on power-hungry machines.\nThe stronger the tier, the bigger the boost and the power cost. A second accelerator on the same machine counts half.
wiki.eclipse-power-optimizer = Refunds part of the machine's power draw to its grid. The coupler must be on the same power grid as the machine. Great on smelters and electrolysis.
wiki.eclipse-output-amplifier = More output per production cycle, at the cost of some speed. It saves input material rather than time.\nIt cannot share a machine with a Precision Fabricator.
wiki.eclipse-precision-fabricator = Returns part of the items the machine consumes each cycle, so the same inputs go further.\nIt cannot share a machine with an Output Amplifier.
wiki.eclipse-material-recycler = Collects part of the machine's consumed items as scrap, which the coupler pushes out. Belt the scrap to an Ore Crusher.
wiki.eclipse-reaction-accelerator = Makes chemical machines work faster. It needs coolant in the coupler; colder coolants (chilled water, cryofluid, liquid nitrogen) last longer. Best in a Chemical Augmentation Interface with its big coolant tank.
wiki.eclipse-thermal-controller = Supplies part of a heat-driven machine's heat requirement, so you need smaller heaters.
wiki.eclipse-pressure-stabilizer = Pressurized reactors reach operating pressure faster and lose it more slowly while idle.
wiki.eclipse-catalyst-optimizer = Catalysts in the attached reactor last more crafts.
wiki.eclipse-purification-module = The machine makes more of its main product liquid (for example purified water, not the brine).
wiki.eclipse-waste-recovery = Turns part of the machine's acidic waste back into the acid it consumes: less waste to neutralize and less acid to make.
wiki.eclipse-thermal-recovery = Turns a hot machine's waste heat into power for the grid. Strongest on heat producers such as the Fission Reactor.
wiki.eclipse-energy-overcharger = Charges for 15 seconds, then pushes the machine much faster for 5 seconds.
wiki.eclipse-capacitor-module = Stores spare grid power and feeds it to the machine during shortages, keeping it running through dips.
wiki.eclipse-deep-mining = Drills mine faster.
wiki.eclipse-advanced-drill-head = Drills extract more ore per cycle without slowing down. It cannot share a drill with other efficiency modules.
wiki.eclipse-geological-analyzer = Surveys every deposit within 10 tiles of the drill. Hover over the coupler to see what is there and how much.
wiki.eclipse-rapid-fire-controller = The turret fires faster but heats up while shooting; an overheated turret slows down until it cools. Pair the stronger tiers with a Cooling System.
wiki.eclipse-cooling-system = The turret sheds Rapid Fire heat faster, so it overheats less or never.
wiki.eclipse-advanced-ammunition = The turret's shots deal more damage. Works on lasers and beams too.
wiki.eclipse-targeting-computer = Removes part (or all) of the turret's random spread. Fragments, mines and other bullets its shots release keep their own spread.
wiki.eclipse-ballistic-computer = Shots fly 50% faster over the same range, so fast targets are easier to hit. Beams and lasers are not affected.
wiki.eclipse-mass-production = A machine configuration: faster and more output per cycle, at an enormous power cost. One per machine.
wiki.eclipse-closed-loop-processing = A machine configuration: returns part of the inputs, recycles some as scrap and recovers half of any acidic waste. One per machine.
wiki.eclipse-emergency-overdrive = A machine configuration: after charging, bursts the machine to 2.5x speed for 5 seconds. Very power hungry. One per machine.
wiki.eclipse-quantum-accelerator = Legendary: the machine works 2.5 times as fast, at a high power cost. One per machine.
wiki.eclipse-matter-replicator = Legendary: 80% more output per cycle with no slowdown, above the 50% cap ordinary modules stop at. One per machine, and it takes the efficiency slot (no Output Amplifier or Precision Fabricator alongside it).
wiki.eclipse-ancient-efficiency-core = Legendary: cuts the machine's power draw by 70% (ordinary modules stop at 50%) and returns a quarter of its inputs. One per machine, and it takes the efficiency slot (no Output Amplifier, Precision Fabricator or Matter Replicator alongside it).
wiki.eclipse-temporal-processing-core = Legendary: after charging, the machine runs 4 times as fast for 5 seconds. One per machine.

