# Flow Meter
block.eclipse-flow-meter.name = Flow Meter
block.eclipse-flow-meter.description = Place it in a belt: items pass straight through, and the number on it shows how many items per second go by (averaged over 5 seconds). Never slows the belt down. Needs a belt on both sides, not another router.\nLogic: [accent]sensor r meter1 @copper[] reads copper per second, [accent]@totalItems[] all items per second.
bar.eclipse-flow = {0} items/s
wiki.eclipse-flow-meter = A cheap measuring tool. Put it into any belt line, between two belts, and it shows on itself how many items per second pass, averaged over the last 5 seconds. Items go straight through and the belt runs at full speed.\nUse it to see how much a machine or drill field really produces, or whether a line is saturated. Like sorters, it passes items instantly, so it needs a belt (not another router or sorter) directly on both sides.\n\n[accent]Reading it with a processor:[] link the meter to a logic processor (it gets a name like meter1). [accent]sensor r meter1 @copper[] gives copper per second, any other item works the same, and [accent]sensor r meter1 @totalItems[] gives everything per second. One meter on a mixed belt reports every material on it separately, so a processor can show many materials from a few meters on a display or message block. The showcase map has a working example: a processor drawing copper, lead, graphite and total rates on a large display.

