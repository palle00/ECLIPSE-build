stat.eclipse-compat-liquid-producers = Crafters that produce a liquid
stat.eclipse-compat-waste-producers = Crafters that produce acidic waste

block.eclipse-military-augmentation-interface.name = Military Augmentation Interface
block.eclipse-military-augmentation-interface.description = A coupler for turrets: three module slots, military modules only.
block.eclipse-experimental-augmentation-facility.name = Experimental Augmentation Facility
block.eclipse-experimental-augmentation-facility.description = Builds tier IV and legendary modules from the most advanced materials available.
block.eclipse-module-recycling-facility.name = Module Recycling Facility
block.eclipse-module-recycling-facility.description = Dismantles unwanted modules and recovers half of the materials used to make them.

item.eclipse-thermal-recovery-1.name = Thermal Recovery I
item.eclipse-thermal-recovery-1.description = Turns 10% of a hot machine's waste heat into power for the grid. Works best on heat producers such as the fission reactor.
item.eclipse-thermal-recovery-2.name = Thermal Recovery II
item.eclipse-thermal-recovery-2.description = Turns 20% of a hot machine's waste heat into power for the grid.
item.eclipse-thermal-recovery-3.name = Thermal Recovery III
item.eclipse-thermal-recovery-3.description = Turns 30% of a hot machine's waste heat into power for the grid.
item.eclipse-energy-overcharger-1.name = Energy Overcharger I
item.eclipse-energy-overcharger-1.description = Charges for 15 seconds, then pushes the machine 60% faster for 5 seconds.
item.eclipse-energy-overcharger-2.name = Energy Overcharger II
item.eclipse-energy-overcharger-2.description = Charges for 15 seconds, then pushes the machine twice as fast for 5 seconds.
item.eclipse-capacitor-module-1.name = Capacitor Module I
item.eclipse-capacitor-module-1.description = Stores 2000 power units from spare grid power and feeds them to the machine during power shortages.
item.eclipse-capacitor-module-2.name = Capacitor Module II
item.eclipse-capacitor-module-2.description = Stores 6000 power units from spare grid power and feeds them to the machine during power shortages.
item.eclipse-deep-mining-1.name = Deep Mining I
item.eclipse-deep-mining-1.description = Drills mine 20% faster.
item.eclipse-deep-mining-2.name = Deep Mining II
item.eclipse-deep-mining-2.description = Drills mine 40% faster.
item.eclipse-deep-mining-3.name = Deep Mining III
item.eclipse-deep-mining-3.description = Drills mine 60% faster.
item.eclipse-advanced-drill-head-1.name = Advanced Drill Head I
item.eclipse-advanced-drill-head-1.description = Drills extract 15% more ore per cycle, without slowing down.\nCannot be combined with other efficiency modules.
item.eclipse-advanced-drill-head-2.name = Advanced Drill Head II
item.eclipse-advanced-drill-head-2.description = Drills extract 30% more ore per cycle, without slowing down.\nCannot be combined with other efficiency modules.
item.eclipse-geological-analyzer.name = Geological Analyzer
item.eclipse-geological-analyzer.description = Surveys every deposit within 10 tiles of the drill. Hover over the coupler to see the results.
item.eclipse-rapid-fire-controller-1.name = Rapid Fire Controller I
item.eclipse-rapid-fire-controller-1.description = The turret fires 20% faster but heats up while shooting. An overheated turret slows down until it cools.
item.eclipse-rapid-fire-controller-2.name = Rapid Fire Controller II
item.eclipse-rapid-fire-controller-2.description = The turret fires 35% faster but heats up while shooting. An overheated turret slows down until it cools.
item.eclipse-rapid-fire-controller-3.name = Rapid Fire Controller III
item.eclipse-rapid-fire-controller-3.description = The turret fires 50% faster but heats up quickly while shooting. Pair it with a cooling system.
item.eclipse-cooling-system-1.name = Cooling System I
item.eclipse-cooling-system-1.description = The turret sheds heat 50% faster, preventing rapid-fire overheating.
item.eclipse-cooling-system-2.name = Cooling System II
item.eclipse-cooling-system-2.description = The turret sheds heat twice as fast, preventing rapid-fire overheating.
item.eclipse-advanced-ammunition-1.name = Advanced Ammunition I
item.eclipse-advanced-ammunition-1.description = The turret's shots deal 10% more damage.
item.eclipse-advanced-ammunition-2.name = Advanced Ammunition II
item.eclipse-advanced-ammunition-2.description = The turret's shots deal 20% more damage.
item.eclipse-advanced-ammunition-3.name = Advanced Ammunition III
item.eclipse-advanced-ammunition-3.description = The turret's shots deal 30% more damage.
item.eclipse-targeting-computer-1.name = Targeting Computer I
item.eclipse-targeting-computer-1.description = Removes half of the turret's spread.
item.eclipse-targeting-computer-2.name = Targeting Computer II
item.eclipse-targeting-computer-2.description = Removes all of the turret's spread.
item.eclipse-ballistic-computer.name = Ballistic Computer
item.eclipse-ballistic-computer.description = Shots fly 50% faster over the same range, making fast targets easier to hit.

item.eclipse-production-accelerator-4.name = Production Accelerator IV
item.eclipse-production-accelerator-4.description = Experimental. The machine works 50% faster at a very high power cost.
item.eclipse-power-optimizer-4.name = Power Optimizer IV
item.eclipse-power-optimizer-4.description = Experimental. Cuts the machine's power draw by 40%.
item.eclipse-output-amplifier-4.name = Output Amplifier IV
item.eclipse-output-amplifier-4.description = Experimental. 40% more output per cycle; the machine runs 20% slower.\nCannot be combined with other efficiency modules.
item.eclipse-precision-fabricator-4.name = Precision Fabricator IV
item.eclipse-precision-fabricator-4.description = Experimental. Returns 40% of consumed items.\nCannot be combined with other efficiency modules.
item.eclipse-reaction-accelerator-4.name = Reaction Accelerator IV
item.eclipse-reaction-accelerator-4.description = Experimental. Chemical machines work 70% faster. Needs a lot of coolant.
item.eclipse-deep-mining-4.name = Deep Mining IV
item.eclipse-deep-mining-4.description = Experimental. Drills mine 80% faster.
item.eclipse-mass-production.name = Mass Production
item.eclipse-mass-production.description = A machine configuration: 40% faster and 20% more output per cycle, but it consumes enormous amounts of power. One per machine.
item.eclipse-closed-loop-processing.name = Closed-Loop Processing
item.eclipse-closed-loop-processing.description = A machine configuration: returns 15% of inputs, recycles 10% as scrap and recovers half of any acidic waste. One per machine.
item.eclipse-emergency-overdrive.name = Emergency Overdrive
item.eclipse-emergency-overdrive.description = A machine configuration: after charging, bursts the machine to 2.5x speed for 5 seconds. Very power hungry. One per machine.
item.eclipse-quantum-accelerator.name = Quantum Accelerator
item.eclipse-quantum-accelerator.description = [purple]Legendary.[] Makes the machine work 2.5 times as fast, using exotic energy. One per machine.
item.eclipse-matter-replicator.name = Matter Replicator
item.eclipse-matter-replicator.description = [purple]Legendary.[] 50% more output per cycle with no slowdown. One per machine.
item.eclipse-ancient-efficiency-core.name = Zero-Point Efficiency Core
item.eclipse-ancient-efficiency-core.description = [purple]Legendary.[] Halves the machine's power draw and returns a quarter of its inputs. One per machine.
item.eclipse-temporal-processing-core.name = Temporal Processing Core
item.eclipse-temporal-processing-core.description = [purple]Legendary.[] After charging, bends time: the machine runs 4x as fast for 5 seconds. One per machine.

