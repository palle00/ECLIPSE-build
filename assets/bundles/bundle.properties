# military M1: ammunition
status.eclipse-etched.name = Etched
status.eclipse-etched.description = Caustic sulfur has eaten into the hull: armour is halved while it lasts. Applied by sulfur shells from Hail and Ripple.

# military M2: turrets
block.eclipse-acid-mortar.name = Acid Mortar
block.eclipse-acid-mortar.description = Lobs shells of acid over long range. The blast etches armour, and the acid pools where it lands, corroding every ground unit that wades through. Chemical-grade lining: its own acid does not corrode it. Ground targets only.
block.eclipse-minelayer.name = Minelayer
block.eclipse-minelayer.description = Lobs mines onto the enemy's path. Each mine waits on the ground for up to 30 seconds and goes off under the first ground unit to cross it. Fires ammonium nitrate or blast compound.
block.eclipse-heat-lance.name = Heat Lance
block.eclipse-heat-lance.description = A continuous beam powered by heat instead of electricity. Needs 12 heat to fire; more heat, up to 24, makes the beam twice as strong. Sets targets melting.
block.eclipse-jammer.name = Jammer
block.eclipse-jammer.description = Every 3 seconds sends out a pulse that jams enemy units in range: their weapons fire 40% slower for 4 seconds. Bosses shake it off in half the time. Does not affect buildings.
status.eclipse-submerged.name = Submerged
status.eclipse-submerged.description = Under water: nothing can target or hit it except mines, until a Sonar picks it up.
status.eclipse-sonar-contact.name = Sonar Contact
status.eclipse-sonar-contact.description = A Sonar has found it: even submerged, it can be targeted and hit.
status.eclipse-jammed.name = Jammed
status.eclipse-jammed.description = Targeting and feed systems are being jammed: weapons fire 40% slower while it lasts. Applied by the Jammer.
status.eclipse-exoskeleton.name = Exoskeleton
status.eclipse-exoskeleton.description = A hard outer layer grown at full health: it takes damage first, and while it holds the unit takes 20% less damage.
status.eclipse-incubating.name = Incubating
status.eclipse-incubating.description = A freshly laid egg: it cannot move or attack and takes double damage until it hatches.
status.eclipse-latched.name = Latched
status.eclipse-latched.description = Clamped onto a building: it stays put, the building is frozen and drained until the unit is killed.

# military M3: unit lines (built in the vanilla factories and reconstructors)
unit.eclipse-reaper.name = Reaper
unit.eclipse-reaper.description = Fast light tank. Its armour-piercing autocannon tears into buildings. Built in the Ground Factory.
unit.eclipse-bulwark.name = Bulwark
unit.eclipse-bulwark.description = Armoured tank with an armour-piercing cannon. Shrugs off light fire.
unit.eclipse-rampart.name = Rampart
unit.eclipse-rampart.description = Heavy tank with a frontal shield arc that soaks up incoming fire while its twin armour-piercing cannons work.
unit.eclipse-annihilator.name = Annihilator
unit.eclipse-annihilator.description = Siege tank. Its long-range caustic shells etch armour for every gun behind it; armour-piercing guns cover its flanks. Crushes enemy blocks it rolls over.
unit.eclipse-colossus.name = Colossus
unit.eclipse-colossus.description = Massive armoured tank. Its main cannon pierces armour and several targets in a row; two acid mortars leave corrosive pools behind the enemy line.
unit.eclipse-wraith.name = Wraith
unit.eclipse-wraith.description = Fast reconnaissance craft. Its light guns mark targets with Etched, halving their armour for heavier guns.
unit.eclipse-interceptor.name = Interceptor
unit.eclipse-interceptor.description = Anti-air fighter. Hunts aircraft and anti-air turrets with homing missiles; with none around it chases enemy players. It ignores the core.
unit.eclipse-valkyrie.name = Valkyrie
unit.eclipse-valkyrie.description = Gunship with rapid armour-piercing guns against air and ground.
unit.eclipse-tempest.name = Tempest
unit.eclipse-tempest.description = Strategic bomber. Each bomb scatters mines that wait on the ground for the enemy. Ground targets only.
unit.eclipse-leviathan.name = Leviathan
unit.eclipse-leviathan.description = Aerial command platform. Its jamming pulse slows enemy fire around it, point defences shoot down incoming bullets, and a heavy lance burns through targets.
ability.eclipse-amphibious = Amphibious
ability.eclipse-amphibious.stats = Hovers over water and land; on land its speed drops to {0}%
ability.eclipse-exoskeleton = Exoskeleton
ability.eclipse-exoskeleton.stats = At full health, regeneration grows an exoskeleton of up to {0} ({1}/s) that takes damage first; 20% less damage while it holds. Acid (Etched) stops it growing
ability.eclipse-eggs.stats = Laid as eggs: they hatch after {0} s, and until then cannot move or attack and take double damage
ability.eclipse-latch = Lamprey Clamp
ability.eclipse-latch.stats = From water, leaps onto an enemy turret within {0} blocks (over walls; only anti-air can hit it in the air). Clamps onto the building beside it (not walls): the building is frozen and loses {1} health/s until the Lamprey dies. Leaps again {2} s after letting go
ability.eclipse-dive = Dive
ability.eclipse-dive.stats = Submerged when not attacking (stays up {0} s after firing); untargetable and unhittable under water except by mines and when on sonar
ability.eclipse-dive.nuclear = Never surfaces; untargetable and unhittable except by mines and when on sonar
ability.eclipse-jampulse = Jamming Pulse
ability.eclipse-jampulse.stats = Jams enemy units within {0} blocks every {1} s for {2} s (weapons 40% slower; bosses half as long)

# military M4: enemy factions joining the waves of custom games
eclipse-factions-start = [#c9d36a]The Swarm[] (every 2nd wave), [#e0683a]the Dominion[] (every 3rd) and [#5a8fd8]the Tide[] (every 5th) join the waves. Every 6th wave the Swarm and the Dominion attack together.
eclipse-factions-swarm-world = [#c9d36a]The Swarm[] holds this world: it attacks every wave.
eclipse-factions-dominion-world = [#e0683a]The Dominion[] holds this world: it attacks every wave.
eclipse-factions-tide-world = [#5a8fd8]The Tide[] holds this world: its boats come every wave, its submarines from the open sea.
eclipse-factions-tide = [#5a8fd8]The Tide[] joins the waves: amphibious boats every 5th wave.
eclipse-factions-newcomers = New in the factions: [#c9d36a]Scrabba[], the Swarm's giant scorpion, and the Tide's [#5a8fd8]Lampreys[], which clamp onto your turrets.
# the ECLIPSE wave event
eclipse-eclipse.start = [#b37aff]An ECLIPSE darkens the sky![] Until the next wave, enemies are x{0} tougher and hit x{0} harder.
eclipse-eclipse.end = The eclipse passes. Enemies are back to normal strength.
unit.eclipse-skiff.name = Skiff
unit.eclipse-skiff.description = Tide. A fast amphibious boat that sprays water (Wet: lightning and electric damage hit harder) and fires a light gun. Slow on land.
unit.eclipse-slicker.name = Slicker
unit.eclipse-slicker.description = Tide. Sprays oil (Tarred: slowed, and fire burns hotter) and fires incendiary rounds. Slow on land.
unit.eclipse-frostwake.name = Frostwake
unit.eclipse-frostwake.description = Tide. Sprays cryofluid (Freezing) and drops mines behind it. Slow on land.
unit.eclipse-cinderwake.name = Cinderwake
unit.eclipse-cinderwake.description = Tide. Heavy boat that sprays slag (Melting), drops mines and arcs lightning at close range. Slow on land.
unit.eclipse-maelstrom.name = Maelstrom
unit.eclipse-maelstrom.description = Tide boss. Sprays water and cryofluid, drops mines and arcs lightning; regenerates. Slow on land.
unit.eclipse-lurker.name = Lurker
unit.eclipse-lurker.description = Tide submarine. Dives when not attacking; while submerged nothing can target or hit it except mines, unless a Sonar has it. Surfaces to fire cavitation torpedoes, which run under water and cannot be shot down.
unit.eclipse-barracuda.name = Barracuda
unit.eclipse-barracuda.description = Tide submarine. Twin cavitation torpedoes and a deck gun; dives when not attacking.
unit.eclipse-abyss.name = Abyss
unit.eclipse-abyss.description = Tide boss: a nuclear submarine. Never has to surface; fires heavy torpedoes and launches long-range incendiary missiles from below.
unit.eclipse-mite.name = Mite
unit.eclipse-mite.description = Swarm. Small self-repairing biological machine that spits acid at close range. Comes in large numbers.
unit.eclipse-wasp.name = Wasp
unit.eclipse-wasp.description = Swarm. Fast flyer whose acid sting corrodes its target.
unit.eclipse-spitter.name = Spitter
unit.eclipse-spitter.description = Swarm. Lobs globs of acid that leave corrosive pools.
unit.eclipse-brood.name = Brood
unit.eclipse-brood.description = Swarm. Sprays spores that slow its targets. When it dies it bursts into four Mites.
unit.eclipse-behemoth.name = Behemoth
unit.eclipse-behemoth.description = Swarm boss. Regenerates quickly, keeps laying Mite eggs (they hatch after 3 seconds: kill them before they do) and bombards with acid.
unit.eclipse-scrabba.name = Scrabba
unit.eclipse-scrabba.description = Swarm boss: a giant scorpion and a melee unit. Its claws crush everything in a 3x3 area in front of it, walls included; its stinger saps its target, healing Scrabba and leaving the target Sapped. Its exoskeleton holds up to 3000 damage.
unit.eclipse-lamprey.name = Lamprey
unit.eclipse-lamprey.description = Tide. A robotic eel. From the water it leaps onto your nearest turret, over walls, and clamps on: the turret is frozen and drained until the Lamprey is killed. Shoot it while it hangs there, or with anti-air while it is in the air.

# military M5: endgame
block.eclipse-titan-manufacturing-complex.name = Titan Manufacturing Complex
block.eclipse-titan-manufacturing-complex.description = Builds the Dreadnought. One per team: while your Dreadnought is alive, the complex pauses and uses nothing.
unit.eclipse-dreadnought.name = Dreadnought
unit.eclipse-dreadnought.description = Titan-class tank. Twin armour-piercing heavy cannons, a heat lance, acid mortars, a broad frontal shield and a jamming pulse. Only one per team.
block.eclipse-orbital-weapons-platform.name = Orbital Weapons Platform
block.eclipse-orbital-weapons-platform.description = Tap it, then tap any spot within 150 blocks to set a target. Charges for two minutes on power, then spends superconductors, aetherite and blast compound on one strike: a warning marks the target, and three seconds later everything enemy in a 10-block radius takes 3000 damage.
unit.eclipse-ew-drone.name = Electronic Warfare Drone
unit.eclipse-ew-drone.description = Unarmed and fragile. Every 5 seconds it scrambles enemy turrets within 10 blocks: they aim and fire at half speed for 4 seconds. It never disables them or touches other buildings. Built in the Air Factory.
ability.eclipse-ewpulse = Fire-Control Jamming
ability.eclipse-ewpulse.stats = Every {1} s, enemy turrets within {0} blocks aim and fire {2}% slower for {3} s

