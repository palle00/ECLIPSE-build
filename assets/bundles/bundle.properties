item.eclipse-superconductor.name = Superconductor
item.eclipse-superconductor.description = An exotic ceramic that carries current without resistance when kept cold. Made in the Chemical Synthesis Complex; needed for the World Engine and the Temporal Interference Array.
block.eclipse-chemical-synthesis-complex.name = Chemical Synthesis Complex
block.eclipse-chemical-synthesis-complex.description = The peak of the chemical industry. Synthesizes superconductors from copper wire and aetherite in nitric acid, under pressure, over a platinum catalyst that is slowly used up, cooled with liquid nitrogen.
block.eclipse-temporal-interference-array.name = Temporal Interference Array
block.eclipse-temporal-interference-array.description = Once fully charged, tap and activate to delay the incoming wave by 50 seconds. Only before the wave arrives. Shares its lockout with the Wave Disruption Array, then locks both for 4 waves.
block.eclipse-world-engine.name = World Engine
block.eclipse-world-engine.description = The ultimate ECLIPSE project. After the frame is built, complete it in five stages (Foundation, Energy Core, Chemistry, Control, Activation), each fed with a different industry's output. It only accepts what the current stage needs. Once complete, it comes online as a planetary power source.
