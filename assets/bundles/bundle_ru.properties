eclipse-valve-reserve = Оставлять в баке:

liquid.eclipse-flue-gas.name = Дымовые газы
liquid.eclipse-flue-gas.description = Горячие выхлопные газы от сжигания метана и отходов: азот и углекислый газ с примесью сернистого газа. Выпускаются в атмосферу, если не отведены трубами, но стоит перерабатывать в скруббере или газовом сепараторе.
liquid.eclipse-carbon-dioxide.name = Углекислый газ
liquid.eclipse-carbon-dioxide.description = Улавливается из дымовых газов газовым сепаратором. Соединяется с водородом с образованием метанола.
liquid.eclipse-wastewater.name = Сточные воды
liquid.eclipse-wastewater.description = Грязная технологическая вода, оставшаяся после очистки газов. Обработайте её, чтобы получить очищенную воду; иначе она скапливается и останавливает скруббер.
item.eclipse-industrial-sludge.name = Промышленный шлам
item.eclipse-industrial-sludge.description = Твёрдые частицы, отфильтрованные из сточных вод. Сжигаются в термическом утилизаторе отходов для получения лома и песка.
block.eclipse-gas-separator.name = Газовый сепаратор
block.eclipse-gas-separator.description = Разделяет дымовые газы через селективные мембраны. Азот выходит слева, углекислый газ — справа. Источник азота без криофлюида.
block.eclipse-wastewater-treatment-plant.name = Очистная станция сточных вод
block.eclipse-wastewater-treatment-plant.description = Отстаивает и фильтрует сточные воды в очищенную воду, оставляя промышленный шлам.
block.eclipse-thermal-waste-processor.name = Термический утилизатор отходов
block.eclipse-thermal-waste-processor.description = Сжигает промышленный шлам теплом соседних нагревателей, извлекая лом и песок. Выделяет дымовые газы.

liquid.eclipse-methanol.name = Метанол
liquid.eclipse-methanol.description = Получается из уловленного углекислого газа и водорода. Начало метанолового маршрута к пластикам и волокнам.
liquid.eclipse-propylene.name = Пропилен
liquid.eclipse-propylene.description = Реакционный газ, получаемый из метанола. Сырьё для эпоксидной смолы, синтетического каучука и акрилонитрила.
liquid.eclipse-acrylonitrile.name = Акрилонитрил
liquid.eclipse-acrylonitrile.description = Токсичный мономер, получаемый из пропилена, аммиака и кислорода. Прядётся и карбонизуется в углеродное волокно.
item.eclipse-synthetic-rubber.name = Синтетический каучук
item.eclipse-synthetic-rubber.description = Вулканизированный этилен-пропиленовый каучук. Используется для уплотнений, прокладок и ремней в совершенных механизмах.
item.eclipse-epoxy-resin.name = Эпоксидная смола
item.eclipse-epoxy-resin.description = Быстротвердеющая смола. Связывает углеродное волокно в композит.
item.eclipse-carbon-fiber.name = Углеродное волокно
item.eclipse-carbon-fiber.description = Прочное лёгкое волокно, получаемое карбонизацией акрилонитрила при очень высокой температуре.
item.eclipse-carbon-composite.name = Углеродный композит
item.eclipse-carbon-composite.description = Углеродное волокно в эпоксидной матрице. Лёгкий и чрезвычайно прочный материал для брони.
block.eclipse-carbon-fiber-furnace.name = Печь углеродного волокна
block.eclipse-carbon-fiber-furnace.description = Прядёт акрилонитрил в волокно и карбонизует его. Требует много тепла от соседних нагревателей. Выделяет дымовые газы.
block.eclipse-composite-press.name = Пресс композитов
block.eclipse-composite-press.description = Укладывает углеродное волокно в эпоксидную смолу и отверждает его в углеродный композит.
block.eclipse-composite-wall.name = Композитная стена
block.eclipse-composite-wall.description = Стена из углеродного композита. Прочнее суперсплава и иногда отражает пули.
block.eclipse-composite-wall-large.name = Большая композитная стена
block.eclipse-composite-wall-large.description = Большая стена из углеродного композита. Прочнее суперсплава и иногда отражает пули.

item.eclipse-biomass.name = Биомасса
item.eclipse-biomass.description = Растительное и водорослевое сырьё. Сбраживается в биотопливо, перерабатывается в ферменты или сжигается в генераторах на топливе.
item.eclipse-fertilizer.name = Удобрение
item.eclipse-fertilizer.description = Гранулы сульфата аммония или перебродивший шлам. Питает культиваторы биомассы.
item.eclipse-enzyme-extract.name = Ферментный экстракт
item.eclipse-enzyme-extract.description = Биологические катализаторы, извлекаемые из биомассы и спор. Удваивает скорость биохимического ферментера.
liquid.eclipse-biofuel.name = Биотопливо
liquid.eclipse-biofuel.description = Этанол, полученный сбраживанием биомассы. Сжигается в биотопливных двигателях для выработки энергии.
block.eclipse-biomass-cultivator.name = Культиватор биомассы
block.eclipse-biomass-cultivator.description = Выращивает биомассу под искусственным светом из очищенной воды и удобрений. Работает на любой поверхности.
block.eclipse-algae-photobioreactor.name = Фотобиореактор водорослей
block.eclipse-algae-photobioreactor.description = Выращивает водоросли на воде, углекислом газе и удобрениях, вырабатывая биомассу и выделяя кислород. Применение для уловленного CO2.
block.eclipse-enzyme-extractor.name = Экстрактор ферментов
block.eclipse-enzyme-extractor.description = Извлекает ферменты из биомассы и стручков спор.
block.eclipse-biochemical-fermenter.name = Биохимический ферментер
block.eclipse-biochemical-fermenter.description = Сбраживает биомассу в биотопливо. Биотопливо выходит слева, углекислый газ — справа. Работает вдвое быстрее с ферментным экстрактом, который постепенно расходуется.
block.eclipse-biofuel-engine.name = Биотопливный двигатель
block.eclipse-biofuel-engine.description = Сжигает биотопливо или дизель для выработки энергии. Выхлоп выходит в виде дымовых газов; отведите его трубами для использования, иначе он выпускается в атмосферу.
block.eclipse-anaerobic-digester.name = Анаэробный дигестер
block.eclipse-anaerobic-digester.description = Бактерии перерабатывают промышленный шлам и биомассу в метан и удобрение. Не требует энергии.

item.eclipse-copper-gear.name = Медная шестерня
item.eclipse-copper-gear.description = Штампуется из меди. Подвижные части для простых механизмов, насосов, сортировщиков и модулей I уровня.
item.eclipse-titanium-rod.name = Титановый стержень
item.eclipse-titanium-rod.description = Прессованный титан. Идёт на болты, винты, кольца и пружины; несущие рамы.
item.eclipse-titanium-gear.name = Титановая шестерня
item.eclipse-titanium-gear.description = Износостойкие шестерни для промышленных машин, реакторов, быстрых конвейеров и модулей уровня II.
item.eclipse-pressure-casing.name = Корпус под давлением
item.eclipse-pressure-casing.description = Герметичная оболочка сосуда из титана и метастекла. Нужна химическим реакторам, колоннам и котлам.
item.eclipse-industrial-bearing.name = Промышленный подшипник
item.eclipse-industrial-bearing.description = Прецизионные подшипники для турбин, буров, компрессоров и другого быстроходного оборудования.
item.eclipse-superalloy-frame.name = Рама из суперсплава
item.eclipse-superalloy-frame.description = Горячеформованная рама из суперсплава для тяжёлого, горячего и высоконапорного оборудования.
item.eclipse-precision-component.name = Прецизионный компонент
item.eclipse-precision-component.description = Точные механические и электронные узлы для умной логистики, электроники и модулей уровня III.
item.eclipse-experimental-core.name = Экспериментальное ядро
item.eclipse-experimental-core.description = Импульсный суперсплав, платина и фазовая ткань вокруг прецизионных деталей. Сердце механизмов финальной стадии и модулей уровня IV.
block.eclipse-gear-press.name = Пресс для шестерён
block.eclipse-gear-press.description = Прессует металл в шестерни. Выберите, что делать: медные шестерни (энергия уровня I), титановые шестерни (уровень II) или шестерни из суперсплава (уровень III).
block.eclipse-extruder.name = Экструдер
block.eclipse-extruder.description = Продавливает металл через фильеру в прутки и проволоку. Выберите, что делать: медная проволока (энергия уровня I), титановые прутки (уровень II, графит в качестве смазки), вольфрамовые прутки, алюминиевая проволока или обмоточная проволока с эпоксидной эмалью (уровень III).
block.eclipse-metal-press.name = Пресс для металла
block.eclipse-metal-press.description = Прокатный стан: прокатывает металл в пластины, а пластины — в фольгу. Медные и свинцовые пластины и медная фольга требуют энергии уровня I, титановые пластины — уровня II, алюминиевые, суперсплавные и вольфрамовые пластины и алюминиевая фольга — уровня III.
block.eclipse-lathe.name = Токарный станок
block.eclipse-lathe.description = Точит титановые прутки в мелкие детали: болты, винты (резьбовые болты), кольца и пружины. Энергия уровня II.
block.eclipse-assembler.name = Сборочный станок
block.eclipse-assembler.description = Соединяет детали и компоненты механизмов. Выберите, что делать: двигатели, насосные блоки, поршни, роторы, нагревательные катушки, датчики и излучатели, либо корпуса под давлением, промышленные подшипники, прецизионные компоненты, свинцово-кислотные элементы и топливные стержни.
block.eclipse-experimental-core-assembler.name = Сборочный станок экспериментальных ядер
block.eclipse-experimental-core-assembler.description = Собирает экспериментальные ядра из прецизионных компонентов, импульсного суперсплава, платины и фазовой ткани.

block.eclipse-component-depot.name = Склад компонентов
block.eclipse-component-depot.description = Хранит только механические компоненты, детали и обработанный металл (пластины, прутки, проволока, болты...), чтобы они оставались рядом со своими производственными линиями. Поддерживает в ядре запас до 200 каждого компонента из любой точки карты, чтобы вы всегда могли строить с ними. Никогда не объединяется с ядром.
stat.eclipse-core-reserve = Резерв ядра
stat.eclipse-core-reserve-value = Хранит до {0} каждого компонента в ядре
setting.eclipse-compact-core.name = Компактное отображение ядра

item.eclipse-copper-plate.name = Медная пластина
item.eclipse-copper-plate.description = Прокатанный медный лист. Дальше прокатывается в медную фольгу; используется в ранних химических машинах.
item.eclipse-lead-plate.name = Свинцовая пластина
item.eclipse-lead-plate.description = Прокатанный свинцовый лист. Пластины свинцово-кислотных элементов и облицовка кислотных установок.
item.eclipse-titanium-plate.name = Титановая пластина
item.eclipse-titanium-plate.description = Прокатанный титановый лист. Оболочка корпусов под давлением и реакторов.
item.eclipse-aluminium-plate.name = Алюминиевая пластина
item.eclipse-aluminium-plate.description = Прокатанный алюминиевый лист. Рёбра теплообменников; дальше прокатывается в алюминиевую фольгу.
item.eclipse-superalloy-plate.name = Пластина из суперсплава
item.eclipse-superalloy-plate.description = Прокатанный лист суперсплава для горячего тяжёлого оборудования.
item.eclipse-tungsten-plate.name = Вольфрамовая пластина
item.eclipse-tungsten-plate.description = Прокатанный вольфрамовый лист. Плотная броня и радиационная защита.
item.eclipse-copper-foil.name = Медная фольга
item.eclipse-copper-foil.description = Тонкий медный лист. Покрывает печатные платы и собирает ток в литиевых батареях.
item.eclipse-aluminium-foil.name = Алюминиевая фольга
item.eclipse-aluminium-foil.description = Тонкий алюминиевый лист для конденсаторов и литиевых батарей.
item.eclipse-tungsten-rod.name = Вольфрамовый пруток
item.eclipse-tungsten-rod.description = Экструдированный вольфрам. Нагревательные элементы и дуговые электроды.
item.eclipse-aluminium-wire.name = Алюминиевая проволока
item.eclipse-aluminium-wire.description = Лёгкая проводящая проволока для накопителей энергии и линий электропередачи.
item.eclipse-titanium-bolt.name = Титановый болт
item.eclipse-titanium-bolt.description = Обработанный на станке титановый болт. Им скрепляют механизмы.
item.eclipse-titanium-screw.name = Титановый винт
item.eclipse-titanium-screw.description = Мелкий резьбовой крепёж для прецизионных узлов.
item.eclipse-titanium-ring.name = Титановое кольцо
item.eclipse-titanium-ring.description = Обработанное кольцо: дорожки качения подшипников и фланцы.
item.eclipse-titanium-spring.name = Титановая пружина
item.eclipse-titanium-spring.description = Витовая пружина для ворот, заслонок и механизмов возврата.
item.eclipse-superalloy-gear.name = Шестерня из суперсплава
item.eclipse-superalloy-gear.description = Шестерня, сохраняющая прочность при высоких нагрузках и нагреве.
item.eclipse-magnet-wire.name = Обмоточная проволока
item.eclipse-magnet-wire.description = Медная проволока, покрытая эпоксидной эмалью. Обмотки двигателей и генераторов.
item.eclipse-resistor.name = Резистор
item.eclipse-resistor.description = Маленький графитовый резистор. Устанавливается на печатные платы и в датчики.
item.eclipse-capacitor.name = Конденсатор
item.eclipse-capacitor.description = Электролитический конденсатор: алюминиевая фольга, свёрнутая с полиэтиленовым сепаратором.
item.eclipse-transistor.name = Транзистор
item.eclipse-transistor.description = Кремниевый переключатель. Устанавливается на печатные платы, в датчики и излучатели.
item.eclipse-insulated-cable.name = Изолированный кабель
item.eclipse-insulated-cable.description = Медная проволока в синтетическом каучуке. Безопасно проводит большой ток.
item.eclipse-electric-motor.name = Электродвигатель
item.eclipse-electric-motor.description = Электродвигатель с обмоткой. Приводит в движение насосы, поршни и блоки управления.
item.eclipse-permanent-magnet-motor.name = Двигатель с постоянными магнитами
item.eclipse-permanent-magnet-motor.description = Компактный мощный двигатель с ротором из магнита AlNiCo.
item.eclipse-superconducting-motor.name = Сверхпроводящий двигатель
item.eclipse-superconducting-motor.description = Двигатель со сверхпроводящими обмотками, охлаждаемый жидким азотом.
item.eclipse-pump-unit.name = Насосный блок
item.eclipse-pump-unit.description = Электродвигатель, вращающий ротор в герметичном корпусе.
item.eclipse-piston.name = Поршень
item.eclipse-piston.description = Поршень с приводом от двигателя и пружиной возврата.
item.eclipse-rotor.name = Ротор
item.eclipse-rotor.description = Лопаточный ротор для вентиляторов, насосов и турбин.
item.eclipse-heating-coil.name = Нагревательная катушка
item.eclipse-heating-coil.description = Нагревательный элемент из вольфрама и молибдена.
item.eclipse-sensor.name = Датчик
item.eclipse-sensor.description = Транзистор, резисторы и кремний за линзой из армированного стекла.
item.eclipse-emitter.name = Излучатель
item.eclipse-emitter.description = Лазерный излучатель с резонатором, покрытым платиной.
item.eclipse-soda-ash.name = Кальцинированная сода
item.eclipse-soda-ash.description = Карбонат натрия: гидроксид натрия, карбонизированный уловленным углекислым газом. Флюс для натрий-известкового стекла и осадитель лития.
item.eclipse-petroleum-coke.name = Нефтяной кокс
item.eclipse-petroleum-coke.description = Тяжёлый остаток сырой нефти, подвергнутый коксованию. Графитизируется в графит, идёт на аноды алюминиевых элементов.
item.eclipse-magnesium.name = Магний
item.eclipse-magnesium.description = Лёгкий металл, извлекаемый из рассола. Восстанавливает хлорид титана до титана и интенсивно горит.
item.eclipse-bauxite.name = Бокситы
item.eclipse-bauxite.description = Алюминиевая руда. Перерабатывается в глинозём горячим гидроксидом натрия.
item.eclipse-red-mud.name = Красный шлам
item.eclipse-red-mud.description = Остаток переработки глинозёма: оксиды железа и титана. Уберите его или выплавьте из него титан.
item.eclipse-pentlandite.name = Пентландит
item.eclipse-pentlandite.description = Сульфид никеля и железа, основная никелевая руда. Реальные никелевые руды содержат кобальт и металлы платиновой группы. Перерабатывается в никель.
item.eclipse-chromite.name = Хромит
item.eclipse-chromite.description = Оксид хрома и железа, единственная руда хрома. Перерабатывается в хром.
item.eclipse-cobaltite.name = Кобальтит
item.eclipse-cobaltite.description = Сульфоарсенид кобальта, кобальтовая руда с содержанием никеля. Перерабатывается в кобальт.
item.eclipse-wolframite.name = Вольфрамит
item.eclipse-wolframite.description = Вольфрамат железа и марганца, основная руда вольфрама. Часто встречается вместе с молибденом. Перерабатывается в вольфрам.
item.eclipse-molybdenite.name = Молибденит
item.eclipse-molybdenite.description = Дисульфид молибдена, руда молибдена. Перерабатывается в молибден.
item.eclipse-sperrylite.name = Сперрилит
item.eclipse-sperrylite.description = Арсенид платины, платиновая руда, встречающаяся в никелевых месторождениях. Перерабатывается в платину.
item.eclipse-copper-wire.name = Медная проволока
item.eclipse-copper-wire.description = Волочёная медная проволока. Используется в электрооборудовании, нагревателях и батареях.
item.eclipse-circuit-board.name = Печатная плата
item.eclipse-circuit-board.description = Медные дорожки на полиэтиленовой плате. Используется в блоках управления, умной логистике и интерфейсах улучшений.
item.eclipse-control-unit.name = Блок управления
item.eclipse-control-unit.description = Микросхемный контроллер с приводом двигателя. Автоматизирует продвинутые буры, умную логистику, реакторы и сборочные станки.
item.eclipse-alnico-magnet.name = Магнит AlNiCo
item.eclipse-alnico-magnet.description = Постоянный магнит из алюминия, никеля и кобальта. Используется в двигателях, турбинах и магнитном удержании.
item.eclipse-crushed-ore.name = Дроблёная руда
item.eclipse-crushed-ore.description = Раздробленный лом и порода. Промывается в металлы в промывателе руды.
liquid.eclipse-chilled-water.name = Охлаждённая вода
liquid.eclipse-chilled-water.description = Вода, охлаждённая испарением. Дешёвый хладагент для турелей и соединителей улучшений: лучше воды, но хуже криофлюида.
block.eclipse-circuit-assembler.name = Сборочный станок плат
block.eclipse-circuit-assembler.description = Собирает все платы и их компоненты. Выберите, что делать: резисторы (уровень II), конденсаторы, транзисторы, изолированный кабель и печатные платы (уровень III; платы травятся соляной кислотой, а отработанная кислота уходит в виде кислотных отходов) или блоки управления (уровень IV).
block.eclipse-ore-crusher.name = Дробилка руды
block.eclipse-ore-crusher.description = Дробит лом в дроблёную руду и песок, а также дробит и сортирует рудные минералы, извлекая из них металл (1 металл из руды — самый простой путь).
block.eclipse-ore-washer.name = Промыватель руды
block.eclipse-ore-washer.description = Промывает дроблёную руду водой и разделяет металлы по плотности: никель, хром, кобальт, молибден, ванадий, вольфрам, немного платины и, изредка, эфирит.
block.eclipse-thermal-storage.name = Теплоаккумулятор
block.eclipse-thermal-storage.description = Пропускает тепло, как теплообменник, и накапливает его. Когда нагреватели останавливаются, продолжает отдавать тепло, пока не опустошится.
block.eclipse-cooling-tower.name = Охлаждающая башня
block.eclipse-cooling-tower.description = Охлаждает воду испарением, превращая её в охлаждённую воду — дешёвый хладагент. Часть воды теряется в воздух.
stat.eclipse-heat-capacity = Ёмкость тепла
stat.eclipse-heat-capacity-value = {0} теплосекунд, отдача до {1} тепла
bar.eclipse-stored-heat = Накопленное тепло: {0}

block.eclipse-methane-pyrolysis-reactor.name = Реактор пиролиза метана
block.eclipse-methane-pyrolysis-reactor.description = Разлагает метан на графит и водород с помощью тепла. Графит без угля и с избытком водорода.

block.eclipse-wave-intelligence-scanner.name = Сканер анализа волн
block.eclipse-wave-intelligence-scanner.description = Пока получает энергию, анализирует следующую вражескую волну: типы юнитов, количество, щиты и боссов, а также оставшееся время. Нажмите на него, чтобы увидеть отчёт. Чтобы вывести волну на экраны, выберите сканер и нажмите до 4 логических экранов в радиусе 12 тайлов. Только информация: волна никогда не изменяется.
block.eclipse-wave-disruption-array.name = Массив подавления волн
block.eclipse-wave-disruption-array.description = После полной зарядки нажмите и активируйте, чтобы задержать приближающуюся волну на 20 секунд. Только до прибытия волны и только на картах с таймером волн. Все массивы используют общую блокировку на 2 волны, поэтому задержки не складываются.
block.eclipse-unit-shield-beacon.name = Маяк щитов юнитов
block.eclipse-unit-shield-beacon.description = Создаёт поле, защищающее союзных юнитов (не здания) из общего ограниченного запаса. Восполняет щит каждому юниту до 80 и забирает его обратно, когда юнит покидает поле. Перезаряжается от энергии, медленнее, пока по полю ведут огонь.
block.eclipse-emergency-repair-dispatch-bay.name = Пункт экстренного ремонта
block.eclipse-emergency-repair-dispatch-bay.description = Быстро чинит выбранное союзное здание, используя титановые прутки как запас для ремонта. Выберите пункт, затем нажмите на здание, которое нужно обслужить; нажмите на пункт снова, чтобы сбросить цель. Никогда не чинит площадь и ничего не строит.
stat.eclipse-wave-delay = Задержка волны
stat.eclipse-wave-delay-value = +{0} с за активацию, затем блокировка на {1} волн (общая для всех массивов)
stat.eclipse-shield-pool = Поле щита
stat.eclipse-shield-pool-value = Запас {0}, до {1} щита на юнит, перезарядка {2}/с
