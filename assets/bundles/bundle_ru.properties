# ---- ECLIPSE settings (EclipseSettings, EclipseSettingsDialog) ----
setting.eclipse-compact-core.description = Скрывать промежуточные продукты (шестерни, пластины, горячие металлы) из списка предметов ядра.
setting.eclipse-machine-status.name = Строка состояния машины
