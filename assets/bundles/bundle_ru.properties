item.eclipse-sulfur.name = Сера
item.eclipse-sulfur.description = Извлекается из сырой нефти при перегонке. Сжигается с кислородом для получения серной кислоты. Также идёт на едкие снаряды для «Града» и «Ряби», разъедающие броню противника.
item.eclipse-polyethylene.name = Полиэтилен
item.eclipse-polyethylene.description = Прочный, химически стойкий пластик из этилена. Используется для корпусов и оборудования, устойчивого к коррозии.
item.eclipse-lead-acid-cell.name = Свинцово-кислотный элемент
item.eclipse-lead-acid-cell.description = Перезаряжаемый элемент со свинцовыми пластинами в серной кислоте, запаянный в полиэтиленовый корпус. Основа промышленных систем накопления энергии.

liquid.eclipse-purified-water.name = Очищенная вода
liquid.eclipse-purified-water.description = Вода, лишённая минералов. Требуется для электролиза и других чувствительных химических процессов. Немного лучший теплоноситель, чем обычная вода.
liquid.eclipse-brine.name = Рассол
liquid.eclipse-brine.description = Концентрированная солёная вода, остающаяся после очистки. Сырьё для хлорно-щелочного процесса.
liquid.eclipse-hydrochloric-acid.name = Соляная кислота
liquid.eclipse-hydrochloric-acid.description = Сильная кислота. Растворяет металлы из лома. Разъедает юниты. [scarlet]Разъедает обычные жидкостные блоки; используйте полимерные кондуиты и баки.[]
liquid.eclipse-oxygen.name = Кислород
liquid.eclipse-oxygen.description = Окислительный газ, получаемый электролизом. Используется в топливных элементах и при производстве серной кислоты.
liquid.eclipse-chlorine.name = Хлор
liquid.eclipse-chlorine.description = Ядовитый, коррозионный газ, получаемый из рассола. Соединяется с водородом с образованием соляной кислоты. [scarlet]Разъедает обычные жидкостные блоки; используйте полимерные кондуиты и баки.[]
liquid.eclipse-methane.name = Метан
liquid.eclipse-methane.description = Лёгкий топливный газ, выделяющийся из сырой нефти. Сжигается для выработки энергии или промышленного тепла.
liquid.eclipse-diesel.name = Дизельное топливо
liquid.eclipse-diesel.description = Средний дистиллят сырой нефти. Горючее во взрывчатке ANFO и растворитель-носитель при переработке топлива.
liquid.eclipse-argon.name = Аргон
liquid.eclipse-argon.description = Инертный газ, около 1% воздуха. Защищает электрические дуги.
liquid.eclipse-heavy-water.name = Тяжёлая вода
liquid.eclipse-heavy-water.description = Вода с дейтерием — более тяжёлым водородом. Концентрируется длительным электролизом, затем подвергается электролизу снова для получения дейтерия.
liquid.eclipse-deuterium.name = Дейтерий
liquid.eclipse-deuterium.description = Тяжёлый водород: топливо Термоядерного реактора. Горюч.
liquid.eclipse-liquid-sodium.name = Жидкий натрий
liquid.eclipse-liquid-sodium.description = Расплавленный металлический натрий. Охлаждает реактор-размножитель, не замедляя его быстрые нейтроны. Горит на воздухе.
liquid.eclipse-naphtha.name = Нафта
liquid.eclipse-naphtha.description = Лёгкая фракция нефти. При крекинге паром и нагревом превращается в этилен.
liquid.eclipse-ethylene.name = Этилен
liquid.eclipse-ethylene.description = Важнейший исходный продукт химии полимеров.
liquid.eclipse-sulfuric-acid.name = Серная кислота
liquid.eclipse-sulfuric-acid.description = Основа тяжёлой химии. Используется как электролит в аккумуляторах. Разъедает юниты. [scarlet]Разъедает обычные жидкостные блоки; используйте полимерные кондуиты и баки.[]
liquid.eclipse-sodium-hydroxide.name = Гидроксид натрия
liquid.eclipse-sodium-hydroxide.description = Сильное основание из хлорно-щелочного процесса. Нейтрализует кислотные отходы. [scarlet]Разъедает обычные жидкостные блоки; используйте полимерные кондуиты и баки.[]
liquid.eclipse-acidic-waste.name = Кислотные отходы
liquid.eclipse-acidic-waste.description = Отработанная кислота после выщелачивания металлов. Требует нейтрализации, иначе скапливается и останавливает производство. [scarlet]Разъедает обычные жидкостные блоки; используйте полимерные кондуиты и баки.[]

block.eclipse-water-treatment-plant.name = Водоочистная станция
block.eclipse-water-treatment-plant.description = Фильтрует воду в очищенную. Отвергнутые соли выходят в виде рассола.\nОчищенная вода выходит слева, рассол — справа.
block.eclipse-acid-leaching-vat.name = Чан кислотного выщелачивания
block.eclipse-acid-leaching-vat.description = Растворяет лом в соляной кислоте и извлекает титан, медь и свинец. Образует кислотные отходы, которые нужно отводить.
block.eclipse-distillation-column.name = Дистилляционная колонна
block.eclipse-distillation-column.description = Разделяет сырую нефть на фракции и коксует остаток в нефтяной кокс. Извлекает серу из сероводородного газа.\nНафта выходит слева, метан — справа, дизельное топливо — спереди.
block.eclipse-steam-cracker.name = Паровой крекер
block.eclipse-steam-cracker.description = Крекет нафту в этилен с помощью пара. Требует тепла от соседних нагревателей.
block.eclipse-sulfuric-acid-plant.name = Завод серной кислоты
block.eclipse-hydrogen-fuel-cell.name = Водородный топливный элемент
block.eclipse-hydrogen-fuel-cell.description = Соединяет водород и кислород для выработки энергии. Побочный продукт — очищенная вода.
block.eclipse-methane-turbine.name = Метановая турбина
block.eclipse-methane-turbine.description = Сжигает метан, вырабатывая много энергии. Выход — дымовые газы; отведите их в скруббер или газосепаратор, иначе они сбрасываются в атмосферу.
block.eclipse-industrial-battery.name = Промышленный аккумулятор
block.eclipse-industrial-battery.description = Батарея свинцово-кислотных элементов. Хранит гораздо больше энергии на клетку, чем большой аккумулятор.
block.eclipse-industrial-heater.name = Промышленный нагреватель
block.eclipse-industrial-heater.description = Сжигает метан для получения тепла. Выдаёт тепло в сторону, куда повёрнут. Выход — дымовые газы; отведите их, чтобы использовать, иначе они сбрасываются в атмосферу.

item.eclipse-polymer-catalyst.name = Полимерный катализатор
item.eclipse-polymer-catalyst.description = Катализатор на основе хлорида титана (Циглера — Натта). Обеспечивает полимеризацию и расходуется очень медленно.
item.eclipse-ammonium-nitrate.name = Нитрат аммония
item.eclipse-ammonium-nitrate.description = Мощный окислитель. В смеси с углём образует взрывчатый состав. Сильно взрывоопасен.
liquid.eclipse-ammonia.name = Аммиак
liquid.eclipse-ammonia.description = Резко пахнущий газ, синтезируемый из азота и водорода под высоким давлением. Основа химии азота.
liquid.eclipse-nitric-acid.name = Азотная кислота
liquid.eclipse-nitric-acid.description = Сильная окислительная кислота из аммиака. Используется для получения нитратов. [scarlet]Разъедает обычные жидкостные блоки; используйте полимерные кондуиты и баки.[]

block.eclipse-air-separation-unit.name = Воздухоразделительная установка
block.eclipse-air-separation-unit.description = Сжижает воздух при криогенном охлаждении и разделяет его на азот, кислород и аргон.\nАзот выходит слева, кислород — справа, аргон — спереди.

stat.eclipse-catalyst = Катализатор
stat.eclipse-catalyst-life = (1 шт. на {0} крафтов)
stat.eclipse-pressure = Рабочее давление
stat.eclipse-pressure-value = {0}% (достигается за {1} с на полной мощности)
bar.eclipse-pressure = Давление: {0}%

block.eclipse-polymer-conduit.name = Полимерный кондуит
block.eclipse-polymer-conduit.description = Кондуит с полиэтиленовой облицовкой. Не боится агрессивных химикатов, которые разъедают обычные кондуиты.
block.eclipse-polymer-liquid-router.name = Полимерный жидкостный маршрутизатор
block.eclipse-polymer-liquid-router.description = Устойчивый к коррозии жидкостный маршрутизатор.
block.eclipse-polymer-bridge-conduit.name = Полимерный мостовой кондуит
block.eclipse-polymer-bridge-conduit.description = Устойчивый к коррозии мостовой кондуит.
block.eclipse-polymer-liquid-tank.name = Полимерный жидкостный бак
block.eclipse-polymer-liquid-tank.description = Большой бак, устойчивый к коррозии. Безопасно хранит кислоты, хлор и химические отходы.

stat.eclipse-corrosive = Коррозионный

item.eclipse-nickel.name = Никель
item.eclipse-nickel.description = Прочный, устойчивый к коррозии металл. Основа суперсплавов.
item.eclipse-chromium.name = Хром
item.eclipse-chromium.description = Твёрдый металл, защищающий сплавы от нагрева и окисления.
item.eclipse-cobalt.name = Кобальт
item.eclipse-cobalt.description = Плотный металл, сохраняющий прочность сплавов при высокой температуре.
item.eclipse-lithium.name = Литий
item.eclipse-lithium.description = Лёгкий реактивный металл, извлекаемый из рассола. Используется в ёмких аккумуляторах.
item.eclipse-superalloy.name = Суперсплав
item.eclipse-superalloy.description = Сплав никеля, хрома и кобальта, сохраняющий прочность при экстремальной жаре.

block.eclipse-ore-nickel.name = Никелевая руда
block.eclipse-flotation-cell.name = Флотационная ячейка
block.eclipse-flotation-cell.description = Перемалывает руду в воде и поднимает ценный минерал пеной: 1.5 металла из руды плюс побочные продукты, характерные для реальных месторождений. Уровень II.
block.eclipse-ore-bauxite.name = Боксит
block.eclipse-tide-reef-sand.name = Рифовый песок
block.eclipse-tide-black-sand.name = Чёрный песок
block.eclipse-tide-coral.name = Коралловое ложе
block.eclipse-tide-barnacle-rock.name = Скала с ракушками
block.eclipse-tide-lagoon.name = Вода лагуны
block.eclipse-tide-abyss.name = Абиссальная вода
block.eclipse-tide-reef-water.name = Мелководная рифовая вода
block.eclipse-tide-black-sand-water.name = Мелководная вода чёрного песка
block.eclipse-tide-sandstone-wall.name = Песчаниковый обрыв
block.eclipse-tide-basalt-wall.name = Базальтовые колонны
block.eclipse-tide-coral-wall.name = Коралловый риф
block.eclipse-tide-palm.name = Пальма
block.eclipse-tide-shell.name = Морская ракушка
block.eclipse-hive-creep.name = Нарост
block.eclipse-hive-brood-moss.name = Выводковый мох
block.eclipse-hive-spore-sand.name = Споровый песок
block.eclipse-hive-chitin.name = Хитиновая осыпь
block.eclipse-hive-bile.name = Жёлчь
block.eclipse-hive-bile-shallows.name = Жёлчные отмели
block.eclipse-hive-flesh-wall.name = Смола улья
block.eclipse-hive-chitin-wall.name = Панцирный хребет
block.eclipse-hive-stalk.name = Грибной стебель
block.eclipse-hive-pod.name = Яйцевая капсула
block.eclipse-ironhold-ash.name = Пепел
block.eclipse-ironhold-scorched-rock.name = Опалённая скала
block.eclipse-ironhold-plating.name = Крепостная обшивка
block.eclipse-ironhold-sludge.name = Шлам
block.eclipse-ironhold-sludge-shallows.name = Шламовые отмели
block.eclipse-ironhold-slag-wall.name = Шлаковый обрыв
block.eclipse-ironhold-scrap-wall.name = Груда обломков
block.eclipse-ironhold-scrap.name = Глыба лома
block.eclipse-tide-oil-seep.name = Нефтяной выход
block.eclipse-tide-vent-rock.name = Скала-жерло
block.eclipse-tide-vent.name = Чёрный курильщик
block.eclipse-tide-sunken-plating.name = Обшивка затонувшего корпуса
block.eclipse-tide-sunken-panel.name = Панель затонувшего корпуса
block.eclipse-tide-wreck-wall.name = Обломки корпуса
block.eclipse-hive-resin.name = Смоляная лужа
block.eclipse-hive-fever-flesh.name = Лихорадочная плоть
block.eclipse-hive-heart.name = Пылающее сердце
block.eclipse-hive-overgrown-plating.name = Заросшая обшивка
block.eclipse-hive-overgrown-panel.name = Заросшая панель
block.eclipse-hive-engulfed-wall.name = Поглощённые обломки
block.eclipse-ironhold-tar.name = Битум
block.eclipse-ironhold-cinder.name = Шлаковая корка
block.eclipse-ironhold-magma.name = Магма
block.eclipse-ironhold-dark-plating.name = Тёмная крепостная обшивка
block.eclipse-ironhold-bulwark-wall.name = Бастионная броня
block.eclipse-ore-chromium.name = Хромовая руда
block.eclipse-ore-cobalt.name = Кобальтовая руда
block.eclipse-ore-tungsten.name = Вольфрамовая руда

block.eclipse-mineral-separator.name = Минеральный сепаратор
block.eclipse-mineral-separator.description = Выщелачивает расплавленный шлак серной кислотой и отделяет содержащиеся в нём ванадий и хром, как это делают с реальным сталелитейным шлаком. Работает на любой карте со шлаком.
block.eclipse-lithium-extractor.name = Литиевый экстрактор
block.eclipse-lithium-extractor.description = Осаждает карбонат лития из рассола с помощью кальцинированной соды.
block.eclipse-carbide-drill.name = Карбидный бур
block.eclipse-carbide-drill.description = Бур с вольфрамокарбидными коронками. Добывает больше, чем крупный пневмобур, и твёрдые руды замедляют его вдвое меньше. Можно ускорить водой.
block.eclipse-lithium-battery.name = Литиевый аккумулятор
block.eclipse-lithium-battery.description = Батарея литиевых аккумуляторов высокой плотности. Хранит вдвое больше энергии, чем промышленный аккумулятор.
block.eclipse-superalloy-wall.name = Стена из суперсплава
block.eclipse-superalloy-wall.description = Очень прочная стена, которая к тому же поглощает лазеры.
block.eclipse-superalloy-wall-large.name = Большая стена из суперсплава
block.eclipse-superalloy-wall-large.description = Очень прочная стена, которая к тому же поглощает лазеры.\nЗанимает несколько клеток.

item.eclipse-alumina.name = Глинозём
item.eclipse-alumina.description = Оксид алюминия, рафинированный из бокситов горячим гидроксидом натрия. Электролизом превращается в алюминий.
item.eclipse-aluminium.name = Алюминий
item.eclipse-aluminium.description = Лёгкий металл с высокой проводимостью. Используется в теплообменниках и турбинах.
item.eclipse-high-purity-silicon.name = Кремний высокой чистоты
item.eclipse-high-purity-silicon.description = Кремний, очищенный соляной кислотой и водородом до полупроводниковой чистоты.
item.eclipse-microchip.name = Микросхема
item.eclipse-microchip.description = Интегральные схемы, травленные на кремнии высокой чистоты. Управляющая электроника для сложных машин.
item.eclipse-reinforced-glass.name = Армированное стекло
item.eclipse-reinforced-glass.description = Метастекло, сплавленное с титановой сеткой. Выдерживает высокое давление и сильный холод.
item.eclipse-hot-superalloy.name = Горячий суперсплав
item.eclipse-hot-superalloy.description = Суперсплав прямо из доменной печи, ещё светится. Перед использованием охладите его в вакуумном охладителе.
item.eclipse-hot-tungsten-carbide.name = Горячий карбид вольфрама
item.eclipse-hot-tungsten-carbide.description = Карбид вольфрама прямо из печи спекания. Перед использованием охладите его в вакуумном охладителе.
item.eclipse-hot-aluminium.name = Горячий алюминий
item.eclipse-hot-aluminium.description = Алюминий прямо из электролизной ванны плавильни. Перед использованием охладите его в вакуумном охладителе.
item.eclipse-hot-surge-superalloy.name = Горячий импульсный суперсплав
item.eclipse-hot-surge-superalloy.description = Импульсный суперсплав прямо из электрической печи, ещё потрескивает. Перед использованием охладите его в вакуумном охладителе.
item.eclipse-hot-titanium.name = Горячий титан
item.eclipse-hot-titanium.description = Титановая губка прямо с завода хлоридного титана. Перед использованием охладите её в вакуумном охладителе.
item.eclipse-hot-silicon.name = Горячий кремний
item.eclipse-hot-silicon.description = Кремний прямо из электрической дуги. Перед использованием охладите его в вакуумном охладителе.
item.eclipse-hot-metaglass.name = Горячее метастекло
item.eclipse-hot-metaglass.description = Натрово-известковое стекло прямо из доменной печи. Перед использованием охладите его в вакуумном охладителе.
item.eclipse-hot-reinforced-glass.name = Горячее армированное стекло
item.eclipse-hot-reinforced-glass.description = Армированное стекло прямо из стекольной печи. Перед использованием охладите его в вакуумном охладителе.
item.eclipse-surge-superalloy.name = Импульсный суперсплав
item.eclipse-surge-superalloy.description = Импульсный сплав, связанный в матрицу суперсплава электрической дугой. Очень прочен и всё ещё потрескивает от накопленного заряда.
liquid.eclipse-steam.name = Пар
liquid.eclipse-steam.description = Горячий водяной пар, получаемый в котле. Приводит в движение паровые турбины.
liquid.eclipse-liquid-nitrogen.name = Жидкий азот
liquid.eclipse-liquid-nitrogen.description = Азот, сконденсированный в жидкость. Самый эффективный охладитель турелей, холоднее криофлюида. Замораживает юниты.

block.eclipse-heat-exchanger.name = Теплообменник
block.eclipse-heat-exchanger.description = Собирает тепло сзади и с боков и отдаёт его вперёд. Используйте его, чтобы отводить отработанное тепло экзотермических процессов.
block.eclipse-industrial-boiler.name = Промышленный котёл
block.eclipse-industrial-boiler.description = Превращает очищенную воду в пар с помощью тепла. Чем больше тепла, тем больше пара.
block.eclipse-steam-turbine.name = Паровая турбина
block.eclipse-steam-turbine.description = Вырабатывает энергию из пара и возвращает большую часть воды в виде очищенной воды.
block.eclipse-combined-cycle-turbine.name = Парогазовая турбина
block.eclipse-combined-cycle-turbine.description = Большая газовая турбина: больше энергии из метана, чем у метановой турбины. Горячие выхлопные газы также отдают тепло вперёд — поставьте там промышленный котёл для ещё большей выработки. Отведите дымовые газы по трубе, иначе они сбрасываются в атмосферу.
block.eclipse-solar-farm.name = Солнечная ферма
block.eclipse-solar-farm.description = Поле из высокочистых кремниевых элементов: энергия без топлива, примерно четыре большие солнечные панели на меньшей площади. Слабее на тёмных картах.
block.eclipse-sulfuric-acid-plant.description = Сжигает серу в кислороде и поглощает газ водой для получения серной кислоты.\nРеакция выделяет отходящее тепло вперёд; утилизируйте его теплообменником и котлом.
block.eclipse-alumina-refinery.name = Рафинерия глинозёма
block.eclipse-alumina-refinery.description = Растворяет бокситы в горячем гидроксиде натрия и осаждает глинозём (процесс Байера). Остаток выходит в виде красного шлама, который нужно вывозить. Требует тепла.
block.eclipse-blast-furnace.name = Доменная печь
block.eclipse-blast-furnace.description = Плавит и формует в горячем состоянии с помощью тепла от соседних нагревателей: горячий суперсплав, каркасы из суперсплава, титан по Кроллю (с магнием в аргоне), известково-содовое стекло (песок с содой) и армированное стекло. Каждый рецепт останавливается при недостаточном нагреве.
block.eclipse-electric-furnace.name = Электрическая печь
block.eclipse-electric-furnace.description = Плавит и спекает только электричеством: магниты AlNiCo (индукция), горячий карбид вольфрама (спекание с кобальтовым связующим), кремний (песок, восстановленный графитом в дуге; CO2 сбрасывается в атмосферу или отводится по трубе), графит из нефтяного кокса, алюминий из переплавленного лома, титан из красного шлама и горячий импульсный суперсплав (электрическая дуга в аргоне).
block.eclipse-pressure-reactor.name = Реактор давления
block.eclipse-pressure-reactor.description = Каталитический синтез и синтез под высоким давлением: аммиак и метанол (сначала под давлением), олефины (пропилен слева, сточные воды справа), азотная кислота (платиновый катализатор), акрилонитрил (молибденовый катализатор), полиэтилен и синтетический каучук (полимерный катализатор). Катализаторы изнашиваются медленно. Энергия III уровня.
block.eclipse-chemical-reactor.name = Химический реактор
block.eclipse-chemical-reactor.description = Химия малыми партиями. Выберите реакцию: соляная кислота, нейтрализация кислотных отходов в рассол, сода, очистка дымовых газов (уровень II), пиратит, царская водка, нитрат аммония, удобрения, полимерный катализатор, эпоксидная смола или взрывчатая смесь (ANFO, с дизельным топливом) (уровень III).
block.eclipse-electrolyzer.name = Электролизёр
block.eclipse-electrolyzer.description = Разлагает электричеством. Воду на водород (слева) и кислород (справа); рассол на хлор (слева), водород (справа) и гидроксид натрия (вперёд); длительный электролиз воды на тяжёлую воду (вперёд); тяжёлую воду на дейтерий (слева) и кислород (справа); рассол на жидкий натрий (слева) и хлор (справа); глинозём в горячий алюминий; магний из рассола; рудные минералы, выщелоченные серной кислотой и выделенные электролизом (2 металла на руду, с побочными продуктами); лом в серной кислоте на медь и свинец, оставляя кислотные отходы. Поверните, чтобы направить выход газов.
block.eclipse-vacuum-freezer.name = Вакуумный охладитель
block.eclipse-vacuum-freezer.description = Охлаждает горячий металл и стекло из печей ECLIPSE криофлюидом, чтобы их можно было использовать. Без выбранного рецепта охлаждает всё, что поступает. Титан, кремний и стекло требуют энергии II уровня, суперсплав, карбид вольфрама и алюминий — III, импульсный суперсплав — V.
block.eclipse-surge-superalloy-wall.name = Стена из импульсного суперсплава
block.eclipse-surge-superalloy-wall.description = Очень прочная стена, поглощающая лазеры и бьющая электрическими разрядами по атакующим.
block.eclipse-surge-superalloy-wall-large.name = Большая стена из импульсного суперсплава
block.eclipse-surge-superalloy-wall-large.description = Очень прочная стена, поглощающая лазеры и бьющая электрическими разрядами по атакующим.\nЗанимает несколько клеток.
block.eclipse-cryogenic-condenser.name = Криогенный конденсатор
block.eclipse-cryogenic-condenser.description = Сжижает газообразный азот в жидкий с помощью криогенного охлаждения.
block.eclipse-silicon-refinery.name = Рафинерия кремния
block.eclipse-silicon-refinery.description = Очищает кремний до полупроводниковой чистоты соляной кислотой и водородом.
block.eclipse-chip-fabricator.name = Изготовитель чипов
block.eclipse-chip-fabricator.description = Травит высокочистый кремний и формирует в нём транзисторы, упаковывая в полиэтилен: одна микросхема за цикл.

item.eclipse-molybdenum.name = Молибден
item.eclipse-molybdenum.description = Тугоплавкий металл с очень высокой точкой плавления. Его силицид служит отличным нагревательным элементом.
item.eclipse-vanadium.name = Ванадий
item.eclipse-vanadium.description = Металл, извлекаемый из шлака. Четыре степени окисления делают его идеальным для проточных редокс-батарей.
item.eclipse-platinum.name = Платина
item.eclipse-platinum.description = Редкий инертный драгоценный металл. Превосходный катализатор.
item.eclipse-thorium-fuel-rod.name = Топливный стержень с торием
item.eclipse-thorium-fuel-rod.description = Таблетки тория, герметизированные в оболочке из суперсплава. Топливо для реактора деления. Радиоактивно.
item.eclipse-spent-fuel-rod.name = Отработанный топливный стержень
item.eclipse-spent-fuel-rod.description = Истощённый топливный стержень. Переработайте его азотной кислотой, чтобы извлечь торий. Радиоактивно.
liquid.eclipse-aqua-regia.name = Царская водка
liquid.eclipse-aqua-regia.description = Смесь соляной и азотной кислот, единственная кислота, растворяющая платину. [scarlet]Разъедает обычные жидкостные блоки; используйте полимерные трубы и резервуары.[]

block.eclipse-ore-molybdenum.name = Молибденовая руда
block.eclipse-ore-platinum.name = Платиновая руда

block.eclipse-platinum-refinery.name = Рафинерия платины
block.eclipse-platinum-refinery.description = Растворяет следы платины из лома царской водкой. Образует кислотные отходы.
block.eclipse-electric-heater.name = Электрический нагреватель
block.eclipse-electric-heater.description = Преобразует энергию в тепло с помощью элементов из силицида молибдена. Выдаёт тепло в сторону, куда обращён.
block.eclipse-flow-battery.name = Ванадиевая проточная батарея
block.eclipse-flow-battery.description = Накапливает энергию в резервуарах с ванадиевым электролитом. Крупнейшая доступная батарея.
block.eclipse-fission-reactor.name = Реактор деления
block.eclipse-fission-reactor.description = Сжигает топливные стержни с торием, выдавая огромное количество тепла вперёд. Сочетайте с промышленным котлом и паровыми турбинами.\nОставляет отработавшие топливные стержни.
block.eclipse-breeder-reactor.name = Реактор-размножитель
block.eclipse-breeder-reactor.description = Быстрый реактор с ториевым бланкетом: в 2.5 раза больше тепла, чем у реактора деления, и каждый стержень выходит двумя отработанными стержнями для переработки. Охлаждается жидким натрием. Направьте его на промышленный котёл.
block.eclipse-fusion-reactor.name = Термоядерный реактор
block.eclipse-fusion-reactor.description = Токамак. Синтезирует дейтерий с тритием, выращенным из лития; плазму удерживают сверхпроводящие магниты, охлаждаемые жидким азотом. Требует энергии для зажигания и медленно прогревается, затем выдаёт огромное количество энергии. Взрывается, если разрушить его во время работы.
block.eclipse-reprocessing-plant.name = Завод по переработке топлива
block.eclipse-reprocessing-plant.description = Растворяет отработавшие топливные стержни в азотной кислоте и извлекает торий растворителем в дизельном топливе (PUREX). Образует кислотные отходы.

stat.eclipse-catalyst-optional = (необязательно: скорость {0}x)

block.eclipse-aluminium-conveyor.name = Алюминиевый конвейер
block.eclipse-aluminium-conveyor.description = Лёгкая быстрая лента. Перемещает 20 предметов в секунду.
block.eclipse-chromium-conveyor.name = Хромовый конвейер
block.eclipse-chromium-conveyor.description = Закалённая лента. Перемещает 30 предметов в секунду.
block.eclipse-superalloy-conveyor.name = Конвейер из суперсплава
block.eclipse-superalloy-conveyor.description = Высокоскоростная лента. Перемещает 40 предметов в секунду.
block.eclipse-carbide-conveyor.name = Карбидный конвейер
block.eclipse-carbide-conveyor.description = Очень быстрая лента на роликах из карбида вольфрама. Перемещает 50 предметов в секунду.
block.eclipse-surge-conveyor.name = Импульсный конвейер
block.eclipse-surge-conveyor.description = Самая быстрая лента. Перемещает 60 предметов в секунду.\nВанильные перекрёстки, маршрутизаторы и мосты медленнее; где возможно, подключайте напрямую.
block.eclipse-aluminium-conduit.name = Алюминиевая труба
block.eclipse-aluminium-conduit.description = Труба большого сечения. Пропускает 3600 жидкости в секунду (плакированная труба: 3000). Устойчива к коррозии.
block.eclipse-chromium-conduit.name = Хромовая труба
block.eclipse-chromium-conduit.description = Пропускает 4200 жидкости в секунду. Устойчива к коррозии.
block.eclipse-superalloy-conduit.name = Труба из суперсплава
block.eclipse-superalloy-conduit.description = Пропускает 4800 жидкости в секунду. Устойчива к коррозии.
block.eclipse-carbide-conduit.name = Карбидная труба
block.eclipse-carbide-conduit.description = Пропускает 5400 жидкости в секунду. Устойчива к коррозии.
block.eclipse-surge-conduit.name = Импульсная труба
block.eclipse-surge-conduit.description = Труба с наибольшей пропускной способностью. Пропускает 6000 жидкости в секунду. Устойчива к коррозии.

block.eclipse-augmentation-coupler.name = Соединитель улучшений
block.eclipse-augmentation-coupler.description = Подключает один модуль улучшения к соседней машине, ванильной или ECLIPSE, не заменяя её.\nПодключается автоматически, если рядом всего одна машина; иначе коснитесь соединителя, затем машины, которую нужно улучшить.\nВставляйте модуль как обычный предмет. Разгрузчики могут вынуть его обратно.\nОдну машину может обслуживать несколько соединителей; дополнительные модули того же типа дают половину эффекта предыдущего.
block.eclipse-basic-module-assembler.name = Сборщик базовых модулей
block.eclipse-basic-module-assembler.description = Собирает модули улучшений I уровня. Выберите модуль для сборки.
block.eclipse-advanced-module-assembler.name = Сборщик продвинутых модулей
block.eclipse-advanced-module-assembler.description = Собирает модули улучшений II и III уровня. Выберите модуль для сборки.

item.eclipse-production-accelerator-1.name = Ускоритель производства I
item.eclipse-production-accelerator-1.description = Заставляет подключённую машину работать на 10% быстрее. Соединитель потребляет дополнительную энергию.
item.eclipse-production-accelerator-2.name = Ускоритель производства II
item.eclipse-production-accelerator-2.description = Заставляет подключённую машину работать на 20% быстрее. Соединитель потребляет дополнительную энергию.
item.eclipse-production-accelerator-3.name = Ускоритель производства III
item.eclipse-production-accelerator-3.description = Заставляет подключённую машину работать на 35% быстрее. Соединитель потребляет гораздо больше дополнительной энергии.
item.eclipse-power-optimizer-1.name = Оптимизатор энергии I
item.eclipse-power-optimizer-1.description = Снижает потребление энергии подключённой машины на 10%.
item.eclipse-power-optimizer-2.name = Оптимизатор энергии II
item.eclipse-power-optimizer-2.description = Снижает потребление энергии подключённой машины на 20%.
item.eclipse-power-optimizer-3.name = Оптимизатор энергии III
item.eclipse-power-optimizer-3.description = Снижает потребление энергии подключённой машины на 30%.

stat.eclipse-module-tier = Уровень
stat.eclipse-module-speed = Скорость машины
stat.eclipse-module-power = Потребление энергии машиной
stat.eclipse-module-cost = Потребление энергии соединителем
stat.eclipse-module-cost-value = {0} ед. энергии/с + {1}% от потребления машины
stat.eclipse-module-compatible = Подходит
stat.eclipse-compat-production = Производители, сепараторы и буры (ванильные и ECLIPSE)
stat.eclipse-compat-powered = Любая машина, потребляющая энергию (кроме аккумуляторов)
stat.eclipse-compat-any = Любая машина
bar.eclipse-augment-none = Машина не подключена
bar.eclipse-augment-idle = {0}: неактивно
bar.eclipse-augment-active = {0}: улучшено

block.eclipse-advanced-coupler.name = Продвинутый соединитель
block.eclipse-advanced-coupler.description = Соединитель улучшений с двумя слотами для модулей.
block.eclipse-augmentation-hub.name = Промышленный центр улучшений
block.eclipse-augmentation-hub.description = Большой интерфейс улучшений с четырьмя слотами для модулей, для сильно специализированных машин.

item.eclipse-output-amplifier-1.name = Усилитель выхода I
item.eclipse-output-amplifier-1.description = Машина выдаёт 10% больше продукции за цикл, но работает на 10% медленнее. Экономит материалы, а не время.\nНе сочетается с прецизионным фабрикатором на одной машине.
item.eclipse-output-amplifier-2.name = Усилитель выхода II
item.eclipse-output-amplifier-2.description = Машина выдаёт 20% больше продукции за цикл, но работает на 15% медленнее.\nНе сочетается с прецизионным фабрикатором на одной машине.
item.eclipse-output-amplifier-3.name = Усилитель выхода III
item.eclipse-output-amplifier-3.description = Машина выдаёт 30% больше продукции за цикл, но работает на 20% медленнее.\nНе сочетается с прецизионным фабрикатором на одной машине.
item.eclipse-precision-fabricator-1.name = Прецизионный фабрикатор I
item.eclipse-precision-fabricator-1.description = Возвращает 10% предметов, потребляемых машиной за цикл.\nНе сочетается с усилителем выхода на одной машине.
item.eclipse-precision-fabricator-2.name = Прецизионный фабрикатор II
item.eclipse-precision-fabricator-2.description = Возвращает 20% предметов, потребляемых машиной за цикл.\nНе сочетается с усилителем выхода на одной машине.
item.eclipse-precision-fabricator-3.name = Прецизионный фабрикатор III
item.eclipse-precision-fabricator-3.description = Возвращает 30% предметов, потребляемых машиной за цикл.\nНе сочетается с усилителем выхода на одной машине.
item.eclipse-material-recycler-1.name = Переработчик материалов I
item.eclipse-material-recycler-1.description = Собирает 10% потребляемых машиной предметов в виде лома, который выдаёт соединитель.
item.eclipse-material-recycler-2.name = Переработчик материалов II
item.eclipse-material-recycler-2.description = Собирает 20% потребляемых машиной предметов в виде лома, который выдаёт соединитель.

stat.eclipse-module-yield = Выход за цикл
stat.eclipse-module-saving = Потребление предметов
stat.eclipse-module-recycle = Превращено в лом
stat.eclipse-module-exclusive = Несовместимо с
stat.eclipse-exclusive-efficiency = Другие модули эффективности (усилитель выхода / прецизионный фабрикатор / репликатор материи / ядро эффективности нулевой точки)
stat.eclipse-compat-item-producers = Производители предметов и буры (ванильные и ECLIPSE)
stat.eclipse-compat-item-consumers = Производители, потребляющие предметы (ванильные и ECLIPSE)
stat.eclipse-coupler-slots = Слоты модулей
bar.eclipse-augment-conflict = {0}: конфликтующие модули

block.eclipse-chemical-augmentation-interface.name = Химический интерфейс улучшений
block.eclipse-chemical-augmentation-interface.description = Соединитель для химических заводов: три слота для модулей и большой бак хладагента. Принимает только химические модули.

item.eclipse-reaction-accelerator-1.name = Ускоритель реакций I
item.eclipse-reaction-accelerator-1.description = Химические машины работают на 15% быстрее. Требует хладагент в соединителе; более холодные хладагенты держатся дольше.
item.eclipse-reaction-accelerator-2.name = Ускоритель реакций II
item.eclipse-reaction-accelerator-2.description = Химические машины работают на 30% быстрее. Требует хладагент в соединителе; более холодные хладагенты держатся дольше.
item.eclipse-reaction-accelerator-3.name = Ускоритель реакций III
item.eclipse-reaction-accelerator-3.description = Химические машины работают на 50% быстрее. Требует хладагент в соединителе; более холодные хладагенты держатся дольше.
item.eclipse-thermal-controller-1.name = Термоконтроллер I
item.eclipse-thermal-controller-1.description = Обеспечивает 15% потребности машины с тепловым приводом в тепле.
item.eclipse-thermal-controller-2.name = Термоконтроллер II
item.eclipse-thermal-controller-2.description = Обеспечивает 30% потребности машины с тепловым приводом в тепле.
item.eclipse-thermal-controller-3.name = Термоконтроллер III
item.eclipse-thermal-controller-3.description = Обеспечивает 45% потребности машины с тепловым приводом в тепле.
item.eclipse-pressure-stabilizer-1.name = Стабилизатор давления I
item.eclipse-pressure-stabilizer-1.description = Реактор давления достигает рабочего давления на 50% быстрее и теряет его медленнее.
item.eclipse-pressure-stabilizer-2.name = Стабилизатор давления II
item.eclipse-pressure-stabilizer-2.description = Реактор давления достигает рабочего давления вдвое быстрее и теряет его медленнее.
item.eclipse-catalyst-optimizer-1.name = Оптимизатор катализатора I
item.eclipse-catalyst-optimizer-1.description = Катализаторы в подключённом реакторе служат на 50% дольше.
item.eclipse-catalyst-optimizer-2.name = Оптимизатор катализатора II
item.eclipse-catalyst-optimizer-2.description = Катализаторы в подключённом реакторе служат вдвое дольше.
item.eclipse-purification-module-1.name = Модуль очистки I
item.eclipse-purification-module-1.description = Машина выдаёт 10% больше основного жидкого продукта (например, очищенной воды, а не рассола).
item.eclipse-purification-module-2.name = Модуль очистки II
item.eclipse-purification-module-2.description = Машина выдаёт 20% больше основного жидкого продукта (например, очищенной воды, а не рассола).
item.eclipse-purification-module-3.name = Модуль очистки III
item.eclipse-purification-module-3.description = Машина выдаёт 30% больше основного жидкого продукта (например, очищенной воды, а не рассола).
item.eclipse-waste-recovery-1.name = Восстановление отходов I
item.eclipse-waste-recovery-1.description = Превращает 25% кислотных отходов машины обратно в потребляемую ею кислоту.
item.eclipse-waste-recovery-2.name = Восстановление отходов II
item.eclipse-waste-recovery-2.description = Превращает 50% кислотных отходов машины обратно в потребляемую ею кислоту.

