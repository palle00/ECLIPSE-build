item.eclipse-aetherite.name = Эфирит
item.eclipse-aetherite.description = Редкий энергетический кристалл, встречающийся глубоко в далёких недрах или вымываемый из дроблёной руды. Хранит огромное количество энергии; используется в модулях уровня V и эфиритовых конденсаторах.
block.eclipse-ore-aetherite.name = Месторождение эфирита
block.eclipse-ore-aetherite.description = Редкие кристаллы эфирита, встречающиеся вдали от стартового ядра на новых секторах. Нужен карбидный бур или лучше.
block.eclipse-aetherite-capacitor.name = Эфиритовый конденсатор
block.eclipse-aetherite-capacitor.description = Хранит энергию в кристаллах эфирита: более чем вдвое больше, чем литиевая батарея в том же объёме.
block.eclipse-geothermal-heat-tap.name = Геотермальный отбор тепла
block.eclipse-geothermal-heat-tap.description = Берёт бесплатное тепло из горячих пород и магматических пород без топлива. Строится только на горячей поверхности; чем жарче грунт, тем больше тепла.
eclipse-geothermal.heat = Тепло: {0}
stat.eclipse-geothermal-value = {0} тепла на единицу тепла пола
block.eclipse-aetherite-module-forge.name = Кузница эфиритовых модулей
block.eclipse-aetherite-module-forge.description = Создаёт модули уровня V вокруг кристаллов эфирита.
item.eclipse-production-accelerator-5.name = Ускоритель производства V
item.eclipse-production-accelerator-5.description = Работает на эфирите. Машина работает на 70% быстрее и потребляет меньше энергии, чем уровень IV.
item.eclipse-power-optimizer-5.name = Оптимизатор энергии V
item.eclipse-power-optimizer-5.description = Работает на эфирите. Снижает энергопотребление машины на 50% — это максимум.
item.eclipse-output-amplifier-5.name = Усилитель выхода V
item.eclipse-output-amplifier-5.description = Работает на эфирите. На 50% больше выхода за цикл всего лишь при 10% меньшей скорости. Не сочетается с прецизионным фабрикатором.
item.eclipse-deep-mining-5.name = Глубокая добыча V
item.eclipse-deep-mining-5.description = Работает на эфирите. Буры добывают в два раза быстрее.

block.eclipse-robot-dispatch-hub.name = Диспетчерский хаб роботов
block.eclipse-robot-dispatch-hub.description = База для до 4 роботов ECLIPSE в радиусе 25 тайлов. Роботы, построенные на Воздушной фабрике, регистрируются в ближайшем хабе со свободным слотом. Нажмите на хаб, чтобы назначить роботу задание, затем нажмите на здание, чтобы выбрать его. Заряжает пришвартованных роботов энергией и превращает титановые прутки в заряд для ремонта.
unit.eclipse-logistics-drone.name = Логистический дрон
unit.eclipse-logistics-drone.description = Переносит до 20 предметов одного типа из здания-источника в здание-получатель, оба в радиусе своего хаба. Доставляет только то, что принимает получатель; для турели это боеприпасы. Медленнее конвейеров; предназначен для неудобных локальных маршрутов.
unit.eclipse-repair-drone.name = Ремонтный дрон
unit.eclipse-repair-drone.description = Летит к одному назначенному зданию и чинит его из ограниченного запаса ремонта, который пополняется в хабе титановыми прутками. Никогда не строит.
unit.eclipse-shield-drone.name = Дрон поддержки щита
unit.eclipse-shield-drone.description = Сопровождает самую большую группу дружественных юнитов рядом со своим хабом и восстанавливает им щит до 40 единиц из конечного запаса. Перезаряжается только у своего хаба. Его щиты исчезают, если дрон уничтожен.
