eclipse-wiki.setup = Минимальная схема
eclipse-wiki.setup.hint = Предметы прибывают по конвейеру слева, жидкости — по трубам; выходы уходят туда, куда их направляет машина. Машины, выводящие жидкости с фиксированных сторон, показаны обращёнными вверх (стрелка указывает переднюю сторону), поэтому их левая и правая стороны соответствуют левой и правой стороне рисунка. Тепловым машинам нужен нагреватель, обращённый к ним; машинам с питанием нужна энергия.

eclipse-wiki.guide.start.name = Начало работы
eclipse-wiki.guide.start.text = ECLIPSE превращает Серпуло в более глубокую промышленность: детали машин, химия, новые металлы, модули улучшений, роботы, новые турели и три фракции врагов. Мод работает в кампании, свободной игре и пользовательских играх. Исследования идут в обычном дереве технологий, а в меню строительства каждый блок ECLIPSE стоит рядом со стандартным блоком, на котором он основан (Заклёпка сразу после Duo).\n\n[accent]Как это связано[]\nЧетыре ветви питают друг друга:\n- [accent]Механические детали[] (шестерни, стержни, корпуса, подшипники, рамы, прецизионные детали): из них сделаны здания ECLIPSE.\n- [accent]Химия[] (вода, рассол и нефть в газы, кислоты и пластмассы): сырьё для особых процессов.\n- [accent]Металлургия[] (новые руды в сплавы): более прочные материалы для поздних машин.\n- [accent]Электроника[] (проволока, печатные платы, микросхемы, блоки управления): «мозги» умных и поздних блоков.\nСтандартные материалы не выходят из обихода: медь, свинец, графит, кремний, титан, торий, импульсный сплав и фаза нужны на каждом этапе.\n\n!tip У каждой машины есть вкладка примеров постройки|Анимированные схемы с правильными пропорциями и настоящими предметами на конвейерах. В игре «Построить это» ставит пример на курсор.\n\n## Первые минуты\nМедь, свинец и графит.\n\n1. Постройте [accent]Пресс шестерён[] (медь в медные шестерни) и [accent]Экструдер[] (медь в проволоку). Шестерни и проволока входят в большинство ранних построек ECLIPSE.\n2. Поставьте пару [accent]Заклёпок[] у входов: дешёвый 1x1 пулемёт, который стреляет всё быстрее, чем дольше ведёт огонь.\n3. Поставьте [accent]Измеритель потока[] на любой конвейер, чтобы видеть предметы в секунду. Он стоит почти ничего и никогда не замедляет конвейер.\n\n## Титановые детали\n1. [accent]Экструдер[] (титан в стержни), [accent]Пресс шестерён[] (титановые шестерни), [accent]Пресс металла[] (пластины) и [accent]Токарный станок[] (болты, винты, кольца, пружины). [accent]Сборщик[] делает из них корпуса давления, подшипники, моторы, насосы и поршни. Эти детали открывают большинство машин середины игры.\n2. Постройте [accent]Склад компонентов[] рядом с линиями деталей. Он хранит ядро до 200 единиц каждой детали с любой точки карты, поэтому вам не нужно тянуть детали конвейером к ядру.\n3. Начните химию: закачайте воду в [accent]Завод водоочистки[] (очищенная вода с одной стороны, рассол с другой). Очищенная вода идёт в [accent]Электролизёр[] (водород и кислород), рассол — туда же. Нефть идёт в [accent]Дистилляционную колонну[].\n4. Оборона: [accent]Серп[] выбрасывает пилу, которая режет наземные юниты на пути туда и обратно.\n\n!warn Кислоты разъедают обычные трубы|Используйте полимерные или плакированные трубы. См. «Химию и коррозию».\n\n## Металлы, тепло и электроника\n1. Никель, хром и молибден находятся рядом с ядром; кобальт, вольфрам и платина — дальше. Нет руды на карте? Дробите лом в [accent]Дробилке руды[] и промывайте её в [accent]Промывателе руды[].\n2. Многие машины нуждаются в [accent]тепле[]: направьте на них [accent]Электрический нагреватель[] или [accent]Промышленный нагреватель[]. [accent]Доменная печь[] превращает никель, хром и кобальт в суперсплав (тепло 8: два электрических нагревателя с двух сторон).\n3. Электроника: печатные платы, высокочистый кремний, микросхемы и прецизионные компоненты.\n4. [accent]Модули улучшений[]: поставьте [accent]Соединитель улучшений[] рядом с любой машиной (в том числе стандартной), соберите модули в [accent]Базовом сборщике модулей[] и вставьте один.\n5. Оборона: [accent]Тремор[], [accent]Тепловое копьё[], [accent]Кислотный миномёт[], а также ПВО — [accent]Кестрел[] и [accent]Тандерхед[].\n\n!warn Нагреватель даёт полное тепло только когда вся его сторона касается машины|Нагреватель 2x2, наполовину свисающий с печи 3x3, даёт лишь половину тепла. На машине 3x3 с каждой стороны помещается по одному нагревателю.\n\n!next Суперсплав выходит горячим|Охладите его в Вакуумном охладителе с криофлюидом перед использованием; один охладитель справляется с тремя печами. Вкладка примеров постройки у Доменной печи показывает всю линию.\n\n## Поздняя игра\n- Энергия: [accent]Реактор деления[] греет [accent]Промышленные котлы[] для [accent]Паровых турбин[] или метановые турбины с топливными элементами; позже — реактор-размножитель и термоядерный реактор.\n- [accent]Роботы[]: собирайте дронов на Авиазаводе и назначайте им задачи в [accent]Центре управления роботами[].\n- [accent]Экспериментальные ядра[] и [accent]импульсный суперсплав[] открывают концовку: [accent]Решётчатый бур[] (добывает всю залежь), турели [accent]Пасека[] и [accent]Событийный горизонт[], Орбитальная боевая платформа и Мировой двигатель.\n\n[accent]Враг[]\nВолны также приносят [accent]Рой[] (каждая 2-я), [accent]Доминион[] (каждая 3-я) и [accent]Прилив[] (каждая 5-я). Смотрите «Фракции врагов» и «Военное дело».\n\n## Полезно знать\n- Большинство машин ECLIPSE [accent]универсальны[]: один Пресс шестерён делает все шестерни, один Сборщик — все детали. Нажмите на машину, чтобы выбрать рецепт; [accent]?[] в меню рецептов открывает её страницу здесь.\n- У каждого рецепта есть [accent]уровень энергии[] (I 30/с, II 120/с, III 480/с, IV 1920/с, V 7680/с). Ниже полной мощности машина останавливается, а не замедляется. Разгон ускоряет машину за намного большее энергопотребление.\n- У страницы каждого предмета есть вкладка [accent]Цепочка[]: вся цепочка до сырья и сколько машин для неё нужно.\n- Наведите на любой блок или юнит ECLIPSE и нажмите [accent]I[], чтобы открыть его страницу здесь. Над остановленной машиной страница откроется с причиной остановки и подсказкой, как её устранить.\n- Нажмите на любой значок, чтобы перейти на его страницу; наведите, чтобы увидеть краткую карточку. Закрепляйте часто используемые страницы (P), переключайтесь назад и вперёд через Alt и стрелки.\n- Машины с несколькими выходами жидкости выдают каждую с фиксированной стороны; при постройке показываются цветные стрелки.\n- Отходы (кислые отходы, сточные воды, дымовые газы) должны куда-то уходить, иначе машина, их производящая, встаёт.\n\n!tip Посмотрите всё в работе|Откройте карту ECLIPSE Showcase в пользовательских играх.

eclipse-wiki.guide.industry.name = Универсальные машины
eclipse-wiki.guide.industry.text = Большинство производства ECLIPSE работает на [accent]универсальных машинах[]: одна машина — много рецептов. Пресс шестерён делает все шестерни, Сборщик — все детали, Электролизёр — всю электролизу.\n\n[accent]Выбор рецепта:[] нажмите на машину и выберите продукт. Наведите на вариант, чтобы увидеть весь рецепт: входы, выходы, уровень энергии, тепло, давление, катализатор и время. Выбранный рецепт также показан под кнопками. Логические процессоры могут задать его командой [accent]control config[] и продуктом; схемы копируют его. Нажмите на выбранный рецепт ещё раз, чтобы сбросить.\n\n[accent]Автоматический режим:[] Вакуумный охладитель без выбранного рецепта охлаждает любой прибывающий горячий материал по очереди, поэтому смешанный конвейер его не забивает.\n\n[accent]Уровни энергии:[] у каждого рецепта есть уровень: I 30 энергии/с, II 120, III 480, IV 1920, V 7680. Машина работает только когда её сеть полностью покрывает этот уровень; ниже она останавливается (в строке состояния написано, сколько нужно и сколько даёт сеть).\n\n[accent]Разгон:[] уровни I–III каждый раз удваивают скорость за 5, 30 и 200 раз больше энергии. Уровень III подходит лишь для нескольких ключевых машин на очень мощной сети. Модули Ускорителя производства складываются сверху, и их дополнительное энергопотребление растёт с разгоном.\n\n[accent]Тепло, давление и катализаторы:[] некоторым рецептам нужно тепло от соседних нагревателей, давление, набираемое энергией, или предмет-катализатор внутри машины. Строка состояния скажет, чего не хватает.\n\n[accent]Горячие металлы:[] металл и стекло из печей ECLIPSE выходят горячими и должны быть охлаждены в [accent]Вакуумном охладителе[] с криофлюидом перед использованием.\n\n[accent]Глубина переработки:[] металл превращается в пластины, стержни, проволоку и фольгу, затем в болты, кольца, пружины, резисторы и транзисторы, а затем собирается в моторы, насосы, поршни и датчики, прежде чем стать компонентом. У страницы каждого предмета есть [accent]дерево рецептов[] со всей цепочкой для 1 предмета в секунду, сырьём и нужными машинами.
eclipse-wiki.guide.qol.name = Удобства
eclipse-wiki.guide.qol.text = Небольшие помощники, которые ECLIPSE добавляет в игру. Клавиши можно переназначить в [accent]Настройки > Управление[], в разделе ECLIPSE; ниже указаны ваши текущие клавиши.\n\n[accent]Горячие клавиши (ПК)[]\n- [accent]{0}[]: открыть вики для блока или юнита ECLIPSE под курсором либо для выбранного в меню строительства блока ECLIPSE. Повторное нажатие закрывает.\n- [accent]{1}[] (удерживать): [accent]Улучшить участок[]. Выберите лучший конвейер, трубу или стену, удерживайте клавишу над существующей линией или стеной того же типа и нажмите. Вся соединённая секция подсвечивается с числом блоков и проверкой стоимости, затем получает планы замены, которые строители возводят обычным порядком и по обычной цене. Содержимое конвейеров сохраняется. Линии обрываются на разрывах, блоках другого типа и слияниях, поэтому линия, подходящая сбоку, никогда не включается.\n- [accent]{2}[]: открыть [accent]Панель производства[]. Она также доступна кнопкой внизу вики. Ресурсы: всё, что ваша база производит и потребляет в секунду, с графиком за минуту, цепочкой производства и подсказкой для выбранного. Цепочки производства: нужные машины против построенных для целевой скорости. Энергия: что вырабатывают генераторы и что потребляют машины.\n- [accent]{3}[]: отметить все остановленные машины: рамка, окрашенная по причине, и значок того, чего не хватает. Повторное нажатие скрывает.\n\n[accent]Информация[]\n- [accent]Состояние машины[]: каждая машина ECLIPSE пишет в строке состояния, почему она встала («Рассолу некуда деться», «Нет тепла (нужно 10)», нет входного предмета или катализатора).\n- [accent]Стрелки выхода жидкости[]: машины с несколькими жидкостными выходами показывают цветную стрелку на каждой стороне выхода при постройке и при наведении.\n- [accent]Предпросмотр тепла[]: при постройке нагревателя блок перед ним обводится с указанием тепла, которое он получит, и тепла, которое ему нужно.\n- [accent]Подсказка о соотношении[]: при постройке машины рядом с той, что её питает (или которую она питает), показано, сколько поставщиков нужны одному потребителю.\n- [accent]Статистика турелей[]: каждая турель, в том числе стандартная, показывает урон в секунду, убийства и общий урон в своей информационной панели.\n- [accent]Измеритель потока[]: поставьте его на любой конвейер, чтобы видеть предметы в секунду по каждому материалу. Логические процессоры могут это читать.\n- [accent]Сканер разведки волн[]: показывает, что именно несёт следующая волна, и может вывести это на логический дисплей.\n- [accent]Живая карта[]: откройте карту (M) и приблизьте. После определённого масштаба изображение карты переходит в живую игру с оттенком старого монитора, так что можно наблюдать любой участок базы, неходя туда. Отдальтесь, чтобы вернуться к карте.\n- [accent]Вехи[]: короткое сообщение при первом получении ключевого материала, один раз на сохранение.\n\n[accent]Удобство[]\n- [accent]Склад компонентов[]: хранит ядро деталями машин с любой точки карты, чтобы вы всегда могли строить.\n- [accent]Компактный дисплей ядра[]: список ресурсов ядра показывает только материалы, используемые в стоимости постройки; промежуточные продукты остаются в ядре, но скрыты. Отключите в [accent]Настройки > Игра[].\n- [accent]Главное меню ECLIPSE[]: сумерки под затмением. Отключите в [accent]Настройки > Графика[].\n\n[accent]Эта вики[]\n- Откройте её из меню паузы или клавишей [accent]{0}[] в игре.\n- Ищите через поле в левом верхнем углу. [accent]Предыдущая[] возвращает на последнюю страницу.\n- Нажмите на любой значок на странице, чтобы перейти к его записи. У страницы каждой машины есть анимированное изображение минимальной рабочей схемы.

eclipse-wiki.guide.components.name = Механические компоненты
eclipse-wiki.guide.components.text = Продвинутые здания делаются не из одного сырого металла: им нужны детали машин. Металл сначала превращается в пластины, стержни, проволоку и фольгу (Пресс металла, Экструдер), затем в мелкие детали (Токарный станок: болты, винты, кольца, пружины; Сборщик схем: резисторы, конденсаторы, транзисторы), затем собирается в узлы (Сборщик: моторы, насосы, поршни, роторы, нагревательные катушки, датчики, излучатели) и компоненты. Компоненты делятся на уровни, и каждый уровень используется зданиями соответствующей сложности:\n- [accent]Медные шестерни и медная проволока[]: базовые машины, сортеры, насосы, модули I уровня.\n- [accent]Титановые стержни, титановые шестерни, корпуса давления[]: промышленные машины, реакторы, колонны, быстрые конвейеры, модули II уровня.\n- [accent]Промышленные подшипники и рамы из суперсплава[]: турбины, буры, тяжёлые и горячие машины.\n- [accent]Прецизионные компоненты[]: умная логистика, электроника, модули III уровня.\n- [accent]Экспериментальные ядра[]: машины концовки и модули IV уровня.\n\nПостройте [accent]Склад компонентов[] рядом с линиями компонентов. Он хранит только компоненты, детали и обработанный металл и поддерживает в ядре до 200 единиц каждого из любой точки карты, так что вы всегда можете строить ими, не протягивая всё к ядру.

eclipse-wiki.guide.metallurgy.name = Руды и металлы
eclipse-wiki.guide.metallurgy.text = ECLIPSE добавляет семь руд металлов (в том числе боксит для алюминия) плюс эфирит. Получить их можно двумя способами.\n\n[accent]Добыча.[] Жилы содержат настоящие рудные минералы (пентландит для никеля, хромит, кобальтит, вольфрамит, молибденит, сперрилит для платины, боксит для алюминия). Перерабатывайте их: Дробилка руды даёт 1 металл из руды, Флотационная ячейка — 1.5 с побочными продуктами, выщелачивание в Электролизёре — 2 с большим количеством побочных продуктов. Новые жилы добавляются во вновь генерируемые секторы и в готовые карты пользовательских игр при загрузке. Распространённые руды (никель, молибден, хром) могут встречаться рядом с ядром; редкие — только дальше: кобальт, затем вольфрам, затем платина, а эфирит дальше всех. Вольфраму и эфириту нужны более мощные буры.\n\n[accent]Переработка.[] На картах без руд дробите лом в [accent]Дробилке руды[] и промывайте его в [accent]Промывателе руды[], чтобы выделить никель, хром, кобальт, молибден, ванадий, вольфрам, немного платины и изредка эфирит. [accent]Минеральный сепаратор[] также выщелачивает следы металлов из шлака.\n\n[accent]Ключевые сплавы:[] никель, хром и кобальт дают [accent]суперсплав[] в Доменной печи (нужно тепло); вольфрам и графит дают [accent]карбид вольфрама[] в Электрической печи; суперсплав и импульсный сплав дают [accent]импульсный суперсплав[] в Электрической печи.\n\n[accent]Буры:[] [accent]Карбидный бур[] добывает больше пневмобура на меньшей площади. В самом конце [accent]Решётчатый бур[] разворачивает решётку добычи над всей залежью и добывает её целиком через одно здание.

eclipse-wiki.guide.heat.name = Тепло
eclipse-wiki.guide.heat.text = !warn Нагреватель даёт полное тепло только когда вся его сторона касается машины|Тепло распределяется по соприкасающимся клеткам: нагреватель 2x2, наполовину свисающий с печи 3x3, даёт половину тепла. На машине 3x3 с каждой стороны помещается по одному нагревателю 2x2.\n\nМногие машины ECLIPSE нуждаются в [accent]тепле[] — в той же системе, что и новые блоки Серпуло. Машина показывает требуемое тепло в характеристиках; при меньшем количестве тепла она работает медленнее или совсем не работает. Универсальные машины с рецептами, требующими тепла (Доменная печь), полностью останавливаются ниже порога рецепта.\n\n[accent]Источники тепла[] отдают тепло со стороны, куда обращены, так что направляйте их на машину:\n- [accent]Промышленный нагреватель[]: сжигает метан; выхлоп — дымовые газы.\n- [accent]Электрический нагреватель[]: превращает энергию в тепло без топлива.\n- [accent]Геотермальный теплоотвод[]: бесплатное тепло, но только на горячей или магматической породе.\n- [accent]Реактор деления[]: огромное количество тепла для котлов.\n\n[accent]Передача тепла:[] [accent]Теплообменник[] собирает тепло с задней и боковых сторон и отдаёт его вперёд, поэтому один нагреватель может обслужить машину за углом. Некоторые реакции выделяют отработанное тепло, которое можно собрать таким же образом. [accent]Тепловое хранилище[] работает как теплообменник с резервуаром: оно продолжает греть некоторое время после окончания топлива.\n\n[accent]Тепло в энергию:[] [accent]Промышленный котёл[] делает пар из очищенной воды за счёт тепла, а [accent]Паровые турбины[] превращают пар в энергию и возвращают большую часть воды.\n\n[accent]Размещение нагревателя:[] блок перед ним обводится с указанием тепла, которое он получит, и тепла, которое ему нужно.

eclipse-wiki.guide.chemistry.name = Химия и коррозия
eclipse-wiki.guide.chemistry.text = Химическая промышленность начинается с воды. [accent]Завод водоочистки[] даёт очищенную воду и рассол. [accent]Электролизёр[] разлагает очищенную воду на водород и кислород, а рассол превращает в хлор, водород и гидроксид натрия. Сырая нефть идёт в [accent]Дистилляционную колонну[] на нафту, метан, дизель, серу и нефтяной кокс; [accent]Установка разделения воздуха[] даёт азот, кислород и аргон. Из них получаются кислоты, пластмассы, удобрения и взрывчатые вещества.\n\n[scarlet]Коррозия:[] кислоты, хлор, гидроксид натрия и кислые отходы медленно разрушают обычные жидкостные блоки (около 1% здоровья в секунду). Каждый жидкостный блок ECLIPSE и стандартный плакированный трубопровод устойчивы к ней. Используйте [accent]полимерные трубы, маршрутизаторы, мосты и резервуары[] либо металлические трубы начиная с алюминия.\n\n[accent]Выходы по сторонам:[] машины с двумя или тремя жидкими продуктами выводят каждый с фиксированной стороны (слева, справа или вперёд). В их описаниях указано, с какой именно.\n\n[accent]Отходы должны куда-то уходить.[] Кислые отходы, сточные воды и дымовые газы скапливаются и останавливают машину, которая их производит. Нейтрализуйте кислые отходы в [accent]Химическом реакторе[] (они становятся рассолом и возвращаются в Электролизёр), очищайте сточные воды и промывайте или разделяйте дымовые газы. Выхлопные газы, например CO2 электрических печей, просто выпускаются, если их никто не забирает.\n\n[accent]Реактор давления:[] для некоторых рецептов нужен предмет-[accent]катализатор[], который расходуется лишь раз за несколько крафтов (платиновая сетка для азотной кислоты, молибден для акрилонитрила, полимерный катализатор для пластмасс); другие сначала нужно [accent]накачать давлением[] за счёт энергии, и на холостом ходу давление падает.\n\n[accent]Настоящая химия:[] ECLIPSE следует реальным процессам (Хабер-Бош, Оствальд, хлор-щелочной, Байер, Холл-Эру, Кролл, Дау, PUREX) с реальными пропорциями и побочными продуктами. Каждый побочный продукт куда-то идёт.\n\n[accent]Когда машина встала:[] выделите её. Строка состояния скажет почему: например, какой выходу некуда деться, какого входа не хватает или что нужны тепло либо катализатор. При постройке машины цветные стрелки показывают, какая жидкость выходит с какой стороны.

eclipse-wiki.guide.electronics.name = Электроника
eclipse-wiki.guide.electronics.text = Электроника образует отдельную цепочку:\n1. [accent]Медная проволока[] из Экструдера и [accent]медная фольга[] из Пресса металла.\n2. [accent]Высокочистый кремний[] из Рафинировщика кремния с соляной кислотой и водородом.\n3. [accent]Резисторы, конденсаторы и транзисторы[] из Сборщика схем.\n4. [accent]Печатные платы[]: медная фольга на полиэтилене с резисторами, конденсатором и транзистором, травлённая соляной кислотой (остаются кислые отходы).\n5. [accent]Микросхемы[] из Фабрики микросхем: высокочистый кремний, два транзистора и полиэтилен.\n6. [accent]Блоки управления[]: микросхема на печатных платах, управляющая электромотором, в Сборщике схем.\n\nСборщик делает из тех же деталей [accent]датчики[] и [accent]излучатели[]. Блоки управления автоматизируют мощные буры, умную логистику, реакторы и сборщики модулей, поэтому эта цепочка открывает многое в поздней игре.

eclipse-wiki.guide.power.name = Энергия и накопление
eclipse-wiki.guide.power.text = [accent]Генераторы[] примерно от малого к большому:\n- [accent]Водородный топливный элемент[] (210/с): водород и кислород; отдаёт очищенную воду обратно.\n- [accent]Биотопливный двигатель[] (150/с): биотопливо из ферментированной биомассы или дизель из Дистилляционной колонны.\n- [accent]Солнечная ферма[] (180/с): без топлива; зависит от освещённости карты.\n- [accent]Метановая турбина[] (360/с): метан; отводите дымовые газы по трубе.\n- [accent]Паровая турбина[] (700/с каждая): пар из Промышленного котла. Реактор деления питает котёл на 4 турбины (2,800/с), реактор-размножитель — на 10 (7,000/с).\n- [accent]Парогазовая турбина[] (2,400/с): метан; тепло выхлопа питает котёл и турбину ещё на 700/с.\n- [accent]Термоядерный реактор[] (24,000/с): дейтерий и литий; для зажигания нужна энергия.\n- [accent]Мировой двигатель[] (300,000/с): проект концовки с хранилищем на 5,000,000, бонусом аплинка 15% и полем перегрузки.\n\n[accent]Уровни энергии:[] у каждого рецепта универсальной машины требуется полная мощность его уровня (I 30/с, II 120/с, III 480/с, IV 1920/с, V 7680/с), ниже которой машина встаёт, — проектируйте сеть под те рецепты, которые используете; батареи сглаживают кратковременные провалы. Если несколько машин разных уровней делят перегруженную сеть, они встают все вместе. Разгон умножает энергопотребление рецепта на 5, 30 или 200: рецепт V уровня при разгоне III хочет около 1.5 миллиона/с.\n\n[accent]Накопление[], от малого к большому: Промышленная батарея, Литиевая батарея, Ванадиевая проточная батарея, Конденсатор эфирита.\n\nМодуль конденсатора также может поддержать одну машину при кратковременном дефиците энергии.

eclipse-wiki.guide.logistics.name = Умная логистика
eclipse-wiki.guide.logistics.text = Маршрутизаторы ECLIPSE никогда не теряют и не дублируют предметы: если пункт назначения предмета заполнен, он ждёт на конвейере, а не уходит не туда. Стороны считаются относительно поворота блока, поэтому поворот маршрутизатора меняет его маршруты. Как и стандартные сортеры, два мгновенных маршрутизатора требуют конвейер между ними.\n- [accent]Трёхсторонний сортер / Распределительный узел[]: отправляет выбранные предметы влево, вперёд или вправо, с резервной стороной.\n- [accent]Продвинутый фильтр предметов[]: список разрешения или запрета; проходящие предметы идут прямо, остальные — в стороны.\n- [accent]Приоритетный объединитель[]: объединяет три линии по приоритету или по очереди.\n- [accent]Управляемый разделитель / Балансировщик линии[]: делит одну линию поровну, по пропорции (например, 2:1) или по приоритету.\n- [accent]Логистические буферы[]: сглаживают неравномерную подачу, при желании сохраняя резерв.\n- [accent]Пакетный шлюз[]: выпускает предметы партиями.\n- [accent]Умный разгрузчик[]: выгружает до трёх выбранных предметов.\n- [accent]Клапаны для жидкостей[]: перелив, балансировка или сохранение резерва в резервуаре.\n\nБолее быстрые конвейеры и трубы (от алюминия до импульсного сплава) переносят намного больше стандартных.\n\n[accent]Измеритель потока:[] дешёвый блок, который ставится в конвейер; показывает предметов в секунду. Логические процессоры могут его читать.\n[accent]Улучшить участок[] (ПК): выберите лучший конвейер, трубу или стену, удерживайте Alt (можно переназначить в «Управлении») над существующей линией или стеной и нажмите: вся соединённая линия или стена получает планы замены, которые строятся обычным порядком.

eclipse-wiki.guide.augmentation.name = Улучшения
eclipse-wiki.guide.augmentation.text = Модули улучшений совершенствуют машину, не заменяя её. Это настоящие предметы: собирайте их в сборщике модулей, перевозите на конвейерах и вставляйте в [accent]соединитель[] рядом с машиной.\n\n[accent]Настройка:[] поставьте соединитель, касающийся машины. Если рядом только одна машина, он подключается сам; иначе нажмите на соединитель, затем на машину. Дайте соединителю энергию (а некоторым химическим модулям ещё и охлаждающую жидкость), затем вставляйте модули как обычные предметы.\n\n[accent]Соединители:[] Соединитель улучшений (1 слот), Продвинутый соединитель (2), Промышленный центр улучшений (4), Химический интерфейс улучшений (3, химические модули, большой бак охлаждающей жидкости), Военный интерфейс улучшений (3, модули турелей).\n\n[accent]Стек:[] самый сильный модуль одного вида учитывается полностью, каждый следующий — вдвое меньше предыдущего, до ограничения. Усилители выхода и Прецизионные фабрикаторы исключают друг друга, уникальные и легендарные модули работают по разу на машину. Наведите на соединитель, чтобы увидеть состояние каждого модуля.\n\n[accent]Уровни:[] I из Базового сборщика модулей, II и III из Продвинутого сборщика модулей, IV и легендарные из Экспериментального центра улучшений, V из Кузницы модулей из эфирита. Ненужные модули идут в Завод переработки модулей за половину материалов.

eclipse-wiki.guide.robotics.name = Робототехника
eclipse-wiki.guide.robotics.text = Роботы ECLIPSE — маленькие летающие помощники, собираемые на стандартном [accent]Авиазаводе[]. Они работают только от [accent]Центра управления роботами[], который вмещает до 4 роботов и действует в радиусе 25 блоков.\n1. Постройте центр и дайте ему энергию.\n2. Соберите роботов; каждый приписывается к ближайшему центру со свободным слотом.\n3. Нажмите на центр, чтобы задать каждому роботу задание: логистическому дрону нужны источник, пункт назначения и предмет; ремонтному — здание, которое чинить.\n\n- [accent]Логистический дрон[]: переносит один тип предмета между двумя зданиями. Хорош для неудобных локальных маршрутов, медленнее конвейеров.\n- [accent]Ремонтный дрон[]: чинит одно здание за счёт ремонтного заряда, восполняемого в центре титановыми стержнями.\n- [accent]Щитовой дрон[]: сопровождает вашу самую крупную группу юнитов и пополняет их щиты.\n\nРоботы летят домой перезарядиться и никогда не действуют дальше радиуса своего центра.

eclipse-wiki.guide.defense.name = Оборона и волны
eclipse-wiki.guide.defense.text = [accent]Знайте, что идёт:[] [accent]Сканер разведки волн[] (вкладка Логика) сообщает юнитов, количество, щиты и боссов следующей волны. Привяжите его к логическим дисплеям, чтобы показать отчёт на экранах.\n\n[accent]Выиграйте время:[] [accent]Массив подавления волн[] и [accent]Массив временных помех[] задерживают надвигающуюся волну. Они делят один «перезаряд», поэтому задержки не складываются.\n\n[accent]Защитите юниты:[] [accent]Маяк защитного поля[] прикрывает дружественных юнитов в своём поле из общего запаса щитов.\n\n[accent]Ремонт:[] [accent]Пункт экстренного ремонта[] быстро чинит одно выбранное здание, расходуя титановые стержни.\n\nНовые стены (из суперсплава, импульсного суперсплава, композитные) намного прочнее стандартных; некоторые поглощают лазеры или отражают пули.

eclipse-wiki.guide.military.name = Военное дело
eclipse-wiki.guide.military.text = [accent]Боеприпасы для стандартных турелей:[] карбид вольфрама (пробивающий) для Duo, Fuse, Salvo и Spectre; сера (разъедающая броню) и свинцово-кислотные аккумуляторы (EMP: всё, во что попало, получает «Заглушение») для Hail и Ripple. Кислотный миномёт может стрелять и кислыми отходами. Жидкий азот — лучший охлаждающий агент для турелей.\n\n[accent]Турели:[]\n- [accent]Кислотный миномёт[]: дальнобойные кислотные снаряды, разъедающие броню и оставляющие коррозионные лужи.\n- [accent]Миноукладчик[]: кладёт мины на пути врага.\n- [accent]Тепловое копьё[]: луч, питаемый теплом вместо энергии.\n- [accent]Глушитель[]: замедляет вражеское оружие в радиусе.\n- [accent]Копробой[]: снаряд, прошивающий до трёх бронированных наземных юнитов в ряд.\n- [accent]Бомбардир[]: осадный миномёт, превосходящий дальностью все остальные турели, но с мёртвой зоной вокруг себя.\n- [accent]Сонар[]: находит затонувшие подводные лодки, чтобы по ним могли стрелять ваши турели.\n- [accent]Катапульта грузов[]: метает целые блоки (наполненные контейнеры, цистерны, батареи), которые взрываются при падении, будто уничтоженные; [accent]Фабрика гильз[] делает пустые оболочки.\n- [accent]Супернова[]: две турели, работающие вместе. [accent]Пусковая установка звёздной пыли[] разбрасывает облака почти любого предмета; метка [accent]Детонатора[] взрывается через несколько секунд и стягивает все ближайшие облака в один взрыв. Больше установок — больше взрыв; каждый предмет добавляет своё свойство.\n\n[accent]Турель на каждый этап[] (от слабейшей к сильнейшей):\n- [accent]Заклёпка[] (медный век): 1x1 пулемёт, который при непрерывной стрельбе раскручивается до тройной скорострельности.\n- [accent]Серп[] (титан): пила, вылетающая туда и обратно и режущая наземные юниты в оба конца.\n- [accent]Тремор[] (энергия): наземная ударная волна, отбрасывающая врагов и замедляющая их.\n- [accent]Пасека[] (пластаний, микросхемы): дроны, кружащиеся вокруг врага и стреляющие по наземным и воздушным целям.\n- [accent]Событийный горизонт[] (концовка, эфирит): сингулярность, стягивающая врагов, а потом схлопывающаяся.\n\n[accent]ПВО:[] [accent]Кестрел[] охотится за самым сильным самолётом управляемыми ракетами, [accent]Тандерхед[] пускает молнии по стаям, а [accent]Клаудбрейкер[] наполняет воздух вокруг себя минами.\n\n[accent]Юниты:[] две новые линейки, собираемые на стандартных заводах и реконструкторах: танки (Жнец, Оплот, Рампарт, Аннигилятор, Колосс) и ударные самолёты (Призрак, Перехватчик, Валькирия, Шторм, Левиафан). Дрон радиоэлектронной борьбы замедляет вражеские турели.\n\n[accent]Концовка:[] [accent]Титановый производственный комплекс[] строит по одному Дредноуту для каждой команды, а [accent]Орбитальная боевая платформа[] наносит удар в любой точке в радиусе 150 блоков.\n\n[accent]Статистика турелей:[] выделите любую турель, стандартную или ECLIPSE, чтобы увидеть её урон в секунду (за последние 5 секунд), убитых врагов и нанесённый урон с момента загрузки карты.

eclipse-wiki.guide.factions.name = Фракции врагов
eclipse-wiki.guide.factions.text = Каждая пользовательская игра и сектор кампании с волнами (в том числе старые сохранения при первой загрузке) получает три вражеские фракции поверх собственных волн карты; то же и на PvP-картах с волнами (волны атакуют все команды одинаково).\n\n## Рой\n[accent]Рой[] атакует каждую 2-ю волну: само восстанавливающиеся биологические машины во всё большом числе. Клещи плюются кислотой, Осы жалят с воздуха, Плюющие оставляют кислотные лужи, Выводки при гибели лопаются Клещами, а с 30-й волны каждые 12 волн приходит босс Бегемот, откладывающий яйца Клещей по мере продвижения (они выводятся за 3 секунды; разлёт смывает кладку). С 50-й волны каждые 20 волн приходит [accent]Скрабба[]: гигантский скорпион, чьи клешни дробят стены впереди, а жало его лечит. При полном здоровье каждый юнит Роя отращивает [accent]экзоскелет[], который принимает урон первым и снижает урон на 20%, пока держится; непрерывный огонь не даёт ему отрасти, а кислота (Разъеденный, от серных снарядов) не даёт появиться вовсе. Убивайте Выводки вдали от стен и держите наготове урон по площади.\n\n## Доминион\n[accent]Доминион[] атакует каждую 3-ю волну: немного, но тяжело бронированных юнитов из танковой и авиационной линеек ECLIPSE, с щитами с середины игры и боссами Колосс и Левиафан в конце. Здесь окупаются пробивающие боеприпасы и разъедающие броню снаряды.\n\n## Прилив\n[accent]Прилив[] атакует каждую 5-ю волну: амфибийные лодки, одинаково идущие по воде и по суше, быстрые на воде и медленные на суше. Каждая распыляет жидкость, готовя реакцию для остальных: Шлюпки делают цели Мокрыми (электрические атаки бьют сильнее), Сликеры покрывают их маслом и поджигают, Фроствейки замораживают и роняют мины, Синдервейки плавят броню шлаком и пускают дуги молний. С 15-й волны [accent]Миноги[] выпрыгивают из воды на ваши турели и вцепляются в них, замораживая до гибели: держите турели вдали от берега или прикрывайте их другими турелями и ПВО. С 45-й волны каждые 20 волн приходит босс Маэльстром. На картах с точкой появления на воде Прилив также шлёт [accent]подводные лодки[] (Луркер с 10-й волны, Барракуда с 20-й, ядерный босс Бездна каждые 25 волн с 60-й): под водой их нельзя взять в цель или задеть, кроме мин, пока их не найдёт [accent]Сонар[]. Сражайтесь с ними у берега, где они медленные, и не подпускайте наземные юниты к минным тропам.\n\n[accent]Каждую 6-ю волну Рой и Доминион атакуют вместе[]; каждую 10-ю к Рою присоединяется Прилив. Используйте Сканер разведки волн, чтобы точно узнать, что несёт следующая волна.\n\n## ECLIPSE\n[#b37aff]ECLIPSE[]: каждая 5-я волна может принести затмение, тем вероятнее, чем дольше идёт игра: 5% на 5-й волне, 10% на 10-й, 30% на 30-й, около 60% на 100-й и обязательно со 200-й. Небо темнеет, и до следующей волны каждый вражеский юнит выносливее и бьёт сильнее: x1.1 на 10-й, x1.3 на 30-й, x2 на 200-й. Заканчивается с приходом следующей волны.

eclipse-wiki.guide.exploration.name = Исследование и окружение
eclipse-wiki.guide.exploration.text = Грунт, на котором вы строите, имеет значение:\n- [accent]Горячая и магматическая порода[]: стройте Геотермальные теплоотводы для бесплатного тепла.\n- [accent]Лёд и снег[]: Градирня и Криогенный конденсатор работают быстрее на холодном грунте.\n- [accent]Мох и споровый мох[]: Культиватор биомассы растёт быстрее.\n\n[accent]Эфирит[] — самый редкий ресурс: кристаллические залежи вдали от стартового ядра (нужен карбидный бур) или редкая находка в Промывателе руды. Он питает модули V уровня, Конденсаторы эфирита, сверхпроводники и Орбитальную боевую платформу.
eclipse-wiki.guide.logic.name = Логика
eclipse-wiki.guide.logic.text = Процессоры могут читать и управлять большинством машин ECLIPSE.\n\n[accent]Стандартные инструкции[]\n- [accent]sensor r machine @config[]: продукт рецепта универсальной машины. Также работают @heat и @progress.\n- [accent]control config machine @eclipse-titanium-gear[]: выбирает рецепт (разгон сохраняется).\n- [accent]control shoot platform x y 1[]: наводит Орбитальную боевую платформу, как турель.\n- [accent]sensor r meter @copper[]: предметов в секунду через Измеритель потока.\n\n[accent]Инструкции ECLIPSE[] (в списках Блоков и Операций редактора)\n- [accent]esensor result block field[]: status, stalled, missing, recipe, overclock, heat, pressure, catalyst, charge, stored, stage, targetX/Y, waveGround/Air/Boss/Time, modules. На странице каждого блока перечислено, что он отвечает.\n- [accent]econtrol overclock|recipe|target block value [y][]: задаёт разгон, рецепт или цель платформы. Блок должен быть привязан, как и для control.\n- [accent]recipe result item field index[]: что нужно машине ECLIPSE, производящей предмет: machine, time, amount, power, tier, inputs, input #, inputAmount #.\n\n[accent]Примеры[] (вставьте в процессор; сначала привяжите блоки)\n\n[lightgray]Разгонять только при избытке энергии:[]\n[#8fd8ff]sensor stored node1 @powerNetStored\nsensor cap node1 @powerNetCapacity\nop div f stored cap\nop greaterThan spare f 0.8\nop mul lvl spare 2\necontrol overclock assembler1 lvl 0[]\n\n[lightgray]Делать шестерни или пластины — чего в ядре меньше:[]\n[#8fd8ff]sensor g core @eclipse-titanium-gear\nsensor p core @eclipse-titanium-plate\njump 5 lessThan g p\ncontrol config press1 @eclipse-titanium-plate\nend\ncontrol config press1 @eclipse-titanium-gear[]\n\n[lightgray]Зажечь лампу, когда машина встала:[]\n[#8fd8ff]esensor bad assembler1 stalled\ncontrol enabled illuminator1 bad[]\n\n[lightgray]Орбитальный удар по самому сильному врагу в радиусе (привяжите платформу):[]\n[#8fd8ff]radar enemy any any maxHealth platform1 1 u\njump 0 equal u null\nsensor x u @x\nsensor y u @y\ncontrol shoot platform1 x y 1[]\n\n[lightgray]Предупредить о большой волне:[]\n[#8fd8ff]esensor n scanner1 waveGround\nesensor t scanner1 waveTime\nprint "Next wave: "\nprint n\nprint " ground units in "\nprint t\nprintflush message1[]
eclipse-wiki.guide.compare.name = Сравнительные таблицы
eclipse-wiki.guide.compare.text = Генераторы, турели и юниты рядом — данные берутся прямо из игры, поэтому числа всегда соответствуют этой версии. Нажмите на любое имя, чтобы открыть его страницу.

# wiki entries: materials
wiki.eclipse-sulfur = Сера — побочный продукт переработки: Дистилляционная колонна выделяет её из сырой нефти, а Химический реактор — из дымовых газов. Большая часть идёт на Завод серной кислоты.\n\nЭто также едкие боеприпасы для Hail и Ripple: их снаряды разъедают вражескую броню, поэтому остальное оружие бьёт сильнее.
wiki.eclipse-polyethylene = Первая пластмасса ECLIPSE: полимеризуется из этилена в Реакторе давления с полимерным катализатором. Этилен получают из нафты в Паровом крекере, поэтому полиэтилену нужна вся нефтяная линия: Дистилляционная колонна, нагреватель и крекер.\n\nОн идёт на корпуса, печатные платы, упаковку микросхем и коррозионностойкие жидкостные блоки.
wiki.eclipse-lead-acid-cell = Перезаряжаемый элемент: свинцовые пластины, полиэтиленовый корпус и серная кислота. Его делает Сборщик, и из него строится Промышленная батарея. Хорошее первое применение для вашей линии серной кислоты.
wiki.eclipse-nickel = Самый распространённый новый металл. Никелевая руда встречается даже рядом с ядром; без неё промывайте дроблёный лом в Промывателе руды.\n\nНикель — основа суперсплава и часть магнитов AlNiCo, поэтому с середины игры он нужен постоянно.
wiki.eclipse-chromium = Твёрдый металл для жаропрочных сплавов, главным образом суперсплава. Его руда довольно распространена, но лежит чуть дальше от стартового ядра. Промыватель руды также выделяет его из лома.
wiki.eclipse-cobalt = Плотный металл, сохраняющий прочность сплавов при нагреве. Идёт в суперсплав и магниты AlNiCo. Его руда встречается на среднем расстоянии от ядра; её также выделяют Промыватель руды и Минеральный сепаратор.
wiki.tungsten = Крайне твёрдый металл. Его руда лежит далеко от ядра и требует лазерного бура или лучше. Её также можно вымыть из дроблёного лома или выщелочить из шлака.\n\nСпечённый с графитом, он становится карбидом вольфрама, из которого делают самый быстрый бур, пробивающие боеприпасы и механизмы поздней игры.
wiki.eclipse-lithium = Лёгкий реакционный металл, осаждаемый из рассола в Литиевом экстракторе, поэтому его может дать любая карта с водой. Он нужен Литиевым батареям и нескольким поздним модулям.
wiki.eclipse-superalloy = Основа середины и конца игры ECLIPSE. Доменная печь плавит никель, хром и кобальт, превращая их в суперсплав, и для этого нужно тепло от соседних нагревателей.\n\nСуперсплав идёт на рамы, оболочку топливных стержней, прочные стены, быстрые конвейеры и многие машины. Запланируйте отдельную линию заранее.
wiki.carbide = Вольфрам, спечённый с графитом в Электрической печи. Почти такой же твёрдый, как алмаз.\n\nПрименение: Карбидный бур, быстрые карбидные конвейеры и трубы, продвинутые модули и пробивающие боеприпасы для Duo, Fuse, Salvo и Spectre — очень эффективные против бронированного Доминиона.
wiki.eclipse-alumina = Окись алюминия, выщелачиваемая из боксита горячим гидроксидом натрия в Рафинировщике глинозёма. У неё одна задача: выплавиться в алюминий в прожорливом до энергии Электролизёре.
wiki.eclipse-hot-superalloy = Суперсплав прямо из Доменной печи, слишком горячий для использования. Отправьте его конвейером в Вакуумный охладитель с выбранным суперсплавом: он охлаждает его криофлюидом в пригодный суперсплав.
wiki.eclipse-hot-tungsten-carbide = Карбид вольфрама прямо из Электрической печи, слишком горячий для использования. Отправьте его конвейером в Вакуумный охладитель с выбранным карбидом вольфрама.
wiki.eclipse-hot-aluminium = Алюминий прямо из Электролизёра, слишком горячий для использования. Отправьте его конвейером в Вакуумный охладитель с выбранным алюминием.
wiki.eclipse-hot-surge-superalloy = Импульсный суперсплав прямо из Электрической печи, слишком горячий для использования. Отправьте его конвейером в Вакуумный охладитель с выбранным импульсным суперсплавом; для охлаждения нужна энергия V уровня.
wiki.eclipse-hot-titanium = Титан из Доменной печи, слишком горячий для использования. Его охлаждает Вакуумный охладитель (энергия II уровня). Титан из руды никогда не бывает горячим.
wiki.eclipse-hot-silicon = Кремний, восстановленный из песка графитом в дуге Электрической печи, слишком горячий для использования. Его охлаждает Вакуумный охладитель (энергия II уровня). Кремний из обычной доменной печи сразу готов к работе.
wiki.eclipse-hot-metaglass = Метастекло из Доменной печи, слишком горячее для использования. Его охлаждает Вакуумный охладитель (энергия II уровня).
wiki.eclipse-hot-reinforced-glass = Армированное стекло из Доменной печи, слишком горячее для использования. Его охлаждает Вакуумный охладитель (энергия II уровня).
wiki.eclipse-aluminium = Лёгкий проводящий металл, выплавляемый из глинозёма с анодами из нефтяного кокса (или переплавляемый из лома в Электрической печи) при огромном электрическом токе. Запланируйте достаточно энергии для Электролизёра.\n\nИспользуется в турбинах, теплообменниках, магнитах, роботах, первых быстрых конвейерах и многих машинах середины игры.
wiki.eclipse-high-purity-silicon = Кремний, очищенный до полупроводниковой чистоты в Рафинировщике кремния с помощью соляной кислоты и водорода. Из него травят микросхемы, и он также нужен прецизионным компонентам.
wiki.eclipse-microchip = Интегральные схемы, изготовленные на фабрике микросхем из высокочистого кремния, двух транзисторов и полиэтилена. Микросхемы — ключевой материал поздней игры: блоки управления, модули, роботы и большинство передовых машин используют их. Постройте несколько фабрик.
wiki.eclipse-reinforced-glass = Метастекло, сплавленное вокруг титановой сетки в доменной печи, которой требуется нагрев. Оно выдерживает давление и сильный мороз, поэтому из него строят криогенное и высоконапорное оборудование.
wiki.eclipse-surge-superalloy = Импульсный суперсплав, переплавленный в суперсплав в электрической печи. Один из прочнейших материалов в игре: стены финальной игры, экспериментальные ядра, титан и орбитальная платформа используют его.
wiki.eclipse-molybdenum = Тугоплавкий металл. Его руда встречается довольно часто; промыватель руды также отделяет его от дроблёного лома.\n\nМолибден идёт на электрические нагревательные элементы и служит катализатором реактора давления.
wiki.eclipse-vanadium = Извлекается из шлака и дроблёного лома. Главное применение — электролит ванадиевого проточного аккумулятора, самого большого аккумулятора; некоторые модули поздней игры тоже используют его.
wiki.eclipse-platinum = Самый редкий металл. Его руда лежит очень далеко от ядра; завод очистки платины растворяет следы платины из лома в царской водке, а промыватель руды находит её немного.\n\nПлатина — катализатор (удваивает скорость реактора давления и приводит в движение комплекс химического синтеза) и входит в экспериментальные ядра и легендарные модули.
wiki.eclipse-thorium-fuel-rod = Торий, запечатанный в оболочку из суперсплава сборщиком. Им заправляется реактор деления. Каждый отработавший стержень можно регенерировать азотной кислотой, чтобы вернуть торий, поэтому реактору не нужна бесконечная добыча.
wiki.eclipse-spent-fuel-rod = То, что остаётся после реактора деления. Не давайте ему скапливаться в реакторе: отправляйте на завод переработки топлива, который извлекает торий азотной кислотой (и оставляет кислые отходы, которые нужно нейтрализовать).
wiki.eclipse-polymer-catalyst = Катализатор на основе хлорида титана, получаемый в химическом реакторе из титана и хлора. Реактор давления и реактор давления удерживают его во время работы и расходуют лишь раз за несколько циклов, поэтому небольшого запаса хватает надолго.
wiki.eclipse-ammonium-nitrate = Сильный окислитель из азотной кислоты и аммиака. Химический реактор смешивает его с углём, получая взрывчатый состав, а минный заградитель может стрелять им прямо минами.
wiki.eclipse-copper-gear = Первый механический компонент, выштампованный из меди на прессе шестерён. Дешёвый и везде нужный в начале игры: базовые машины, сортеры, насосы и модули I уровня.
wiki.eclipse-titanium-rod = Титан, выдавленный через фильеру экструдером с графитом в качестве смазки. Стержни — начало титановых деталей: токарный станок делает из них болты, винты, кольца и пружины, они идут на каркасы и многие постройки.
wiki.eclipse-titanium-gear = Износостойкие шестерни с пресса шестерён. Промышленное оборудование, реакторы, быстрые конвейеры, прецизионные детали и модули II уровня требуют их.
wiki.eclipse-pressure-casing = Герметичная оболочка сосуда из сборщика. Каждый химический реактор, колонна и котёл нуждаются в них при постройке. Запаситесь несколькими десятками перед расширением химического производства.
wiki.eclipse-industrial-bearing = Прецизионные подшипники из сборщика. Всё, что быстро вращается, нуждается в них: турбины, буры, компрессоры, тяжёлые машины.
wiki.eclipse-superalloy-frame = Тяжёлый каркас машины, горячеформенный из суперсплава и титановых стержней в доменной печи (нужен нагрев). На нём строят крупные, горячие и высоконапорные машины.
wiki.eclipse-precision-component = Тонкие сборки из сборщика. Они открывают умную логистику, электронику и модули III уровня.
wiki.eclipse-experimental-core = Компонент высшего уровня: прецизионные детали вокруг импульсного суперсплава, платины и фазовой ткани. Нужен только для финальных машин и модулей IV уровня.
wiki.eclipse-copper-plate = Медь, раскатанная в лист на металлопрессе (уровень I). Раскатанная тоньше, она становится медной фольгой; из неё строят водоочистную станцию.
wiki.eclipse-lead-plate = Свинец, раскатанный в лист на металлопрессе (уровень I). Свинцово-кислотные ячейки строятся вокруг свинцовых пластин, и завод серной кислоты облицован ими, как настоящие свинцовые камеры.
wiki.eclipse-titanium-plate = Титан, раскатанный в лист на металлопрессе (уровень II). Корпуса давления — титановые пластины, болтами стянутые вокруг метастекла; реактор давления использует их.
wiki.eclipse-aluminium-plate = Алюминий, раскатанный в лист на металлопрессе (уровень III). Из него строят теплообменники, и он раскатывается дальше в алюминиевую фольгу.
wiki.eclipse-superalloy-plate = Суперсплав, раскатанный в лист на металлопрессе (уровень III). Из него строят рамы из суперсплава и реактор деления.
wiki.eclipse-tungsten-plate = Вольфрам, раскатанный в лист на металлопрессе (уровень III). Броня для копра и экранирование реактора деления.
wiki.eclipse-copper-foil = Медная пластина, раскатанная тонко на металлопрессе (уровень I). Печатные платы — медная фольга на полиэтилене, и литиевые аккумуляторы используют её как токосъёмник анода, как и настоящие.
wiki.eclipse-aluminium-foil = Алюминиевая пластина, раскатанная тонко на металлопрессе (уровень III). Токосъёмник катода литиевых аккумуляторов и электроды конденсаторов.
wiki.eclipse-tungsten-rod = Вольфрам, выдавленный экструдером с графитом (уровень III). Электрические нагреватели и электрическая печь используют его для нагревательных элементов и электродов.
wiki.eclipse-aluminium-wire = Алюминий, вытянутый экструдером (уровень III). Литиевые и ванадиевые проточные аккумуляторы соединяются им.
wiki.eclipse-titanium-bolt = Выточен из титанового стержня на токарном станке (уровень II). Корпуса давления и рамы из суперсплава стягиваются ими, а с нарезанной резьбой они становятся винтами.
wiki.eclipse-titanium-screw = Титановый болт с резьбой, нарезанной на токарном станке (уровень II). Прецизионные детали и блоки управления свинчиваются ими.
wiki.eclipse-titanium-ring = Выточен из титанового стержня на токарном станке (уровень II). Дорожки качения промышленных подшипников и фланцы паровых турбин.
wiki.eclipse-titanium-spring = Свит из титанового стержня на токарном станке (уровень II). Умная логистика, такая как пакетный шлюз и умный разгружатель, использует их.
wiki.eclipse-superalloy-gear = Выштампован из суперсплава на прессе шестерён (уровень III). Для самых напряжённых приводов: карбидного бура и балансировщика линий.
wiki.eclipse-magnet-wire = Медная проволока, покрытая эпоксидным лаком в экструдере (уровень III), поэтому витки обмотки не замыкаются. Обмотки двигателей с постоянными магнитами и генератора метановой турбины делают её.
wiki.eclipse-resistor = Графит и медная проволока, сделанные в сборщике схем (уровень II). Печатные платы и датчики используют их.
wiki.eclipse-capacitor = Алюминиевая фольга и полиэтилен, сделанные в сборщике схем (уровень III). Печатные платы используют их, а конденсатор Эфирита — это батарея из них.
wiki.eclipse-transistor = Высокочистый кремний, медная проволока и полиэтилен, сделанные в сборщике схем (уровень III). Печатные платы, датчики и излучатели используют их.
wiki.eclipse-insulated-cable = Медная проволока в оболочке из синтетического каучука, сделанная в сборщике схем (уровень III). Промышленные аккумуляторы и глушитель соединяются ею.
wiki.eclipse-electric-motor = Обмотки из медной проволоки вокруг титанового стержня-вала, в корпусе из титановой пластины, стянутом болтами; собирается сборщиком (уровень II). Насосные узлы, поршни и блоки управления строятся вокруг него.
wiki.eclipse-permanent-magnet-motor = Обмотка из эмалированной проволоки вокруг ротора из магнита AlNiCo, собранная сборщиком (уровень III). Меньше и сильнее обмоточного двигателя: паровые турбины и карбидный бур используют его.
wiki.eclipse-superconducting-motor = Обмотки из сверхпроводника в корпусе из суперсплава, охлаждаемые жидким азотом при сборке в сборщике (уровень V). Производственный комплекс «Титан» и решётчатый бур приводятся ими.
wiki.eclipse-pump-unit = Электродвигатель, ротор, два титановых кольца и титановая пластина, собранные сборщиком (уровень II). Промышленные котлы и установка разделения воздуха перекачивают ими.
wiki.eclipse-piston = Электродвигатель, вращающий титановый стержень в цилиндре из титановой пластины, с пружинами; собран сборщиком (уровень II). Копёр и Тремор бьют ими.
wiki.eclipse-rotor = Титановые пластины, привинченные к ступице-кольцу из титана в сборщике (уровень II). Насосные узлы, вентилятор градирни и метановая турбина используют их.
wiki.eclipse-heating-coil = Титановые стержни и молибден (его силицид даёт хорошие нагреватели), собранные сборщиком (уровень III). Электрический нагреватель и электрическая печь греют ими.
wiki.eclipse-sensor = Собрана сборщиком (уровень III) из транзистора, резисторов, высокочистого кремния и армированного стекла. Прецизионные детали и излучатели строятся на ней, и волновой сканер разведки смотрит через них.
wiki.eclipse-emitter = Датчик, транзисторы, платина и армированное стекло, собранные сборщиком (уровень IV). Глушитель и массив подавления волн излучают через них.
wiki.eclipse-soda-ash = Карбонат натрия, получаемый в химическом реакторе из гидроксида натрия и углекислого газа (2 NaOH + CO2). В настоящем стекловарении песок сплавляют с содой, и настоящий литий из рассола осаждают ею как карбонат лития: доменная печь и экстрактор лития используют её. Хорошее применение для CO2 из газосепаратора, ферментера и электрической печи.
wiki.eclipse-petroleum-coke = Остаток, оставшийся на дне колонны перегонки и подвергнутый коксованию. Настоящие графитовые электроды — графитизированный нефтяной кокс: электрическая печь превращает его в графит (уровень III), а электролизёр сжигает его как аноды алюминиевых ячеек.
wiki.eclipse-diesel = Средний дистиллят с передней стороны колонны перегонки. Смешанный с аммиачной селитрой, он даёт ANFO (взрывчатый состав) в химическом реакторе, а завод переработки топлива несёт в нём свой экстрагент, как настоящие заводы PUREX используют керосин.
wiki.eclipse-argon = Около 1% воздуха, с передней стороны установки разделения воздуха. Электрическая печь ведёт дугу по импульсному сплаву под аргоном, как настоящая дуговая плавка идёт в инертном газе.
wiki.eclipse-heavy-water = Вода, водород которой — дейтерий, около 1 части на 6400 в природной воде. Лёгкая вода разлагается быстрее, поэтому при долгом электролизе тяжёлая вода остаётся: рецепт тяжёлой воды в электролизёре даёт её тонкой струйкой спереди, с водородом и кислородом по бокам. Электролизуйте её снова, чтобы получить дейтерий.
wiki.eclipse-deuterium = Тяжёлый водород, полученный электролизом тяжёлой воды. Термоядерный реактор синтезирует его с тритием, который выращивается из лития; стадия «Удержание» Мирового двигателя требует большого запаса.
wiki.eclipse-liquid-sodium = Металлический натрий, полученный электролизом рассола в электролизёре (настоящие заводы используют расплав соли). Хладагент реактора-размножителя: он уносит тепло, не замедляя быстрые нейтроны, которые создают новое топливо.
wiki.eclipse-magnesium = Получается из рассола в электролизёре, как в процессе Дау: хлорид магния из рассола электролизируют в расплаве (с соляной кислотой; выделяется хлор). Доменная печь использует его для восстановления хлорида титана до титана (процесс Кролла), а химический реактор смешивает его с аммиачной селитрой в пиратит, ведь магний — классический зажигательный состав.
wiki.eclipse-pentlandite = Сульфид никеля и железа, главная никелевая руда. Настоящие никелевые руды содержат кобальт и металлы платиновой группы. То, что роняют жилы никеля. Три способа получить никель: раздробить и отсортировать в дробилке руды (1 никеля на руду), обогатить во флотационной камере с водой (1.5 на руду, с кобальтом) или выщелочить серной кислотой и выделить электролизом в электролизёре (2 на руду, с кобальтом и небольшим количеством платины — большая часть мировой платины на самом деле получается при очистке никеля; кислые отходы).
wiki.eclipse-chromite = Оксид хрома и железа, единственная руда хрома. То, что роняют жилы хрома. Три способа получить хром: раздробить и отсортировать в дробилке руды (1 хрома на руду), обогатить во флотационной камере с водой (1.5 на руду) или выщелочить серной кислотой и выделить электролизом в электролизёре (2 на руду; кислые отходы).
wiki.eclipse-cobaltite = Сульфоарсенид кобальта, руда кобальта, содержащая никель. То, что роняют жилы кобальта. Три способа получить кобальт: раздробить и отсортировать в дробилке руды (1 кобальта на руду), обогатить во флотационной камере с водой (1.5 на руду, с никелем) или выщелочить серной кислотой и выделить электролизом в электролизёре (2 на руду, с никелем; кислые отходы).
wiki.eclipse-wolframite = Вольфрамат железа и марганца, главная руда вольфрама. Молибден часто встречается вместе с ней. То, что роняют жилы вольфрама. Три способа получить вольфрам: раздробить и отсортировать в дробилке руды (1 вольфрама на руду), обогатить во флотационной камере с водой (1.5 на руду, с молибденом) или выщелочить серной кислотой и выделить электролизом в электролизёре (2 на руду, с молибденом; кислые отходы).
wiki.eclipse-molybdenite = Дисульфид молибдена, руда молибдена. То, что роняют жилы молибдена. Три способа получить молибден: раздробить и отсортировать в дробилке руды (1 молибдена на руду), обогатить во флотационной камере с водой (1.5 на руду, с серой) или выщелочить серной кислотой и выделить электролизом в электролизёре (2 на руду, с серой; кислые отходы).
wiki.eclipse-sperrylite = Арсенид платины, руда платины, встречающаяся с никелевыми месторождениями. То, что роняют жилы платины. Три способа получить платину: раздробить и отсортировать в дробилке руды (1 платины на руду), обогатить во флотационной камере с водой (1.5 на руду, с никелем) или выщелочить серной кислотой и выделить электролизом в электролизёре (2 на руду, с никелем; кислые отходы).
wiki.eclipse-copper-wire = Тянутая медь из экструдера. Электрические машины, нагреватели, аккумуляторы и синтез сверхпроводника используют её.
wiki.eclipse-circuit-board = Медные дорожки на полиэтилене, травленные соляной кислотой в сборщике схем. Кислота уходит как кислые отходы, поэтому рядом с принтером нужен нейтрализатор. Блоки управления, умная логистика и интерфейсы улучшений используют платы.
wiki.eclipse-control-unit = Контроллер на микросхеме с приводом двигателя, собранный из микросхем, печатных плат и магнитов AlNiCo. Он автоматизирует передовые буры, умную логистику, реакторы и сборщики.
wiki.eclipse-alnico-magnet = Магнит из алюминия, никеля и кобальта, выплавленный в электрической печи (энергия, без нагрева). Двигатели, турбины, блоки управления и дроны используют его.
wiki.eclipse-crushed-ore = Лом и порода, раздробленные в дробилке руды. Промойте их в промывателе руды, чтобы разделить металлы. Это способ получить металлы ECLIPSE на любой карте.
wiki.eclipse-aetherite = Редкий энергетический кристалл. Месторождения лежат дальше всего от ядра и требуют карбидного бура; промыватель руды изредка находит их.\n\nЭфирит питает модули V уровня, конденсаторы Эфирита, сверхпроводники и удары орбитальной платформы вооружения.
wiki.eclipse-superconductor = Самый передовой материал, синтезируемый в комплексе химического синтеза из медной проволоки и эфирита в азотной кислоте, под давлением, над платиной, с охлаждением жидким азотом. Мировой двигатель, массив временной интерференции и орбитальная платформа вооружения требуют его.
wiki.eclipse-synthetic-rubber = Каучук, полимеризованный из этилена и пропилена с полимерным катализатором и вулканизированный серой. Уплотнения и ремни для передовых машин.
wiki.eclipse-epoxy-resin = Твёрдо застывающая смола из пропилена, хлора и гидроксида натрия. Она связывает углеродное волокно в углеродный композит.
wiki.eclipse-carbon-fiber = Акрилонитрил, пряденный и карбонизированный при очень высокой температуре в печи углеродного волокна. Спрессованный с эпоксидной смолой, он становится углеродным композитом.
wiki.eclipse-carbon-composite = Углеродное волокно, залитое эпоксидной смолой: лёгкое и невероятно прочное. Композитные стены, роботы, поздние юниты и орбитальная платформа строятся из него.
wiki.eclipse-biomass = Растительная и водорослевая масса из культиватора биомассы или фотобиореактора водорослей. Сбродите её в биотопливо, извлеките ферменты или переварите в метан и удобрение.
wiki.eclipse-fertilizer = Питает выращиватели биомассы. Делайте его из аммиака и серной кислоты в химическом реакторе или как перегной из анаэробного реактора.
wiki.eclipse-enzyme-extract = Биологические катализаторы из биомассы и споровых капсул. Держите немного в биохимическом ферментере, и он работает вдвое быстрее; расходуются они медленно.
wiki.eclipse-biofuel = Этанол, сброженный из биомассы. Сжигайте его в двигателях на биотопливе для энергии: возобновляемая альтернатива нефти.

# wiki entries: liquids and gases
wiki.eclipse-purified-water = Вода, лишённая минералов на водоочистной станции. Электролиз, котлы и многие чувствительные процессы требуют её. Топливные элементы и паровые турбины возвращают часть, поэтому замкнутый цикл почти ничего не теряет.
wiki.eclipse-brine = Концентрированная солёная вода, второй продукт очистки воды. Не давайте ей скапливаться: отправляйте в электролизёр или экстрактор лития.
wiki.eclipse-hydrochloric-acid = Сильная кислота, получаемая сжиганием водорода в хлоре. Она растворяет металлы из лома, очищает кремний и травит печатные платы.\n[scarlet]Коррозионная:[] перевозите её только по полимерным трубопроводам или трубопроводам из металлов ECLIPSE.
wiki.eclipse-oxygen = Получается электролизом и разделением воздуха. Топливным элементам, серной кислоте и акрилонитрилу нужен он.
wiki.eclipse-chlorine = Токсичный газ из электролизёра. Он становится соляной кислотой, полимерным катализатором, эпоксидной смолой и титаном из песка.\n[scarlet]Коррозионный:[] только полимерные трубопроводы.
wiki.eclipse-methane = Лёгкий топливный газ из колонны перегонки или анаэробного реактора. Сжигайте его в турбинах и промышленных нагревателях или крекируйте в графит и водород.
wiki.eclipse-naphtha = Лёгкая нефтяная фракция из колонны перегонки. Установка парового крекинга превращает её в этилен.
wiki.eclipse-ethylene = Получается из нафты на установке парового крекинга. Основа полиэтилена и синтетического каучука.
wiki.eclipse-sulfuric-acid = Сера, сожжённая в кислороде и поглощённая водой. Аккумуляторы, выщелачивание металлов, удобрения, минеральный сепаратор и электровыделение используют её. Завод выделяет отходящее тепло, которое можно рекуперировать.\n[scarlet]Коррозионная.[]
wiki.eclipse-sodium-hydroxide = Сильное основание из электролизёра. Оно нейтрализует кислые отходы, очищает глинозём, поглощает дымовые газы и даёт соду для стекла без свинца.\n[scarlet]Коррозионное.[]
wiki.eclipse-acidic-waste = Отработанная кислота после выщелачивания, травления, электровыделения и регенерации топлива. Если ей некуда идти, машина, которая её производит, останавливается. Направьте её в химический реактор; модули восстановления отходов превращают часть обратно в кислоту.\n[scarlet]Коррозионная.[]
wiki.eclipse-ammonia = Синтезируется из азота и водорода в реакторе давления. Основа азотной кислоты, удобрений, аммиачной селитры и акрилонитрила.
wiki.eclipse-nitric-acid = Делается из аммиака в реакторе давления (вдвое быстрее с платиной). Применяется для нитратов, царской водки, регенерации топлива и сверхпроводников.\n[scarlet]Коррозионная.[]
wiki.eclipse-steam = Получается в промышленном котле из очищенной воды и тепла. Паровые турбины превращают его в энергию и возвращают большую часть воды.
wiki.eclipse-liquid-nitrogen = Азот, сконденсированный в криогенном конденсаторе. Лучший хладагент для турелей (холоднее криофлюида): он замораживает юниты, в которые попадает, и комплекс химического синтеза требует его для охлаждения.
wiki.eclipse-aqua-regia = Смесь соляной и азотной кислот; единственная кислота, растворяющая платину. Завод очистки платины использует её.\n[scarlet]Коррозионная.[]
wiki.eclipse-flue-gas = Дымовые газы от сжигания метана, биотоплива и отходов. Если их не отвести трубопроводом, они просто уходят в атмосферу, поэтому ничего не блокируют. Подведённые к химическому реактору, они дают серу; к газосепаратору — азот и углекислый газ.
wiki.eclipse-carbon-dioxide = Улавливается из дымовых газов газосепаратором или выделяется ферментером. Превратите его в метанол или подавайте в фотобиореактор водорослей.
wiki.eclipse-wastewater = Грязная вода после газоочистки и химических заводов. Она забивает их и останавливает, если её не отводить: водоочистная станция превращает её в очищенную воду и осадок.
wiki.eclipse-industrial-sludge = Твёрдые частицы, отфильтрованные из сточных вод. Сожгите их в установке термической переработки отходов, чтобы получить лом и песок, или позвольте бактериям переварить их в метан и удобрение.
wiki.eclipse-methanol = Делается из углекислого газа и водорода. Он начинает путь от метанола к пластикам: реактор давления превращает его в пропилен.
wiki.eclipse-propylene = Реактивный газ из метанола. Идёт в эпоксидную смолу, синтетический каучук и акрилонитрил.
wiki.eclipse-acrylonitrile = Токсичный мономер из пропилена, аммиака и кислорода. Печь углеродного волокна прядёт и карбонизирует его в углеродное волокно.
wiki.eclipse-chilled-water = Вода, охлаждённая испарением в градирне. Дешёвый хладагент для турелей и соединителей: лучше воды, но хуже криофлюида.

# wiki entries: ores
wiki.eclipse-ore-bauxite = Руда алюминия, довольно распространённая и встречающаяся от ядра наружу, поскольку алюминий нужен с середины игры. Её добывает любой базовый бур. На карте нет бокситов? Электрическая печь переплавляет лом в алюминий.
wiki.eclipse-bauxite = Руда алюминия. Завод глинозёма переваривает её в горячем гидроксиде натрия (процесс Байера), а электролизёр выплавляет из глинозёма алюминий.
wiki.eclipse-red-mud = То, что остаётся от бокситов после производства глинозёма: оксиды железа и титана. Это отходы, поэтому убирайте их конвейером от завода глинозёма, иначе он остановится; электрическая печь выплавляет из них титан, как из настоящего красного шлама извлекают металлы.
wiki.eclipse-flotation-cell = Пенная флотация — так обогащают большинство реальных руд: минералы руды размалывают в воде, а нужный минерал всплывает с пеной. 4 руды дают 6 металла (1.5 на руду) и побочный продукт: кобальт из пентландита, никель из кобальтита и спериллита, молибден из вольфрамита, сера из молибденита. Энергия II уровня; нужна вода. Между дробилкой руды (1 на руду) и выщелачиванием в электролизёре (2 на руду).
wiki.eclipse-ore-nickel = Самая распространённая руда ECLIPSE; жилы могут появляться рядом со стартовым ядром. Её добывает любой базовый бур.
wiki.eclipse-ore-chromium = Распространённая руда, встречающаяся немного дальше от стартового ядра.
wiki.eclipse-ore-cobalt = Встречается на среднем расстоянии от стартового ядра, жилами поменьше, чем никель.
wiki.eclipse-ore-tungsten = Твёрдая руда вдали от стартового ядра. Требуется лазерный бур или лучше.
wiki.eclipse-ore-molybdenum = Довольно распространённая руда, встречающаяся недалеко от стартового ядра.
wiki.eclipse-ore-platinum = Самая редкая руда металла: маленькие жилы очень далеко от стартового ядра.
wiki.eclipse-ore-aetherite = Энергетические кристаллы в маленьких месторождениях, дальше всего от стартового ядра. Добывайте их карбидным буром.

# wiki entries: water and basic chemistry
wiki.eclipse-water-treatment-plant = Корень химической промышленности. Подайте воду (и энергию): очищенная вода выходит слева, рассол — справа.\nОба продукта должны иметь куда уходить, иначе станция остановится: отправьте рассол в электролизёр или экстрактор лития.
wiki.eclipse-acid-leaching-vat = Чан кислотного выщелачивания растворяет лом в соляной кислоте и извлекает титан, медь и свинец. Кислые отходы выходят жидкостью и должны отводиться, обычно в химический реактор. Хорошее применение для лома стен и отходов добычи песка.
wiki.eclipse-distillation-column = Разделяет сырую нефть: нафта выходит слева, метан (нефтяной газ) справа, дизель спереди; тяжёлый остаток коксуется в нефтяной кокс, а сера извлекается из кислого газа (на настоящем НПЗ — гидрообессериванием и установкой Клауса; здесь это встроено в колонну). Здесь начинается маршрут нефти к пластикам, топливу, графиту и кислоте.
wiki.eclipse-steam-cracker = Крекирует нафту в этилен паром. Ему также нужен нагрев: направьте на него промышленный или электрический нагреватель.
wiki.eclipse-sulfuric-acid-plant = Сжигает серу в кислороде и поглощает её водой, получая серную кислоту. Реакция выделяет отходящее тепло спереди: поставьте там теплообменник и промышленный котёл, чтобы превратить его в пар.
wiki.eclipse-air-separation-unit = Сжижает воздух и разделяет его на азот (слева), кислород (справа) и немного аргона (спереди). Для охлаждения нужен криофлюид. Для азота без криофлюида используйте газосепаратор на дымовых газах.
wiki.eclipse-platinum-refinery = Растворяет следы платины из лома царской водкой. Медленно, но платину можно получить где угодно. Его кислые отходы нужно нейтрализовать.
wiki.eclipse-gas-separator = Разделяет дымовые газы мембранами: азот слева, углекислый газ справа. Источник азота без криофлюида и источник CO2 для метанола и водорослей.
wiki.eclipse-wastewater-treatment-plant = Отстаивает сточные воды до очищенной воды и промышленного осадка. Поставьте его после газоочистных установок и маршрута метанола.
wiki.eclipse-thermal-waste-processor = Сжигает промышленный осадок с теплом от соседних нагревателей, извлекая лом и песок. Выделяет дымовые газы.
wiki.eclipse-carbon-fiber-furnace = Прядёт акрилонитрил в волокно и карбонизирует его. Ему нужно много тепла, поэтому запланируйте два нагревателя или сеть теплообменников. Выделяет дымовые газы.
wiki.eclipse-composite-press = Укладывает углеродное волокно в эпоксидную смолу и отверждает его в углеродный композит — конец маршрута метанола.
wiki.eclipse-cryogenic-condenser = Конденсирует азот в жидкий с помощью криофлюида. Работает быстрее на льду и снегу.
wiki.eclipse-cooling-tower = Охлаждает воду испарением в градирне, получая дешёвый хладагент. Часть воды теряется. Работает быстрее на льду и снегу.
wiki.eclipse-chemical-synthesis-complex = Вершина химии: делает сверхпроводники из медной проволоки и эфирита в азотной кислоте. Его нужно держать под давлением, в нём есть платиновый катализатор, который постепенно расходуется, и требуется охлаждение жидким азотом. Готовьтесь построить большую часть химической промышленности до него.

# wiki entries: metallurgy
wiki.eclipse-mineral-separator = Выщелачивает расплавленный шлак серной кислотой и разделяет ванадий и хром, которые на самом деле есть в сталелитейном шлаке. Подавайте шлак из стандартного плавильника или сепаратора. Никель, кобальт, молибден и вольфрам получают из руд или из раздробленного и промытого лома.
wiki.eclipse-lithium-extractor = Осаждает литий из рассола содой (как карбонат лития, так получают настоящий литий из рассолов). Хорошее применение рассолу после очистки воды и нейтрализации.
wiki.eclipse-alumina-refinery = Переваривает бокситы в горячем гидроксиде натрия и осаждает глинозём — процесс Байера, с которого начинается каждый настоящий алюминиевый завод. Ему нужно тепло. Остаток выходит красным шламом: убирайте его конвейером (подойдёт и инсинератор), иначе завод остановится; электрическая печь может выплавить из него титан.
wiki.eclipse-blast-furnace = Печь на нагреве. Направьте на неё нагреватели (промышленные, электрические или геотермальные — через теплообменники или тепловые аккумуляторы). Горячий суперсплав из никеля, хрома и кобальта (8 тепла, энергия III уровня); рамы из суперсплава, горячеформенные из пластин суперсплава, титановых стержней и болтов (8 тепла, III уровень); известково-содовое стекло из песка с содовым флюсом (6 тепла, II уровень); армированное стекло из метастекла и титана (5 тепла, II уровень); горячий титан по процессу Кролла: песок хлорируют углём, хлорид титана восстанавливают магнием под аргоном (10 тепла, III уровень). Ниже требуемого тепла рецептуры печь останавливается. Суперсплав и стекло выходят горячими: их охлаждает вакуумный охладитель.\n\n!warn Самая частая ошибка: мало тепла|Нагреватель даёт полное тепло, только если вся его сторона касается печи. Два электрических нагревателя с двух сторон дают 4 + 4 = 8 — ровно столько, сколько нужно суперсплаву.\n\n!next Что дальше|Всё, что она производит, выходит горячим. Охладите это в вакуумном охладителе: один охладитель справляется с тремя печами, делающими суперсплав (полная линия на вкладке «Примеры постройки»).
wiki.eclipse-electric-furnace = Печь только на энергии: индукционная плавка алюминия, никеля и кобальта в магниты AlNiCo (уровень III), спекание вольфрама и графита с кобальтовой связкой в карбид вольфрама (уровень III), кремний из песка и графита в дуге — настоящий способ (уровень II; углекислый газ выходит и просто уходит в атмосферу, если его не отвести трубопроводом), графит из нефтяного кокса (уровень III), вторичный алюминий из лома (уровень III; алюминий на любой карте), титан из красного шлама (уровень III) и дуга под аргоном, сплавляющая импульсный сплав в суперсплав (уровень V, 7680 энергии/с). Карбид и импульсный суперсплав выходят горячими: их охлаждает вакуумный охладитель. Строится с нагревательными катушками.\n\n!next Что дальше|Её металлы выходят горячими: охладите их в вакуумном охладителе перед использованием.
wiki.eclipse-pressure-reactor = Большой синтетический сосуд. Нажмите, чтобы выбрать: [accent]аммиак[] (процесс Габера — Боша: азот + 3 водорода, нужно 80% давления), [accent]метанол[] (углекислый газ + 3 водорода, 60% давления), [accent]олефины[] (метанол в пропилен слева и сточные воды справа), [accent]азотная кислота[] (процесс Оствальда: аммиак сжигается с кислородом над платиновой сеткой; одной платины хватает на 60 циклов), [accent]акрилонитрил[] (пропилен, аммиак и кислород над молибденовым катализатором; по 30 циклов на катализатор), [accent]полиэтилен[] и [accent]синтетический каучук[] (над полимерным катализатором; по 12 циклов). Давление растёт с энергией и утекает, пока реактор простаивает. Всё уровня III.
wiki.eclipse-chemical-reactor = Рабочая лошадка мелкосерийной химии. Нажмите, чтобы выбрать реакцию: [accent]соляная кислота[] (водород + хлор) и [accent]нейтрализация[] кислых отходов гидроксидом натрия в рассол (солёная вода, обратно в хлор-щелочной процесс), [accent]сода[] (гидроксид натрия, карбонизированный уловленным углекислым газом), [accent]очистка дымовых газов[] (гидроксид натрия улавливает диоксид серы, серная кислота выходит слева, сточные воды справа) (уровень II); [accent]пиратит[] (магний и аммиачная селитра); [accent]царская водка[] (3 соляной : 1 азотной кислоты), [accent]аммиачная селитра[] (аммиак + азотная кислота), [accent]удобрение[] (аммиак + серная кислота), [accent]полимерный катализатор[] (хлор титана хлором), [accent]эпоксидная смола[] (пропилен, хлор и гидроксид натрия; сточные воды на выходе) и [accent]взрывчатый состав[] (ANFO: аммиачная селитра + дизель) (уровень III).\n\n!warn Кислотам нужны правильные трубы|Обычные трубопроводы корродируют. Используйте полимерные или плакированные трубопроводы для кислот и хлора и обеспечьте каждому отходу путь.
wiki.eclipse-electrolyzer = Вся электролизация в одной машине. Нажмите, чтобы выбрать: [accent]вода[] (очищенная вода в водород слева и кислород справа, 2:1, уровень II), [accent]хлор-щелочной процесс[] (рассол в хлор слева, водород справа и гидроксид натрия спереди, уровень II), [accent]Холл — Эру[] (глинозём с анодами из нефтяного кокса в горячий алюминий, уровень III) [accent]магний[] (из рассола с соляной кислотой, уровень III), [accent]выщелачивание руды[] (минерал руды растворяется серной кислотой и выделяется электролизом: 2 металла на руду, плюс побочные продукты, такие как кобальт и платина из пентландита; кислые отходы на выходе; уровень III) или [accent]электровыделение[] (лом растворяется серной кислотой и осаждается медью и свинцом, уровень II; отработанная кислота уходит как кислые отходы). [accent]Тяжёлая вода[] (долгий электролиз очищенной воды концентрирует D2O: тонкой струйкой спереди, водород слева, кислород справа, уровень III), [accent]дейтерий[] (тяжёлая вода в дейтерий слева и кислород справа, уровень III) и [accent]натрий[] (рассол в жидкий натрий слева и хлор справа, уровень III) питают термоядерный реактор и реактор-размножитель. Стороны выхода поворачиваются вместе с машиной; при установке их показывают стрелки.\n\n!warn Каждая жидкость выходит со своей стороны|Рецепты с несколькими жидкими продуктами выводят каждый через фиксированную сторону относительно направления машины. Цветные стрелки показывают их при установке, а вкладка «Примеры постройки» показывает все рецепты с правильными трубами.
wiki.eclipse-vacuum-freezer = Металлы середины игры и позже выходят из печей горячими и не могут использоваться, пока не остынут. Вакуумный охладитель закаливает их в вакуумной камере криофлюидом, который расходуется. Если ничего не выбрано, он охлаждает любой приходящий горячий материал, поэтому один охладитель может принимать смешанную ленту; выберите материал, чтобы охлаждать только его. Титан, кремний, метастекло и армированное стекло требуют энергии II уровня (120/с); суперсплав, карбид вольфрама и алюминий — III уровня (480/с); импульсный суперсплав — V уровня. Титан, кремний и метастекло из стандартных машин никогда не бывают горячими.\n\n!tip Один охладитель, много печей|Он охлаждает 2 горячих суперсплава в секунду — столько, сколько делают три доменные печи. Если ничего не выбрано, он принимает смешанную ленту горячих металлов.
wiki.eclipse-silicon-refinery = Очищает кремний до полупроводникового качества соляной кислотой и водородом. Питает фабрику микросхем.
wiki.eclipse-ore-crusher = Две задачи. Лом: дробится в дроблёную руду (для промывателя руды) и песок на любой карте (уровень I). Минералы руды жил ECLIPSE: дробятся и сортируются в металл, 1 металла на руду, без побочных продуктов (уровень II). Чтобы получить больше металла на руду, используйте флотационную камеру (1.5) или выщелачивание в электролизёре (2).
wiki.eclipse-ore-washer = Промывает дроблёную руду водой и разделяет никель, хром, кобальт, молибден, ванадий, вольфрам, немного платины и изредка эфирит. Сортируйте её смешанный выход трёхходовым сортером или улучшенным фильтром предметов.
wiki.eclipse-methane-pyrolysis-reactor = Крекирует метан в графит и водород с нагревом: графит без угля и водород для химии.
wiki.eclipse-carbide-drill = Скорость пневмобура на площадке 3x3, почти вдвое выше лазерного бура: на твёрдых рудах он соответствует пневмобуру 4x4, а его карбидные коронки делают так, что твёрдые руды (титан, торий, вольфрам, эфирит) замедляют его вдвое меньше, чем другие буры. Вода ускоряет его так же, как пневмобур. Необходим для эфирита.

# wiki entries: components and electronics
wiki.eclipse-gear-press = Прессует все шестерни: нажмите и выберите, какую делать. Медные шестерни требуют энергии I уровня (30/с), титановые — II (120/с), суперсплавовые — III (480/с). Одна из первых машин ECLIPSE, которые стоит построить.
wiki.eclipse-extruder = Проталкивает металл через фильеру в стержни и проволоку: медная проволока (уровень I, 30 энергии/с), титановые стержни с графитовой смазкой (уровень II, 120/с), вольфрамовые стержни с графитом, алюминиевая проволока и эмалированная проволока (медная проволока в эпоксидном лаке, для обмоток двигателей) (уровень III, 480/с). Нажмите, чтобы выбрать, что делать.
wiki.eclipse-metal-press = Прокатный стан для пластин и фольги. Медные и свинцовые пластины (уровень I) идут на ранние машины и свинцово-кислотные ячейки; титановые (уровень II) — на корпуса давления; алюминиевые, суперсплавовые и вольфрамовые (уровень III) — на теплообменники, рамы, реакторы и броню. Пластины прокатываются дальше в медную и алюминиевую фольгу для печатных плат, аккумуляторов и конденсаторов.
wiki.eclipse-lathe = Точит титановые стержни в мелкие детали, из которых болтами собирают машины: болты и винты (корпуса давления, рамы, прецизионные детали, блоки управления), кольца (дорожки подшипников, фланцы турбин) и пружины (умная логистика). Энергия II уровня (120/с).
wiki.eclipse-assembler = Сердце механического производства: оно собирает детали, из которых сделана каждая передовая машина, и компоненты из них. Детали: электродвигатель (обмотки медной проволоки, стержень, пластина, болты; уровень II), двигатель с постоянными магнитами (эмалированная проволока и магнит AlNiCo; уровень III), сверхпроводящий двигатель (сверхпроводник, охлаждённый жидким азотом; уровень V), ротор, насосный узел и поршень (уровень II), нагревательная катушка (вольфрам и молибден; уровень III), датчик (уровень III) и излучатель (уровень IV). Компоненты: корпуса давления и промышленные подшипники (уровень II), прецизионные детали, свинцово-кислотные ячейки (подаётся серная кислота) и топливные стержни (уровень III). Нажмите, чтобы выбрать; наведите на вариант, чтобы увидеть рецепт.
wiki.eclipse-experimental-core-assembler = Собирает экспериментальные ядра, компонент высшего уровня, из прецизионных деталей, импульсного суперсплава, платины и фазовой ткани.
wiki.eclipse-component-depot = Хранилище только для компонентов, деталей и форменного металла (шестерни, пластины, фольга, стержни, проволока, болты, винты, кольца, пружины, двигатели, насосы, датчики...). Ставьте его в конце линий компонентов: он держит ваше ядро снабжённым до 200 каждого компонента из любой точки карты, так что вы всегда можете строить, не таща всё на конвейерах к ядру. С ядром он никогда не объединяется.
wiki.eclipse-circuit-assembler = Собирает схемы с нуля: резисторы (графит и медная проволока, уровень II), конденсаторы (алюминиевая фольга и полиэтилен), транзисторы (высокочистый кремний, медная проволока, полиэтилен) и изолированный кабель (медная проволока в синтетическом каучуке) — все уровня III. Печатная плата — медная фольга на полиэтилене с резисторами, конденсатором и транзистором, травленная соляной кислотой; её кислые отходы должны идти в нейтрализатор, иначе машина остановится. Блок управления — микросхема на печатных платах, управляющая электродвигателем (уровень IV).
wiki.eclipse-chip-fabricator = Травит микросхемы из высокочистого кремния, медной проволоки и полиэтилена.

# wiki entries: heat and power
wiki.eclipse-industrial-heater = Сжигает метан в тепло и отдаёт его в сторону, куда повёрнут. Дымовые газы уходят в атмосферу, если их не отвести трубопроводом.
wiki.eclipse-electric-heater = Превращает энергию в тепло. Без топлива и выхлопа: простейший нагреватель, если у вас есть лишняя энергия.
wiki.eclipse-geothermal-heat-tap = Даровое тепло без топлива, но строить его можно только на горячей породе или магматической породе. Чем горячее грунт под ним, тем больше тепла.
wiki.eclipse-heat-exchanger = Собирает тепло с задней и боковых сторон и отдаёт его спереди. Используйте его, чтобы провести тепло за углом или собрать отходящее тепло реакций.
wiki.eclipse-thermal-storage = Пропускает тепло, как теплообменник, и накапливает его. Когда нагреватели выключаются (например, заканчивается топливо), он продолжает греть машину, пока не опустеет.
wiki.eclipse-industrial-boiler = Кипятит очищенную воду в пар с теплом. Больше тепла — больше пара. Сочетайте с паровыми турбинами; реактор деления — лучший источник тепла для него.
wiki.eclipse-steam-turbine = Превращает пар в энергию и возвращает большую часть воды очищенной, поэтому контур котла требует мало свежей воды.
wiki.eclipse-hydrogen-fuel-cell = Соединяет водород и кислород в энергию, возвращая очищенную воду. Чистый генератор для электролизных установок.
wiki.eclipse-methane-turbine = Сжигает метан, давая много энергии. Отведите дымовые газы в газоочистную установку или газосепаратор, иначе они уйдут в атмосферу.
wiki.eclipse-biofuel-engine = Сжигает биотопливо или дизель для энергии (150/с в обоих случаях). Биотопливо возобновляемо, если выращивать биомассу и держать ферментер; дизель — излишек колонны перегонки, который почти никуда больше не идёт.
wiki.eclipse-fission-reactor = Сжигает топливные стержни тория, давая огромное количество тепла спереди. Поставьте там промышленный котёл, а за ним паровые турбины. Извлекайте отработавшие стержни и отправляйте на регенерацию.
wiki.eclipse-breeder-reactor = Сжигает топливные стержни тория, давая 100 тепла спереди — в 2.5 раза больше реактора деления. Его ториевая оболочка выращивает новое топливо: каждый стержень оставляет два отработавших, и завод переработки превращает каждый в 2 тория, так что топливный цикл растёт. Охлаждается жидким натрием из электролизёра. Один промышленный котёл забирает всё его тепло и питает 10 паровых турбин (7,000 энергии/с); этому котлу нужно много очищенной воды и он даёт много пара, поэтому используйте несколько трубопроводов.
wiki.eclipse-fusion-reactor = Синтезирует дейтерий с тритием, которое выращивает его литиевая оболочка, давая 27,000 энергии/с: 24,000 после того, как заберут его магниты и нагрев плазмы. Как и импульсный реактор, ему нужна энергия для запуска и он медленно прогревается; он остывает, если заканчиваются дейтерий, литий или жидкий азот для сверхпроводящих магнитов. Дейтерий получают из тяжёлой воды в электролизёре. Он взрывается, если его разрушить в горячем состоянии.
wiki.eclipse-combined-cycle-turbine = Сжигает метан, давая 2,400 энергии/с — вдвое больше энергии на метан, чем метановая турбина. Выхлоп всё ещё горячий: 10 тепла выходит спереди (поверните, чтобы направить), чего хватает промышленному котлу и одной паровой турбине — ещё 700/с. Отведите дымовые газы в газоочистную установку или газосепаратор, иначе они уйдут в атмосферу.
wiki.eclipse-solar-farm = 180 энергии/с при полном свете от элементов из высокочистого кремния, без топлива. Как и стандартные солнечные панели, следует освещению карты и настройкам солнца. Хорошо для аванпостов, которые трудно снабжать.
wiki.eclipse-reprocessing-plant = Извлекает торий из отработавших топливных стержней: стержни растворяют в азотной кислоте и экстрагируют торий растворителем на дизеле, как настоящие заводы PUREX используют керосин. Производит кислые отходы.
wiki.eclipse-industrial-battery = Батарея из свинцово-кислотных ячеек. Хранит намного больше энергии на клетку, чем большая батарея.
wiki.eclipse-lithium-battery = Хранит вдвое больше энергии, чем промышленный аккумулятор.
wiki.eclipse-flow-battery = Самая большая батарея: ванадиевый электролит в больших баках.
wiki.eclipse-aetherite-capacitor = Хранит энергию в кристаллах эфирита, более чем вдвое больше литиевого аккумулятора в том же объёме.
wiki.eclipse-world-engine = Высший проект ECLIPSE. Постройте каркас, затем завершите его в шесть этапов: «Основание», «Энергетическое ядро», «Химия», «Управление», «Удержание», «Активация». Каждый этап требует больших поставок от отдельной отрасли и принимает только то, что ему ещё нужно; «Удержание» требует дейтерия из термоядерной отрасли. Нажмите, чтобы увидеть, чего не хватает. После включения:\n- [accent]300,000 энергии/с[].\n- [accent]Запас в 5,000,000 энергии[]: он хранит то, что сеть не использует, и отдаёт, когда сети не хватает, до собственных аккумуляторов сети.\n- [accent]Аплинк[]: он также даёт 15% всего, что производят другие ваши генераторы на карте. Эта энергия выходит из Мирового двигателя, поэтому свяжите сети с ним. Даёт только один Мировой двигатель на команду.\n- [accent]Поле ускорения[]: постройки в радиусе 40 блоков работают на 50% быстрее, как проектор ускорения (усиления не складываются).
wiki.eclipse-core-bastion = Первое ядро после Нуклеуса. Ставьте его поверх Нуклеуса для улучшения, как и стандартные ядра. Оно вмещает 30,000 каждого предмета, поднимает лимит юнитов на 8 больше, чем Нуклеус, вдвое прочнее и имеет более толстую броню. Его [accent]встроенный энергетический узел[] дотягивается до 12 блоков: каждые несколько секунд он связывает до 10 энергетических узлов и аккумуляторов на других сетях, так что сети вокруг ядра становятся одной. Вы можете вручную связывать с ним энергетические узлы. Вы возрождаетесь как [accent]Дельта[].
wiki.eclipse-core-citadel = Самое большое ядро. Ставьте его поверх Ядра: Крепости для улучшения. Оно вмещает 60,000 каждого предмета, поднимает лимит юнитов на 16 больше, чем Нуклеус, в 3.5 раза прочнее и имеет самую прочную броню, а его встроенный энергетический узел дотягивается до 16 блоков с до 15 связями. Вы возрождаетесь как [accent]Эпсилон[].
wiki.eclipse-delta = Ядро: Крепость — его боевой юнит, преемник Гаммы: быстрее строит и добывает, добывает торий и несёт больше. Его пушки выпускают на 2 снаряда за залп больше, чем у Гаммы, и они самонаводятся. [accent]Луч восстановления[] сам чинит повреждённые блоки рядом, пока вы летите.
wiki.eclipse-epsilon = Ядро: Цитадель — его боевой юнит: самый быстрый строитель и добытчик, добывает на один уровень выше Дельты. Пушки снова выпускают на 2 снаряда за залп больше (на 4 больше, чем у Гаммы), самонаводятся, и каждый снаряд взрывается при попадании. Его луч восстановления самый сильный.

# wiki entries: biology
wiki.eclipse-biomass-cultivator = Выращивает биомассу из очищенной воды и удобрения под искусственным светом. Работает где угодно, быстрее на мху и споровом мху.
wiki.eclipse-algae-photobioreactor = Выращивает водоросли на воде, углекислом газе и удобрении, давая биомассу и кислород. Применение для уловленного CO2.
wiki.eclipse-enzyme-extractor = Извлекает ферменты из биомассы и споровых капсул. Ферменты удваивают скорость ферментера.
wiki.eclipse-biochemical-fermenter = Сбраживает биомассу в биотопливо (слева) и углекислый газ (справа). Вдвое быстрее с экстрактом ферментов.
wiki.eclipse-anaerobic-digester = Переваривает осадок и биомассу в метан и удобрение без энергии.

# wiki entries: transport and liquids
wiki.eclipse-aluminium-conveyor = Конвейер на 20 предметов в секунду, первый конвейер ECLIPSE.
wiki.eclipse-chromium-conveyor = Конвейер на 30 предметов в секунду.
wiki.eclipse-superalloy-conveyor = Конвейер на 40 предметов в секунду.
wiki.eclipse-carbide-conveyor = Конвейер на 50 предметов в секунду.
wiki.eclipse-surge-conveyor = Самый быстрый конвейер, 60 предметов в секунду. Стандартные перекрёстки, маршрутизаторы и мосты медленнее; подавайте прямо в него, где возможно.
wiki.eclipse-aluminium-conduit = Широкий трубопровод, 3600 жидкости в секунду и коррозионностойкий.
wiki.eclipse-chromium-conduit = 4200 жидкости в секунду, коррозионностойкий.
wiki.eclipse-superalloy-conduit = 4800 жидкости в секунду, коррозионностойкий.
wiki.eclipse-carbide-conduit = 5400 жидкости в секунду, коррозионностойкий.
wiki.eclipse-surge-conduit = Самый вместительный трубопровод, 6000 жидкости в секунду, коррозионностойкий.
wiki.eclipse-polymer-conduit = Первый коррозионноустойчивый трубопровод. Используйте его для кислот, хлора, гидроксида натрия и кислых отходов.
wiki.eclipse-polymer-liquid-router = Маршрутизатор жидкости, который не могут разрушить коррозионные жидкости.
wiki.eclipse-polymer-bridge-conduit = Мост-трубопровод, который не могут разрушить коррозионные жидкости.
wiki.eclipse-polymer-liquid-tank = Большой бак, безопасно хранящий кислоты, хлор и химические отходы. Полезен как буфер перед нейтрализаторами.
wiki.eclipse-liquid-overflow-valve = Жидкость с задней стороны идёт прямо вперёд; только то, что передняя сторона не может принять, уходит налево, затем направо. Используйте его, чтобы сначала кормить основного потребителя, а излишки отправлять куда-то ещё.
wiki.eclipse-liquid-balancer = Равномерно делит жидкость с задней стороны между левой, передней и правой сторонами.
wiki.eclipse-reserve-valve = Ставьте его после бака и выберите уровень: он выпускает жидкость, только когда в баке её выше этого уровня. Держите охлаждающую жидкость или топливо в резерве для важных машин.

# wiki entries: logistics
wiki.eclipse-three-way-sorter = Отправляет до трёх выбранных предметов налево, вперёд или направо; вход с задней стороны. Остальные предметы идут на резервную сторону или ждут на конвейере, если её нет. Заблокированный маршрут удерживает свой предмет, а не теряет его. Нажмите на него, чтобы задать правила.
wiki.eclipse-distribution-hub = Сортировщик 2x2 с четырьмя правилами для предметов и резервной стороной, на 60 предметах в секунду. Требует немного энергии.
wiki.eclipse-priority-merger = Объединяет линии сзади, слева и справа в переднюю. В режиме приоритета верхняя линия всегда идёт первой, остальные заполняют паузы; в режиме по очереди они чередуются.
wiki.eclipse-controlled-splitter = Делит одну линию между левой, передней и правой сторонами: поровну, по соотношению (веса 0-3, например 2:1) или по приоритету. Заблокированные ветви пропускаются, поэтому ничего не забивается.
wiki.eclipse-line-balancer = Разделитель 2x2, который честно делит один источник между максимум четырьмя зданиями слева, спереди и справа. Требует энергии.
wiki.eclipse-small-logistics-buffer = Хранит до 60 предметов с задней и боковых сторон и выгружает их через переднюю. Может удерживать минимальное количество одного типа предметов, которое никогда не выгружается.
wiki.eclipse-industrial-logistics-buffer = Хранит до 200 предметов, может держать резерв и выгружать только один выбранный предмет. Требует энергии.
wiki.eclipse-advanced-item-filter = Фильтрует целый список предметов. Режим «разрешить»: указанные предметы идут прямо, остальные — в стороны. Режим «запретить»: наоборот.
wiki.eclipse-batch-gate = Собирает заданное количество предметов (2, 5, 10 или 20) с задней стороны, затем выпускает всю партию через переднюю. Полезно для машин, которые должны получать полные загрузки.
wiki.eclipse-smart-unloader = Выгружает до трёх выбранных типов предметов из соседних контейнеров по очереди. Как обычный разгрузчик, никогда не загружает в хранилища.

# wiki entries: augmentation buildings
wiki.eclipse-augmentation-coupler = Подключает один модуль к соседней машине, обычной или ECLIPSE. Если рядом одна машина, он подключается сам; иначе нажмите на соединитель, затем на машину. Дайте ему энергию. Наведите курсор, чтобы увидеть, что делает каждый модуль.
wiki.eclipse-advanced-coupler = Соединитель с двумя слотами для модулей.
wiki.eclipse-augmentation-hub = Большой интерфейс с четырьмя слотами для модулей для сильно улучшенных машин.
wiki.eclipse-chemical-augmentation-interface = Соединитель для химических машин: три слота, только химические модули и большой бак с охлаждающей жидкостью для модулей, которым нужно охлаждение.
wiki.eclipse-military-augmentation-interface = Соединитель для турелей: три слота, только военные модули.
wiki.eclipse-basic-module-assembler = Создаёт модули I уровня. Нажмите, чтобы выбрать модуль; затем он принимает только ингредиенты этого модуля.
wiki.eclipse-advanced-module-assembler = Создаёт модули II и III уровня. Нажмите, чтобы выбрать модуль.
wiki.eclipse-experimental-augmentation-facility = Создаёт модули IV уровня, уникальные и легендарные модули из самых передовых материалов.
wiki.eclipse-aetherite-module-forge = Создаёт модули V уровня вокруг кристаллов эфирита.
wiki.eclipse-module-recycling-facility = Разбирает ненужные модули и возвращает половину их материалов.

# wiki entries: defense, robotics and endgame
wiki.eclipse-wave-intelligence-scanner = Пока включён, он показывает следующую волну: типы и количество юнитов, щиты, боссов и время до неё. Нажмите для отчёта. Чтобы вывести волну на экраны, выберите сканер и нажмите до 4 логических экранов в пределах 12 блоков. Сам он никогда не меняет волну.
wiki.eclipse-wave-disruption-array = При полной зарядке нажмите «Активировать», чтобы отложить прибытие волны на 20 секунд. Только до прихода волны и только на картах с таймером волн. Все массивы делят общую блокировку на 2 волны, поэтому задержки нельзя объединять.
wiki.eclipse-temporal-interference-array = Более сильная задержка волны: 50 секунд. Использует общую блокировку с массивом срыва волн, после чего блокирует оба на 4 волны.
wiki.eclipse-unit-shield-beacon = Защищает дружественных юнитов (не здания) в своей зоне из общего запаса, до 80 прочности щита на юнита. Выданный щит забирается обратно, когда юнит выходит из зоны. Он перезаряжается от энергии, медленнее, пока по зоне ведут огонь.
wiki.eclipse-emergency-repair-dispatch-bay = Быстро чинит одно выбранное здание. Выберите док, затем нажмите на здание; повторное нажатие по доку сбрасывает выбор. Каждая порция ремонта расходует титановый стержень.
wiki.eclipse-robot-dispatch-hub = Дом до 4 роботов в пределах 25 блоков. Роботы из Воздушной фабрики регистрируются сами; нажмите на центр, чтобы назначить каждому работу, затем нажмите на здание, чтобы выбрать его. Припаркованные роботы перезаряжаются от энергии, а титановые стержни превращаются в заряд ремонта.
wiki.eclipse-titan-manufacturing-complex = Создаёт Дредноут. Один Дредноут на команду: пока он жив, комплекс простаивает и ничего не потребляет.
wiki.eclipse-orbital-weapons-platform = Нажмите на него, затем на точку в пределах 150 блоков. Он заряжается две минуты, затем расходует сверхпроводники, эфирит и взрывную смесь на один удар: красное предупреждение отмечает цель, и через три секунды все враги в пределах 10 блоков получают 3000 урона. Ваши здания не страдают.

# wiki entries: walls and turrets
wiki.eclipse-superalloy-wall = Очень прочная стена, которая также поглощает лазеры.
wiki.eclipse-superalloy-wall-large = Очень прочная большая стена, которая также поглощает лазеры.
wiki.eclipse-surge-superalloy-wall = Крайне прочная стена: поглощает лазеры и бьёт молниями по атакующим.
wiki.eclipse-surge-superalloy-wall-large = Крайне прочная большая стена: поглощает лазеры и бьёт молниями по атакующим.
wiki.eclipse-composite-wall = Стена из углеродного композита, прочнее суперсплава, иногда отражает пули.
wiki.eclipse-composite-wall-large = Большая стена из углеродного композита, иногда отражает пули.
wiki.eclipse-acid-mortar = Забрасывает кислотные снаряды на большую дальность по наземным целям. Взрыв разъедает броню, а в месте падения остаётся кислота, разъедающая юнитов, которые через неё идут. Подавайте в неё кислоту через полимерные трубы.
wiki.eclipse-minelayer = Забрасывает мины на путь врага. Каждая мина ждёт до 30 секунд и взрывается под первым наземным юнитом, который её перейдёт. Стреляет нитратом аммония или взрывной смесью.
wiki.eclipse-heat-lance = Непрерывный луч, который питается теплом, а не энергией. Для выстрела нужно 12 тепла; при 18 тепла он в 1.5 раза сильнее. Направьте на него нагреватель (или теплообменник).
wiki.eclipse-jammer = Каждые 3 секунды глушит вражеских юнитов в радиусе: их оружие стреляет на 40% медленнее в течение 4 секунд. Боссы восстанавливаются вдвое быстрее. На здания не действует.

# wiki entries: units
wiki.eclipse-logistics-drone = Перевозит до 20 предметов одного типа между двумя зданиями в радиусе своего центра и доставляет только то, что принимает пункт назначения (турель получает боеприпасы). Медленнее конвейера; используйте для неудобных маршрутов, например чтобы кормить турель на обрыве. Требуется Центр роботов.
wiki.eclipse-repair-drone = Летит к одному назначенному зданию и чинит его из конечного запаса ремонта, который пополняется в центре титановыми стержнями. Назначьте его на важную стену или турель.
wiki.eclipse-shield-drone = Сопровождает самую большую группу дружественных юнитов у своего центра и пополняет их щиты до 40 из общего запаса. Перезаряжается только в центре, и выданные им щиты исчезают, если его уничтожить. Медленный и хрупкий: держите его за армией.
wiki.eclipse-reaper = Первый танк ECLIPSE: быстрый и лёгкий, с бронепробивающей автоматической пушкой, которая рвёт здания. Создаётся в Наземной фабрике; улучшайте его в реконструкторах.
wiki.eclipse-bulwark = Бронированный танк с бронепробивающей пушкой, который не обращает внимания на лёгкий огонь.
wiki.eclipse-rampart = Тяжёлый танк. Лобовая дуга щита гасит входящий огонь, пока его спаренные бронепробивающие пушки ведут стрельбу.
wiki.eclipse-annihilator = Осадный танк. Его дальнобойные коррозийные снаряды разъедают броню, поэтому все пушки за ним бьют сильнее, а сам он давит вражеские блоки, через которые проезжает.
wiki.eclipse-colossus = Самый большой танк ECLIPSE. Его главная пушка пробивает броню и несколько целей подряд, а два кислотных миномёта оставляют коррозийные лужи за линией врага. Доминион отправляет его как позднего босса.
wiki.eclipse-wraith = Быстрый разведывательный аппарат. Его лёгкие пушки помечают цели как «Разъеденные», вдвое уменьшая их броню для тяжёлых пушек. Начало линии ударных самолётов.
wiki.eclipse-interceptor = Истребитель против воздушных целей: сначала идёт за авиацией, затем за турелями, которые могут стрелять по воздуху; если их нет, преследует вражеских игроков и никогда не атакует ядро. Прикрывайте им свою наземную армию.
wiki.eclipse-valkyrie = Штурмовик со скорострельными бронепробивающими пушками против воздуха и земли.
wiki.eclipse-tempest = Стратегический бомбардировщик. Каждая бомба разбрасывает мины, которые ждут на земле врага. Только по наземным целям.
wiki.eclipse-leviathan = Воздушная командная платформа. Её импульс глушения замедляет огонь врагов вокруг, системы точечной обороны сбивают подлетающие пули, а тяжёлое копьё прожигает цели. Доминион отправляет её как позднего босса.
wiki.eclipse-dreadnought = Титан: спаренные тяжёлые бронепробивающие пушки, тепловое копьё, кислотные миномёты, широкая лобовая броня и импульс глушения. Один на команду, строится в Титановом производственном комплексе.
wiki.eclipse-ew-drone = Безоружный и хрупкий. Каждые 5 секунд он глушит вражеские турели в пределах 10 блоков, так что они наводятся и стреляют вдвое медленнее в течение 4 секунд. Отправляйте его вместе с атакой, чтобы притупить оборону врага.
wiki.eclipse-skiff = Прилив. Первая лодка каждой волны Прилива. Её водяная струя наносит мало урона, но оставляет цели «Мокрыми», а мокрые юниты получают больше урона от электрических атак, включая собственные разрядные катушки Прилива. Быстрая на воде, медленная на суше: ловите её у берега.
wiki.eclipse-slicker = Прилив. Покрывает цели нефтью («Засмолённые») и затем поджигает их зажигательными снарядами: горение вместе с нефтью наносит гораздо больше урона. Держите огнеопасные блоки подальше от берега, где она высаживается.
wiki.eclipse-frostwake = Прилив. Замораживает то, во что попадает, и оставляет за собой след из мин: наземные юниты, преследующие её, наезжают на них. Мины взрываются только под наземными юнитами.
wiki.eclipse-cinderwake = Прилив. Поздняя бронированная лодка. Её струя шлака плавит броню, разрядная катушка наказывает всех, кого Скифы оставили мокрыми, а за ней остаются мины.
wiki.eclipse-maelstrom = Босс Прилива, каждые 20 волн начиная с 45-й. Две струи (вода и криофлюид) пропитывают и замораживают всё перед ней, разрядная катушка делает мокрые цели лёгкой добычей, а позади остаются мины. Она восстанавливается; на суше она ползёт, поэтому сражайтесь с ней у берега.
wiki.eclipse-lurker = Прилив. Первая подводная лодка, с 10-й волны на картах с точкой появления в воде. Под водой ваши турели её не видят: поставьте [accent]Сонар[] у берега, чтобы они её видели, или разложите мины в воде. Она всплывает на момент выстрела, и тогда её может поразить что угодно.
wiki.eclipse-barracuda = Прилив. Более тяжёлый охотник-убийца с 20-й волны, с спаренными торпедами и палубной пушкой для того, что всплывёт рядом. Способы борьбы те же, что с Луркером: Сонар, чтобы увидеть, мины, чтобы поразить под водой.
wiki.eclipse-abyss = Босс Прилива, каждые 25 волн с 60-й на картах с появлением в воде. Он никогда не всплывает, поэтому без Сонара в радиусе с ним просто нельзя сражаться: до него достают только мины. Его ракеты можно сбить точечной обороной, торпеды — нельзя.
wiki.eclipse-mite = Рой. Маленькая самовосстанавливающаяся машинка, которая плюёт кислотой вблизи. Поодиночке слабая, но на каждой волне Роя её становится больше, и Выводки с Бегемотами выпускают ещё. Лучше всего справляться уроном по площади.
wiki.eclipse-wasp = Рой. Быстрый летающий юнит, чьё кислотное жало разъедает цель. Обеспечьте себе противовоздушную оборону примерно с 6-й волны.
wiki.eclipse-spitter = Рой. Забрасывает кислоту, после которой остаются коррозийные лужи. Перестреляйте его издалека, иначе он медленно прогрызёт вашу линию обороны.
wiki.eclipse-brood = Рой. Распыляет споры, замедляющие цели, и при смерти лопается на четырёх Клещей. Убейте его, пока он не дошёл до ваших стен.
wiki.eclipse-behemoth = Босс Роя. Быстро восстанавливается, каждые 6 секунд откладывает яйцо Клеща, пока продвигается, и обстреливает кислотой. Приходит каждые 12 волн с 30-й. Яйца выводятся через 3 секунды; до этого они не могут двигаться или атаковать и получают двойной урон, поэтому турели с уроном по площади уничтожают всю кладку. Сосредоточьте огонь на нём: затяжные бои только прибавляют ему Клещей.
wiki.eclipse-scrabba = Босс Роя: гигантский скорпион, каждые 20 волн с 50-й (на Улье — с 30-й на самых сложных секторах, до 15 волн позже на спокойных). Первый юнит ближнего боя: он подходит к вашим стенам, и его клешни раздавливают площадь 3x3 перед ними, включая стены, с двойным уроном по зданиям. Жало высасывает всё, во что попадает, лечит Скраббу и оставляет цель «Истощённой». Его экзоскелет выдерживает до 3000 урона и отрастает полным здоровьем. Держите по нему непрерывный огонь, чтобы экзоскелет не восстановился, разъедайте его серными снарядами и ставьте стены в несколько слоёв, чтобы он не прогрыз их насквозь.
wiki.eclipse-lamprey = Юнит Прилива с 15-й волны. Роботизированная минога, быстрая в воде, медленная на суше. Из воды она прыгает до 10 блоков на ближайшую турель, перепрыгивая стены, и вцепляется рядом: турель замирает (не перезаряжается, не поворачивается) и теряет здоровье, пока Минога не умрёт. В воздухе её может поразить только ПВО. На суше она вцепляется в любое здание, кроме стен. Держите турели подальше от берега или прикрывайте их другими турелями, чтобы вцепившаяся Минога быстро погибла.

# wiki entries: upgrade modules (one text per family; the tiers differ only in strength)
wiki.eclipse-production-accelerator = Заставляет машину работать быстрее. Соединитель берёт для неё дополнительную энергию: отчасти фиксированную, отчасти пропорционально собственному энергопотреблению машины, так что дороже всего это на прожорливых машинах.\nЧем выше уровень, тем больше прирост и энергозатраты. Второй ускоритель на той же машине считается вдвое слабее.
wiki.eclipse-power-optimizer = Возвращает часть энергопотребления машины в её сеть. Соединитель должен быть подключён к той же энергосети, что и машина. Отлично работает на доменных печах и электролизёрах.
wiki.eclipse-output-amplifier = Больше продукции за цикл, но за счёт скорости. Он экономит входные материалы, а не время.\nНе может работать на одной машине с Прецизионным фабрикатором.
wiki.eclipse-precision-fabricator = Возвращает часть предметов, которые машина расходует за цикл, так что те же входные материалы идут дальше.\nНе может работать на одной машине с Усилителем выхода.
wiki.eclipse-material-recycler = Собирает часть расходуемых машиной предметов в виде лома, который соединитель выталкивает наружу. Отведите лом конвейером к Дробилке руды.
wiki.eclipse-reaction-accelerator = Заставляет химические машины работать быстрее. Ему нужна охлаждающая жидкость в соединителе; более холодные жидкости (охлаждённая вода, криофлюид, жидкий азот) держатся дольше. Лучше всего в Химическом интерфейсе улучшений с его большим баком охлаждения.
wiki.eclipse-thermal-controller = Частично покрывает потребность машины в тепле, поэтому можно ставить меньше нагревателей.
wiki.eclipse-pressure-stabilizer = Реакторы давления быстрее выходят на рабочее давление и медленнее теряют его на холостом ходу.
wiki.eclipse-catalyst-optimizer = Катализаторы в подключённом реакторе работают на большее количество циклов.
wiki.eclipse-purification-module = Машина вырабатывает больше своей основной жидкости-продукта (например, очищенной воды, а не рассола).
wiki.eclipse-waste-recovery = Превращает часть кислых отходов машины обратно в кислоту, которую она потребляет: меньше отходов нейтрализовать и меньше кислоты нужно вырабатывать.
wiki.eclipse-thermal-recovery = Превращает избыточное тепло горячей машины в энергию для сети. Сильнее всего на генераторах тепла, таких как Реактор деления.
wiki.eclipse-energy-overcharger = Заряжается 15 секунд, затем 5 секунд ускоряет машину гораздо сильнее.
wiki.eclipse-capacitor-module = Копит избыточную энергию сети и отдаёт её машине при нехватке, чтобы та работала через провалы.
wiki.eclipse-deep-mining = Буры бурят быстрее.
wiki.eclipse-advanced-drill-head = Буры добывают больше руды за цикл без замедления. Не может стоять на одном буре с другими модулями эффективности.
wiki.eclipse-geological-analyzer = Исследует все залежи в пределах 10 тайлов от бура. Наведите на соединитель, чтобы увидеть, что там и сколько.
wiki.eclipse-rapid-fire-controller = Турель стреляет чаще, но при стрельбе греется; перегретая турель замедляется, пока не остынет. Сочетайте более сильные уровни с Системой охлаждения.
wiki.eclipse-cooling-system = Турель быстрее сбрасывает тепло от «Скорострельности», поэтому перегревается реже или вовсе не перегревается.
wiki.eclipse-advanced-ammunition = Выстрелы турели наносят больше урона. Работает и с лазерами, и с лучами.
wiki.eclipse-targeting-computer = Убирает часть (или всю) случайный разброс выстрелов турели. Осколки, мины и другие пули, которые выпускают её выстрелы, сохраняют свой разброс.
wiki.eclipse-ballistic-computer = Снаряды летят на 50% быстрее на той же дальности, поэтому по быстрым целям попадать легче. Лучи и лазеры не затрагиваются.
wiki.eclipse-mass-production = Конфигурация машины: быстрее и больше продукции за цикл, но за огромное энергопотребление. Одна на машину.
wiki.eclipse-closed-loop-processing = Конфигурация машины: возвращает часть входных материалов, часть перерабатывает в лом и восстанавливает половину любых кислых отходов. Одна на машину.
wiki.eclipse-emergency-overdrive = Конфигурация машины: после зарядки ускоряет машину до 2.5x на 5 секунд. Очень прожорлива. Одна на машину.
wiki.eclipse-quantum-accelerator = Легендарный: машина работает в 2.5 раза быстрее при высоком энергопотреблении. Один на машину.
wiki.eclipse-matter-replicator = Легендарный: на 80% больше продукции за цикл без замедления, выше предела в 50%, на котором останавливаются обычные модули. Один на машину и занимает слот эффективности (без Усилителя выхода и Прецизионного фабрикатора рядом).
wiki.eclipse-ancient-efficiency-core = Легендарный: снижает энергопотребление машины на 70% (обычные модули останавливаются на 50%) и возвращает четверть входных материалов. Один на машину и занимает слот эффективности (без Усилителя выхода, Прецизионного фабрикатора и Репликатора материи рядом).
wiki.eclipse-temporal-processing-core = Легендарный: после зарядки машина работает в 4 раза быстрее 5 секунд. Один на машину.

