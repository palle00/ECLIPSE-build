eclipse-menu.whatsnew = Что нового в ECLIPSE 1.0
eclipse-menu.whatsnew.text = [accent]Промышленность[]\n- [accent]Универсальные машины[]: один Пресс для шестерён на все шестерни, один Сборочный станок на все детали, один Электролизёр для любого электролиза.\n- [accent]Уровни энергии и разгон[]: каждый рецепт требует полной мощности своего уровня; разгон в 2, 4 или 8 раз за высокую цену энергии.\n- [accent]Рудные минералы[]: дробите, флотируйте или выщелачивайте их, чтобы получить 1, 1.5 или 2 металла из руды, с настоящими побочными продуктами.\n- [accent]Энергия[]: Солнечная ферма, Парогазовая турбина, Реактор-размножитель и Термоядерный реактор; более мощный Мировой двигатель.\n\n[accent]Война[]\n- [accent]Прилив[]: третья вражеская фракция амфибийных лодок и подводных лодок и Сонар, чтобы их найти.\n- Новые турели: [accent]Бомбардир[], [accent]Супернова[] (Праймер + Пусковая установка "Звёздная пыль") и [accent]Катапульта грузов[].\n- Баланс: более слабые турели и юниты высших уровней бьют гораздо сильнее; патроны из карбида вольфрама теперь окупаются против брони.\n- Турели и юниты [accent]ощущаются тяжелее[]: вспышки выстрелов, дым, гильзы и тряска экрана под каждое оружие; Рой вырывается вперёд, лодки Прилива тонут с плеском, крупные машины взрываются мощным взрывом.\n\n[accent]Планеты[]\n- [accent]Эрекир[] поддерживается: на нём можно строить любые машины и турели ECLIPSE, карты Эрекира получают руды, нужные для цепочек, фракции присоединяются к волнам Эрекира (там они сложнее), а озон, аркицит, оксид и бериллий Эрекира получили рецепты ECLIPSE.\n- У [accent]Прилива, Улья и Железной крепости[] есть своя земля, обрывы, нефть, источники и обломки вместо серпульских.\n- Теперь ECLIPSE использует ванильные [accent]вольфрам и карбид[]: старые сохранения сохраняют то, что было.\n\n[accent]Информация и управление[]\n- [accent]Панель производства[] (O): что ваша база производит и потребляет, график за минуту, цепочки производства с нужными и уже построенными машинами, а также энергия.\n- [accent]Остановленные машины[] (K): каждая вставшая машина отмечена с указанием причины.\n- [accent]Логика[]: считывайте машины ECLIPSE через esensor, задавайте разгон, рецепт или цель Орбитальной платформы через econtrol, ищите рецепты через recipe. Смотрите гайд по логике в вики.\n- [accent]Вики[]: калькулятор производства для каждого предмета, таблицы сравнения генераторов, турелей и юнитов, а также раздел "Логика" в карточке каждого блока.\n- [accent]Соотношения при размещении[]: сколько поставщиков нужно, чтобы кормить машину, прямо во время размещения.\n- [accent]Меню паузы и настройки[]: новое меню Esc и вкладка настроек ECLIPSE со всеми опциями мода (13), рядом с игровыми настройками в том же стиле.
