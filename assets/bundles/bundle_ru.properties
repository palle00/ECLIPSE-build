# Flow Meter
block.eclipse-flow-meter.name = Измеритель потока
block.eclipse-flow-meter.description = Поставьте его в конвейер: предметы проходят прямо, а число на нём показывает, сколько предметов в секунду проходит (в среднем за 5 секунд). Никогда не замедляет конвейер. Нужны конвейеры с обеих сторон, не другой маршрутизатор.\nЛогика: [accent]sensor r meter1 @copper[] читает медь в секунду, [accent]@totalItems[] — все предметы в секунду.
bar.eclipse-flow = {0} предметов/с
wiki.eclipse-flow-meter = Дешёвый измерительный инструмент. Вставьте его в любую линию конвейера, между двумя конвейерами, и он покажет на себе, сколько предметов в секунду проходит, в среднем за последние 5 секунд. Предметы идут прямо, конвейер работает на полной скорости.\nИспользуйте его, чтобы увидеть, сколько на самом деле производят машина или буры и не насыщена ли линия. Как и сортировщики, он пропускает предметы мгновенно, поэтому прямо с двух сторон нужны конвейеры (не другой маршрутизатор или сортировщик).\n\n[accent]Чтение показаний процессором:[] свяжите измеритель с логическим процессором (он получит имя вроде meter1). [accent]sensor r meter1 @copper[] даёт медь в секунду, с любым другим предметом работает так же, а [accent]sensor r meter1 @totalItems[] даёт всё в секунду. Один измеритель на смешанном конвейере сообщает каждый материал отдельно, так что процессор может показать много материалов с нескольких измерителей на экране или в блоке сообщений. На карте-демонстрации есть рабочий пример: процессор выводит скорость меди, свинца, графита и общую на большой экран.

