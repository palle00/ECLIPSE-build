eclipse-wiki.fix.working = Оно работает.
eclipse-wiki.fix.disabled = Процессор логики или переключатель выключили его. Включите снова или проверьте процессор, который им управляет.
eclipse-wiki.fix.outputFull = Продукту некуда идти. Подведите конвейер или трубу к каждому выходу, а отходы (кислые отходы, сточные воды, дымовые газы) отправляйте туда, где их принимают. Машины с фиксированными сторонами вывода жидкости отправляют каждую жидкость только через свою сторону.
eclipse-wiki.fix.noPower = Оно не получает энергии. Подключите его к узлу энергии или проверьте, вырабатывает ли ваша сеть вообще энергию.
eclipse-wiki.fix.missing = Не хватает входного ресурса. Проверьте, что все компоненты поступают в пропорциях рецепта: конвейер, забитый одним предметом, задерживает остальные.
eclipse-wiki.fix.noCatalyst = Ему нужен катализатор. Подайте его вместе с другими ресурсами; одного хватает на несколько циклов.
eclipse-wiki.fix.noHeat = Оно не получает нагрева. Направьте на него нагреватель: нагреватель греет только блок, в который смотрит, и отдаёт полную мощность, лишь когда всей своей стороной касается машины.
eclipse-wiki.fix.pressurizing = Оно набирает давление. Подождите немного: оно запустится, когда давление станет достаточным.
eclipse-wiki.fix.lowHeat = Оно получает не весь нагрев, поэтому работает медленно. Добавьте нагреватель или переместите его так, чтобы он касался машины всей стороной.
eclipse-wiki.fix.noRecipe = Рецепт не выбран. Нажмите на машину и выберите рецепт.
eclipse-wiki.fix.autoWaiting = Оно выбирает рецепт исходя из того, что поступает, и ожидает ресурс.
eclipse-wiki.fix.underpowered = Сеть не даёт полной мощности своего уровня, а при неполной мощности машина останавливается. Добавьте генераторы или аккумуляторы либо перенесите машину в более мощную сеть.
eclipse-wiki.fix.heatShort = Нагрев меньше, чем требует рецепт. Добавьте нагреватель или переместите его так, чтобы он касался машины всей стороной: нагреватель, прикасающийся лишь частью стороны, отдаёт только часть тепла.
eclipse-build.build-key = Построить это (B)
eclipse-wiki.check.gear-press = Постройте Пресс для шестерён|Медь в медные шестерни, которые нужны для большинства ранних затрат ECLIPSE.
eclipse-wiki.check.extruder = Постройте Экструдер|Медь в проволоку. Шестерни и проволока открывают ранние машины.
eclipse-wiki.check.rivet = Поставьте Заклёпку у входа|Пулемёт 1x1, который стреляет тем быстрее, чем дольше ведёт огонь.
eclipse-wiki.check.flow-meter = Поставьте Расходомер на конвейер|Показывает, сколько предметов проходит за секунду. Он никогда не замедляет конвейер.
eclipse-wiki.check.metal-press = Постройте Металлический пресс|Титан в пластины для корпусов и рам.
eclipse-wiki.check.lathe = Постройте Токарный станок|Болты, винты, кольца и пружины из стержней.
eclipse-wiki.check.assembler = Постройте Сборочный станок|Корпуса под давлением, подшипники, двигатели, насосы и поршни из деталей.
eclipse-wiki.check.component-depot = Постройте Склад компонентов|Поддерживает запас деталей в ядре с любого места карты.
eclipse-wiki.check.water-treatment-plant = Постройте Водоочистную станцию|Очищенная вода с одной стороны, рассол с другой: начало химии.
eclipse-wiki.check.ore-crusher = Постройте Дробилку руды|Рудные минералы в металл, а лом в дроблёную руду на любой карте.
eclipse-wiki.check.electric-heater = Постройте Электрический нагреватель|Нагрев за счёт энергии — для печей.
eclipse-wiki.check.blast-furnace = Постройте Доменную печь|Никель, хром и кобальт в горячий суперсплав (нагрев 8: два нагревателя).
eclipse-wiki.check.vacuum-freezer = Постройте Вакуумный охладитель|Охлаждает горячий металл и стекло криофлюидом.
eclipse-wiki.check.augmentation-coupler = Установите Соединитель улучшений на машину|Затем вставьте в него модуль улучшения.
eclipse-wiki.check.fission-reactor = Постройте Ядерный реактор|Нагрев для котлов, а через них пар для турбин.
eclipse-wiki.check.steam-turbine = Постройте Паровую турбину|700 энергии/с от пара котла.
eclipse-wiki.check.robot-dispatch-hub = Постройте Узел управления роботами|Назначает дронам задания.
eclipse-wiki.check.lattice-drill = Постройте Решётчатый бур|Добывает всё месторождение руды одним сооружением.
wiki.eclipse-mite.counter = Они приходят толпами и восстанавливаются. Урон по площади (Риппл, Кислотный миномёт, Тремор) очищает их, пока они не дошли до стен; ведите по ним непрерывный огонь, чтобы их экзоскелет не отрастал.
wiki.eclipse-wasp.counter = Быстрые летающие враги с кислотным жалом. Их побеждает зенитное оружие, бьющее сразу по нескольким (Громовержец, Грозолом, Скаттер).
wiki.eclipse-spitter.counter = Швыряет кислоту из-за роя и оставляет коррозионные лужи. Перебейте его дальнобойной артиллерией и держите стены на несколько плиток впереди турелей.
wiki.eclipse-brood.counter = При гибели разрывается на четырёх Клещей. Убейте его вдали от стен, подготовив урон по площади для тех, кто выйдет.
wiki.eclipse-behemoth.counter = На ходу откладывает яйца Клещей. Бейте по яйцам площадью до вылупления (3 секунды) и сосредоточьте огонь на Гиганте: затяжные бои лишь дают ему новых Клещей. Серные снаряды (Травильщик) не дают экзоскелету отрасти снова.
wiki.eclipse-scrabba.counter = Ближний бой: ему нужно добраться до ваших стен. Бейте сильно, пока он подходит, ведите непрерывный огонь, чтобы экзоскелет не поднимался, и травите его серными снарядами. Несколько слоёв стен выиграют время против его когтей; жало лечит его, поэтому сосредоточьте огонь.
wiki.eclipse-skiff.counter = Быстр на воде, медлен на суше. Наносит целям статус "Влажный", из-за чего молния и электрический урон бьют сильнее. Сражайтесь с ним на берегу.
wiki.eclipse-slicker.counter = Его нефть поджигает цели. Раставляйте турели, чтобы огонь не распространялся, и сражайтесь на суше, где он медленный.
wiki.eclipse-frostwake.counter = Замораживает цели и оставляет за собой мины. Не ведите свои наземные части по его следу.
wiki.eclipse-lamprey.counter = Выпрыгивает из воды на ближайшую турель и замораживает её. Держите турели подальше от берега или прикрывайте их другими турелями, которые смогут сбить его. ПВО бьёт по нему в воздухе.
wiki.eclipse-cinderwake.counter = Плавит броню шлаком и пускает молнии по "Влажным" целям. Сначала уничтожьте Скифы, чтобы его разрядам досталось меньше влажных целей.
wiki.eclipse-maelstrom.counter = Босс Прилива: две струи, мины и ударная катушка, при этом он восстанавливается. Сражайтесь на берегу, где он становится очень медленным.
wiki.eclipse-lurker.counter = Под водой его нельзя поразить. Сонар берёт его на контакт, чтобы турели могли стрелять; мины всё равно срабатывают под ним.
wiki.eclipse-barracuda.counter = Двойные торпеды и палубное орудие; ныряет, когда прекращает огонь. Сонар и мины — как против Скрытня.
wiki.eclipse-abyss.counter = Никогда не всплывает. Только сонар позволяет турелям поразить его; зенитная защита может сбить его ракеты.
eclipse-welcome.title = Добро пожаловать в ECLIPSE
eclipse-welcome.text = ECLIPSE добавляет многое, поэтому поставляется со своей справкой:\n\n[accent]Вики ECLIPSE[] (меню паузы): пошаговое руководство [accent]«Начало работы»[], гайды по всем системам и страница для каждого блока, материала и юнита.\n\n[accent]{0}[]: открыть страницу вики блока или юнита ECLIPSE под курсором.\n[accent]{1}[]: отметить все остановленные машины на карте.\n[accent]{2}[]: панель производства — что ваша база производит и потребляет за секунду.\n[accent]{3}[] (удерживать): с выбранным улучшенным конвейером, трубой или стеной обновить всю соединённую линию.\n\n[accent]Строка поиска[] над меню строительства находит любой блок по названию. Клавиши можно изменить в "Настройки > Управление", в разделе ECLIPSE.
eclipse-welcome.text.mobile = ECLIPSE добавляет многое, поэтому поставляется со своей справкой:\n\n[accent]Вики ECLIPSE[] (меню паузы): пошаговое руководство [accent]«Начало работы»[], гайды по всем системам и страница для каждого блока, материала и юнита.\n\n[accent]Строка поиска[] над меню строительства находит любой блок по названию, а машины показывают, почему они остановились.
