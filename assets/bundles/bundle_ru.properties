eclipse-menu.tip.0 = Нагреватель учитывается только там, где он соприкасается с машиной и обращён к ней: два Электрических нагревателя, полностью прижатых к Доменной печи, дают 8 единиц тепла, которое нужно суперсплаву.
eclipse-menu.tip.1 = Нажмите O, чтобы открыть панель производства: что производит ваша база, чего не хватает и какие машины остановились.
eclipse-menu.tip.2 = Нажмите K, чтобы отметить на карте все остановленные машины и причину их остановки.
eclipse-menu.tip.3 = Наведите курсор на машину и нажмите I, чтобы открыть её страницу в вики; над остановленной машиной страница покажет, почему она встала.
eclipse-menu.tip.4 = Один Вакуумный охладитель охлаждает столько горячего суперсплава, сколько производят три Доменные печи.
eclipse-menu.tip.5 = У каждой машины в вики есть примеры постройки. В игре кнопка «Построить это» ставит её на курсор.
eclipse-menu.tip.6 = Разгоняйте универсальную машину до 2x, 4x или 8x скорости — за заметно большее энергопотребление.
eclipse-menu.tip.7 = Откройте карту ECLIPSE Showcase в пользовательской игре, чтобы увидеть все машины в работе.
eclipse-menu.tip.8 = Каждая 5-я волна может принести затмение: до следующей волны враги становятся выносливее.
