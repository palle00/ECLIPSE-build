item.eclipse-superconductor.name = Сверхпроводник
item.eclipse-superconductor.description = Экзотическая керамика, которая проводит ток без сопротивления, если её охлаждать. Производится в Комплексе химического синтеза; нужна для Мирового двигателя и Массива временных помех.
block.eclipse-chemical-synthesis-complex.name = Комплекс химического синтеза
block.eclipse-chemical-synthesis-complex.description = Вершина химической промышленности. Синтезирует сверхпроводники из медной проволоки и эфирита в азотной кислоте под давлением над платиновым катализатором, который постепенно расходуется, с охлаждением жидким азотом.
block.eclipse-temporal-interference-array.name = Массив временных помех
block.eclipse-temporal-interference-array.description = После полной зарядки коснитесь и активируйте, чтобы отложить ближайшую волну на 50 секунд. Только до прибытия волны. Делит блокировку с Массивом помех волн и блокирует оба на 4 волны.
block.eclipse-world-engine.name = Мировой двигатель
block.eclipse-world-engine.description = Главный проект ECLIPSE. После постройки каркаса завершите его в шесть этапов (Фундамент, Энергетическое ядро, Химия, Управление, Удержание, Активация), каждый запитывается продукцией отдельной отрасли. Он принимает только то, что нужно текущему этапу. В сети он даёт 300,000 энергии/с, хранит 5,000,000 энергии, добавляет 15% мощности ваших остальных генераторов и ускоряет всё в радиусе 40 блоков.
block.eclipse-core-bastion.name = Ядро: Крепость-бастион
block.eclipse-core-bastion.description = Ядро после Нуклеуса. Вмещает гораздо больше каждого предмета, повышает лимит юнитов и намного прочнее. Встроенный силовой узел объединяет ближайшие узлы и аккумуляторы в одну сеть. Разместите поверх Нуклеуса, чтобы улучшить его. Вы возрождаетесь как Дельта.
block.eclipse-core-citadel.name = Ядро: Цитадель
block.eclipse-core-citadel.description = Самое большое ядро. Вмещает 60,000 каждого предмета, ещё сильнее повышает лимит юнитов, имеет самую прочную броню и больший радиус энергии. Разместите поверх Ядра: Крепость-бастион, чтобы улучшить его. Вы возрождаетесь как Эпсилон.
unit.eclipse-delta.name = Дельта
unit.eclipse-delta.description = Строитель Ядра: Крепость-бастион. Строит и добывает быстрее Гаммы, добывает торий, а его пушки выпускают больше самонаводящихся снарядов. Луч ремонта сам чинит повреждённые блоки вокруг него.
unit.eclipse-epsilon.name = Эпсилон
unit.eclipse-epsilon.description = Строитель Ядра: Цитадель. Самый быстрый строитель и шахтёр. Его пушки выпускают ещё больше самонаводящихся снарядов, взрывающихся при попадании, а луч ремонта сильнее.
