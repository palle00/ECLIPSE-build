stat.eclipse-compat-waste-producers = Производители, создающие кислотные отходы

block.eclipse-military-augmentation-interface.name = Военный интерфейс улучшений
block.eclipse-military-augmentation-interface.description = Соединитель для турелей: три слота для модулей, только военные модули.
block.eclipse-experimental-augmentation-facility.name = Экспериментальный центр улучшений
block.eclipse-experimental-augmentation-facility.description = Создаёт модули IV уровня и легендарные модули из самых передовых доступных материалов.
block.eclipse-module-recycling-facility.name = Завод по переработке модулей
block.eclipse-module-recycling-facility.description = Разбирает ненужные модули и возвращает половину материалов, использованных при их создании.

item.eclipse-thermal-recovery-1.name = Восстановление тепла I
item.eclipse-thermal-recovery-1.description = Превращает 10% отходящего тепла горячей машины в энергию для сети. Лучше всего работает на генераторах тепла, таких как реактор деления.
item.eclipse-thermal-recovery-2.name = Восстановление тепла II
item.eclipse-thermal-recovery-2.description = Превращает 20% отходящего тепла горячей машины в энергию для сети.
item.eclipse-thermal-recovery-3.name = Восстановление тепла III
item.eclipse-thermal-recovery-3.description = Превращает 30% отходящего тепла горячей машины в энергию для сети.
item.eclipse-energy-overcharger-1.name = Перезарядчик энергии I
item.eclipse-energy-overcharger-1.description = Заряжается 15 секунд, затем ускоряет машину на 60% в течение 5 секунд.
item.eclipse-energy-overcharger-2.name = Сверхзаряд энергии II
item.eclipse-energy-overcharger-2.description = Заряжается 15 секунд, затем ускоряет машину вдвое на 5 секунд.
item.eclipse-capacitor-module-1.name = Конденсаторный модуль I
item.eclipse-capacitor-module-1.description = Накапливает 2000 единиц энергии из излишков сети и подаёт их машине при нехватке энергии.
item.eclipse-capacitor-module-2.name = Конденсаторный модуль II
item.eclipse-capacitor-module-2.description = Накапливает 6000 единиц энергии из излишков сети и подаёт их машине при нехватке энергии.
item.eclipse-deep-mining-1.name = Глубокая добыча I
item.eclipse-deep-mining-1.description = Буры добывают руду на 20% быстрее.
item.eclipse-deep-mining-2.name = Глубокая добыча II
item.eclipse-deep-mining-2.description = Буры добывают руду на 40% быстрее.
item.eclipse-deep-mining-3.name = Глубокая добыча III
item.eclipse-deep-mining-3.description = Буры добывают руду на 60% быстрее.
item.eclipse-advanced-drill-head-1.name = Улучшенная буровая головка I
item.eclipse-advanced-drill-head-1.description = Буры добывают на 15% больше руды за цикл без замедления.\nНе сочетается с другими модулями эффективности.
item.eclipse-advanced-drill-head-2.name = Улучшенная буровая головка II
item.eclipse-advanced-drill-head-2.description = Буры добывают на 30% больше руды за цикл без замедления.\nНе сочетается с другими модулями эффективности.
item.eclipse-geological-analyzer.name = Геологический анализатор
item.eclipse-geological-analyzer.description = Обнаруживает все месторождения в радиусе 10 клеток от бура. Наведите на соединитель, чтобы увидеть результаты.
item.eclipse-rapid-fire-controller-1.name = Контроллер скорострельности I
item.eclipse-rapid-fire-controller-1.description = Турель стреляет на 20% быстрее, но перегревается при стрельбе. Перегретая турель замедляется до остывания.
item.eclipse-rapid-fire-controller-2.name = Контроллер скорострельности II
item.eclipse-rapid-fire-controller-2.description = Турель стреляет на 35% быстрее, но перегревается при стрельбе. Перегретая турель замедляется до остывания.
item.eclipse-rapid-fire-controller-3.name = Контроллер скорострельности III
item.eclipse-rapid-fire-controller-3.description = Турель стреляет на 50% быстрее, но быстро перегревается при стрельбе. Сочетайте с системой охлаждения.
item.eclipse-cooling-system-1.name = Система охлаждения I
item.eclipse-cooling-system-1.description = Турель сбрасывает тепло на 50% быстрее, предотвращая перегрев при скорострельности.
item.eclipse-cooling-system-2.name = Система охлаждения II
item.eclipse-cooling-system-2.description = Турель сбрасывает тепло вдвое быстрее, предотвращая перегрев при скорострельности.
item.eclipse-advanced-ammunition-1.name = Улучшенные боеприпасы I
item.eclipse-advanced-ammunition-1.description = Снаряды турели наносят на 10% больше урона.
item.eclipse-advanced-ammunition-2.name = Улучшенные боеприпасы II
item.eclipse-advanced-ammunition-2.description = Снаряды турели наносят на 20% больше урона.
item.eclipse-advanced-ammunition-3.name = Улучшенные боеприпасы III
item.eclipse-advanced-ammunition-3.description = Снаряды турели наносят на 30% больше урона.
item.eclipse-targeting-computer-1.name = Прицельный компьютер I
item.eclipse-targeting-computer-1.description = Устраняет половину разброса турели.
item.eclipse-targeting-computer-2.name = Прицельный компьютер II
item.eclipse-targeting-computer-2.description = Устраняет весь разброс турели.
item.eclipse-ballistic-computer.name = Баллистический компьютер
item.eclipse-ballistic-computer.description = Снаряды летят на 50% быстрее на той же дальности, по быстрым целям попадать легче.

item.eclipse-production-accelerator-4.name = Ускоритель производства IV
item.eclipse-production-accelerator-4.description = Экспериментальный. Машина работает на 50% быстрее при очень высоком энергопотреблении.
item.eclipse-power-optimizer-4.name = Оптимизатор энергии IV
item.eclipse-power-optimizer-4.description = Экспериментальный. Снижает энергопотребление машины на 40%.
item.eclipse-output-amplifier-4.name = Усилитель выхода IV
item.eclipse-output-amplifier-4.description = Экспериментальный. На 40% больше выхода за цикл; машина работает на 20% медленнее.\nНе сочетается с другими модулями эффективности.
item.eclipse-precision-fabricator-4.name = Точный фабрикатор IV
item.eclipse-precision-fabricator-4.description = Экспериментальный. Возвращает 40% потреблённых предметов.\nНе сочетается с другими модулями эффективности.
item.eclipse-reaction-accelerator-4.name = Ускоритель реакций IV
item.eclipse-reaction-accelerator-4.description = Экспериментальный. Химические машины работают на 70% быстрее. Требует много хладагента.
item.eclipse-deep-mining-4.name = Глубокая добыча IV
item.eclipse-deep-mining-4.description = Экспериментальный. Буры добывают руду на 80% быстрее.
item.eclipse-mass-production.name = Массовое производство
item.eclipse-mass-production.description = Конфигурация машины: на 40% быстрее и на 20% больше выхода за цикл, но потребляет огромное количество энергии. Один на машину.
item.eclipse-closed-loop-processing.name = Замкнутый цикл переработки
item.eclipse-closed-loop-processing.description = Конфигурация машины: возвращает 15% входных материалов, 10% перерабатывает в лом и извлекает половину кислотных отходов. Один на машину.
item.eclipse-emergency-overdrive.name = Аварийный форсаж
item.eclipse-emergency-overdrive.description = Конфигурация машины: после зарядки ускоряет машину в 2.5 раза на 5 секунд. Очень прожорлива до энергии. Один на машину.
item.eclipse-quantum-accelerator.name = Квантовый ускоритель
item.eclipse-quantum-accelerator.description = [purple]Легендарный.[] Заставляет машину работать в 2.5 раза быстрее, используя экзотическую энергию. Один на машину;
item.eclipse-matter-replicator.name = Репликатор материи
item.eclipse-matter-replicator.description = [purple]Легендарный.[] На 80% больше выхода за цикл без замедления, выше обычного предела в 50%. Один на машину; заменяет другие модули эффективности.
item.eclipse-ancient-efficiency-core.name = Ядро эффективности нулевой точки
item.eclipse-ancient-efficiency-core.description = [purple]Легендарный.[] Снижает энергопотребление машины на 70% и возвращает четверть входных материалов. Один на машину; заменяет другие модули эффективности.
item.eclipse-temporal-processing-core.name = Ядро временной обработки
item.eclipse-temporal-processing-core.description = [purple]Легендарный.[] После зарядки искажает время: машина работает в 4 раза быстрее 5 секунд. Один на машину.

