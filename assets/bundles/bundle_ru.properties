eclipse-wiki.hot.text = Горячий металл и стекло нельзя использовать, пока Вакуумный охладитель не охладит их криофлюидом. Если ничего не выбрано, охладитель охлаждает любой поступающий к нему горячий материал, так что один охладитель справится и со смешанным конвейером.
