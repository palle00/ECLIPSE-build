block.eclipse-three-way-sorter.name = Трёхсторонний сортировщик предметов
block.eclipse-three-way-sorter.description = Направляет до трёх выбранных предметов влево, вперёд или вправо. Вход сзади. Остальные предметы идут на резервную сторону или ждут на конвейере; заблокированный маршрут удерживает предмет, не теряя его.\nПропускает 30 предметов/с. Как и обычные сортировщики, требует конвейер между ним и другими мгновенными маршрутизаторами.
block.eclipse-priority-merger.name = Приоритетный объединитель
block.eclipse-priority-merger.description = Объединяет до трёх линий (задней, левой и правой) в переднюю.\nРежим приоритета: верхняя линия идёт первой, остальные заполняют паузы. По очереди: линии чередуются.\nПропускает 30 предметов/с; предметы, которые он не может принять, остаются на конвейерах.
block.eclipse-controlled-splitter.name = Управляемый разветвитель
block.eclipse-controlled-splitter.description = Делит одну линию (сзади) на левую, переднюю и правую: поровну, по соотношению (например, 2:1) или по приоритету. Заблокированные ветки пропускаются; ничего не теряется.\nПропускает 30 предметов/с.
block.eclipse-distribution-hub.name = Распределительный узел
block.eclipse-distribution-hub.description = Маршрутизирующий узел 2x2: четыре правила для предметов влево, вперёд или вправо плюс резервная сторона. Вход сзади.\nПропускает 60 предметов/с. Требует немного энергии.
block.eclipse-small-logistics-buffer.name = Малый логистический буфер
block.eclipse-small-logistics-buffer.description = Сглаживает неравномерную подачу: хранит до 60 предметов, поступающих сзади и с боков, и выдаёт их вперёд со скоростью до 60 предметов/с.\nМожет хранить резерв одного предмета.
block.eclipse-industrial-logistics-buffer.name = Промышленный логистический буфер
block.eclipse-industrial-logistics-buffer.description = Хранит до 200 предметов и выдаёт их вперёд со скоростью до 60 предметов/с. Может хранить резерв одного предмета и выдавать только выбранный предмет. Требует энергию.
block.eclipse-line-balancer.name = Балансировщик линий
block.eclipse-line-balancer.description = Справедливо распределяет один поток по четырём производственным линиям (всем зданиям слева, спереди и справа): поровну, по соотношению или по приоритету. Вход сзади.\nПропускает 60 предметов/с. Требует энергию.
block.eclipse-advanced-item-filter.name = Улучшенный фильтр предметов
block.eclipse-advanced-item-filter.description = Фильтрует целый список предметов: пропущенные идут прямо, остальные попеременно влево и вправо. Режим «разрешить» или «запретить».\nПропускает 30 предметов/с.
block.eclipse-batch-gate.name = Пакетный шлюз
block.eclipse-batch-gate.description = Собирает заданное количество предметов (2, 5, 10 или 20) сзади, затем выпускает всю партию вперёд.
block.eclipse-smart-unloader.name = Умный разгрузчик
block.eclipse-smart-unloader.description = Выгружает до трёх выбранных предметов из соседних хранилищ, чередуя их. Работает так же быстро, как обычный разгрузчик; никогда не загружает в хранилище.
block.eclipse-liquid-overflow-valve.name = Клапан перелива жидкости
block.eclipse-liquid-overflow-valve.description = Отправляет жидкость сзади прямо; только то, что не может принять передний выход, идёт влево, затем вправо.
block.eclipse-liquid-balancer.name = Балансировщик жидкости
block.eclipse-liquid-balancer.description = Равномерно делит жидкость, поступающую сзади, между левым, передним и правым выходами.
block.eclipse-reserve-valve.name = Клапан резерва
block.eclipse-reserve-valve.description = Устанавливается после бака: выпускает жидкость, только когда уровень в баке выше выбранного, сохраняя резерв.

