# military: second turret set (line-breaker and anti-air)
block.eclipse-piledriver.name = Копёр
block.eclipse-piledriver.description = Тяжёлое орудие, стреляющее снарядами из карбида вольфрама. Каждый снаряд пробивает до трёх наземных юнитов подряд, без урона по площади. Медленно перезаряжается; не может поражать воздушные цели.
block.eclipse-kestrel.name = Кестрель
block.eclipse-kestrel.description = Запускает по одной управляемой ракете-перехватчику за раз по самой мощной воздушной цели в радиусе. Очень точная, дальнобойная; слаба против роёв. Стреляет нитратом аммония или взрывчаткой.
block.eclipse-thunderhead.name = Грозовое облако
block.eclipse-thunderhead.description = Электрический разряд поражает одну воздушную цель и перескакивает на до четырёх соседних, теряя четверть силы с каждым переходом. Каждая поражённая воздушная цель ненадолго глушится. Малый радиус, много энергии; только по воздуху.
block.eclipse-cloudbreaker.name = Пробиватель облаков
block.eclipse-cloudbreaker.description = Разбрасывает вокруг себя плавающие мины, до 8 одновременно. Каждая мина ждёт до 20 секунд; когда рядом появляется воздушная цель, она бросается на неё и взрывается. Только по воздуху. Стреляет взрывчаткой или нитратом аммония.
wiki.eclipse-piledriver = Ответ на бронированные колонны. Снаряд проходит сквозь до трёх наземных юнитов подряд, поэтому ставьте его там, где враги идут в ряд: на прямом подходе или в коридоре. У него нет урона по площади и долгая перезарядка, так что против роёв мелких юнитов он плох.\nЛучше всего работает с огнём, ослабляющим броню: снаряды кислотного миномёта и серные снаряды «Града» или «Ряби» оставляют врагов разъеденными (половина брони), и тогда Копёр прошивает их насквозь.
block.eclipse-bombard.name = Бомбарда
block.eclipse-bombard.description = Осадный миномёт с самой большой дальностью среди всех турелей: 70 блоков. Тяжёлые снаряды летят медленно по высокой траектории и взрываются на большой площади; красное кольцо на земле показывает точку падения. Не может стрелять по целям ближе 15 блоков и не поражает воздушные цели. Стреляет графитом, нитратом аммония или взрывчаткой.
wiki.eclipse-bombard = Дальнобойная осадная артиллерия. Она дальше, чем «Рябь» и даже «Предвестие», поэтому может обстреливать вражеские базы и точки высадки из глубины собственной обороны, а её снаряды наносят дополнительный урон зданиям. Цена — мёртвая зона в 15 блоков: всё, что подошло близко, от неё в безопасности, поэтому всегда прикрывайте её турелями меньшего радиуса и стенами.\nСнаряд летит около трёх секунд, и точка падения отмечена, так что быстрые юниты успевают уйти. Применяйте её против медленных тяжёлых колонн и зданий, а против бронированных целей комбинируйте с разъеданием (кислотный миномёт, серные снаряды).
block.eclipse-primer.name = Запал
block.eclipse-primer.description = Одна половина «Сверхновой». Стреляет слабым выстрелом, оставляющим тикающую метку. Через 2.5 секунды метка детонирует, притягивает все дружественные облака звёздной пыли в радиусе 11 блоков и взрывается. Сама по себе даёт лишь небольшой хлопок; с окружающими пусковыми установками звёздной пыли взрыв растёт с каждым облаком. Нужна энергия.
wiki.eclipse-primer = Детонатор пары «Сверхновой». Ставьте его вместе с одной или несколькими [accent]пусковыми установками звёздной пыли[], направленными на тот же подход: установки заполняют зону пылью, а метка Запала собирает до 60 облаков в один взрыв. Его размер и урон растут с каждым облаком, и каждый предмет добавляет своё свойство:\n- взрывчатые предметы (взрывчатка, нитрат аммония, пират) дают больше всего урона;\n- горючие предметы (уголь, споровые стручки, пират, сера) поджигают;\n- заряженный импульсный сплав мечет молнии;\n- радиоактивные предметы (торий, фазовая ткань) добавляют урон;\n- пластаний разрывается осколками;\n- споровые стручки замедляют выживших.\nОблака живут всего 4 секунды, поэтому установки должны стрелять, пока горит фитиль. Пунктирный круг вокруг метки показывает радиус действия.
block.eclipse-stardust-launcher.name = Пусковая установка звёздной пыли
block.eclipse-stardust-launcher.description = Другая половина «Сверхновой». Быстро стреляет мелкими зарядами почти любым предметом: песком, ломом, углём, металлами, стеклом, кремнием, торием, споровыми стручками, пиратом, взрывчаткой, пластанием, фазовой тканью, импульсным сплавом, серой или нитратом аммония. Каждый выстрел слабый, но в точке падения он оставляет облако звёздной пыли цвета предмета на 4 секунды, чтобы его детонировал Запал.
wiki.eclipse-stardust-launcher = Сама по себе она почти никому не вредит: это топливо для [accent]Запала[]. Каждое облако добавляет к его взрыву, так что больше установок (или более быстрые, с охладителем) дают гораздо более мощную «Сверхновую».\nДешёвые предметы вроде песка и лома дают дешёвый широкий взрыв. Дорогие добавляют сильные свойства: взрывчатка — чистый урон, пират — огонь, импульсный сплав — молнии, пластаний — осколки. Смешивание предметов смешивает свойства, и взрыв принимает их цвета.
planet.eclipse-hive.name = Улей
planet.eclipse-hive.description = Мир-джунгли, пропитанный спорами, родной мир Роя. Он атакует каждую волну, а размножители и бегемоты появляются здесь раньше, чем где-либо ещё. Исследования общие с Серпуло.
planet.eclipse-ironhold.name = Железная крепость
planet.eclipse-ironhold.description = Опалённая промышленная пустошь, цитадель Доминиона. Его бронированные танки и канонерки атакуют каждую волну, а оба босса появляются здесь раньше, чем где-либо ещё. Исследования общие с Серпуло.
planet.eclipse-tide.name = Прилив
planet.eclipse-tide.description = Океанический мир с разбросанными островами, принадлежащий Приливу. Его лодки атакуют каждую волну, а подводные лодки приходят с открытого моря; наземные армии здесь тонут. Исследования общие с Серпуло.
block.eclipse-sonar.name = Сонар
block.eclipse-sonar.description = Каждые 2 секунды посылает сигнал. Затонувшие подводные лодки в радиусе 25 блоков получают статус «Контакт сонара» на 3 секунды, и ваши турели могут захватывать их и поражать. Нужна энергия.
wiki.eclipse-sonar = Ответ на подводные лодки Прилива. Под водой лодку не видно, и её не может поразить ничего, кроме мин; при «Контакте сонара» по ней можно стрелять как по любой лодке. Ставьте сонары вдоль берега рядом с водной точкой высадки, чтобы их зона пересекалась с радиусом турелей. Ядерная Бездна никогда не всплывает, так что против неё сонар — единственный способ ответить, кроме мин.
block.eclipse-payload-catapult.name = Грузовая катапульта
block.eclipse-payload-catapult.description = Метает целые блоки. Подавайте ей пустые контейнеры, хранилища, жидкостные ёмкости или аккумуляторы по грузовому конвейеру, затем наполняйте загруженный блок конвейерами, трубами и энергией. Когда 2 секунды ничего больше не поступает, она швыряет блок до 52 блоков вдаль, где он взрывается так же, как если бы был уничтожен. Не поражает воздушные цели; её выстрелы всегда приземляются не ближе 8 блоков. Нужна энергия.
wiki.eclipse-payload-catapult = Самые дорогие и самые крупные выстрелы в игре. Что находится внутри снаряда, то и определяет взрыв — по тем же правилам, что и при уничтожении этого блока:\n- [accent]контейнер или хранилище взрывчатки[] (до 300 или 1000) — сокрушительный взрыв;\n- [accent]пират, уголь, споровые стручки, нефть[] и другие горючие материалы поджигают;\n- заряженный [accent]аккумулятор[] мечет молнии;\n- [accent]шлак, нефть, криофлюид[] и другие жидкости разливаются лужами по цели.\nБолее дешёвые варианты (бак нефти или шлака, заряженный аккумулятор) — бюджетные боеприпасы; хранилище, полное взрывчатки, — настоящий вариант.\nСхема: [accent]фабрикатор корпусов[] строит пустые снаряды на грузовой конвейер, ведущий в катапульту; конвейеры и трубы, ведущие в катапульту, наполняют её снаряд. Она стреляет, когда наполнение прекращается (заполнен или закончилась подача), так что медленная подача означает медленный, но полный выстрел. Взрыву безразлично, чьи здания он задевает: держите катапульту подальше от своих.
block.eclipse-casing-fabricator.name = Фабрикатор корпусов
block.eclipse-casing-fabricator.description = Строит пустые контейнеры, хранилища, ёмкости для жидкости, жидкостные баки, аккумуляторы и большие аккумуляторы из обычных материалов и выталкивает их на грузовой конвейер. Создан для снабжения грузовой катапульты. Нужна энергия.
wiki.eclipse-casing-fabricator = На Серпуло нет Конструктора, поэтому грузовая катапульта получает снаряды вот так. Выберите блок для постройки, подавайте ему материалы этого блока и направьте выход на грузовой конвейер, ведущий в катапульту. Малые снаряды (контейнер, аккумулятор) быстрые и дешёвые; хранилища и большие баки вмещают гораздо больше, давая куда более мощные выстрелы.
wiki.eclipse-kestrel = Точная ПВО. Она всегда целится в самую мощную воздушную цель в радиусе, поэтому сначала убирает опасные юниты (канонерки, бомбардировщики, командные платформы). Каждая ракета следует за целью. Против большого роя мелких лётчиков она бесполезна: сочетайте её с пробивателем облаков или грозовым облаком.
wiki.eclipse-thunderhead = ПВО против групп. Один разряд может поразить пять воздушных целей, каждый переход даёт меньше урона, и каждая поражённая цель ненадолго глушится. Она хороша против роёв ос Роя и теряет ценность против одной сильно бронированной воздушной цели. Радиус у неё маленький, энергии она потребляет много, так что обеспечьте ей мощную сеть.
wiki.eclipse-cloudbreaker = Не орудие, а охраняемое воздушное пространство. Она разбрасывает вокруг себя плавающие мины (до 8 одновременно); взведённые мины бросаются на любую воздушную цель, приблизившуюся к ним, и взрываются. Мины, которые никого не нашли, гаснут через 20 секунд. Ставьте её там, где воздушные цели летят к вашей базе. Это фильтр для пролетающих формаций, а не замена обычной ПВО, и по наземным юнитам она никогда не стреляет.

# Third turret set: one per tier, from the first minutes to the endgame
block.eclipse-rivet.name = Заклёпка
block.eclipse-rivet.description = Маленький пулемёт. Начинает медленно, но чем дольше стреляет, тем быстрее: до трёх раз от начальной скорости после 3 секунд. Он замедляется, когда не по чему стрелять. Стреляет медью, графитом или кремнием (самонаводящиеся патроны).
block.eclipse-sickle.name = Серп
block.eclipse-sickle.description = Метает вращающуюся дисковую пилу, которая летит вперёд, разворачивается и возвращается к турели, разрезая всех наземных юнитов на своём пути в обе стороны. Не поражает воздушные цели. Стреляет титановыми лезвиями или лезвиями из карбида вольфрама, которые бьют сильнее и разъедают броню.
block.eclipse-tremor.name = Сотрясение
block.eclipse-tremor.description = Бьёт по земле: ударная волна расходится от турели на весь её радиус, задевая каждого вражеского наземного юнита на своём пути, отбрасывая его и замедляя. Воздушные цели и здания не страдают. Нужна только энергия.
block.eclipse-apiary.name = Пасека
block.eclipse-apiary.description = Запускает дронов, до 6 одновременно. Каждый дрон летит к врагу, кружит над ним 10 секунд и стреляет лазерными зарядами по ближайшему врагу, наземному или воздушному, переключаясь, когда цель уничтожена. Дронов нельзя сбить. Стреляет кремниевыми дронами или дронами из микросхем, которые бьют сильнее и стреляют быстрее.
block.eclipse-event-horizon.name = Горизонт событий
block.eclipse-event-horizon.description = Выпускает медленную сингулярность, которая останавливается в точке наведения и притягивает к себе всех врагов вокруг — наземных и воздушных — нанося им урон, пока не схлопнется в огромном взрыве через 5 секунд. Тяжёлые юниты притягиваются слабее. Нужна энергия. Стреляет эфиритом или фазовой тканью для более слабой сингулярности.
wiki.eclipse-rivet = Первая турель ECLIPSE, доступная уже в медную эпоху. Пулемёт 1x1, который раскручивается: начинает с 2 выстрелов в секунду и за 3 секунды непрерывной стрельбы выходит на 6 в секунду, затем за 2 секунды замедляется, когда не по чему стрелять. Из-за этого он слаб против одного быстрого бегуна, но хорош против постоянного потока врагов. Раскрученный на меди, он наносит около 54 урона в секунду — вдвое больше, чем «Дуо»; графит (тяжёлые патроны) и кремний (самонаводящиеся патроны) дают около 86. Для постройки нужны медные шестерни, так что это хорошее первое применение вашего пресса для шестерён.
wiki.eclipse-sickle = Раннее средство прореживания линий в середине игры. Пила вылетает примерно на 18 блоков, разворачивается и летит прямо назад, разрезая всех наземных юнитов и на пути туда, и обратно, так что плотная группа получает двойной урон. Направляйте её вдоль пути, по которому идут враги. Титановые лезвия наносят 96 урона за разрез; лезвия из карбида вольфрама — 180 и разъедают броню. Она никогда не задевает воздушные цели или здания.
wiki.eclipse-tremor = Контроль толпы для земли. Каждые две секунды ударная волна расходится от турели на 15 блоков, нанося 260 урона каждому вражескому наземному юниту на своём пути, отбрасывая его и замедляя на 2 секунды. Лёгкие юниты отлетают примерно на два блока, тяжёлые почти не двигаются. Она никогда не промахивается и не требует боеприпасов — только энергию, но не может поражать воздушные цели. Ставьте её в узком проходе, чтобы волна задевала сразу много юнитов, и за стенами, чтобы отбрасывание удерживало врагов от стен.
wiki.eclipse-apiary = Поздний комплекс запуска дронов, прикрывающий одновременно землю и воздух. Каждый дрон кружит над целью 10 секунд и стреляет лазерными зарядами по ближайшему врагу; когда цель умирает, он ищет другую. Одновременно летают до 6 дронов, поэтому она сильнее всего против длинных растянутых волн. Кремниевые дроны стреляют каждые полсекунды; дроны из микросхем стреляют быстрее и дают по два дрона на микросхему.
wiki.eclipse-event-horizon = Финальная турель, созданная из экспериментальных ядер и стреляющая эфиритом. Её сингулярность дрейфует к точке наведения и останавливается там; 5 секунд она тянет всех врагов в радиусе 9 блоков к своему центру, нанося урон, затем схлопывается в взрыве с уроном до 2,700. Рои и лёгкие юниты собираются в плотный шар; самые тяжёлые почти не двигаются, но всё равно получают урон. Сочетайте её с турелями урона по площади («Рябь», кислотный миномёт, «Циклон»), бьющими по шару. Фазовая ткань подходит как более слабый запасной боеприпас.
stat.eclipse-spin = Раскрутка
stat.eclipse-spin-value = до {0}x темпа стрельбы после {1} с непрерывной стрельбы
stat.eclipse-drones = Дронов одновременно

# Lattice Drill (endgame)
block.eclipse-lattice-drill.name = Решётчатый бур
block.eclipse-lattice-drill.description = Поставьте её на рудное месторождение: после постройки она разрастает добывающую решётку по всему связанному участку этой руды (до 200 клеток, по 3 в секунду), и каждая покрытая клетка добывает в бур. Постройка на покрытой клетке вырезает её из решётки. Потребление энергии растёт вместе с решёткой. Необязательный охлаждающий агент (вода, криофлюид, жидкий азот...) ускоряет добычу и рост: чем холоднее агент, тем больше бонус.
wiki.eclipse-lattice-drill = Финальный способ добыть всё рудное поле одной постройкой. Поставьте ядро на нужную руду (оно добывает ту руду, которая преобладает под ним). После подачи энергии светящаяся решётка распространяется клетка за клеткой по всем связанным клеткам этой руды, до 200 клеток, и каждая покрытая клетка добывает в ядро. Медный участок в 100 клеток даёт около 29 меди в секунду через одну постройку.\nРешётка идёт только по той же руде и только по свободному грунту: она не переходит на другой участок или другую руду, а если вы построитесь на покрытой клетке, она выпадает из решётки. Два решётчатых бура никогда не захватывают одну и ту же клетку. Потребление энергии растёт с покрытой площадью (3 на клетку в секунду сверх базового потребления ядра), так что большой участок требует мощной сети.\nУскоряйте её охладителем, подведённым к ядру: вода даёт около 1.6x, криофлюид около 2.35x, а жидкий азот около 2.65x — и для добычи, и для роста. Коррозионные жидкости отвергаются. Буровые головки, вращающиеся над месторождением, нужны только для вида: каждая покрытая клетка добывает независимо от того, есть ли над ней головка.
