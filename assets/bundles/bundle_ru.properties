# military M1: ammunition
status.eclipse-etched.name = Разъеденный
status.eclipse-etched.description = Едкая сера разъела корпус: броня вдвое слабее, пока эффект активен. Наносится серными снарядами турелей «Град» и «Рябь».

# military M2: turrets
block.eclipse-acid-mortar.name = Кислотный миномёт
block.eclipse-acid-mortar.description = Забрасывает кислотные снаряды на большие расстояния. Взрыв разъедает броню, а на месте падения образуется лужа кислоты, разъедающая любые наземные юниты, вошедшие в неё. Химически стойкая облицовка: собственная кислота его не разъедает. Только по наземным целям.
block.eclipse-minelayer.name = Миноукладчик
block.eclipse-minelayer.description = Забрасывает мины на пути врага. Каждая мина ждёт на земле до 30 секунд и взрывается под первым наземным юнитом, который её пересечёт. Стреляет нитратом аммония или взрывной смесью.
block.eclipse-heat-lance.name = Тепловое копьё
block.eclipse-heat-lance.description = Непрерывный луч, питаемый теплом, а не электричеством. Для выстрела нужно 12 тепла; большее тепло, до 24, делает луч вдвое сильнее. Приводит цели в состояние плавления.
block.eclipse-jammer.name = Глушитель
block.eclipse-jammer.description = Каждые 3 секунды посылает импульс, глушащий вражеские юниты в радиусе: их оружие стреляет на 40% медленнее 4 секунды. Боссы сбрасывают эффект вдвое быстрее. На здания не действует.
status.eclipse-submerged.name = Погружённый
status.eclipse-submerged.description = Под водой: его не может захватить или поразить ничего, кроме мин, пока сонар его не обнаружит.
status.eclipse-sonar-contact.name = Контакт сонара
status.eclipse-sonar-contact.description = Сонар его нашёл: даже под водой его можно захватить и поразить.
status.eclipse-jammed.name = Под помехами
status.eclipse-jammed.description = Системы наведения и подачи находятся под помехами: оружие стреляет на 40% медленнее, пока эффект активен. Наносится глушителем.
status.eclipse-exoskeleton.name = Экзоскелет
status.eclipse-exoskeleton.description = Твёрдый наружный слой, вырастающий при полном здоровье: он принимает урон первым, и пока он держится, юнит получает на 20% меньше урона.
status.eclipse-incubating.name = Инкубация
status.eclipse-incubating.description = Свежеотложенное яйцо: не может двигаться или атаковать и получает двойной урон, пока не вылупится.
status.eclipse-latched.name = Прикреплённый
status.eclipse-latched.description = Вцепился в здание: остаётся на месте, здание обездвижено и истощается, пока юнит не будет убит.

# military M3: unit lines (built in the vanilla factories and reconstructors)
unit.eclipse-reaper.name = Жнец
unit.eclipse-reaper.description = Быстрый лёгкий танк. Бронепробивающая автоматическая пушка разносит здания. Строится в Наземном заводе.
unit.eclipse-bulwark.name = Оплот
unit.eclipse-bulwark.description = Бронированный танк с бронепробивающей пушкой. Легко держит слабый огонь.
unit.eclipse-rampart.name = Вал
unit.eclipse-rampart.description = Тяжёлый танк с фронтальной дугой щита, поглощающей огонь, пока работают две бронепробивающие пушки.
unit.eclipse-annihilator.name = Аннигилятор
unit.eclipse-annihilator.description = Осадный танк. Дальнобойные едкие снаряды разъедают броню за каждым орудием позади него; бронепробивающие пушки прикрывают фланги. Давит вражеские блоки, по которым проезжает.
unit.eclipse-colossus.name = Колосс
unit.eclipse-colossus.description = Огромный бронированный танк. Главная пушка пробивает броню и несколько целей подряд; два кислотных миномёта оставляют разъедающие лужи за линией врага.
unit.eclipse-wraith.name = Призрак
unit.eclipse-wraith.description = Быстрый разведывательный аппарат. Лёгкие пушки помечают цели как «Разъеденные», вдвое ослабляя их броню для тяжёлых орудий.
unit.eclipse-interceptor.name = Перехватчик
unit.eclipse-interceptor.description = Истребитель ПВО. Охотится за авиацией и зенитными турелями самонаводящимися ракетами; если поблизости нет целей, преследует вражеских игроков. Ядро он игнорирует.
unit.eclipse-valkyrie.name = Валькирия
unit.eclipse-valkyrie.description = Боевой вертолёт со скорострельными бронепробивающими пушками против воздуха и земли.
unit.eclipse-tempest.name = Шторм
unit.eclipse-tempest.description = Стратегический бомбардировщик. Каждая бомба разбрасывает мины, ждущие врага на земле. Только по наземным целям.
unit.eclipse-leviathan.name = Левиафан
unit.eclipse-leviathan.description = Воздушная командная платформа. Импульс помех замедляет огонь врага вокруг неё, орудия точечной защиты сбивают летящие снаряды, а тяжёлое копьё прожигает цели.
ability.eclipse-amphibious = Амфибия
ability.eclipse-amphibious.stats = Парит над водой и сушей; на суше скорость падает до {0}%
ability.eclipse-exoskeleton = Экзоскелет
ability.eclipse-exoskeleton.stats = При полном здоровье регенерация наращивает экзоскелет до {0} ({1}/с), который принимает урон первым; пока он держится, урон на 20% меньше. Кислота («Разъеденный») останавливает рост.
ability.eclipse-eggs.stats = Откладываются яйцами: вылупляются через {0} с, до этого не могут двигаться или атаковать и получают двойной урон
ability.eclipse-latch = Хватка миноги
ability.eclipse-latch.stats = Из воды прыгает на вражескую турель в радиусе {0} блоков (через стены; в воздухе его может поразить только ПВО). Вцепляется в соседнее здание (не в стены): здание обездвижено и теряет {1} здоровья/с, пока минога жива. Снова прыгает через {2} с после того, как отпустит.
ability.eclipse-dive = Погружение
ability.eclipse-dive.stats = Погружается, когда не атакует (остаётся на поверхности {0} с после выстрела); под водой его нельзя захватить или поразить, кроме мин и когда его видит сонар
ability.eclipse-dive.nuclear = Никогда не всплывает; его нельзя захватить или поразить, кроме мин и когда его видит сонар
ability.eclipse-jampulse = Импульс помех
ability.eclipse-jampulse.stats = Глушит вражеские юниты в радиусе {0} блоков каждые {1} с в течение {2} с (оружие на 40% медленнее; у боссов вдвое короче)

# military M4: enemy factions joining the waves of custom games
eclipse-factions-start = [#c9d36a]Рой[] (каждая 2-я волна), [#e0683a]Доминион[] (каждая 3-я) и [#5a8fd8]Прилив[] (каждая 5-я) присоединяются к волнам. Каждую 6-ю волну Рой и Доминион атакуют вместе.
eclipse-factions-swarm-world = [#c9d36a]Рой[] удерживает этот мир: атакует каждую волну.
eclipse-factions-dominion-world = [#e0683a]Доминион[] удерживает этот мир: атакует каждую волну.
eclipse-factions-tide-world = [#5a8fd8]Прилив[] удерживает этот мир: его лодки приходят каждую волну, подводные лодки — из открытого моря.
eclipse-factions-tide = [#5a8fd8]Прилив[] присоединяется к волнам: амфибийные лодки каждую 5-ю волну.
eclipse-factions-newcomers = Новое у фракций: [#c9d36a]Скрабба[], гигантский скорпион Роя, и [#5a8fd8]Миноги[] Прилива, которые вцепляются в ваши турели.
# the ECLIPSE wave event
eclipse-eclipse.start = [#b37aff]Затмение ECLIPSE омрачает небо![] До следующей волны враги в {0} раза выносливее и бьют в {0} раза сильнее.
eclipse-eclipse.end = Затмение проходит. Враги возвращаются к обычной силе.
unit.eclipse-skiff.name = Шлюпка
unit.eclipse-skiff.description = Прилив. Быстрая амфибийная лодка, разбрызгивающая воду («Мокрый»: молния и электрический урон наносят больше вреда) и стреляющая из лёгкого орудия. Медленная на суше.
unit.eclipse-slicker.name = Сликер
unit.eclipse-slicker.description = Прилив. Разбрызгивает нефть («Смолистый»: замедление, огонь горит сильнее) и стреляет зажигательными снарядами. Медленная на суше.
unit.eclipse-frostwake.name = Морозный след
unit.eclipse-frostwake.description = Прилив. Разбрызгивает криофлюид («Замороженный») и сбрасывает мины позади себя. Медленная на суше.
unit.eclipse-cinderwake.name = Огненный след
unit.eclipse-cinderwake.description = Прилив. Тяжёлая лодка, разбрызгивающая шлак («Расплавленный»), сбрасывающая мины и пускающая электрические разряды на ближней дистанции. Медленная на суше.
unit.eclipse-maelstrom.name = Водоворот
unit.eclipse-maelstrom.description = Босс Прилива. Разбрызгивает воду и криофлюид, сбрасывает мины и пускает электрические разряды; восстанавливается. Медленный на суше.
unit.eclipse-lurker.name = Скрытень
unit.eclipse-lurker.description = Подводная лодка Прилива. Погружается, когда не атакует; под водой его не может захватить или поразить ничего, кроме мин, если его не видит сонар. Всплывает, чтобы выпустить кавитационные торпеды, которые идут под водой и не могут быть сбиты.
unit.eclipse-barracuda.name = Барракуда
unit.eclipse-barracuda.description = Подводная лодка Прилива. Две кавитационные торпеды и палубное орудие; погружается, когда не атакует.
unit.eclipse-abyss.name = Бездна
unit.eclipse-abyss.description = Босс Прилива: атомная подводная лодка. Ему никогда не нужно всплывать; выпускает тяжёлые торпеды и запускает дальнобойные зажигательные ракеты из-под воды.
unit.eclipse-mite.name = Клещ
unit.eclipse-mite.description = Рой. Маленькая саморемонтирующаяся биологическая машина, плюющаяся кислотой на близком расстоянии. Приходит в больших количествах.
unit.eclipse-wasp.name = Оса
unit.eclipse-wasp.description = Рой. Быстрый лётчик, чей кислотный жал разъедает цель.
unit.eclipse-spitter.name = Плевак
unit.eclipse-spitter.description = Рой. Забрасывает сгустки кислоты, оставляющие разъедающие лужи.
unit.eclipse-brood.name = Выводок
unit.eclipse-brood.description = Рой. Распыляет споры, замедляющие цели. Когда он умирает, из него вылупляются четыре Клеща.
unit.eclipse-behemoth.name = Бегемот
unit.eclipse-behemoth.description = Босс Роя. Быстро восстанавливается, продолжает откладывать яйца Клещей (они вылупляются через 3 секунды: успейте убить их) и обстреливает кислотой.
unit.eclipse-scrabba.name = Скрабба
unit.eclipse-scrabba.description = Босс Роя: гигантский скорпион, ближний боец. Клешни раздавливают всё в зоне 3x3 перед ним, включая стены; жало высасывает цель, исцеляя Скраббу и оставляя цель «Истощённой». Его экзоскелет выдерживает до 3000 урона.
unit.eclipse-lamprey.name = Минога
unit.eclipse-lamprey.description = Прилив. Роботизированный угорь. Из воды прыгает на ближайшую к вам турель, перескакивая через стены, и вцепляется: турель обездвижена и истощается, пока минога не убита. Стреляйте по ней, пока она висит, или из ПВО, пока она в воздухе.

# military M5: endgame
block.eclipse-titan-manufacturing-complex.name = Производственный комплекс «Титан»
block.eclipse-titan-manufacturing-complex.description = Строит Дредноут. Один на команду: пока ваш Дредноут жив, комплекс простаивает и ничего не потребляет.
unit.eclipse-dreadnought.name = Дредноут
unit.eclipse-dreadnought.description = Танк класса «Титан». Две тяжёлые бронепробивающие пушки, тепловое копьё, кислотные миномёты, широкий фронтальный щит и импульс помех. Только один на команду.
block.eclipse-orbital-weapons-platform.name = Орбитальная платформа вооружения
block.eclipse-orbital-weapons-platform.description = Коснитесь её, затем коснитесь любой точки в радиусе 150 блоков, чтобы задать цель. Две минуты заряжается от энергии, затем тратит сверхпроводники, эфирит и взрывную смесь на один удар: предупреждение отмечает цель, и три секунды спустя всё вражеское в радиусе 10 блоков получает 3000 урона.
unit.eclipse-ew-drone.name = Дрон радиоэлектронной борьбы
unit.eclipse-ew-drone.description = Безоружен и хрупок. Каждые 5 секунд он сбивает наведение вражеских турелей в радиусе 10 блоков: они наводятся и стреляют вдвое медленнее 4 секунды. Он никогда не отключает их и не трогает другие здания. Строится в Воздушном заводе.
ability.eclipse-ewpulse = Подавление управления огнём
ability.eclipse-ewpulse.stats = Каждые {1} с вражеские турели в радиусе {0} блоков наводятся и стреляют на {2}% медленнее в течение {3} с

