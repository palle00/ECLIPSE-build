eclipse-menu.credits.text = [accent]ECLIPSE[] от palle00.\n\n[accent]Поиск ошибок, тестирование и идеи[]\nSunioBunio\nMoon SleepyBird\n\n[accent]Текстуры[]\nДруг\n\n[accent]Новые планеты кампании[]\nДруг
